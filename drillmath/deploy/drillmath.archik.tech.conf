# Тренажёр «Приём»: узнать приём по настоящему вопросу архива.
#
# Отдельный сайт, а не вкладка атласа: занятие здесь одно, и экран под
# него устроен целиком. Служба та же, что у атласа, — ib-drill на 8042,
# поэтому журнал, расписание и сила приёмов общие с ib.archik.tech.
# Своего бэкенда у сайта нет: статика плюс проксирование /api/drill.
#
# TLS снимает archik-nginx ярусом выше и приходит сюда по unix-сокету с
# proxy_protocol; $proxy_protocol_server_port = 80 означает «пришли по
# голому HTTP» и уводит на https.

server {
    listen unix:/run/archik-nginx/h1.sock proxy_protocol;
    server_name drillmath.archik.tech;
    charset utf-8;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/archik-acme/www;
        try_files $uri =404;
    }

    # Страницы билетов приходят картинками из службы: они тяжелее всего
    # остального на сайте, и ответ у них долгий только в первый раз —
    # дальше страницу отдаёт кэш самой службы.
    location ^~ /api/drill/ {
        if ($proxy_protocol_server_port = 80) {
            return 308 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /assets/ {
        root /var/www/drillmath.archik.tech/current;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        if ($proxy_protocol_server_port = 80) {
            return 308 https://$host$request_uri;
        }
        root /var/www/drillmath.archik.tech/current;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

