version: 0.2
practicum: B5
title: Показательные и логарифмические модели
source_topic: functions.logarithmic_functions
also_covers:
  - topic: functions.exponential_models
    share: 1.0
    what: Шесть блоков, 18 баллов. Модели распада и алгебра показателей.
  - topic: number_algebra.exponential_models
    share: 1.0
    what: >
      Пять блоков, 12 баллов. Проценты: сложный процент, амортизация, инфляция.
      Разметка держит их в разделе «Число и алгебра», но приём тот же самый,
      и в бумаге они стоят рядом с e-моделями.
  - topic: functions.mathematical_models
    share: 1.0
    what: >
      Тринадцать блоков, 20 баллов. Самая разношёрстная из четырёх тем: сюда
      разметка складывает всё, где есть слово «модель». Двенадцать блоков
      действительно про подстановку в готовую модель и суждение о ней,
      тринадцатый — оптимизация с sec и tan, см. corpus_issues.

corpus:
  blocks: 37
  marks: 85
  sessions: May 2021 — November 2025
  papers: {1: 16, 2: 8, 3: 13}
  gdc_marks: 46
  note: >
    Тема ровно на нижней трети диапазона гранулярности: 85 баллов при границах
    60–200. Резать её не на что, а сливать не с чем — соседи по секции заняты
    B1–B4 целиком.

    54% баллов с калькулятором, и здесь это не иллюзия, в отличие от B2 и B3.
    Разрез проходит по бумаге почти без исключений: Paper 1 спрашивает законы
    логарифмов и точные значения, Paper 2 и Paper 3 — подгонку модели под
    данные и предсказание. Один и тот же приём «взять логарифм обеих частей»
    в Paper 1 даёт ln 2 / 5730, а в Paper 2 — число 2380.

directions:
  down: >
    Неизвестное в показателе. Спуск — логарифм: приёмы 4–8.
  up: >
    Неизвестное под логарифмом. Подъём — возведение в степень: приёмы 1–3.
  read: >
    Модель уже построена, спрашивают о ней самой: подставить, назвать
    допущение, сравнить два предсказания. Приём 9.

skills:
  - id: log_laws
    name: Три закона логарифма
    rung: 1
    trigger: >
      В строке несколько логарифмов одного основания, или логарифм произведения,
      частного, степени. Практический признак: ответ просят «в терминах p и q»,
      где p и q — логарифмы простых чисел.
    chain:
      - Разложить аргумент на множители, показывая нужные простые числа
      - Свернуть или развернуть по log ab = log a + log b и log aⁿ = n log a
      - Отдельно вспомнить, что 1 = log_b b, а не единица под логарифмом
      - Собрать ответ через данные буквы, не возвращаясь к числам
    traps:
      - "log(a + b) раскладывают как log a + log b — закона с такой левой частью нет"
      - "Свободное слагаемое 1 оставляют как есть: чтобы соединить его с логарифмами,
        его надо записать как log_b b"
      - Степень выносят перед логарифмом вместе с коэффициентом, который там уже стоял
      - Ответ выражают числом, хотя спрашивали через p и q
    calculator:
      mode: forbidden
      note: >
        Все вопросы приёма из Paper 1 и все требуют точной формы: 3p + q, −1/3, 1/9.
        Калькулятор годится ровно на одну вещь — сверить порядок величины готового
        ответа, подставив log 2 ≈ 0.301.
    prereq: []
    raw_tags: [logarithms, logarithm_properties, logarithm_property,
               logarithm_power_rule, apply_logarithm_power_rule,
               logarithm_product_rule, quotient_rule, evaluate_logarithm,
               logarithmic_rewriting, algebraic_simplification]
    blocks: [2024-MAY-TZ1-P1-Q02-A, 2025-MAY-TZ3-P1-Q01-A, 2025-MAY-TZ1-P1-Q08-A]

  - id: change_of_base
    name: Смена основания
    rung: 2
    trigger: >
      В одном равенстве логарифмы разных оснований — log₈ и log₄, log₁₀ и log₁₀₀₀,
      log₁₀ и log₃. Пока основания разные, ни один закон приёма 1 не применим.
    chain:
      - Выбрать одно основание, к которому сводится всё, — обычно наименьшее
      - "Переписать каждый логарифм: log_a b = log_c b / log_c a"
      - Заметить, что основания часто степени одного числа (8 = 2³, 4 = 2², 1000 = 10³)
      - Свернуть получившееся по законам приёма 1
    traps:
      - Дробь переворачивают — в знаменателе оказывается логарифм аргумента
      - "Основание меняют не везде: одно слагаемое остаётся в старом основании,
        и уравнение перестаёт сворачиваться"
      - "Числовое основание считают на калькуляторе и теряют точную форму:
        1/9 превращается в 0.111"
    calculator:
      mode: forbidden
      note: >
        Оба вопроса приёма из Paper 1, оба просят точное значение. Замечу побочное:
        именно смена основания и позволяет калькулятору считать log₈ 10 — у GDC
        внутри только натуральный логарифм.
    prereq: [log_laws]
    raw_tags: [change_of_base, apply_change_of_base]
    blocks: [2024-MAY-TZ1-P1-Q02-B, 2025-MAY-TZ3-P1-Q01-B, 2025-NOV-TZ3-P1-Q04]

  - id: log_equation
    name: Уравнение с неизвестным под логарифмом
    rung: 3
    trigger: >
      Слева и справа логарифмы, внутри которых стоит x. Отдельная примета —
      свободное число рядом с логарифмом: его придётся превратить в логарифм.
    chain:
      - Привести все логарифмы к одному основанию (приём 2)
      - Свернуть каждую сторону в один логарифм (приём 1)
      - Снять логарифмы, приравняв аргументы, или возвести основание в степень
      - Решить получившееся алгебраическое уравнение
      - Отбросить корни, при которых хоть один аргумент неположителен
    traps:
      - Проверка области не сделана, и посторонний корень остаётся в ответе
      - "Логарифмы снимают по частям: из log A − log B = log C выводят A − B = C"
      - "Свободную единицу переносят, но не переводят в log_b b, и она пропадает"
      - Ответ дают в виде √x, а спрашивали x
    calculator:
      mode: forbidden
      note: >
        Оба уравнения из Paper 1, ответы точные: x = 14 и x = 1/25. GDC найдёт корень
        численно, но за него не дадут ни балла — markscheme платит за законы
        логарифмов, а не за число.
    prereq: [log_laws, change_of_base]
    raw_tags: [solve_logarithmic_equation, simplify_logarithmic_equation,
               exponentiate, exponentiation, isolate_variable,
               solving_linear_equation, logarithmic_inequality]
    blocks: [2025-NOV-TZ1-P1-Q02-B, 2025-NOV-TZ3-P1-Q04, 2024-MAY-TZ2-P2-Q03-C]

  - id: exponent_laws
    name: Законы показателей и данное соотношение
    rung: 4
    trigger: >
      Степени одного основания перемножаются или делятся; или в условии дано
      готовое равенство вида e^T = 1 + v₀, которое надо куда-то подставить;
      или просят записать число в виде e^a.
    chain:
      - "Разделить показатель на части: e^{−(T−k)} = e^{−T}·e^{k}"
      - Заменить кусок по данному в условии соотношению
      - Сократить и собрать ответ
      - "Любое положительное число записывается как e^{ln числа} — это не трюк,
        а определение логарифма"
    traps:
      - "Минус перед скобкой в показателе раскрывают только у первого слагаемого"
      - "e^{−T} заменяют на 1 + v₀ вместо 1/(1 + v₀)"
      - "«Deduce a similar expression» решают заново, хотя достаточно заменить k на −k"
    calculator:
      mode: forbidden
      note: >
        Все три вопроса приёма из Paper 1, два из них «show that». Числа в них нет
        вообще: ответ — выражение через букву.
    prereq: []
    raw_tags: [factor_exponential, simplify_using_given_relation, substitute_time,
               natural_logarithm, exponentiation, algebraic_manipulation]
    blocks: [2021-MAY-TZ2-P1-Q11-C, 2021-MAY-TZ2-P1-Q11-D, 2025-MAY-TZ1-P1-Q07-A]

  - id: take_logs
    name: Логарифм обеих частей
    rung: 5
    trigger: >
      Неизвестное стоит в показателе: 50 = 100e^{−5730k}, 1.00694ⁿ > 1.1,
      75 = 100e^{−kt}. Ни один алгебраический ход его оттуда не достанет.
    chain:
      - Оставить в одной части чистую степень, поделив на множитель перед ней
      - Взять логарифм обеих частей — натуральный, если основание e
      - "Снести показатель вниз по log aⁿ = n log a"
      - Выразить неизвестное и только в конце округлить
    traps:
      - "Логарифм берут до деления на 100, и ln(100e^{−kt}) раскрывают неверно"
      - "ln(1/2) записывают как ln 2 без минуса"
      - "Округляют k, а потом им пользуются: три значащих цифры в k дают ошибку
        в сотнях лет в ответе"
      - "«Первый месяц, когда превысит» — это следующее целое, а не округление"
    calculator:
      mode: speeds_up
      note: >
        Метод один и тот же на обеих бумагах, различается только вид ответа. В Paper 1
        приём заканчивается точной формой ln 2 / 5730, в Paper 2 — числом 2380 или
        14 месяцами. GDC умеет решить такое уравнение и графиком, и markscheme это
        принимает (May 2021 TZ2 P2 Q5(c) прямо перечисляет оба пути), но подстановку
        в модель показать всё равно надо.
    prereq: [exponent_laws]
    raw_tags: [exponential_equation, solve_exponential_equation,
               set_up_exponential_equation, solve_for_rate_constant,
               half_life, exponential_decay, gdc_solver, rounding,
               round_final_answer, inequality, inequality_manipulation]
    blocks: [2021-MAY-TZ2-P2-Q05-B, 2021-MAY-TZ2-P2-Q05-C, 2025-MAY-TZ2-P2-Q04-B]

  - id: fit_model
    name: "Подгонка модели: две постоянные, два условия"
    rung: 6
    trigger: >
      Дана форма модели с буквами — A₀e^{−kt}, 15000e^{kt} — и два факта о ней:
      значение в начале и значение в какой-то момент. Спрашивают третье значение.
    chain:
      - Назначить точку отсчёта времени и записать, какому t отвечает каждый факт
      - Подставить первый факт — обычно он даёт множитель перед степенью
      - Подставить второй и найти k приёмом 5
      - Подставить искомый t в готовую модель
    traps:
      - "Отсчёт времени сдвинут: 2041 год при t = 0 в 2014-м это t = 27, а не t = 19"
      - "«Уменьшилось на 11%» превращают в множитель 0.11 вместо 0.89"
      - k округляют до подстановки в модель
      - "Знак k теряют, и убывающая модель начинает расти"
    calculator:
      mode: required
      note: >
        Все вопросы приёма из Paper 2 и Paper 3, все просят число. Приём и есть
        работа с GDC, но подстановку обоих условий markscheme требует увидеть
        на бумаге: за одно только конечное число ставят один балл из семи.
    prereq: [take_logs]
    raw_tags: [substitution, substitute, substitute_data, initial_value,
               identify_initial_value, read_initial_condition,
               substitute_initial_condition, identify_time_parameter,
               solve_for_parameter, exponential_model, evaluate_model]
    blocks: [2022-NOV-COMMON-P2-Q04, 2021-MAY-TZ2-P2-Q05-A, 2025-NOV-TZ1-P3-Q02-A-III]

  - id: percentage_model
    name: Проценты как степень
    rung: 7
    trigger: >
      В условии проценты со словом «за период»: «depreciates at 15% per annum»,
      «compounded quarterly», «inflation 0.8% per month». Модель не написана —
      её надо составить самому.
    chain:
      - "Перевести процент в множитель за один период: рост 1 + r, спад 1 − r"
      - "Пересчитать период, если начисление чаще года: 4% годовых поквартально
        это множитель 1 + 0.04/4 за квартал"
      - "Возвести множитель в число периодов"
      - "Два процесса сразу делятся, а не вычитаются: реальный рост это
        (1 + i)/(1 + j), а не 1 + i − j"
    traps:
      - "Номинальную годовую ставку берут за период целиком: 1.04 вместо 1.01"
      - "Инфляцию вычитают из процента вклада, и ответ отличается на месяцы"
      - "«Nearest dinar» и «two decimal places» — разные требования, и оба стоят балла"
      - "Число периодов путают с числом лет при поквартальном или помесячном начислении"
    calculator:
      mode: speeds_up
      note: >
        Здесь тема делится ровно пополам. May 2025 TZ2 P2 — чистый GDC: 30000·0.85¹⁰
        и решение неравенства перебором. May 2025 TZ1 P1 и Nov 2025 TZ1 P1 — тот же
        множитель на бумаге, но 1.01⁴ и 0.9⁻⁴ считаются биномиальным разложением,
        и десятичный ответ с калькулятора там баллов не приносит.
    prereq: [fit_model]
    raw_tags: [compound_interest, quarterly_compounding, interest_rate_conversion,
               real_interest_rate, percentage_decay, percentage_decrease,
               depreciation_formula, depreciation_model, binomial_approximation,
               maclaurin_series_application, direct_calculation]
    blocks: [2025-MAY-TZ1-P1-Q02-A, 2025-MAY-TZ1-P1-Q02-C, 2025-MAY-TZ2-P2-Q04-A,
             2025-MAY-TZ2-P2-Q04-B, 2025-NOV-TZ1-P1-Q05-B]

  - id: logistic_model
    name: Логистическая модель и её потолок
    rung: 8
    trigger: >
      В условии названо предельное значение — «stable size of 200», «carrying
      capacity» — и дана дробь вида L/(1 + Ce^{−kt}).
    chain:
      - "Прочитать L прямо из условия и сказать, какое допущение этим делается"
      - "Подставить t = 0: e⁰ = 1, и C находится одним уравнением"
      - Подставить вторую точку и найти k приёмом 5
      - Предсказать нужное значение и округлить до целого, если считают особей
    traps:
      - "e⁰ забывают, и уравнение на C решается неверно"
      - "L считают начальным значением, а не пределом"
      - "Ответ дают дробным, хотя считают животных"
      - "Знак в показателе теряют: при k > 0 модель обязана расти к L, а не от него"
    calculator:
      mode: required
      note: >
        Все пять пунктов приёма из Paper 3 ноября 2025, все с калькулятором. Полезная
        привычка: считать x(t) при большом t и убеждаться, что модель подходит к L,
        а не уходит вниз, — это ловит потерянный знак за пять секунд.
    prereq: [fit_model]
    raw_tags: [substitution, evaluate_function, evaluate_at_point,
               round_to_nearest_integer, interpret_parameter]
    blocks: [2025-NOV-TZ1-P3-Q02-A-II, 2025-NOV-TZ1-P3-Q02-A-III,
             2025-NOV-TZ1-P3-Q02-A-IV, 2025-NOV-TZ1-P3-Q02-A-I]

  - id: log_as_function
    name: "Логарифм как функция: композиция, область, шкала"
    rung: 9
    trigger: >
      ln x стоит внутри другой функции или снаружи неё; или уравнение дано в виде
      ln(g(x)) = …; или величина измеряется логарифмической шкалой (децибелы).
    chain:
      - "Подставить одну функцию в другую, не упрощая раньше времени"
      - "Решить внешнее неравенство относительно ln x, и только потом снять логарифм"
      - "Для области композиции g∘f потребовать, чтобы f(x) попадала в область g"
      - "Для равенства ln(g) = h возвести e в обе части: g = e^h"
    traps:
      - "Область композиции берут как область f, забыв про требование ln"
      - "При снятии логарифма из −5 ≤ ln x ≤ 1 получают −e⁵ ≤ x ≤ e"
      - "В шкале с 10 log₁₀ множитель 10 применяют дважды или ни разу"
      - "«Twice the intensity» превращают в «twice the loudness»"
    calculator:
      mode: checks
      note: >
        Composition-вопросы из Paper 1 и требуют точной формы e^{−5} ≤ x ≤ e;
        децибелы из Paper 2 и просят три значащих цифры. GDC полезен ровно как
        проверка: построить (f∘g)(x) и посмотреть, где график ниже 40.
    prereq: [log_laws]
    raw_tags: [composite_function, domain_restriction, inequality_solving,
               monotonic_function, compute_decibels, double_value,
               algebraic_verification, verification, formula_evaluation]
    blocks: [2025-MAY-TZ1-P1-Q10-D, 2025-MAY-TZ1-P1-Q10-E, 2023-MAY-TZ1-P3-Q02-I,
             2024-MAY-TZ2-P2-Q03-A, 2024-MAY-TZ2-P2-Q03-B]

# Приёмы, встречающиеся в теме, но принадлежащие другим практикумам.
imported:
  - {id: binomial_expansion, from: A7,
     note: "1000(1+k)⁴ и (1−x)^{−4}: разложение делается там, сюда приходит применение"}
  - {id: induction, from: A4,
     note: "май 2025 TZ1 P1 Q8(b) — индукция, логарифмическое неравенство только в (a)"}
  - {id: separation, from: E7,
     note: "модель Гомперца в ноябре 2025 P3 решается разделением переменных"}

# Замечания к классификации, отправить в classification/reviews.
corpus_issues:
  - block: 2025-NOV-TZ3-P1-Q08-A
    issue: >
      Помечен темой mathematical_models, но ни показательной, ни логарифмической
      функции в нём нет: это «show that T = 500 sec θ + (2500 − 1000 tan θ)/3»
      для задачи о времени в пути по пляжу. Приём — выразить длины через угол,
      место блока в C1 или в теме оптимизации. Проверено по странице 10 бумаги.
  - block: 2023-MAY-TZ1-P2-Q03-A
    issue: >
      Модель здесь квадратичная, а не показательная: y = −0.6T² + 23T + 110.
      Тема mathematical_models объединяет их по слову «модель», а не по приёму.
      Для B5 блок годится только как разминочный пример приёма 9.
  - blocks: [2023-MAY-TZ1-P3-Q02-C, 2023-MAY-TZ1-P3-Q02-E-I,
             2023-MAY-TZ1-P3-Q02-E-II, 2023-MAY-TZ1-P3-Q02-E-III]
    issue: >
      Четыре пункта по одному баллу — подстановка чисел в уже доказанную формулу
      (S/n)ⁿ. Разметка относит их к mathematical_models, но настоящая тема
      исследования — неравенство о средних, и она лежит в A8.

