version: 0.2
practicum: E5
title: Техника интегрирования
source_topic: calculus.integration_applications
also_covers: []

corpus:
  blocks: 39
  marks: 157
  effective_blocks: 36
  effective_marks: 145
  sessions: May 2021 — November 2025
  papers: {1: 86, 2: 36, 3: 35}
  gdc_marks: 71
  note: >
    Тема calculus.integration_applications целиком — 85 блоков и 354 балла,
    почти вдвое больше верхней границы. Она разрезана поимённо надвое,
    и списки лежат в blocks карточек, как это сделано у A5, A6, E3 и E4.

    E5 берёт 39 блоков и 157 баллов: всё, где вопрос — «чему равна
    первообразная». E6 берёт остальные 46 блоков и 197 баллов: всё, где
    вопрос — «что этот интеграл измеряет». Граница снова по вопросу,
    а не по функции. «Найдите ∫x(ln x)²dx», «покажите, что ∫ равен»,
    «проинтегрируйте почленно» — сюда. «Найдите площадь», «найдите объём
    вращения», «какое расстояние прошла точка» — в E6.

    Разрез рассекает и отдельные вопросы. У ноябрьской 2025 TZ1 Paper 2
    вопрос 11 пункт (a) — интегрирование по частям и стоит здесь, а пункты
    (c)–(d) считают E(X) и стоят в статистике. У майской 2025 TZ1 Paper 1
    вопрос 12 пункты (a)–(c) строят формулу понижения и стоят здесь,
    а (d) считает объём вращения и уходит в E6.

    Самая некалькуляторная тема серии: 86 баллов из 157 — Paper 1, вдвое
    больше, чем Paper 2. У E3 и E4 доля Paper 1 была 27% и 23%, здесь 55%.
    Причина простая: подстановка, по частям и простейшие дроби — ровно то,
    чего калькулятор не делает.

    Ноябрьские 2023 TZ1 и TZ2 — одна и та же бумага. Совпадают все двенадцать
    вопросов Paper 1 и девять из двенадцати Paper 2, слово в слово; три
    оставшихся расходятся только тем, как pdfminer читает формулы. Корпус
    держит их двумя независимыми прогонами классификации, поэтому три блока
    здесь посчитаны дважды: за вычетом дублей 36 блоков и 145 баллов.
    Подробности в corpus_issues.

directions:
  visible: >
    Первообразная берётся из таблицы — сразу или после замены переменной.
    Постоянная фиксируется точкой, если точка дана. Приёмы 1–2.
  reshape: >
    Подынтегральное выражение сначала надо разобрать: произведение —
    по частям, дробь — на простейшие, частное — узнать в нём f′/f.
    Приёмы 3–5.
  none: >
    Первообразной в конечном виде нет. Остаётся рекурсия по показателю
    или ряд вместо самой функции. Приёмы 6–7.
  aside: >
    Первообразная уже не вопрос: интеграл известен, а найти просят предел
    интегрирования, постоянную или второй интеграл по симметрии. Приём 8.

skills:
  - id: antiderivative_and_constant
    name: Первообразная по таблице и постоянная по точке
    rung: 1
    trigger: >
      Подынтегральное выражение — сумма степеней, экспонент и простых
      тригонометрических функций: каждое слагаемое есть в таблице как
      оно есть. Спрашивают либо значение определённого интеграла, либо
      «дана f′ и точка графика — найдите f».
    chain:
      - "Переписать каждое слагаемое в виде, который есть в таблице:
        5/√x — это 5x^(−1/2)"
      - Проинтегрировать почленно
      - "Определённый интеграл: подставить оба предела и вычесть"
      - "Неопределённый: добавить постоянную и найти её из данной точки"
    traps:
      - "Постоянная не добавлена вовсе, и подставлять точку не во что:
        балл за +c отдельный"
      - "Точка подставлена в f′, а не в проинтегрированное выражение"
      - "Подставлен только верхний предел: нижний забыт, а не равен нулю"
      - "Показатель повышен, но на новый показатель не поделено:
        ∫x^(−1/2)dx это 2√x, а не x^(1/2)"
    calculator:
      mode: mixed
      note: >
        Девять баллов из восемнадцати — Paper 1, и ответы там целые: 4,
        x³+5eˣ−1, x³+6x²−15x−10. Единственный балл, где калькулятор
        действительно нужен, — площадь под кусочной плотностью, и та
        оказывается равной 3/7 точно.
    prereq: []
    raw_tags: [rewrite_integrand, integrate_power_rule, substitute_limits,
               evaluate_definite_integral, indefinite_integration, power_rule,
               exponential_integration, constant_of_integration,
               initial_condition, indefinite_integral, substitute_point,
               integrate, logarithmic_integration, simplify_logarithm,
               definite_integral, trigonometric_integration]
    blocks: [2022-MAY-TZ1-P1-Q01, 2025-MAY-TZ1-P2-Q11-A-I,
             2022-MAY-TZ2-P2-Q02, 2025-NOV-TZ1-P1-Q09-E,
             2021-MAY-TZ1-P2-Q12-B]

  - id: substitution
    name: Замена переменной
    rung: 2
    trigger: >
      В подынтегральном выражении видна пара «функция и её производная»:
      sec^n x·tan x рядом с sec x, 6x рядом с 1+x², cos√x рядом с √x.
      Замену либо называют в условии («by using the substitution u = sin x»),
      либо предлагают выбрать самому («or otherwise»).
    chain:
      - "Назвать замену u = g(x) и продифференцировать её: du = g′(x)dx"
      - Выразить всё подынтегральное выражение через u, включая dx
      - Проинтегрировать по u
      - Вернуться к x — или, если интеграл определённый, пересчитать пределы
    traps:
      - "dx заменено на du без множителя: замена делит на производную,
        и без этого ответ отличается постоянным множителем"
      - "Пределы оставлены прежними после перехода к u"
      - "Возврат к x забыт: в ответе на неопределённый интеграл стоит u"
      - "После замены в выражении остался x — значит, замена подобрана
        не под всё выражение"
    calculator:
      mode: "no"
      note: >
        Все семнадцать баллов приёма — Paper 1. Замену переменной
        калькулятор не делает вовсе, и IB это знает.
    prereq: [antiderivative_and_constant]
    raw_tags: [u_substitution, back_substitution, substitution,
               trigonometric_integration, integration_by_inspection,
               logarithmic_integration, initial_condition, integration,
               power_rule, definite_integral, limit_evaluation]
    blocks: [2022-MAY-TZ2-P1-Q07, 2022-NOV-COMMON-P1-Q04,
             2023-MAY-TZ2-P1-Q12-A]

  - id: by_parts
    name: Интегрирование по частям
    rung: 3
    trigger: >
      Подынтегральное выражение — произведение двух непохожих множителей,
      и один из них при дифференцировании упрощается: x·(ln x)², (x²−5)eˣ,
      t·e^(−3t). Сюда же одиночные arccos x и arctan x: множителем берут
      единицу.
    chain:
      - "Выбрать u — тот множитель, который дифференцирование упрощает —
        и dv, остальное"
      - Написать uv − ∫v du
      - Если оставшийся интеграл того же вида, применить правило ещё раз
      - Определённый интеграл — подставить пределы и в uv, и в остаток
    traps:
      - "u и dv выбраны наоборот: интеграл становится сложнее исходного,
        а не проще"
      - Знак минус перед вторым интегралом потерян
      - "Пределы подставлены только в остаточный интеграл, а слагаемое uv
        оставлено без них"
      - "У arccos и arctan не увидено скрытой единицы: dv = 1·dx"
      - "После второго применения правила слагаемые не собраны, и ответ
        остаётся с невзятым интегралом внутри"
    calculator:
      mode: mixed
      note: >
        Восемнадцать баллов Paper 1, четырнадцать Paper 2 и четырнадцать
        Paper 3 — единственный приём темы, поровну разложенный по всем
        трём бумагам. Работа для GDC здесь ровно одна: A₄ = 24 и A₅ = 120
        у майской 2023 Paper 3, где верхний предел бесконечен и вместо него
        берут большое число.
    prereq: [antiderivative_and_constant]
    raw_tags: [integration_by_parts, double_integration_by_parts,
               indefinite_integration, antiderivative, definite_integration,
               definite_integral, logarithm_simplification,
               logarithmic_integration, evaluate_limits, substitution,
               algebraic_simplification, evaluate_improper_integral,
               apply_limit, numerical_integration, gdc_evaluate,
               definite_integral_FTC, substitution_of_limits,
               indefinite_integral, exponential_function, polynomial]
    blocks: [2023-NOV-TZ1-P1-Q08-A, 2023-NOV-TZ1-P1-Q08-B,
             2023-NOV-TZ2-P1-Q08-A, 2023-NOV-TZ2-P1-Q08-B,
             2025-MAY-TZ3-P2-Q12-A, 2025-NOV-TZ1-P2-Q11-A,
             2025-NOV-TZ3-P3-Q02-E, 2025-MAY-TZ2-P2-Q11-B,
             2023-MAY-TZ1-P3-Q01-B, 2023-MAY-TZ1-P3-Q01-C-II,
             2023-MAY-TZ1-P3-Q01-D-I, 2023-MAY-TZ1-P3-Q01-D-II]

  - id: partial_fractions
    name: Разложение на простейшие дроби
    rung: 4
    trigger: >
      Подынтегральное выражение — правильная рациональная дробь, знаменатель
      которой раскладывается на множители: (x+3)(x−4), (x+1)²(2x+1), 1−v².
      Часто разложение уже сделано предыдущим пунктом, и здесь его просят
      «hence» проинтегрировать.
    chain:
      - Разложить знаменатель на неприводимые множители
      - Написать сумму простейших дробей с неизвестными числителями
      - Найти числители подстановкой корней или сравнением коэффициентов
      - "Проинтегрировать каждую дробь: линейный знаменатель даёт логарифм,
        квадрат линейного — степень"
    traps:
      - "Кратному множителю (x+1)² отведена одна дробь вместо двух:
        нужны и A/(x+1), и B/(x+1)²"
      - "У дроби с квадратом знаменателя взят логарифм: ∫dx/(x+1)² —
        это −1/(x+1), а не ln|x+1|"
      - "Потерян множитель 1/2 у ln|2x+1|: производная внутренней 2x+1
        равна двум"
      - Модуль под логарифмом опущен там, где отрезок задевает
        отрицательные значения
    calculator:
      mode: mixed
      note: >
        Одиннадцать баллов Paper 1, семь Paper 2, пять Paper 3. Ответы
        точные всюду: ln 32 = 5 ln 2, (1/3)ln|sin x+1| + (2/3)ln|sin x−2|,
        (1/2)ln|(1+v)/(1−v)|.
    prereq: [antiderivative_and_constant]
    raw_tags: [partial_fractions, integrate_rational_function,
               logarithmic_integration, evaluate_definite_integral,
               logarithm_simplification, u_substitution, back_substitution,
               termwise_integration, logarithmic_antiderivative]
    blocks: [2021-MAY-TZ2-P1-Q09, 2021-NOV-COMMON-P2-Q10-E,
             2024-MAY-TZ1-P1-Q11-E, 2025-MAY-TZ2-P3-Q01-E]

  - id: logarithmic_integration
    name: Частное, узнанное как f′/f
    rung: 5
    trigger: >
      Подынтегральное выражение — дробь, числитель которой оказывается
      производной знаменателя, иногда после алгебры: g′/(g′−g), f′/f.
      Признак вопроса — слова «by integrating both sides» и появление
      постоянной в виде e^C или ln A.
    chain:
      - Привести частное к виду, где числитель есть производная знаменателя
      - Написать ln от модуля знаменателя
      - "Постоянную интегрирования одеть по месту: e^C становится
        множителем A, ln A — слагаемым"
      - Если сверху осталась не вся производная, отделить лишнее
        и проинтегрировать отдельно
    traps:
      - "Постоянная оставлена слагаемым там, где обе части
        потенцируются: e^C — это множитель, а не +C"
      - "Знак в g′ − g перепутан, и вместо −2 sin x выходит 2 cos x"
      - "Ответ не доведён до заказанной формы: просят f(x) = eˣ/h(x),
        а написано e^(x/2)/√(sin x)"
      - "Модуль под логарифмом потерян, хотя область задана 0 < x < π
        именно ради него"
    calculator:
      mode: "yes"
      note: >
        Все четырнадцать баллов — одно исследование майской 2024 Paper 3,
        и калькулятор там не нужен ни в одном из них: ответы e^(x+x²/2)
        и eˣ/(e^(x/2)√(sin x)) точные.
    prereq: [substitution, partial_fractions]
    raw_tags: [logarithmic_integration, exponentiation,
               constant_of_integration, derivative, algebraic_simplification,
               polynomial_integration, trigonometric_simplification,
               cotangent_integral]
    blocks: [2024-MAY-TZ2-P3-Q01-C, 2024-MAY-TZ2-P3-Q01-D,
             2024-MAY-TZ2-P3-Q01-E]

  - id: reduction_formula
    name: Формула понижения
    rung: 6
    trigger: >
      Показатель в подынтегральном выражении — буква: cosⁿx, sinⁿx.
      Просят выразить интеграл при показателе n через интеграл при
      показателе n − 2, а потом воспользоваться этим для конкретного n.
    chain:
      - "Отделить один множитель: cosⁿx = cosⁿ⁻¹x · cos x"
      - "Проинтегрировать по частям, взяв u = cosⁿ⁻¹x"
      - Заменить sin²x на 1 − cos²x, чтобы справа появился тот же интеграл
      - Собрать одинаковые интегралы в одну сторону и поделить
      - Спускаться по формуле до показателя 0 или 1
    traps:
      - "Множитель (n−1) потерян при дифференцировании cosⁿ⁻¹x"
      - "Одинаковые интегралы не собраны: формула остаётся неявной
        и пользоваться ею нельзя"
      - "Спуск остановлен на показателе 2, а ∫cos²x dx взят наугад
        вместо двойного угла"
      - "Постоянная c потеряна, хотя ответ просят в виде
        p cos³x sin x + q cos x sin x + rx + c"
    calculator:
      mode: "no"
      note: >
        Все десять баллов — Paper 1 майской 2025 TZ1. Ответ рациональный:
        p = 1/4, q = 3/8, r = 3/8.
    prereq: [by_parts]
    raw_tags: [integration_by_parts, algebraic_manipulation,
               trigonometric_identity, rearrangement, reduction_formula]
    blocks: [2025-MAY-TZ1-P1-Q12-A, 2025-MAY-TZ1-P1-Q12-B,
             2025-MAY-TZ1-P1-Q12-C]

  - id: termwise_series
    name: Интегрирование ряда почленно
    rung: 7
    trigger: >
      Первообразной в конечном виде нет — или она не нужна: подынтегральную
      функцию заменяют несколькими первыми членами ряда. Признак — слова
      «use the first two non-zero terms», «up to and including the term
      in x⁷», «hence, use integration to show that the Maclaurin series».
    chain:
      - Записать ряд подынтегральной функции до нужной степени
      - Проинтегрировать почленно, повышая каждый показатель на единицу
      - Не забыть постоянную у неопределённого интеграла
      - Подставить пределы или значение x и упростить
    traps:
      - "Проинтегрирован не ряд, а сам ряд выдан за ответ:
        1 − x² + x⁴ − x⁶ это подынтегральная функция, а не интеграл"
      - Показатель повышен, а делить на новый показатель забыли
      - "Написано больше членов, чем заказано: «up to x⁷» значит,
        что x⁹ лишний"
      - "Ряд арксинуса подставлен, а сам arcsin не узнан:
        ∫dx/√(1−x²) — это arcsin x"
    calculator:
      mode: mixed
      note: >
        Тринадцать баллов из пятнадцати — Paper 1, и ответы точные:
        149e/1500, 25/48 + 3/1280, k = 3. Единственные два балла с
        калькулятором — ноябрьское 2025 TZ3 Paper 3, где просят
        0.158422 с шестью знаками после запятой.
    prereq: [antiderivative_and_constant]
    raw_tags: [series_integration, termwise_integration, definite_integral,
               algebraic_simplification, approximate_integrand,
               integrate_polynomial, evaluate_definite_integral,
               simplify_algebraic_expression, series_expansion,
               antiderivative, substitution, series_evaluation,
               polynomial_integration, gdc]
    blocks: [2023-NOV-TZ1-P1-Q11-E, 2023-NOV-TZ2-P1-Q11-E,
             2025-NOV-TZ1-P1-Q10-A-II, 2025-NOV-TZ1-P1-Q10-B-II,
             2025-NOV-TZ1-P1-Q10-C, 2025-NOV-TZ3-P3-Q02-F]

  - id: integral_as_condition
    name: Интеграл как условие
    rung: 8
    trigger: >
      Значение интеграла названо, а найти просят что-то другое: предел
      интегрирования c, постоянную k в плотности вероятности, второй
      интеграл по чётности подынтегральной функции. Первообразная здесь
      средство, а не ответ.
    chain:
      - Записать интеграл с неизвестным и приравнять его к данному числу
      - Взять первообразную и подставить пределы
      - Решить получившееся уравнение — точно или на калькуляторе
      - Там, где подынтегральная функция чётна или нечётна, интеграл
        по симметричному отрезку берётся без первообразной вовсе
    traps:
      - "Уравнение решено относительно c², а до самого c дело не дошло"
      - Отброшен второй корень, хотя оба лежат в области
      - "У нечётной функции взят модуль: ∫ от −4 до 0 равен −1.6,
        а не 1.6"
      - "Точность потеряна: k просят с шестью значащими цифрами,
        и 0.713 такой ответ не заменяет"
    calculator:
      mode: mixed
      note: >
        Восемь баллов Paper 1 и шесть Paper 2. Единственное место темы,
        где калькулятор решает по существу, — k = 0.713250 у ноябрьской
        2025 TZ1: уравнение k²arccos(k²) − √(1−k⁴) + 1/3 = 0 аналитически
        не решается, и шесть значащих цифр требуют именно GDC.
    prereq: [antiderivative_and_constant, by_parts]
    raw_tags: [definite_integral, u_substitution, logarithmic_integration,
               log_laws, equation_solving, substitution, numerical_gdc,
               odd_function_properties, linearity_of_integration]
    blocks: [2023-MAY-TZ2-P1-Q04, 2025-NOV-TZ1-P2-Q11-B,
             2024-MAY-TZ1-P1-Q09-C-I-II]

corpus_issues:
  - blocks: [2023-NOV-TZ2-P1-Q08-A, 2023-NOV-TZ2-P1-Q08-B,
             2023-NOV-TZ2-P1-Q11-E]
    issue: >
      Ноябрьские 2023 TZ1 и TZ2 — одна и та же бумага, и это измерено,
      а не предположено. Все двенадцать вопросов Paper 1 совпадают
      построчно; в Paper 2 совпадают девять из двенадцати, а три
      оставшихся расходятся только тем, как извлекается текст формул.
