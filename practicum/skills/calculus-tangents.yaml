version: 0.2
practicum: E4
title: "Неявное дифференцирование: касательная и нормаль"
source_topic: calculus.differentiation
also_covers: []

corpus:
  blocks: 33
  marks: 131
  effective_blocks: 32
  effective_marks: 126
  sessions: May 2021 — November 2025
  papers: {1: 30, 2: 59, 3: 42}
  gdc_marks: 101
  note: >
    Тема calculus.differentiation целиком — 98 блоков и 350 баллов, вдвое
    больше верхней границы. Она разрезана поимённо на три части, и списки
    лежат в blocks карточек, как это сделано у A5, A6 и E3.

    E4 берёт 33 блока и 131 балл: всё, где производная работает наклоном.
    Граница проходит по вопросу, а не по функции: «найдите f′(x)» — это E3,
    «найдите касательную», «под каким углом», «кривая задана уравнением» —
    сюда, «найдите ускорение» — в E9. Один и тот же вопрос архива поэтому
    бывает разрезан: у мая 2022 Paper 3 пункт (d)(i) показывает вид g′(x)
    и стоит в E3, а (d)(ii) строит по ней касательную и стоит здесь.

    Ноябрьский Paper 3 2023 года корпус держит двумя зональными копиями,
    хотя бумага одна и лежит в Common. Пункт (d) поэтому посчитан дважды;
    за вычетом дубля 32 блока и 126 баллов. Та же беда отмечена в B1, C1,
    E1, E2 и A1 — седьмой практикум подряд.

    Тридцать баллов из 131 — Paper 1, и это самая честная доля темы:
    касательную к явной функции спрашивают без калькулятора, а кривую,
    заданную уравнением, — почти всегда с ним.

directions:
  forward: >
    Точка кривой известна, ответ — прямая. Касательная, нормаль, прямая
    с буквой вместо числа. Приёмы 1–2.
  backward: >
    Прямая известна, ответ — точка. Наклон дан числом, углом или другой
    прямой, и найти надо, где кривая идёт именно так. Приём 3.
  implicit: >
    Кривая задана уравнением, а не формулой: y участвует наравне с x.
    Наклон через обе буквы, касательная к такой кривой, второе
    дифференцирование того же соотношения. Приёмы 4–6.
  condition: >
    Прямая не ответ, а условие. Перпендикулярность и касание сами
    становятся уравнением, из которого достают постоянную. Приёмы 7–8.

skills:
  - id: tangent_line
    name: Касательная в известной точке
    rung: 1
    trigger: >
      Точка названа — числом, буквой или словами «в точке, где x = 4», —
      и спрашивают уравнение касательной либо её наклон. Кривая задана
      формулой y = f(x), и решать относительно y ничего не нужно.
    chain:
      - Найти ординату точки, подставив абсциссу в саму функцию
      - Взять производную и подставить в неё ту же абсциссу
      - Написать прямую через точку и наклон, y − y₀ = m(x − x₀)
    traps:
      - "Наклон найден, а точка нет: у прямой из ответа верный угол,
        но проходит она мимо кривой"
      - "Ордината взята с касательной, а не с кривой, когда спрашивают
        f(4) по данной касательной — это как раз одно и то же, и в
        ноябре 2021 за это дают отдельный балл"
      - "В составной функции h = f(g) забыт множитель g′: h′(4) — это
        f′(g(4))·g′(4), а не f′(4)"
      - "Ответ оставлен наклоном, когда спрошено уравнение прямой"
    calculator:
      mode: mixed
      note: >
        Пять баллов из четырнадцати — Paper 1, и там ответ целый:
        y = 30x − 97. Шесть баллов из Paper 3 — доказательство с буквами,
        где калькулятор бесполезен по существу.
    prereq: []
    raw_tags: [tangent_line_equation, derivative_from_tangent_slope,
               function_value_from_tangent, point_slope_form,
               evaluate_derivative_at_point, x_intercept, tangent_line,
               differentiate_trigonometric, chain_rule]
    blocks: [2021-NOV-COMMON-P1-Q05-A, 2021-NOV-COMMON-P1-Q05-B,
             2021-NOV-COMMON-P1-Q05-D, 2025-MAY-TZ1-P2-Q05-A,
             2022-MAY-TZ1-P3-Q02-D-II]

  - id: normal_line
    name: Нормаль
    rung: 2
    trigger: >
      В вопросе стоит слово normal или «перпендикулярно кривой в точке».
      Всё остальное — как у касательной, и отличается ровно один шаг.
    chain:
      - Найти наклон касательной в точке
      - Взять минус обратную величину, а не просто минус
      - Написать прямую через ту же точку с этим наклоном
    traps:
      - "Взято −m вместо −1/m: у наклона 2 нормаль идёт с −1/2, а не с −2"
      - "Сдана касательная вместо нормали"
      - "Горизонтальная касательная: нормаль там вертикальна, и уравнения
        вида y = mx + c у неё нет вовсе"
      - "Обратная величина взята, но знак потерян"
    calculator:
      mode: mixed
      note: >
        Пять баллов из семи — Paper 1, где ответ печатают в условии
        («show that the equation of L is y = −x/2 + 1») и всё считается
        в уме. Оставшиеся два — Paper 3 с буквой вместо числа.
    prereq: [tangent_line]
    raw_tags: [normal_line, negative_reciprocal, derivative, substitution,
               point_slope_form, implicit_differentiation]
    blocks: [2025-NOV-TZ3-P1-Q09-C, 2025-NOV-TZ1-P3-Q01-A-I]

  - id: point_from_gradient
    name: Наклон дан — найти точку
    rung: 3
    trigger: >
      Известен наклон, а не точка. Сказано это может быть тремя способами:
      числом («gradient of L is 1/3»), другой прямой («parallel to y = x»)
      или углом («makes an angle of 70° to the horizontal»). Спрашивают,
      где кривая идёт именно так.
    chain:
      - "Перевести условие в число: наклон прямой, или tan угла"
      - Приравнять к нему производную и решить полученное уравнение
      - Отобрать корни, попадающие в область из условия
      - Подставить их в саму функцию, если спрошены координаты
    traps:
      - "Найден x, а спрошены координаты: вторая координата — отдельный балл"
      - "В ответ попал лишний корень: у ln(x² − 16) с x > 4 корней два,
        а годится один, и за второй снимают балл"
      - "Угол подставлен вместо тангенса: наклон равен tan 70°, а не 70"
      - "Калькулятор в градусах, когда условие в радианах, и наоборот"
      - "Ответ округлён там, где сказано exact: 2 ln 45 — это точно,
        7.61 — нет"
    calculator:
      mode: mixed
      note: >
        Одиннадцать баллов из семнадцати — Paper 2, и семь из них
        настоящие: уравнение e^(2x)(6x − 5) = 1 и кубическое уравнение
        на a решаются только машиной. Остальное точное.
    prereq: [tangent_line]
    raw_tags: [set_derivative_equal_to_value, set_derivative_equal_to_constant,
               solve_exponential_equation, solve_quadratic_equation,
               apply_domain_condition, exact_coordinates, evaluate_function,
               solve_equation_gdc, tangent_slope, trigonometric_equation,
               cross_multiply, rearrange_quadratic]
    blocks: [2021-MAY-TZ1-P2-Q10-B, 2021-MAY-TZ2-P1-Q04-B,
             2022-NOV-COMMON-P2-Q11-B, 2025-MAY-TZ3-P2-Q05-B]

  - id: implicit_derivative
    name: Кривая задана уравнением
    rung: 4
    trigger: >
      В условии равенство, в котором y стоит наравне с x и выразить его
      нельзя или не хочется — e^(x+y) = x² + y², y² = x³ + x,
      4x² + y² − 24x + 4y + 20 = 0. Ответ будет содержать обе буквы.
    chain:
      - Дифференцировать обе части по x, помня, что y — функция от x
      - У каждого слагаемого с y дописать множитель dy/dx
      - Собрать слагаемые с dy/dx в одну сторону
      - Выразить dy/dx делением
    traps:
      - "Множитель dy/dx не дописан: производная y² по x — это 2y·dy/dx,
        а не 2y"
      - "Произведение xy продифференцировано как x·dy/dx, без второго
        слагаемого y"
      - "Слагаемые с dy/dx собраны, но общий множитель не вынесен,
        и деление сделано не на то"
      - "Логарифмическое дифференцирование забыто там, где x стоит и
        в основании, и в показателе: (S/x)^x иначе не берётся"
    calculator:
      mode: mixed
      note: >
        Двенадцать баллов из двадцати одного — Paper 2, девять — Paper 3,
        и калькулятор не нужен ни разу: все четыре ответа напечатаны
        в условии как AG, а пятый — x = S/e.
    prereq: [tangent_line]
    raw_tags: [implicit_differentiation, product_rule, chain_rule,
               collect_terms, algebraic_rearrangement, algebraic_simplification,
               logarithmic_transformation, set_derivative_to_zero,
               solve_for_variable, algebraic_manipulation, derivative]
    blocks: [2021-NOV-COMMON-P2-Q08-A, 2022-MAY-TZ2-P3-Q01-D-I,
             2024-MAY-TZ1-P2-Q11-A, 2025-MAY-TZ2-P2-Q12-A,
             2023-MAY-TZ1-P3-Q02-H]

  - id: implicit_tangent
    name: Касательная к кривой, заданной уравнением
    rung: 5
    trigger: >
      Наклон уже выражен через x и y — своим трудом или напечатан
      в предыдущем пункте, — и теперь нужна прямая в точке кривой или
      точка с нужным наклоном. Отличие от приёма 3 одно: чтобы посчитать
      наклон, нужны обе координаты сразу.
    chain:
      - Найти вторую координату точки из уравнения самой кривой
      - Подставить обе координаты в выражение для dy/dx
      - Написать прямую через точку и наклон
      - Для обратного хода — приравнять dy/dx к нужному числу и решать
        полученное уравнение вместе с уравнением кривой
    traps:
      - "Подставлена только одна координата: выражение с двумя буквами
        числом от этого не становится"
      - "Горизонтальная касательная искалась приравниванием к нулю всей
        дроби, а не её числителя"
      - "Найдена одна точка из двух: у e^(x+y) = x² + y² горизонтальных
        касательных две"
      - "Точка взята с прямой, а не с кривой"
      - "Координаты округлены до трёх цифр в промежуточном шаге, и
        вторая координата уехала в четвёртой"
    calculator:
      mode: mixed
      note: >
        Восемнадцать баллов из двадцати — Paper 2, и здесь калькулятор
        наконец при деле: 2x² + (ln 2x)² − 2x ln 2x − 2x = 0 и e^(2x) = 2x²
        решаются численно, ответы 0.331, 1.84 и −0.451.
    prereq: [implicit_derivative, point_from_gradient]
    raw_tags: [implicit_equation_solving, evaluate_derivative,
               tangent_line_equation, substitution, set_derivative_zero,
               logarithmic_transform, numerical_solve_gdc,
               coordinate_evaluation, gradient_condition, numerical_solving,
               evaluate_derivative_at_point]
    blocks: [2021-NOV-COMMON-P2-Q08-B, 2022-MAY-TZ2-P3-Q01-F-I,
             2024-MAY-TZ1-P2-Q11-B-I-II, 2024-MAY-TZ1-P2-Q11-D]

  - id: second_implicit
    name: Продифференцировать соотношение ещё раз
    rung: 6
    trigger: >
      Спрошена d²y/dx² или d²P/dt², а y относительно x не выражен — есть
      только соотношение, связывающее его с производной. Дифференцировать
      придётся не функцию, а равенство.
    chain:
      - Дифференцировать по x обе части уже полученного равенства
      - К произведениям применить правило произведения, помня, что и y,
        и dy/dx — функции от x
      - Подставить dy/dx из первого равенства, если ответ должен обойтись
        без неё
      - Подставить числа только в самом конце
    traps:
      - "Производная от dy/dx взята как ноль: это функция, и её
        производная — d²y/dx²"
      - "В произведении x·dy/dx продифференцирован только один множитель"
      - "Квадрат (dy/dx)² потерян или взят с обратным знаком"
      - "Числа подставлены до дифференцирования, и переменная исчезла
        раньше времени"
      - "Сдана первая производная вместо второй"
    calculator:
      mode: allowed
      note: >
        Все пятнадцать баллов — Paper 2, и все с калькулятором на столе.
        Считать им нужно ровно один раз: 8.064 в последнем пункте.
        Остальное — три «show that».
    prereq: [implicit_derivative]
    raw_tags: [second_derivative, implicit_differentiation, product_rule,
               quotient_rule, chain_rule, algebraic_substitution,
               algebraic_simplification, evaluate_second_derivative,
               substitution, algebraic_manipulation]
    blocks: [2022-MAY-TZ2-P2-Q12-B, 2023-MAY-TZ1-P2-Q12-B-I-II,
             2025-NOV-TZ3-P2-Q12-B-I, 2025-NOV-TZ3-P2-Q12-B-II]

  - id: right_angles
    name: Прямой угол как условие
    rung: 7
    trigger: >
      Речь о двух кривых или двух касательных сразу, и сказано
      «intersect at right angles», «perpendicular», «orthogonal».
      Спрашивают не прямую, а то, что произведение наклонов равно −1.
    chain:
      - Найти наклон каждой кривой в общей точке — своим дифференцированием
      - Подставить в оба общую точку, а не разные
      - Перемножить и упростить до −1
      - Сказать вслух, что это и означает прямой угол
    traps:
      - "Наклоны найдены, а перемножены не они: подставлена не общая точка"
      - "Показано, что наклоны различны, и на этом остановлено"
      - "Сумма наклонов приравнена к нулю вместо произведения к −1"
      - "У семейства кривых наклон прямой y = mx выражен через m, а нужен
        через x и y: m = y/x — это отдельный балл и весь ход дальше"
      - "Корень √(ab) сокращён неверно: −a/√(ab) · b/√(ab) = −ab/ab = −1,
        и промежуточная запись здесь нужна"
    calculator:
      mode: mixed
      note: >
        Одиннадцать баллов из четырнадцати — одно ноябрьское исследование
        2023 года про ортогональные траектории, где считать нечего:
        ответ −1 по построению. Три балла Paper 1 — то же самое на
        cos x и tan x.
    prereq: [normal_line, implicit_derivative]
    raw_tags: [perpendicular_condition, gradient_product,
               verify_orthogonal_gradients, orthogonality_check,
               perpendicular_gradients, gradient_of_line,
               rearrange_linear_equation, trigonometric_derivatives,
               differentiation]
    blocks: [2023-MAY-TZ2-P1-Q08-B, 2023-NOV-TZ1-P3-Q02-D,
             2023-NOV-TZ2-P3-Q02-D, 2023-NOV-TZ2-P3-Q02-A-I]

  - id: tangency_condition
    name: Касание как условие
    rung: 8
    trigger: >
      Касательная в вопросе есть, но её не спрашивают. «Have a common
      tangent at x = 3», «the tangent is parallel to y = 5e^k x»,
      «show that the line is tangent to the curve», «y = x is a tangent
      to y = log_a x». Неизвестна постоянная, а касание — уравнение на неё.
    chain:
      - "Записать первое условие: наклоны равны в этой точке"
      - "Записать второе: значения тоже равны, кривые встречаются"
      - Решить систему относительно неизвестной постоянной
      - Проверить, что найденное значение попадает в область из условия
    traps:
      - "Использовано только одно из двух условий: равенство наклонов
        без равенства значений даёт параллельность, а не касание"
      - "Касание проверено подстановкой одной точки: у кривой и прямой
        общая точка бывает и при пересечении"
      - "Двойной корень назван корнем: (x − 4)²(x − 1) = 0 касается
        в x = 4 именно потому, что корень двойной"
      - "e^k сокращено делением на ноль без оговорки, что оно не ноль"
      - "Ответ округлён там, где спрошено exact: a = e^(1/e), а не 1.44"
    calculator:
      mode: mixed
      note: >
        Одиннадцать баллов Paper 1 и двенадцать Paper 3, и калькулятора
        не требует ни один: ответы e + e²/4, k = 3, (e, e), a = e^(1/e).
        Единственное место темы, где 1.4 ≤ a ≤ 1.5 из условия служит
        подсказкой, а не заданием на счёт.
    prereq: [point_from_gradient, tangent_line]
    raw_tags: [equate_derivatives, equate_functions, substitute_parameter,
               simplify_algebraic, equate_slopes, solve_linear_equation,
               tangent_verification, tangent_condition, differentiate_logarithmic,
               set_derivative_equal, solve_logarithmic_equation,
               simultaneous_equations, product_rule, derivative_evaluation,
               differentiate_exponential, solve_linear]
    blocks: [2021-MAY-TZ1-P1-Q04-B, 2021-MAY-TZ1-P1-Q04-C,
             2022-MAY-TZ1-P1-Q04, 2022-MAY-TZ1-P3-Q02-B,
             2023-MAY-TZ2-P3-Q01-E]

corpus_issues:
  - block: 2021-NOV-COMMON-P2-Q08-A
    issue: >
      task_summary печатает совсем не то равенство, которое стоит
      в бумаге. Корпус — «(1 + ln(xy)) dy/dx + (1 + y/x) = 0», бумага —
      «dy/dx + (x dy/dx + y)(1 + ln(xy)) = 1». Второе выводится из
      y = x − xy ln(xy) и верно, первое не выводится ниоткуда.
      Вопрос — «show that», то есть напечатанная строка и есть цель,
      и по корпусу его решить нельзя. В evidence, кстати, единица
      уцелела: «final line ... = 1 leading to AG».
  - block: 2025-NOV-TZ3-P2-Q12-B-I
    issue: >
      То же самое и хуже. Корпус пишет
      «(x²+xy)y″ = 2(x y′ − y)(y′ + 1) + (x²+xy)y′ − (x²+3xy−2y²)»,
      бумага — «(x²+xy)y″ = 2x + y − x(y′)² − (x + 7y)y′». Это не
      другая запись одного и того же: у корпуса при (dy/dx)² стоит +2x,
      у бумаги −x. Проверено подстановкой x = 1, y = 3/2, y′ = −1.7:
      бумага даёт 8.064, что и напечатано в схеме оценивания следующим
      пунктом.
  - block: 2021-MAY-TZ1-P1-Q04-C
    issue: >
      k = (2e + e²)/4 ≈ 3.21 вместо напечатанного k = e + e²/4 ≈ 4.57.
      Замечание уже стоит в карточке E3 — там оно было найдено при
      сборке соседнего практикума, а блок принадлежит этому.
  - block: 2023-MAY-TZ1-P3-Q02-H
    issue: >
      Корпус пишет «g(x) = ln((S/x)^x)», бумага — «ln(g(x)) = x ln(S/x)»,
      то есть g(x) = (S/x)^x. Это разные функции. На ответ пункта (h)
      не влияет — x-координата максимума в обоих случаях S/e, — но
