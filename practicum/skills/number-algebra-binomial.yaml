version: 0.1
practicum: A3
title: Биномиальная теорема
source_topic: number_algebra.binomial_theorem
corpus:
  blocks: 24
  marks: 109
  sessions: May 2021 — November 2025
  papers: {1: 77, 2: 32, 3: 0}
  gdc_marks: 32
  note: >
    Тема взята целиком, делить не пришлось. Единственная в секции A,
    где нет ни одного блока Paper 3: вопросы короткие и самостоятельные,
    в длинные исследования бином не заходит.

principle: >
  Шесть приёмов из семи — прочтения формулы общего члена
  T_{r+1} = C(n,r) a^{n−r} b^r. Приём 1 её частный случай, когда членов мало
  и проще выписать все; приём 3 применяет её дважды и сравнивает; приём 4 —
  трижды и смотрит на связь; приём 5 продолжает её на нецелые n; приём 6
  перемножает два таких ряда; приём 7 подставляет в неё i.

  Отсюда главное умение темы: не раскрывать. Вопрос почти всегда про один
  член, и ищут не разложение, а номер r — приравнивают показатель x
  в общем члене к нужному и решают. Три строки вместо девяти слагаемых.

skills:
  - id: full_expansion
    name: Раскрыть целиком
    rung: 1
    trigger: "«Expand and simplify», показатель не больше 5."
    chain:
      - Дописать строку треугольника Паскаля или взять коэффициенты формулой
      - Собрать члены по убыванию или возрастанию степени
    traps:
      - >
        Первое слагаемое скобки не единица, а его степень всё равно входит
        в каждый член: в (3 + x²)^8 остаётся 3^{8−r}
      - Знак второго слагаемого теряется, и вместо (−1)^r в ответе плюсы
    calculator:
      mode: checks
      note: >
        До n = 7 строку треугольника быстрее дописать, чем считать факториалы,
        и markscheme это принимает явно.
    prereq: []
    raw_tags: [binomial_expansion, binomial_coefficient, pascal_triangle,
               factorial_calculation, polynomial_expansion]
    blocks: [2025-MAY-TZ1-P1-Q02-B, 2022-MAY-TZ2-P1-Q05-A, 2021-MAY-TZ2-P2-Q09-A]

  - id: general_term
    name: Общий член
    rung: 2
    trigger: >
      «The coefficient of x^k», «the term in x^k», «the constant term»,
      «the term independent of x». Показатель большой, раскрывать нельзя.
    chain:
      - "Выписать T_{r+1} = C(n,r) a^{n−r} b^r, подставив содержимое скобки"
      - Собрать все степени x в одну; показатель окажется линейным по r
      - Приравнять показатель к нужному и найти r
      - Подставить r обратно и посчитать коэффициент
    traps:
      - >
        Нумерация: член с номером r+1, а не r. «Третий член» — это r = 2
      - >
        Член против коэффициента: «the coefficient of x^5» — число без x^5
      - >
        Дробное r округляют. Если r = 5/3, такого члена нет, и это часто
        и есть ответ («только при n, кратных 4»)
    calculator:
      mode: partial
      note: >
        Показатель и номер r — руками в обеих бумагах, на них все M1.
        Калькулятор подключается после: решить уравнение вида
        n(n+1)/2·3^{n−1} = 20412 аналитически нельзя, и markscheme
        разрешает подбор и графики.
    prereq: [full_expansion]
    raw_tags: [general_term, binomial_general_term, coefficient_extraction,
               exponent_analysis, integer_condition, power_matching,
               term_selection, identify_term, rewrite_expression, gdc_solver]
    blocks: [2021-MAY-TZ2-P1-Q03, 2021-MAY-TZ1-P2-Q05, 2022-MAY-TZ1-P1-Q06,
             2022-NOV-COMMON-P2-Q05, 2025-MAY-TZ3-P2-Q07]

  - id: equate_coefficients
    name: Приравнять коэффициенты
    rung: 3
    trigger: >
      Разложение выписано в условии, в скобке буквы. Два известных
      коэффициента — два уравнения.
    chain:
      - Посчитать те же коэффициенты формулой
      - Приравнять и сократить общий множитель, если он есть
      - Решить систему и отобрать корни по условию
    traps:
      - >
        Не сокращают k² во втором уравнении и вязнут в системе двух
        неизвестных, хотя n находится отдельно
      - >
        Не отбрасывают посторонний корень: n² − n − 56 = 0 даёт n = 8
        и n = −7, а в условии написано n ∈ ℤ⁺
      - >
        Путают, какая буква входит в квадрате. В (ax³+b)^8 степень x
        приносит только ax³, и для x^6 этот множитель взят дважды: a², а не a^6
    calculator:
      mode: partial
      note: >
        В Paper 2 систему разрешено решать графически. Но деление одного
        уравнения на другое короче любого графика: в задании про (ax³+b)^n
        так сразу уходит a².
    prereq: [general_term]
    raw_tags: [equate_coefficients, equating_coefficients, coefficient_equating,
               simultaneous_equations, equation_setup, equation_solving,
               quadratic_equation, solve_quadratic, substitution,
               binomial_coefficient_formula, solving_simultaneous_equations]
    blocks: [2023-NOV-TZ1-P1-Q05, 2023-NOV-TZ2-P1-Q05, 2023-MAY-TZ1-P2-Q05,
             2025-MAY-TZ2-P1-Q11-C]

  - id: coefficients_as_sequence
    name: Коэффициенты как последовательность
    rung: 4
    trigger: >
      «Arithmetic mean», «form a geometric sequence», «are in arithmetic
      progression» — про сами коэффициенты разложения.
    chain:
      - Формулой общего члена выписать три нужных коэффициента
      - "Записать условие связи: 2T₃ = T₂ + T₄ либо T₃/T₂ = T₄/T₃"
      - Решить уравнение и отбросить вырожденный корень
    traps:
      - >
        Корень 0 появляется почти всегда, потому что уравнение получено
        делением на степень x или h. Markscheme пишет прямо: «award final A0
        for obtaining x = 0»
      - >
        Берут три подряд идущих коэффициента, хотя в условии пропуск:
        x^7, x^6 и x^4, а не x^7, x^6, x^5
    calculator:
      mode: checks
      note: 7 из 12 баллов — Paper 2, но уравнение всё равно квадратное.
    prereq: [general_term]
    raw_tags: [arithmetic_mean, geometric_sequence, common_ratio,
               algebraic_simplification, solving_quadratic, factoring]
    blocks: [2022-MAY-TZ2-P1-Q05-B, 2023-MAY-TZ2-P2-Q04]

  - id: fractional_index
    name: Дробный и отрицательный показатель
    rung: 5
    trigger: >
      Показатель не целый положительный: (1+x)^{1/2}, (1−x)^{-1},
      1/√(1−x²), 1/(2−qx). Просят «first n terms in ascending powers».
    chain:
      - "Привести к форме (1 + …)^m, вынеся константу: 1/(2−qx) = ½(1 − qx/2)^{-1}"
      - "Считать коэффициенты по одному: m, m(m−1)/2!, m(m−1)(m−2)/3!"
      - Подставлять всю скобку целиком, вместе со знаком и множителем
      - Записать область сходимости
    traps:
      - >
        Пытаются применить C(n,r) с факториалами при дробном n. Факториала
        от ½ нет; работает только произведение m(m−1)(m−2)…
      - >
        Возводят в степень только x, забыв множитель: −⅛x² вместо −25/8·x²
        для (1+5x)^{1/2}
      - >
        Не выносят константу, и формула применяется к (2 − qx) как есть
      - >
        Не пишут область сходимости. В ноябре 2021 за строку «|x| < 1»
        стоял отдельный A1
    convergence: >
      (1+cx)^m сходится при |cx| < 1, то есть |x| < 1/|c|. Когда скобок
      несколько, берут самую жёсткую границу из всех.
    calculator:
      mode: forbidden
      note: Все 18 баллов приёма — Paper 1.
    prereq: [full_expansion]
    raw_tags: [binomial_expansion_fractional, fractional_exponent,
               negative_exponent, ascending_powers, series_expansion,
               convergence_condition, absolute_value_inequality,
               algebraic_solving]
    blocks: [2025-MAY-TZ2-P1-Q11-A, 2025-NOV-TZ1-P1-Q10-A-I,
             2025-NOV-TZ1-P1-Q10-B-I, 2021-NOV-COMMON-P1-Q09-A,
             2021-NOV-COMMON-P1-Q09-B]

  - id: product_and_approximation
    name: Произведение рядов и приближение
    rung: 6
    trigger: >
      «Up to and including the term in x²» для произведения или дроби;
      «use your expansion to approximate».
    chain:
      - Каждый сомножитель разложить до той же степени, не дальше
      - Перемножить и выбросить всё выше требуемой степени
      - "Для приближения: приравнять выражение нужному числу и найти x"
      - Проверить, что найденный x лежит в области сходимости
    traps:
      - >
        Раскладывают сомножители дальше, чем нужно, и тратят время
        на члены, которые всё равно уйдут
      - >
        Объясняют потерю точности чем угодно, кроме верного: хвост ряда
        тем больше, чем больше подставляемый |x|
      - >
        Не различают «менее точно» и «неприменимо». Если найденный x
        вышел за область сходимости, о точности говорить уже нельзя
    calculator:
      mode: forbidden
      note: Оба блока — Paper 1, ответ требуется дробью.
    prereq: [fractional_index, equate_coefficients]
    raw_tags: [series_multiplication, approximation, error_analysis,
               substitution]
    blocks: [2025-MAY-TZ2-P1-Q11-B, 2025-MAY-TZ2-P1-Q11-D]

  - id: binomial_with_i
    name: Бином и комплексные числа
    rung: 7
    trigger: >
      (cos θ + i sin θ)^n, (1+i)^n, либо чётная комбинация вида
      (1+z)^4 + (1−z)^4.
    chain:
      - Раскрыть по биному, коэффициенты взять из треугольника
      - "Заменить степени i: i² = −1, i³ = −i, i⁴ = 1"
      - Собрать чётные r в действительную часть, нечётные — в мнимую
      - "Для подстановки z = i tan θ помнить, что z² = −tan²θ"
    traps:
      - >
        Знаки внутри частей: чередование +, −, + теряется на третьем члене
      - >
        Выбор корня в конце не обоснован. Из tan²(π/8) = 3 ∓ 2√2 надо ещё
        сказать, почему берётся меньший — за это стоит R1
    calculator:
      mode: forbidden
      note: Все 15 баллов — Paper 1.
    prereq: [full_expansion]
    raw_tags: [powers_of_i, collect_real_imaginary_parts, complex_separation,
               evaluate_powers_of_i, polynomial_simplification,
               quadratic_solving, root_selection]
    blocks: [2023-NOV-TZ1-P1-Q12-A, 2023-NOV-TZ2-P1-Q12-A, 2025-NOV-TZ3-P1-Q11-D]

# Куда ведёт тема дальше.
leads_to:
  - practicum: A6
    what: >
      Приём binomial_with_i делает первую половину работы: раскладывает
      (cos θ + i sin θ)^n на части. Вторая половина — приравнять их
      к cos nθ и sin nθ по Муавру и получить формулы кратного угла —
      живёт в A6, приём trig_via_de_moivre.
  - practicum: E2
    what: >
      Разложение с дробным показателем — это ряд Маклорена для (1+x)^m,
      посчитанный без производных. В E2 та же функция получается общим
      способом, и совпадение стоит проверить.

# Что проверка практикума принципиально не ловит.
verification_limits:
  - what: требование раскрыть скобки
    why: >
      check_series сверяет значения, а (1+x)**4 численно равно своему
      разложению. Ответ в нераскрытом виде проверка примет, хотя в условии
      сказано «expand». Отличить их по значениям нельзя в принципе.
  - what: требуемая форма записи тригонометрического ответа
    why: >
      Для (cos θ + i sin θ)^5 условие просит выразить части через sin θ
      и cos θ. Ответ cos(5θ) численно тот же, и проверка его примет,
      а markscheme — нет: это ровно то, что доказывают. Поведение
      зафиксировано в test_kit_series.py и оговорено в ноутбуке.

# Расхождения с разметкой корпуса. В classification/ ничего не менялось.
corpus_issues:
  - block: 2023-MAY-TZ1-P2-Q05
    what: >
      В method_path коэффициент при x^6 записан как C(8,2)·a^6·b^2, и та же
      запись повторена в evidence. Степени перепутаны местами: x^6 приносит
      только ax³, взятый дважды, поэтому коэффициент равен C(8,2)·a²·b^6.
    check: >
      sympy: коэффициент при x^6 в (ax³+b)^8 равен 28a²b^6, в (ax³+b)^10 —
      45a²b^8. Система из записи корпуса (28a^6b² = 448, 45a^8b² = 2880)
      даёт a = 2, b = 1/2 — то есть ровно перевёрнутый ответ.
    impact: >
      Итоговый ответ в корпусе (a = 1/2, b = 2) верен и с его же выкладкой
      не согласуется. На практикум не влияет: в verify_a3.py коэффициенты
      берутся из настоящих разложений, а перевёрнутый вариант стоит
      в негативных проверках.
  - block: 2025-MAY-TZ2-P1-Q11-D
    what: >
      В method_path и task_summary цель приближения записана как sqrt(5/2).
      Читать надо √5/2, то есть (√5)/2.
    check: >
      Markscheme даёт x = 1/20 и обоснование «1/20 > 1/25». Значение
      x = 1/20 отвечает 1+5x = 5/4, а это √5/2 = √1.25. Для √(5/2) = √2.5
      понадобилось бы 1+5x = 5/2, то есть x = 3/10, а это вне области
      сходимости |x| < 1/5 — и ответом было бы не «менее точно»,
      а «разложение неприменимо».
    impact: >
      Практикум использует чтение √5/2, как того требует markscheme;
      второй случай разобран отдельно в решении, потому что различать
      «менее точно» и «неприменимо» полезно само по себе.
  - block: 2022-NOV-COMMON-P2-Q05
    what: >
      Блок помечен review_flags: formula_extraction_uncertain, и разбор
      внутренне противоречив. В (ax + 1/x²)^9 общий член равен
      C(9,r)a^{9−r}x^{9−3r}, поэтому члена с x^4 не существует вовсе
      (9−3r = 4 даёт r = 5/3), а упомянутый «C(9,6)(ax)³» отвечает x^{−9},
      не x^6. Правая часть уравнения указана двумя разными способами:
      24a^5 в method_path и (8/7)a^5 в accepted_alternatives, и они дают
      разные ответы.
    impact: >
      Блок не используется как задание. Приём general_term отрабатывается
      на 2021-MAY-TZ1-P2-Q05 и 2022-MAY-TZ1-P1-Q06, проверенных sympy.

ladder:
  - full_expansion
  - general_term
  - equate_coefficients
  - coefficients_as_sequence
  - fractional_index
  - product_and_approximation
  - binomial_with_i
