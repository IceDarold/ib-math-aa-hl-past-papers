version: 0.1
practicum: E8
title: Стационарные точки, вогнутость, перегиб
source_topic: calculus.stationary_points
also_covers: []

corpus:
  blocks: 43
  marks: 114
  effective_blocks: 39
  effective_marks: 101
  sessions: May 2021 — November 2025
  papers: {1: 35, 2: 11, 3: 68}
  gdc_marks: 79
  note: >
    Тема взята целиком: 43 блока и 114 баллов, внутри верхней границы
    гранулярности, и резать её не на что. Вопрос всегда один и тот же —
    что происходит с графиком в точке, — и меняется только то, что о ней
    спрашивают: где она, какая она, по какую сторону оси и сколько их.

    Дубль ноября 2023 года здесь снова есть, и на этот раз он двойной.
    Paper 3 ноября 2023 — общая бумага (в архиве она лежит в
    AA_HL/2023/November/Common), а Paper 1 TZ1 и TZ2 оказались одной и той
    же бумагой: вопрос 11 в них совпадает слово в слово. Классификация
    прогнана по обеим зонам, и четыре блока задвоились: P1 Q11(b) (4),
    P3 Q1(e) (5), P3 Q1(f)(i) (3), P3 Q1(g)(i) (1) — всего 13 баллов.
    Рабочих блоков поэтому 39, рабочих баллов 101.

    Два прогона разошлись и там, где блок остался один. P1 Q11(a) в TZ1
    уехал в calculus.differentiation, а в TZ2 остался здесь; P3 Q1(f)(ii)
    в TZ2 уехал в functions.curve_sketching, а в TZ1 остался; P3 Q1(g)(ii)
    в TZ2 уехал в functions.equations. Это то же измерение разброса
    разметки, что дало 14% в E5, и здесь оно видно поимённо.

    Paper 3 весит 68 баллов из 114 — больше, чем Paper 1 и Paper 2 вместе.
    Тема живёт в длинных исследованиях, и понятно почему: стационарная
    точка семейства кривых — идеальный материал для вопроса, который
    строится десятью пунктами. Одно майское исследование 2021 года (TZ1
    Paper 3 Q1, кубики x³ − 3cx + d) даёт 20 баллов, ноябрьское 2023
    (x³ + ax² + b) — 11, майское 2021 TZ2 (xⁿ(a − x)ⁿ) — 5.

    79 баллов формально с калькулятором, 70 после вычета дубля. Настоящей
    работы для GDC здесь баллов на тринадцать: вершина ln(xeˣ + 1) − x⁴
    (2), перегиб у (3x + 2)/(4x² − 1) (2), перегиб через график
    производной в мае 2023 TZ2 (2), момент покоя частицы (2), вершины
    кубической дроби мая 2025 TZ2 Paper 3 (2) и часть вершины эллипса мая
    2025 TZ2 Paper 2 (3). Всё остальное — буквы, слова и неравенства, а у
    них кнопки нет. Восьмая иллюзия калькулятора и самая большая по доле.

    Один балл доли не про стационарные точки вовсе: май 2025 TZ2 Paper 3
    Q1(d)(iii) просит точку, где касательная параллельна наклонной
    асимптоте. Наклон там равен единице, а не нулю; блок оставлен в доле,
    чтобы тема складывалась в единицу, но в ноутбуки не идёт — записан в
    leftovers и corpus_issues.

directions:
  - >
    Стационарная точка — место на кривой, а не формула. У неё две
    координаты, и вторая берётся у самой функции, а не у производной.
  - >
    Вид точки решают соседи. Вторая производная — только признак, и при
    f″ = 0 она не говорит ничего: у x⁴ и у x⁵ в нуле она одинакова, а
    точки разные.
  - >
    Перегиб — это два условия: f″ = 0 и смена знака f″. Схема ставит R0
    за «потому что f″(c) = 0» и ставит балл за «потому что f″ меняет знак».
  - >
    «Выше или ниже оси» — отдельный вопрос от «максимум или минимум», и
    отдельный балл. Максимум бывает и ниже оси.
  - >
    «Сколько таких точек» — вопрос не о точках, а о числе решений f′ = 0,
    и решается он дискриминантом. «Сколько пересечений с осью» — вопрос о
    знаках стационарных значений.

skills:
  - id: find
    name: Найти точку — обе координаты
    rung: 1
    trigger: >
      «Find the coordinates of the local minimum point»; «find the points on
      the curve where the gradient is zero»; «the graph has a local minimum
      at (p, q), find p and q»; «the particle first comes to rest». Функция
      дана, и нужна точка, в которой её график горизонтален.
    chain:
      - "Продифференцировать и приравнять производную нулю"
      - "Решить уравнение — точно, если бумага без калькулятора, иначе GDC"
      - "Подставить каждый корень в саму функцию: вторая координата берётся у f"
      - "Проверить, все ли корни попали в область из условия"
      - "Закрытый отрезок добавляет концы: они не стационарны, но могут быть
        крайними значениями"
    traps:
      - "Названо x и на этом остановились: вторая координата — отдельный балл"
      - "Вторая координата взята у f′, а не у f, и вышел ноль"
      - "Найден один корень из двух или из трёх: схема даёт A0 за неполный набор"
      - "Дробь приравняли нулю целиком, вместе со знаменателем: нулю равен
        только числитель, и знаменатель там обязан быть жив"
      - "Округлённое x подставлено обратно, и третья значащая цифра y уехала"
    calculator:
      mode: mixed
      note: >
        Из 27 баллов приёма 12 на некалькуляторных бумагах и требуют точных
        значений: −64/3, ±1/√2, (0, e). Остальные 15 — GDC, и там он делает
        всю работу разом, обеими координатами.
    prereq: []
    raw_tags: [differentiate, set_derivative_zero, solve_equation, substitute,
               evaluate_function, solve_derivative_zero, find_critical_points,
               find_coordinates, set_derivative_to_zero, gdc_find_maximum,
               extract_coordinates, round_values, stationary_point, substitution,
               find_maximum_of_quadratic, function_evaluation, determine_range,
               solve_trigonometric_equation, chain_rule, product_rule,
               state_coordinates, evaluate_at_critical_point]
    blocks: ['2025-MAY-TZ1-P1-Q01', '2023-NOV-TZ2-P1-Q11-A',
             '2022-NOV-COMMON-P2-Q02-A', '2025-MAY-TZ2-P2-Q12-C',
             '2025-MAY-TZ2-P3-Q01-A-III', '2023-MAY-TZ1-P3-Q02-B-I',
             '2023-MAY-TZ1-P3-Q02-B-II', '2023-NOV-TZ1-P2-Q04-A',
             '2022-MAY-TZ2-P1-Q06-B']

  - id: classify
    name: Вид точки по второй производной
    rung: 2
    trigger: >
      «Using the second derivative at each point, show that…»; «find d²y/dx²
      and hence determine whether each point is a local maximum or a local
      minimum»; «use d²V/dx² to show that there is a local maximum». Точки
      уже найдены, и спрашивают, какие они.
    chain:
      - "Продифференцировать ещё раз"
      - "Подставить каждую стационарную точку"
      - "Отрицательно — максимум, положительно — минимум"
      - "Выписать само значение, а не только его знак"
      - "С буквой: упростить до вида, у которого знак виден — например до
        −4√(a² − ab + b²)"
    traps:
      - "Знак прочитан наоборот: f″ < 0 это максимум, кривая выгнута вниз"
      - "При f″ = 0 объявляют перегиб, а вывода нет никакого"
      - "Выписан только знак: схема требует значения («the values for the
        second derivative must be correct»)"
      - "Взята первая производная вместо второй"
      - "В семействе не сказано, какого знака параметр, и знак 2a остался
        неопределённым"
    calculator:
      mode: allowed
      note: >
        9 из 13 баллов на калькуляторных бумагах, но считать нечего: три
        подстановки в 6x + 2a и один корень, который заведомо положителен.
        Единственное место, где GDC помог бы, — упрощение при подстановке
        x_m в d²V/dx², и схема ждёт алгебры.
    prereq: [find]
    raw_tags: [second_derivative, second_derivative_test, classify_critical_points,
               classify_stationary_point, classify_stationary_points,
               evaluate_derivative, evaluate_at_point, substitute_critical_point,
               differentiate_polynomial]
    blocks: ['2023-NOV-TZ1-P1-Q11-B', '2023-NOV-TZ2-P1-Q11-B',
             '2023-NOV-TZ1-P3-Q01-F-I', '2023-NOV-TZ2-P3-Q01-F-I',
             '2023-NOV-TZ1-P3-Q01-G-I', '2023-NOV-TZ2-P3-Q01-G-I',
             '2025-MAY-TZ3-P3-Q02-D']

  - id: sign
    name: Вид точки по смене знака первой производной
    rung: 3
    trigger: >
      «State, with a reason, whether there is a local maximum point or a local
      minimum point»; «by considering the sign of fₙ′(−1), show that (0, 0)
      is…»; знаки производной даны диаграммой или выводятся из чётности
      показателя. Второй производной здесь либо нет, либо она молчит.
    chain:
      - "Взять по точке слева и справа от стационарной"
      - "Убедиться, что между ними нет другой стационарной точки"
      - "Определить знак f′ в каждой — счётом или разбором множителей"
      - "− потом + — минимум; + потом − — максимум; знак не сменился —
        перегиб с нулевым наклоном"
      - "Записать причину словами: смена знака и есть балл R"
    traps:
      - "Назван вид, но не названа причина: схема ставит A0R1 или вовсе
        A0, «do not award A0R1»"
      - "Взята точка по другую сторону от соседней вершины, и знак вышел чужой"
      - "Чётность показателя разобрана наоборот: при чётном n показатель
        n − 1 нечётен, и (−1)ⁿ⁻¹ = −1"
      - "Из f′(0) = 0 делают вывод о виде точки: сам по себе ноль не говорит
        ничего"
    calculator:
      mode: 'no'
      note: >
        Из 7 баллов 5 — Paper 3, но считать снова нечего: вся работа
        в знаке произведения n(−1)ⁿ⁻¹(a + 2)(a + 1)ⁿ⁻¹, и калькулятор
        с буквами не поможет. Остальные 2 — Paper 1, диаграмма знаков.
    prereq: [find]
    raw_tags: [first_derivative_test, sign_change, sign_analysis, parity_argument,
               classify_inflexion_point, reason_about_sign]
    blocks: ['2025-NOV-TZ1-P1-Q09-B', '2021-MAY-TZ2-P3-Q01-G-I',
             '2021-MAY-TZ2-P3-Q01-G-II']

  - id: inflexion
    name: Точка перегиба
    rung: 4
    trigger: >
      «Find the x-coordinate of the point of inflexion»; «write down the
      coordinates of the two points of inflexion»; «by sketching the graph of
      an appropriate derivative, determine the x-coordinate of P»; «state,
      with a reason, whether there is a point of inflexion at x = c».
    chain:
      - "Найти вторую производную и приравнять её нулю"
      - "Убедиться, что знак f″ при переходе меняется"
      - "На калькуляторной бумаге короче: вершина графика f′ — это и есть
        перегиб f"
      - "У неявной кривой дифференцировать ещё раз само равенство:
        2(dy/dx)² + 2y d²y/dx² = 6x"
      - "Координату y брать у исходной кривой"
    traps:
      - "Названо f″(c) = 0 как причина: схема ставит R0, нужна смена знака"
      - "Взята вершина самой f вместо вершины f′"
      - "У неявной кривой подставили dy/dx = 0 вместо d²y/dx² = 0"
      - "Ответ округлён мимо третьей цифры: 0.655 вместо 0.656"
      - "Найдена одна точка перегиба из двух: у y² = x³ + 1 их две, по одной
        на ветвь"
    calculator:
      mode: speeds_up
      note: >
        11 баллов из 18 на калькуляторных бумагах, и четыре из них GDC
        действительно берёт: −1.60 и 0.656 читаются с графика производной,
        и схема прямо называет этот путь («correct graph of dy/dx»).
        Остальное — алгебра с буквами и точное значение √((2√3 − 3)/3).
    prereq: [classify]
    raw_tags: [inflection_point, point_of_inflexion, identify_inflection_points,
