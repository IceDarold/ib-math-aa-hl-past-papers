  - id: none
    name: Показать, что стационарных точек нет
    rung: 8
    trigger: >
      «Show that the curve has no local maximum or local minimum points for
      x > 0»; «hence deduce that the curve has no local minimum or maximum
      points». Кривая почти всегда задана уравнением, а не формулой.
    chain:
      - "Продифференцировать неявно, с правилом произведения"
      - "Приравнять dy/dx нулю — у дроби это значит «числитель ноль»"
      - "Решить получившееся уравнение"
      - "Сверить решения с областью из условия — и отбросить все"
      - "Сказать вслух, что не осталось ни одного: это и есть последний балл"
    traps:
      - "Область из условия не применена, и найденные y = ±2 приняты за ответ"
      - "Числитель 3x² + 1 приравняли нулю и решили в комплексных"
      - "Дробь приравняли нулю вместе со знаменателем"
