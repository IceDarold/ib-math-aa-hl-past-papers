             '2022-MAY-TZ2-P3-Q01-B-I', '2022-MAY-TZ2-P3-Q01-E',
             '2023-MAY-TZ2-P2-Q12-E', '2025-NOV-TZ1-P1-Q09-D']

  - id: family
    name: Стационарные точки семейства с буквой
    rung: 5
    trigger: >
      «Show that the curve has a point of zero gradient at P(0, b) and at
      Q(−2a/3, 4a³/27 + b)»; «show that the y-coordinate of the local maximum
      point is 2c^{3/2} + 2». В функции стоит параметр, и ответ — выражение,
      а не число.
    chain:
      - "Дифференцировать по x; буква ведёт себя как число"
      - "Решить f′ = 0 относительно x — ответом будет выражение с буквой"
      - "Подставить каждый корень обратно в f и упростить"
      - "Довести запись ровно до напечатанной строки: за AG платят только
        за неё"
      - "Сказать, при каком знаке буквы точки вообще существуют"
    traps:
      - "Букву дифференцируют как переменную: у 3cx производная 3c, а не 3x"
      - "Корень найден, но не подставлен, и второй координаты нет"
      - "Выкладка оборвана до напечатанного вида: схема ставит A0 за
        −8a³/27 + 4a³/9 + b без приведения"
      - "(−√c)³ раскрыто без минуса: у нечётной степени знак сохраняется"
      - "Забыто, что c^{3/2} существует только при c ≥ 0"
    calculator:
      mode: 'no'
      note: >
        Все 9 баллов на калькуляторных бумагах Paper 3, и ни один балл
        калькулятору не достаётся: ответ — выражение с буквой, и схема
        требует выкладку до напечатанной строки.
    prereq: [find]
    raw_tags: [solve_for_critical_points, substitute_value, simplify_expression,
