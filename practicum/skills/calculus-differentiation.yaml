version: 0.2
practicum: E3
title: Техника дифференцирования
source_topic: calculus.differentiation
also_covers: []

corpus:
  blocks: 55
  marks: 188
  effective_blocks: 55
  effective_marks: 188
  sessions: May 2021 — November 2025
  papers: {1: 12, 2: 9, 3: 34}
  gdc_marks: 138
  note: >
    Тема calculus.differentiation целиком — это 98 блоков и 350 баллов,
    вдвое больше верхней границы. Она разрезана поимённо на три части,
    и списки лежат в blocks карточек, как это сделано у A5 и A6.

    E3 берёт 55 блоков и 188 баллов: всё, где спрашивают саму производную.
    E4 берёт 33 блока и 131 балл: всё, где производная работает наклоном —
    касательная, нормаль, «параллельно», «под углом», и кривая, заданная
    уравнением, а не формулой. E9 берёт 10 блоков и 31 балл: движение
    и скорость роста, то есть производную как скорость.

    Граница между E3 и E4 проходит по вопросу, а не по функции: «найдите
    f′(x)» — сюда, «найдите касательную» — туда. Один и тот же вопрос
    архива поэтому бывает разрезан: у мая 2022 Paper 3 пункт (d)(i)
    просит показать вид g′(x) и стоит здесь, а (d)(ii) строит по ней
    касательную и стоит в E4.

    Тридцать четыре блока из пятидесяти пяти — Paper 3. Тема живёт
    в длинных исследованиях, и это не случайность: производную там
    берут не ради ответа, а ради следующего пункта. Двадцать девять
    баллов из 188 — одно майское исследование 2025 года про кривизну,
    и ещё 10 — ноябрьское 2022 про поверхность вращения.

    73% баллов формально с калькулятором. Настоящей работы для GDC
    здесь на 15 баллов из 188: два корня неравенства в мае 2025 TZ2,
    два значения a в мае 2025 TZ3 и система трёх уравнений в мае 2024
    TZ2. Всё остальное на бумаге с калькулятором на столе — самая
    большая иллюзия калькулятора за девять практикумов.

directions:
  rules: >
    Функция дана, надо получить производную. Выбор правила — это чтение
    формы записи, и делается он до счёта: приёмы 1–5.
  combine: >
    Правило внутри правила, алгебра до напечатанного вида, вторая
    и высшие производные, буква вместо числа. Приёмы 6–8.
  read: >
    Производная уже есть, и её надо прочесть: где ноль, какого знака,
    что говорит вторая. Приём 9, и он стоит 51 балл из 188.

skills:
  - id: power_rule
    name: Степень и почленно
    rung: 1
    trigger: >
      Функция записана суммой степеней x — многочленом, конечной суммой
      с многоточием или рядом. Никаких скобок, дробей и функций от функции
      в ней нет, и это видно с одного взгляда.
    chain:
      - Разбить сумму на слагаемые
      - У каждого понизить показатель на единицу и умножить на старый
      - Постоянное слагаемое обнулить
    traps:
      - "Показатель понижают, но не выносят: у x⁴ производная 4x³, а не x³"
      - "Постоянную оставляют в ответе: у −3cx + 2 производная −3c,
        двойка исчезает целиком"
      - "Букву принимают за переменную: в x³ − 3cx + 2 дифференцируют по x,
        и c ведёт себя как число"
      - "В сумме с многоточием теряют последний член: у 1 + x + … + xⁿ
        производная кончается на nxⁿ⁻¹, и n там остаётся"
    calculator:
      mode: allowed
      note: >
        Формально четыре блока из пяти с калькулятором, но считать нечего:
        все ответы точные и короче, чем набор их на клавиатуре.
    prereq: []
    raw_tags: [power_rule, differentiate_polynomial, polynomial_differentiation,
               termwise_differentiation, differentiate_quadratic,
               differentiate_linear]
    blocks: [2021-MAY-TZ1-P1-Q04-A, 2021-MAY-TZ1-P3-Q01-B,
             2025-MAY-TZ1-P3-Q01-C-I, 2022-NOV-COMMON-P3-Q01-C,
             2022-NOV-COMMON-P3-Q01-D-I]

  - id: standard_derivatives
    name: Таблица производных
    rung: 2
    trigger: >
      В функции стоит sec, cosec, cot, tan, ln, eˣ или обратная
      тригонометрическая — то есть то, что не выводится из правила
      степени и берётся из справочника готовым.
    chain:
      - Узнать функцию в записи, включая sec и cosec
      - Взять её производную из справочника
      - Сохранить постоянные множители и знаки
    traps:
      - "d(sec θ)/dθ = sec θ tan θ, а d(cosec θ)/dθ = −cosec θ cot θ:
        у второй минус, и он теряется чаще всего"
      - "d(cot θ)/dθ = −cosec²θ, а не −cosec θ: квадрат теряют вместе
        со знаком"
      - "Постоянное слагаемое внутри дроби (2500 − 1000 tan θ)/3
        дифференцируют, забыв делить на 3"
      - "Производную ln x берут как 1/x и там, где аргумент не x"
    calculator:
      mode: mixed
      note: >
        Два блока из трёх — Paper 1, и оба требуют точной записи через
        sec и tan. Третий из Paper 3, где ответ тоже точный.
    prereq: [power_rule]
    raw_tags: [trigonometric_derivatives, differentiate_trigonometric,
               sec_derivative, tan_derivative, differentiate_exponential,
               derivative_of_exponential, differentiation_trigonometric,
               second_derivative]
    blocks: [2025-NOV-TZ3-P1-Q08-B, 2023-MAY-TZ1-P1-Q11-B,
             2021-NOV-COMMON-P3-Q01-A]

  - id: chain_rule
    name: Цепное правило
    rung: 3
    trigger: >
      Под знаком функции стоит не x, а выражение: e^(x²+1), √(r²−x²),
      ln(cot x), sin(sin x). Примета одна и надёжная — чтобы вычислить
      функцию в точке, приходится сначала вычислить что-то внутри.
    chain:
      - Назвать внутреннюю функцию u
      - Взять производную внешней по u, оставив u внутри
      - Умножить на u′
      - При цепи из трёх звеньев повторить, пока внутри не останется x
    traps:
      - "Внутренний множитель теряют целиком: у e^(x²+1) производная
        2x·e^(x²+1), а не e^(x²+1)"
      - "Внутрь подставляют не всё: у √(r²−k²x²) внутренняя производная
        −2k²x, и k² в ней остаётся"
      - "Цепь из трёх звеньев обрывают на втором: у ln(ln200 − ln x)
        нужны обе производные, и знак минус приходит от внутренней"
      - "Знак результата не проверяют по смыслу: у ½ln(cot x) производная
        −cosec 2x, отрицательная на всей области"
    calculator:
      mode: allowed
      note: >
        Пять блоков из семи с калькулятором, и все пять — Paper 3
        с точным ответом. Считать в приёме нечего вообще.
    prereq: [standard_derivatives]
    raw_tags: [chain_rule, differentiate_composite_function,
               differentiate_logarithmic_function, power_rule,
               derivative_of_exponential, substitution,
               simplify_rational_expression]
    blocks: [2022-NOV-COMMON-P1-Q01, 2024-MAY-TZ2-P3-Q01-A-I,
             2022-NOV-COMMON-P3-Q02-C, 2024-MAY-TZ2-P2-Q12-B,
             2025-NOV-TZ1-P3-Q02-B-III, 2025-NOV-TZ3-P3-Q01-E,
             2022-NOV-COMMON-P2-Q11-D-II]

  - id: product_rule
    name: Произведение
    rung: 4
    trigger: >
      Функция записана произведением двух множителей, каждый из которых
      зависит от x: e^(2x)(3x − 4), xⁿ(a − x)ⁿ, (x + 3)√(9 − x²).
      Раскрывать скобки при этом либо нельзя, либо дороже.
    chain:
      - Назвать множители u и v
      - Написать u′v + uv′, не считая пока ни одной производной
      - Подставить производные множителей
      - Вынести общий множитель — в архиве ответ почти всегда просят
        свёрнутым
    traps:
      - "Пишут u′v′: два слагаемых превращаются в одно, и балл за метод
        не ставят вовсе"
      - "Одно из двух слагаемых теряют — чаще то, где дифференцируется
        второй множитель"
      - "Внутри множителя забывают цепное правило: у (x + 3)√(9 − x²)
        второй множитель даёт −x/√(9 − x²)"
      - "Общий множитель не выносят, а вопрос просит показать
        напечатанный вид: n·xⁿ⁻¹(a − 2x)(a − x)ⁿ⁻¹ не получится
        без вынесения"
    calculator:
      mode: mixed
      note: >
        Три блока из четырёх с калькулятором, все три — Paper 2 и 3
        с точной записью. Один блок Paper 1.
    prereq: [chain_rule]
    raw_tags: [product_rule, apply_product_rule, factorisation, factorization,
               algebraic_simplification, algebraic_expansion,
               simplify_expression]
    blocks: [2022-NOV-COMMON-P2-Q11-A, 2021-MAY-TZ2-P3-Q01-C,
             2022-MAY-TZ1-P3-Q02-D-I, 2023-MAY-TZ2-P1-Q10-C]

  - id: quotient_rule
    name: Частное
    rung: 5
    trigger: >
      Функция записана дробью, у которой x стоит и сверху, и снизу:
      (3x + 2)/(4x² − 1), (2x + a)³/(x + 5)², x(x² − A)/(x² + A).
      Если снизу x нет, дробь — это постоянный множитель, и правило
      не нужно.
    chain:
      - Назвать числитель u и знаменатель v
      - Написать (u′v − uv′)/v², не считая производных
      - Подставить, раскрыть только числитель
      - Сократить общий множитель числителя и знаменателя, если он есть
    traps:
      - "Порядок в числителе переставляют: (uv′ − u′v)/v² — это минус
        верный ответ, и знак теряется целиком"
      - "Знаменатель не возводят в квадрат"
      - "Дробь дифференцируют почленно, u′/v′ — правило превращается
        в чужое"
      - "Числитель раскрывают и не сворачивают обратно: у (2x + a)³/(x + 5)²
        схема оценивания принимает и развёрнутый вид, но следующий пункт
        считать по нему втрое дольше"
      - "Забывают, что √(x²) = |x|, а не x: в мае 2021 TZ2 весь второй
        пункт стоит на этом различии"
    calculator:
      mode: mixed
      note: >
        Четыре блока из пяти с калькулятором. Реальная работа для GDC
        одна на всю тему — в мае 2025 TZ3 решить f′(1) = tan 70°
        и получить a = 2.73 и 15.0.
    prereq: [product_rule]
    raw_tags: [quotient_rule, differentiate_rational_function,
               simplify_rational_expression, simplify_derivative,
               algebraic_simplification, absolute_value, sign_analysis]
    blocks: [2021-MAY-TZ1-P2-Q11-B, 2025-MAY-TZ3-P2-Q05-A,
             2025-MAY-TZ2-P3-Q01-C, 2021-MAY-TZ2-P2-Q12-C,
             2022-NOV-COMMON-P3-Q01-F]

  - id: to_printed_form
    name: Довести до напечатанного вида
    rung: 6
    trigger: >
      Вопрос начинается со «show that» и печатает ответ целиком. Считать
      после этого нечего — баллы стоят на пути от своей записи к чужой,
      и путь этот алгебраический, а не дифференциальный.
    chain:
      - Продифференцировать как умеется, не глядя на напечатанное
      - Привести к общему знаменателю
      - Вынести общий множитель числителя
      - Сверить с напечатанным и, если не сошлось, искать ошибку
        в алгебре, а не в производной
    traps:
      - "Идут с обеих сторон навстречу: схема оценивания за это снимает
        баллы, «show that» доказывают в одну сторону"
      - "Останавливаются на верном, но не том выражении: 4x/(2 − x)³
        и −4x/(x − 2)³ — одно и то же, и второе засчитывают, а вот
        2x/(2 − x)² + 2x²/(2 − x)³ ещё не ответ"
      - "Общий знаменатель берут как произведение знаменателей, хотя
        один делится на другой: (2 − x)² и (2 − x)³ дают (2 − x)³,
        а не (2 − x)⁵"
      - "Напечатанную строку не переписывают в конце — схема оценивания
        требует увидеть её"
    calculator:
      mode: allowed
      note: >
        Все четыре блока из Paper 3, все четыре с точной записью.
        Калькулятор здесь бесполезен по устройству вопроса.
    prereq: [quotient_rule]
    raw_tags: [algebraic_simplification, common_denominator, factorization,
               rearrangement, substitution, algebraic_rearrangement,
               simplify_expression]
    blocks: [2024-MAY-TZ2-P3-Q01-A-II, 2024-MAY-TZ2-P3-Q01-A-III,
             2024-MAY-TZ2-P3-Q01-B, 2025-MAY-TZ1-P3-Q02-A]

  - id: higher_derivatives
    name: Вторая и высшие
    rung: 7
    trigger: >
      Просят f″, d²y/dx², d²L/dα² — или соотношение между производными
      разных порядков, вроде g″ = 2(g′ − g). Второй признак: пункт (a)
      уже нашёл первую производную, и «hence» велит идти дальше.
    chain:
      - Первую производную довести до вида, удобного для второго шага
      - Продифференцировать её тем же правилом
      - Упростить, подставляя обратно то, что известно о самой функции
      - Для соотношения между порядками дифференцировать не функцию,
        а само соотношение
    traps:
      - "Первую производную упрощают до неудобного вида и дифференцируют
        вдвое дольше: √(1 + x) выгоднее держать как (1 + x)^(1/2)"
      - "У соотношения g″ = 2(g′ − g) дифференцируют левую часть и
        забывают правую"
      - "Подстановку x² + y² = r² делают в числитель и не делают
        в знаменатель"
      - "Знак второй производной не проверяют по смыслу: у √(1 + x)
        график выпуклый вниз, и f″ обязана быть отрицательной"
    calculator:
      mode: mixed
      note: >
        Четыре блока из шести с калькулятором, и все четыре просят
        точное значение: 45√5/4, −r²/y³, 1/r. Считать нечего.
    prereq: [to_printed_form]
    raw_tags: [second_derivative, deduce_higher_derivative,
               verify_differential_equation, verify_identity,
               higher_derivatives, substitute_derivative]
    blocks: [2021-MAY-TZ1-P1-Q12-A, 2022-MAY-TZ1-P1-Q12-C,
             2023-MAY-TZ1-P1-Q11-C, 2024-MAY-TZ1-P3-Q02-A,
             2025-MAY-TZ1-P3-Q02-E-I, 2025-MAY-TZ1-P3-Q02-E-II]

  - id: with_parameter
    name: Буква в функции
    rung: 8
    trigger: >
      В функции стоит буква — a, k, m, n, A, r, — и ответ просят в её
      терминах. Правило от этого не меняется ни на йоту; меняется то,
      что в конце нельзя посчитать и придётся упрощать.
    chain:
      - "Отделить букву от переменной: по чему дифференцируем"
      - Применить обычное правило, обращаясь с буквой как с числом
      - Упростить до вида, в котором букву видно
      - Проверить ответ на частном значении буквы
    traps:
      - "Букву дифференцируют вместе с переменной: у √(r² − k²x²)
        производная −k²x/√(r² − k²x²), и k² там от цепного правила,
        а не от дифференцирования k"
      - "Знак модуля теряют: kmax = 2|a|, а не 2a — при a = −2 ответ
        тот же, что при a = 2, и весь последний пункт про это"
      - "Общий множитель с буквой сокращают вместе с частью, где буквы
        нет: в 12a|a|(2ax + b) сокращается a, но |a| остаётся"
      - "Отвечают числом, когда просят выражение: «в терминах m» значит,
        что m обязана остаться в ответе"
    calculator:
      mode: allowed
      note: >
        Все девять блоков формально с калькулятором, и во всех девяти
        ответ содержит букву. Считать нечего ни в одном.
    prereq: [higher_derivatives]
    raw_tags: [substitute_x_value, simplify_expression, absolute_value,
               compare_absolute_values, set_derivative_zero, solve_for_x,
               rationalize_denominator, quadratic_formula, simplify_radical]
    blocks: [2022-NOV-COMMON-P3-Q02-E-III, 2025-MAY-TZ1-P3-Q02-B-I,
             2025-MAY-TZ1-P3-Q02-B-II, 2025-MAY-TZ1-P3-Q02-B-IV,
             2025-MAY-TZ1-P3-Q02-C-I, 2025-MAY-TZ1-P3-Q02-C-II,
             2025-MAY-TZ1-P3-Q02-D-I, 2025-MAY-TZ3-P3-Q02-C,
             2024-MAY-TZ1-P3-Q02-E]

  - id: read_derivative
    name: Прочесть производную
    rung: 9
    trigger: >
      Производная уже есть — своя из предыдущего пункта или чужая,
      напечатанная в условии, — и спрашивают о ней самой: где ноль,
      какого знака, что говорит вторая. Слова-приметы: «points where
      the gradient is zero», «values of x for which f is decreasing»,
      «concave-up», «points of inflexion», «horizontal tangents».
    chain:
      - Решить f′(x) = 0 — и не забыть область из условия
      - Для координат подставить каждый корень обратно в саму f
      - Для знака f′ смотреть промежутки между корнями
      - Для выпуклости и перегиба то же самое с f″
    traps:
      - "Отвечают одной координатой, когда просят точки: «coordinates»
        значит пару, и второй балл стоит на подстановке в f"
      - "Область из условия сужают до одного оборота: у e^(cos 2x)
        на −π/4 ≤ x ≤ 5π/4 три точки, а не две"
      - "«Decreasing» решают как f′ = 0 вместо f′ < 0 — критические
        значения найдены, а промежутки не выписаны"
      - "Перегиб объявляют по f″ = 0, не проверив смену знака"
      - "Схема оценивания мая 2025 TZ2 принимает и x ≤ −1.74, и
        x < −1.74: строгость на концах здесь балла не стоит, а вот
        пропущенный второй промежуток стоит"
      - "«a и b» в ответе путают местами: условие говорит a < b"
    calculator:
      mode: mixed
      note: >
        Восемь блоков из двенадцати с калькулятором, и здесь он наконец
        нужен по-настоящему: −1.74 и 0.518 в мае 2025 TZ2, система
        трёх уравнений в мае 2024 TZ2. Всего это 14 баллов из 51.
    prereq: [with_parameter]
    raw_tags: [set_derivative_zero, set_derivative_to_zero, solve_inequality,
               sign_analysis, inflection_points, solve_second_derivative_zero,
               coordinate_evaluation, classify_critical_point,
