corpus_issues:
  - block: 2025-MAY-TZ2-P1-Q06-B
    marks: 6
    issue: >
      В task_summary и method_path расстояние записано как
      √(x² + (x/2 − 4 ln x)²) и производная «упрощается до (x + 2 ln x)/l».
      В бумаге f(x) = √(x² ln x + 4 − x²), а пункт (a) даёт
      l = √(x² ln x + 4). Ответ e^{−1/2} сходится случайно: по записанной
      разметкой функции он не получается. Разметку надо переписать по бумаге.
  - block: 2021-MAY-TZ2-P2-Q11-D
    marks: 6
    issue: >
      В method_path «x = ln(2 + √3) ≈ 1.76». Но ln(2 + √3) ≈ 1.317; ноль
      e^{2x} − 6eˣ + 1 — это eˣ = 3 + 2√2 и x = ln(3 + 2√2) ≈ 1.7627.
      Число 1.76 верно, точная запись — нет.
