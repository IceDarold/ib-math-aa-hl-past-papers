    rung: 1
    trigger: >
      «Find the rate of change of the height of the water when t = 13»;
      «find the acceleration of the particle when t = 7»; «find the time when
      Fiona's acceleration is 4 m s⁻²»; «interpret the meaning of dP/dt»;
      «find the total amount of time when the rate of growth of Plant B was
      greater than the rate of growth of Plant A».
    chain:
      - "Назвать, чья это скорость: скорость изменения H — это H′(t), ускорение
        — это v′(t)"
      - "В момент: производная в точке, на калькуляторной бумаге — кнопкой
        d/dx прямо по формуле"
      - "Обратный вопрос «когда ускорение равно 4»: решить v′(t) = 4 на
        промежутке из условия"
      - "Сравнение скоростей роста: неравенство между производными, а не между
        самими величинами; сложить длины всех кусков"
      - "Интерпретация dP/dt: скорость изменения численности во времени, со
        словом rate"
    traps:
      - "Вместо скорости изменения дано само значение H(13)"
      - "Калькулятор в градусах: схема даёт A0 за ответ, посчитанный так"
      - "Сравнили высоты растений, а вопрос про скорости роста"
      - "Сложили не все куски: у cos(2t + 6) < −½ на [0, 9] их три"
      - "«Growth per year» вместо «rate of growth»: схема такую фразу не
