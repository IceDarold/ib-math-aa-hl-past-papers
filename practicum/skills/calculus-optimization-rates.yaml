version: 0.1
practicum: E9
title: Оптимизация и связанные скорости
source_topic: calculus.optimization
also_covers: [calculus.rates_of_change, calculus.differentiation]

corpus:
  blocks: 42
  marks: 147
  effective_blocks: 42
  effective_marks: 147
  sessions: May 2021 — November 2025
  papers: {1: 26, 2: 112, 3: 9}
  gdc_marks: 121
  note: >
    Три части: calculus.optimization целиком (18 блоков, 60 баллов),
    calculus.rates_of_change целиком (14 блоков, 56 баллов) и десять блоков
    calculus.differentiation на 31 балл, отданных сюда при разборе E3:
    v = ds/dt, a = dv/dt, скорость роста растения. Метод там —
    дифференцирование, а вопрос — про скорость, и ответ на него проверяется
    так же, как ответ на соседний пункт про момент покоя. Всего 42 блока и
    147 баллов; check_map.py показывает 41, потому что десять блоков он
    считает долей 0.089 от 98.

    Разметка разрезала тему не там, где она режется по смыслу. Движение
    частицы по прямой разнесено по трём темам — «при каком t частица стоит»
    в rates_of_change, «найдите ускорение» в differentiation, «наибольший
    модуль скорости» в optimization, — хотя это пункты (a), (b), (c) одного
    вопроса на шесть баллов. Такие вопросы стоят почти в каждой сессии
    (одиннадцать из семнадцати), и это самая плотная часть темы: 50 баллов
    из 147. Связанные скорости — 43 балла в семи вопросах, оптимизация по
    модели — 54 балла.

    Дубль ноября 2023 года здесь есть, но не внутри темы, а поперёк серии.
    Paper 2 ноября 2023 TZ1 и TZ2 — одна бумага, и два её пункта лежат
    здесь копией TZ2, а копией TZ1 — в других практикумах: Q4(a), «когда
    частица впервые приходит в покой» (2 балла), в TZ1 размечен
    calculus.stationary_points и стоит в E8; Q8(b), наименьшее |AB × AC|²
    (3 балла), в TZ1 размечен geometry.vectors_3d и стоит в C7. Внутри E9
    дубля нет, и рабочих баллов 147. Оба пункта в архиве E9 остаются, с
    пометкой, где лежит близнец.

    121 балл из 147 формально с калькулятором, и на этот раз число почти
    честное. Движение по прямой — 50 баллов — калькулятор делает почти
    целиком: корень v = 0, производная в точке, вершина графика, и схема
    прямо пишет «using GDC». В связанных скоростях кнопка находит
    состояние (h по V = 200, x по θ = 0.178) — баллов на двенадцать, —
    а цепочку правил пишут руками. В оптимизации с калькулятором — минимум
    D(t) и |AB × AC|², вершина графика dP/dt и производной радиуса, таблица
    (20/n)ⁿ по целым n. Итого настоящей работы для GDC баллов на
    семьдесят пять из 121: 62%, самая честная доля серии после D2.

directions:
  - >
    Скорость — это производная по времени, и вопрос всегда называет, чья.
    Ускорение — скорость изменения скорости, поэтому «найдите ускорение в
    момент, когда частица меняет направление» — два шага: момент по v,
    значение по v′.
  - >
    «At rest» и «changes direction» — разные условия. Стоит частица там, где
    v = 0; направление меняет там, где v меняет знак. Касание нуля без смены
    знака — остановка без разворота.
  - >
    Наибольшее на отрезке ищется среди вершин и концов. Модуль скорости —
    это |v|: самая отрицательная скорость тоже в счёт, и наибольший модуль
    часто стоит на конце промежутка, где вершины нет.
  - >
    Связанные скорости: сначала связь между величинами, потом производная
    по времени, и только потом числа момента. Подставить h = 4 до
    дифференцирования — значит продифференцировать константу.
  - >
    Оптимизация: модель — функция одной буквы, её область из условия
    отбрасывает лишние корни, а ответ часто не сама буква, а другая
    величина в той точке — y точки R, PX, радиус.
  - >
    Если буква считает предметы, лучшее значение — целое, и его ищут
    сравнением соседей вершины, а не округлением вершины.

