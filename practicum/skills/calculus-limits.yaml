version: 0.2
practicum: E1
title: Пределы, неопределённости, правило Лопиталя
source_topic: calculus.limits
also_covers: []

corpus:
  blocks: 22
  marks: 81
  effective_blocks: 20
  effective_marks: 73
  sessions: May 2021 — November 2025
  papers: {1: 11, 2: 5, 3: 8}
  gdc_marks: 32
  note: >
    Тема идёт одним практикумом и лежит в нижней трети диапазона: 73 балла
    при границах 60–200. Резать нечего, сливать не с чем — соседи по секции
    заняты E2–E9.

    Два блока из двадцати двух дублируют другие, и оба дубля разной природы.
    Ноябрьский Paper 3 2023 года лежит в Common, но корпус держит его двумя
    зональными копиями; страницы совпадают побайтово. А вопрос про
    sin²(kx)/x² в ноябре 2023 поставлен в TZ1 и TZ2 слово в слово: бумаги
    разные, вопрос один. Отсюда 20 блоков и 73 балла вместо 22 и 81.

    44% баллов с калькулятором, и здесь это иллюзия почти полная. Ответы
    темы — 2/3, −3, −1/4, π/4, −n/2, n(n+1)/2 — точные всюду, независимо от
    бумаги. Два числа, ради которых калькулятор и правда нужен, — k = 4 и
    k = 9, и оба не пределы, а постоянные, подобранные под предел.

    Тема — самая маленькая из calculus и одна из самых связных во всём
    архиве: одиннадцать блоков из двадцати это буквально одно правило,
    применённое от одного до трёх раз.

directions:
  settled: >
    Подстановка дала число, или 0/0 от общего множителя, или бесконечность.
    Исчисление не нужно вовсе: приёмы 1–2.
  rule: >
    Подстановка дала 0/0 или ∞/∞ и сокращать нечего. Середина темы:
    приёмы 3–5.
  elsewhere: >
    Предел — не вопрос, а условие. Постоянная подбирается под него, стрелка
    стоит не под x, параметр сидит внутри выражения, или спрашивают, что
    предел значит: приёмы 6–9.

skills:
  - id: substitute
    name: Подстановка и сокращение
    rung: 1
    trigger: >
      Точка внутри области определения — тогда предел и есть значение. Или
      подстановка дала 0/0, но числитель и знаменатель раскладываются
      на множители: в архиве разложение обычно уже стоит в предыдущем пункте.
    chain:
      - Подставить точку
      - Если вышло число — это и есть предел, работа окончена
      - Если вышло 0/0 — разложить числитель и знаменатель на множители
      - Сократить общий множитель, оговорив, что x ≠ a
      - Подставить снова
    traps:
      - "Правило Лопиталя применяют не глядя: на определённой форме оно даёт
        неверное число, а не просто лишнюю работу"
      - "Забывают оговорку x ≠ a: сокращённая функция не равна исходной
        в самой точке, и именно поэтому предел есть, а значения нет"
      - Множитель сокращают один раз, хотя он стоит в квадрате
      - "Тянутся за правилом там, где хватает деления многочленов, — на вопросе
        в один балл это вся отпущенная минута"
    calculator:
      mode: forbidden
      note: >
        Вопрос из Paper 1, ответ — обыкновенная дробь. Калькулятор годится
        только на то, чтобы подставить x = −0.999 и увидеть, куда идёт дело.
    prereq: []
    raw_tags: [limit_evaluation, limit_notation, direct_substitution,
               continuity, factorisation, polynomial_factorisation,
               removable_discontinuity, algebraic_simplification]
    blocks: [2024-MAY-TZ1-P1-Q11-F-I-II]

  - id: at_infinity
    name: Старшая степень на бесконечности
    rung: 2
    trigger: >
      x → ∞ или x → −∞, и в выражении только степени и корни — ни экспоненты,
      ни логарифма. Корень считается степенью: √(t² + 0.2) ведёт себя как t.
    chain:
      - Найти наибольшую степень переменной во всём выражении
      - Поделить на неё числитель и знаменатель
      - Применить 1/xᵏ → 0
      - Прочитать ответ: отношение старших коэффициентов, ноль или бесконечность
    traps:
      - "Экспоненту считают степенью: eˣ обгоняет любой xᵏ, и деление
        на степень ничего не даёт"
      - "Под корнем берут t² + 0.2 как t², не заметив, что порядок это
        не меняет, а вот множитель перед корнем — меняет"
      - Знак теряют при x → −∞, где √(x²) = −x, а не x
    calculator:
      mode: allowed
      note: >
        Годится, чтобы подставить t = 1000 и увидеть 8.14 — но записывать
        нужно деление на старшую степень.
    prereq: [direct]
    raw_tags: [limit_evaluation, limit_at_infinity, rational_functions,
               horizontal_asymptote, dominant_term]
    blocks: [2024-MAY-TZ1-P1-Q11-F-I-II, 2025-MAY-TZ3-P2-Q10-C]

  - id: lhopital
    name: Правило Лопиталя, один раз
    rung: 3
    trigger: >
      Подстановка дала 0/0 или ∞/∞, и сокращать нечего. Часто сказано прямо:
      «use l'Hôpital's rule».
    chain:
      - Подставить точку и назвать форму вслух — это лицензия, и она оценивается
      - Продифференцировать числитель и знаменатель по отдельности
      - Подставить снова
      - Записать lim на каждой строке
    traps:
      - "Дифференцируют по правилу частного вместо раздельного дифференцирования"
      - "Произведение вида ∞·0 подают в правило как есть: сначала его надо
        переписать дробью, положив умирающий множитель в знаменатель вверх ногами"
      - "Знак lim не пишут: май 2021 режет пятибалльный вопрос до четырёх,
        май 2024 снимает последний A1"
      - Лицензию не проверяют вовсе, и правило применяют к определённой форме
    calculator:
      mode: forbidden
      note: >
        Три вопроса приёма из Paper 1 и Paper 3 без вычислений; ответы 2/3, 1, 0.
    prereq: [direct]
    raw_tags: [lhopitals_rule, indeterminate_form, limit_notation,
               differentiation, limit_evaluation, exponential_differentiation,
               trigonometric_differentiation]
    blocks: [2021-MAY-TZ1-P1-Q08, 2023-MAY-TZ1-P3-Q01-C-I, 2025-MAY-TZ2-P2-Q11-C]

  - id: lhopital_again
    name: Правило Лопиталя, несколько раз
    rung: 4
    trigger: >
      Знаменатель — высокая степень x: x², x³, x⁴. Каждое применение снижает
      степень на единицу, так что число раундов видно до начала работы.
    chain:
      - Применить правило один раз
      - Подставить снова и назвать форму заново
      - Если опять 0/0 — новая лицензия, повторить
      - Как только форма стала определённой, остановиться и прочитать ответ
    traps:
      - "Применяют лишний раз: после того как знаменатель перестал обнуляться,
        ещё один раунд даёт неверное число. Схема оценивания мая 2024 снимает
        M1 именно за третью попытку"
      - Форму заново не проверяют, и второе применение остаётся необоснованным
      - "Ошибка в производной второго порядка: sec⁴x tan x и sin 2x — те два
        места, где теряют этот вопрос"
    calculator:
      mode: forbidden
      note: Все три вопроса приёма из Paper 1, все просят точное значение.
    prereq: [lhopital]
    raw_tags: [lhopitals_rule, repeated_lhopitals_rule, indeterminate_form,
               higher_order_derivatives, trigonometric_differentiation,
               chain_rule, product_rule]
    blocks: [2024-MAY-TZ2-P1-Q08, 2025-MAY-TZ3-P1-Q09, 2022-MAY-TZ2-P2-Q07-B]

  - id: maclaurin
    name: Ряд Маклорена вместо правила
    rung: 5
    trigger: >
      Выражение собрано из eˣ, sin, cos, ln около нуля, и знаменатель — степень
      x. Прямая примета: предыдущий пункт вопроса просил найти ряд.
    chain:
      - Заменить каждый множитель отрезком его ряда
      - Вынести степень наружу, если она есть: x⁹ = (x³)³
      - Сократить на степень знаменателя
      - Прочитать свободный член — это и есть предел
    traps:
      - "Ряд обрывают слишком рано: чтобы поделить на x³, нужны члены до x³
        включительно, а нулевой коэффициент при x² легко принять за конец"
      - "Степень не выносят и честно раскрывают куб — вместо трёх строк выходит
        страница"
      - "В (1 − x²/2)ⁿ берут только первый член биномиального разложения"
      - Ответ записывают без n там, где вопрос просил «in terms of n»
    calculator:
      mode: forbidden
      note: >
        Все три вопроса приёма из Paper 1. Ряды Маклорена как таковые живут
        в E2; сюда приходит только их применение.
    prereq: [lhopital]
    raw_tags: [maclaurin_series, taylor_series, series_expansion,
               limit_evaluation, indeterminate_form, lhopitals_rule]
    blocks: [2021-NOV-COMMON-P1-Q11-C, 2022-MAY-TZ1-P1-Q12-E,
             2025-MAY-TZ1-P1-Q12-E-II]

  - id: make_finite
    name: Постоянная, при которой предел существует
    rung: 6
    trigger: >
      В выражении стоит буква, и сказано «a finite limit only exists for…»
      или дано само значение предела. Спрашивают букву, а не предел.
    chain:
      - Заметить, что знаменатель идёт в ноль
      - Отсюда: конечный предел возможен только при нулевом числителе
      - Приравнять предел числителя нулю и решить относительно буквы
      - Если дано значение предела, вычислить предел через букву и приравнять
    traps:
      - "Рассуждение ведут в обратную сторону: подставляют готовое k и
        показывают, что вышло 0/0. Схема оценивания мая 2022 даёт за это M1A0"
      - "Отрицательный корень не отбрасывают там, где условие говорит k > 0"
      - arctan 1 оставляют как arctan 1 вместо π/4
    calculator:
      mode: allowed
      note: >
        Обе задачи приёма из Paper 2, но обе с точным ответом: π/4 и 4.
    prereq: [lhopital]
    raw_tags: [indeterminate_form, limit_evaluation, lhopitals_rule,
               inverse_trigonometric_functions, solving_equations,
               probability_density_function]
    blocks: [2022-MAY-TZ2-P2-Q07-A, 2023-NOV-TZ1-P1-Q09-B,
             2025-MAY-TZ2-P2-Q11-C]

  - id: parameter
    name: Предел по параметру
    rung: 7
    trigger: >
      Стрелка стоит не под x: n → ∞, α → π/2, b → ∞. Всё, что не под стрелкой,
      остаётся на месте, и ответ — выражение через оставшиеся буквы.
    chain:
      - Найти в выражении единственную часть, которая движется
      - Понять, куда она идёт: mⁿ → 0 при |m| < 1, 1/n → 0, 1/tan α → 0
      - Подставить этот предел, оставив всё прочее без изменений
      - Собрать ответ через буквы, которые не двигались
    traps:
      - "Переменную путают с параметром и берут предел по x, которого никто
        не просил"
      - "tan α → ∞ подставляют прямо: нужно поделить на tan α и работать
        с 1/tan α, которое идёт в ноль"
      - "Ответ округляют: ноябрь 2022 принимает π/4 и 45°, но не 0.785"
      - "|m| < 1 не используют, и mⁿ остаётся в ответе"
    calculator:
      mode: allowed
      note: >
        Двенадцать баллов приёма, и ни одного числа среди ответов: c/(1−m),
        π/4, −1/f, 1.
    prereq: [direct]
    raw_tags: [limit_evaluation, limit_at_infinity, geometric_sequence,
               parameter, vectors, trigonometric_identities,
               composite_functions, lhopitals_rule]
    blocks: [2025-MAY-TZ3-P3-Q01-D, 2022-NOV-COMMON-P2-Q07-B,
             2023-NOV-TZ1-P3-Q02-F]

  - id: symbolic
    name: Правило с буквой внутри выражения
    rung: 8
    trigger: >
      Предел берётся по x, но в самом выражении сидит параметр: x^{n+2},
      S_n(x), cos^n x. Ответ выйдет формулой от параметра, а не числом.
    chain:
      - Проверить форму — она обязана быть 0/0 при любом значении параметра
      - Дифференцировать по x, ведя параметр как постоянную
      - Подставить точку, не забывая, что n^0 = 1 и 1^n = 1
      - Свернуть ответ, вынеся общий множитель: n(n+1)(n+2) − n(n+1)² = n(n+1)
    traps:
      - "Дифференцируют по n вместо x: параметр здесь постоянная"
      - "Форму называют для одного n и считают вопрос закрытым: обоснование
        обязано работать при любом n, и схема оценивания ноября 2022 требует
        упрощения числителя до n − (n+1) + 1"
      - "Ответ оставляют числом там, где спрашивали формулу от n"
      - "Правило применяют лишний раз: после второго раунда знаменатель уже 2"
    calculator:
      mode: forbidden
      note: >
        Все три вопроса приёма из Paper 3 и ни одного числа среди ответов:
        n(n+1)/2 и единица при каждом n.
    prereq: [lhopital_again]
    raw_tags: [lhopitals_rule, indeterminate_form, parameter,
               higher_order_derivatives, composite_functions, induction,
               limit_notation, series_sum]
    blocks: [2022-NOV-COMMON-P3-Q01-G-I, 2022-NOV-COMMON-P3-Q01-G-II,
             2025-NOV-TZ3-P3-Q01-G]

  - id: interpret
    name: Что предел значит
    rung: 9
    trigger: >
      «State a reason why», «explain briefly the significance». Ответ — фраза
      о моделируемой вещи, а не о выражении.
    chain:
      - Назвать значение предела
      - Сказать, что происходит с самим предметом модели
      - Если предел не достигается — объяснить, что мешает
    traps:
      - "Говорят про алгебру: «знаменатель растёт неограниченно» балла не даёт"
      - "Предел выдают за достижимое значение: 8.14 м/с — граница формулы,
        а не скорость бегуньи"
      - Пункт пропускают целиком, хотя это самые дешёвые баллы темы
    calculator:
      mode: allowed
      note: Считать нечего; оба балла за предложение.
    prereq: [at_infinity]
    raw_tags: [limit_evaluation, limit_at_infinity, interpretation,
               modelling, curvature, contextual_reasoning]
    blocks: [2025-MAY-TZ3-P2-Q10-C, 2025-MAY-TZ1-P3-Q02-B-III]

# Приёмы, встречающиеся в теме, но принадлежащие другим практикумам.
imported:
  - {id: maclaurin_series, from: E2,
     note: "ряды строятся там; сюда приходит только чтение главного члена"}
  - {id: induction, from: A4,
     note: "ноябрь 2022 P3 и ноябрь 2025 P3: предел стоит последним пунктом
            после доказательства индукцией, оно само в A4"}
  - {id: partial_fractions, from: A8,
     note: "май 2024 TZ1 Q11: разложение P(x) на множители сделано раньше,
            здесь оно только сокращается"}
  - {id: pdf_normalisation, from: D5,
     note: "май 2025 TZ2: предел нужен, чтобы приравнять интеграл плотности
            единице; сама нормировка — статистика"}

# Замечания к классификации, отправить в classification/reviews.
corpus_issues:
  - blocks: [2023-NOV-TZ1-P3-Q02-F, 2023-NOV-TZ2-P3-Q02-F]
    issue: >
      Один и тот же блок, лежащий в корпусе дважды. Ноябрьская Paper 3
      2023 года — общая бумага, физически лежащая в Common, но корпус держит
      её зональными копиями TZ1 и TZ2. Отрисованные страницы вопроса и схемы
      оценивания совпадают побайтово (проверено md5). Та же беда отмечена
      в карточках B1 и C1. В архиве E1 блок входит один раз.
  - blocks: [2023-NOV-TZ1-P1-Q09-B, 2023-NOV-TZ2-P1-Q09-B]
    issue: >
      Дубль другой природы: бумаги действительно разные (8823-7106 и
      8823-7111), но вопрос в них поставлен слово в слово — f(x) = sin²(kx)/x²,
      показать чётность, найти k из предела 16. Это не ошибка разметки,
      а совпадение в самих бумагах; стоит пометить блоки как эквивалентные,
      чтобы счётчики баллов не удваивали тему. В архиве E1 вопрос входит
      один раз.
  - block: 2022-NOV-COMMON-P2-Q07-B
    issue: >
      Вторичными темами указаны geometry.trigonometry и geometry.vectors,
      и векторы там действительно есть — но весь балл пункта (b) за предел
      1/n → 0. Разметка method_family = limits_and_series верна; отмечаю,
      чтобы блок не ушёл в C-практикумы при пересборке карты.

ladder:
