imported:
  - practicum: D1
    what: >
      Перебор равновозможных исходов (приём 9) опирается на счёт, а счёт —
      это D1. Здесь пространства маленькие и перебираются руками; там,
      где надо считать размещения и сочетания, вопрос стоит в D1.
  - practicum: D3
    what: >
      Биномиальные вероятности встречаются здесь на ветвях деревьев
      (май 2025 TZ3, ноябрь 2025 TZ1) и в полной вероятности. Само
      распределение — тема D3; здесь оно только поставщик чисел.
  - practicum: D5
    what: >
      Нормальные вероятности стоят на ветвях у майского 2022 TZ1 и
      ноябрьского 2022. Как их взять — D5; что с ними делать дальше —
      этот практикум.
  - practicum: A4
    what: >
      Квадратные уравнения приёмов 3, 8 и 10 решаются как обычно.
      Новое здесь только одно: корень отбрасывают не за то, что он
      посторонний, а за то, что он не вероятность.

corpus_issues:
  - id: '2021-MAY-TZ2-P2-Q03'
    what: >
      source_pages указывает страницу 4, а вопрос лежит на пятой:
      на четвёртой стоит Q2 про арифметическую прогрессию. Смещение
      на единицу, схема оценивания при этом указана верно.
    why: >
      Ломает не текст, а работающий код: practicum/drill/archive.py
      отдаёт модели картинку страницы по этому номеру, и модель
      получает чужой вопрос без единого признака ошибки.
  - id: '2022-NOV-COMMON-P1-Q06'
    what: >
      То же смещение на единицу: source_pages 7, вопрос на восьмой
      (на седьмой Q5 про комплексные корни).
  - id: '2022-MAY-TZ2-P2-Q03'
    what: >
      И здесь: source_pages 5, вопрос на шестой.
  - id: '2024-MAY-TZ1-P2-Q06'
    what: >
      source_pages 8, вопрос на девятой. Четвёртый случай того же
      смещения в одной теме — стоит проверить весь корпус разом.
  - id: '2025-MAY-TZ1-P1-Q04-A'
    what: >
      task_summary говорит «given P(A') = 3/4 and P(B|A) = 2/3», а в
      билете дано P(A′) = P(A∪B) = 3/4. Потеряно P(A∪B) = 3/4 — без
      него пункт (b) не решается вовсе.
  - id: '2023-MAY-TZ2-P2-Q11-C'
    what: >
      Блок «Find two pairs of positive integer values for r and y that
      satisfy P(YY) = 1/3» числится за number_algebra.polynomials.
      Целочисленное решение там действительно есть, но вопрос про
      вынимание без возвращения, и метод у него этой темы.
  - id: '2024-MAY-TZ2-P1-Q06-B'
    what: >
      task_summary называет это «Find the probability a randomly selected
      apple from the container is an eating apple» и не говорит, что
      вопрос условный. Это Байес, и без слова «given» пересказ читается
      как полная вероятность.
  - id: 'ноябрьский дубль 2023 года'
    what: >
      2023-NOV-TZ1-P1-Q02 и 2023-NOV-TZ2-P1-Q02 — одна и та же бумага
      в двух зональных копиях. Четыре балла посчитаны дважды. Тот же
      дубль уже находили в B4 и C3.
  - id: 'описательной статистики нет в карте'
    what: >
      Двенадцать баллов темы — ящик с усами и межквартильный размах
      (май 2021 TZ1 Q3), среднее, медиана и размах (ноябрь 2025 TZ3 Q2),
      способ отбора (май 2025 TZ3 Q3) — не принадлежат ни одному из семи
      практикумов секции D. Описательной статистики в карте нет вовсе.
    why: >
      Ошибка того же рода, что параметрическое дифференцирование в E4,
      но обратная: там карта обещала то, чего в архиве нет, здесь архив
      спрашивает то, чего в карте нет. Двенадцати баллов на практикум
      не хватает; вопрос в том, куда их приписать — вероятнее всего
      к D7, где регрессия, и переименовать его.

