version: 0.2
practicum: D2
title: "Вероятность: события, условная, независимость, деревья"
source_topic: statistics.probability
also_covers: []

corpus:
  blocks: 50
  marks: 156
  effective_blocks: 50
  effective_marks: 156
  sessions: May 2021 — November 2025
  papers: {1: 21, 2: 22, 3: 7}
  gdc_marks: 96
  note: >
    Тема statistics.probability целиком — 77 блоков и 237 баллов. D2 берёт
    из неё 50 блоков и 156 баллов: всё, где ответ получают из устройства
    вероятностного пространства — из правил сложения и умножения, из
    условной вероятности, из независимости, из дерева. Оставшийся 81 балл
    расходится по соседям, и три четверти его — не про эту тему вовсе.

    36 баллов — биномиальное распределение, и они принадлежат D3. 11 —
    производящая функция вероятностей майского исследования 2025 года,
    и это D4. 7 — нормальное распределение, D5. 11 — вопросы про
    плотность, D6.

    Ещё 12 баллов не принадлежат ничему: ящик с усами и межквартильный
    размах мая 2021, среднее и размах ноября 2025, способ отбора мая 2025
    TZ3. Это описательная статистика, и практикума под неё в карте нет —
    см. corpus_issues, пункт «описательной статистики нет в карте».

    Четыре балла — ноябрьский дубль 2023 года: одна и та же бумага лежит
    в корпусе двумя зональными копиями, и Q2 посчитан дважды. В D2 он
    входит один раз.

    62% баллов формально с калькулятором, и здесь это ближе к правде,
    чем обычно: биномиальные вероятности внутри деревьев (май 2025 TZ3,
    ноябрь 2025 TZ1) и нормальные вероятности внутри полной вероятности
    (май 2022 TZ1) на бумаге не берутся. Настоящей работы для GDC около
    30 баллов из 156 — самая честная доля за десять практикумов.

directions:
  algebra: >
    Событий два-три, все вероятности их комбинаций связаны правилом
    сложения и определением условной вероятности. Ответ — арифметика
    на диаграмме Венна. Приёмы 1–3.
  build: >
    Пространство надо сначала построить: дерево, повторные испытания,
    вынимание без возвращения, перебор равновозможных исходов.
    Приёмы 4, 5, 8, 9.
  reverse: >
    Пространство построено, и вопрос идёт в обратную сторону: полная
    вероятность вниз по дереву, Байес — вверх. Приёмы 6, 7.
  unknown: >
    В самом пространстве стоит буква, и её ищут из данной вероятности.
    Приём 10 — он же единственное место темы, где ответ отбраковывают
    за то, что он больше единицы.

skills:
  - id: event_algebra
    name: Алгебра событий и дополнение
    rung: 1
    trigger: >
      В условии перечислены вероятности комбинаций двух событий —
      P(A), P(B), P(A∩B), P(A∪B), P(A∩B′) — и спрашивают ещё одну.
      Никакого процесса, никаких этапов: всё происходит один раз.
    chain:
      - Нарисовать четыре клетки диаграммы Венна для A и B
      - Расставить по ним то, что дано, помня, что сумма четырёх равна единице
      - Прочесть с диаграммы то, о чём спрашивают
    traps:
      - "В P(A∪B) = P(A) + P(B) − P(A∩B) забывают вычесть пересечение:
        оно попадает в сумму дважды"
      - "P(A′∩B′) считают как 1 − P(A) − P(B): по де Моргану это
        1 − P(A∪B), а не 1 − P(A) − P(B)"
      - "Ответ 0,2 в правильной клетке диаграммы без подписи схема
        оценивания не засчитывает: ноябрь 2023, «just seeing an unlabeled
        0.2 in the correct region earns M1A0»"
      - "P(A∩B) считают как P(A)·P(B) там, где независимость не обещана"
    calculator:
      mode: none
      note: >
        Все восемь блоков этого приёма из Paper 1. Считать нечего:
        арифметика с двумя знаками после запятой.
    prereq: []
    raw_tags: [addition_rule, union_probability, complement_rule, de_morgans_law,
               probability_addition_rule, probability_intersection,
               probability_difference, set_difference, venn_diagram,
               law_of_addition, union_formula, probability_bounds,
               subset_condition]
    blocks: ['2023-NOV-TZ1-P1-Q02-A', '2023-NOV-TZ1-P1-Q02-B',
             '2021-MAY-TZ2-P2-Q03-A', '2021-MAY-TZ2-P2-Q03-B',
             '2025-MAY-TZ2-P1-Q04-A', '2022-NOV-COMMON-P1-Q06-A',
             '2022-NOV-COMMON-P1-Q06-B', '2022-NOV-COMMON-P1-Q06-C']

  - id: conditional
    name: Условная вероятность
    rung: 2
    trigger: >
      В условии или в вопросе стоит слово «given that», «дано, что»,
      или вертикальная черта. Часть пространства отрезана, и всё
      считается внутри оставшегося.
    chain:
      - Записать P(A|B) = P(A∩B) / P(B) и решить, что здесь A, а что B
      - Недостающее из двух найти алгеброй событий
      - Разделить — и проверить, что делили на вероятность условия
    traps:
      - "P(A|B) и P(B|A) меняют местами: это разные числа, и совпадают
        они только когда P(A) = P(B)"
      - "Делят на P(A) вместо P(B): знаменатель — вероятность того,
        что дано, а не того, что ищут"
      - "Останавливаются на P(A∩B) и сдают его как ответ: делить ещё не стали"
      - "P(A|B′) считают как 1 − P(A|B). Это неверно: дополнение берут
        у события, а не у условия"
    calculator:
      mode: allowed
      note: >
        Три блока из семи с калькулятором, и ни в одном он не нужен:
        дроби вроде 5/12 ÷ 2/3 берутся в уме, а десятичный ответ
        схема оценивания принимает наравне с точным.
    prereq: [event_algebra]
    raw_tags: [conditional_probability, multiplication_rule,
               probability_of_intersection, conditional_probability_formula,
               solving_linear_equation]
    blocks: ['2025-NOV-TZ3-P1-Q02-A', '2025-NOV-TZ3-P1-Q02-B',
             '2025-MAY-TZ1-P1-Q04-A', '2023-MAY-TZ2-P1-Q03',
             '2022-MAY-TZ1-P2-Q05-B', '2025-MAY-TZ2-P1-Q04-B',
             '2021-MAY-TZ2-P2-Q03-C']

  - id: independence
    name: Независимость как уравнение
    rung: 3
    trigger: >
      Слово «independent» стоит либо в вопросе («determine whether»),
      либо в условии («A and B are independent»). В первом случае это
      вычисление и вывод, во втором — лишнее уравнение, которого без
      этого слова не было бы.
    chain:
      - Написать P(A∩B) = P(A)·P(B) — это определение, а не свойство
      - Если независимость спрашивают, посчитать обе стороны и сравнить
      - Если независимость дана, подставить её и решить получившееся
        уравнение как обычное
    traps:
      - "Вывод пишут без чисел. Схема оценивания: «Both conclusion and
        reasoning are required. Do not split the A2» — за один вывод ноль"
      - "Независимость путают с несовместностью: несовместные события
        как раз зависимы, если у обоих вероятность не ноль"
      - "Из P(A)·P(B) = P(A∩B) получают квадратное уравнение и берут оба
        корня: майский 2022 TZ2 даёт P(B) = 0,2 и 17/15, и второй
        отбрасывают за то, что он больше единицы"
      - "Проверяют P(A|B) = P(A) и, получив неравенство, объявляют события
        несовместными вместо зависимых"
    calculator:
      mode: checks
      note: >
        Квадратное уравнение майского 2022 TZ2 решается на GDC, но корень
        1,133… всё равно надо узнать и отвергнуть глазами — калькулятор
        про то, что вероятность не больше единицы, не знает.
    prereq: [conditional]
    raw_tags: [independence_check, independence_test, independent_events,
               conditional_probability_equality, probability_multiplication,
               joint_probability, comparison_of_probabilities, independence,
               select_valid_solution]
    blocks: ['2025-MAY-TZ1-P1-Q04-B', '2021-MAY-TZ2-P2-Q03-D',
             '2021-NOV-COMMON-P1-Q04-B', '2022-MAY-TZ1-P2-Q05-A',
             '2022-MAY-TZ2-P2-Q03']

  - id: tree
    name: "Дерево: вдоль ветви умножаем, между ветвями складываем"
    rung: 4
    trigger: >
      В задаче есть этапы: сначала выбирают коробку, потом шар; сначала
      сезон, потом гнездование. Дерево либо нарисовано в билете, либо
      напрашивается само.
    chain:
      - Первый уровень — вероятности исходов первого этапа, в сумме единица
      - Второй уровень — условные вероятности при каждом исходе первого,
        в сумме единица на каждом узле
      - Вероятность пути — произведение вдоль него; вероятность события —
        сумма по путям
    traps:
      - "Ветви второго уровня подписывают безусловными вероятностями:
        на них стоит P(второе | первое), и это разные числа"
      - "Дополнение ветви пишут как p′ или как q. Схема оценивания мая
        2023: «award A0 for G′ branch labelled q unless explicitly
        defined as 1 − p»"
      - "Складывают там, где надо умножать: «и» вдоль ветви — произведение"
      - "Пропускают путь: «ровно один из четверых» — это четыре пути,
        а не один"
    calculator:
      mode: allowed
      note: >
        Три блока из четырёх с калькулятором. Настоящая работа для него
        одна: ноябрьский 2022 требует нормальной вероятности на ветви.
    prereq: [conditional]
    raw_tags: [tree_diagram, conditional_probability_branches,
               complementary_probability, fraction_arithmetic,
               probability_complement]
    blocks: ['2023-MAY-TZ1-P2-Q07-A', '2021-NOV-COMMON-P1-Q04-A',
             '2022-NOV-COMMON-P2-Q10-B', '2024-MAY-TZ2-P1-Q04-A']

  - id: first_success
    name: Повторные испытания и первый успех
    rung: 5
    trigger: >
      Одно и то же испытание повторяется, испытания независимы, и вопрос
      про то, когда впервые или сколько раз всего. «First day that it
      rains», «first boost occurs on the third action».
    chain:
      - Решить, спрашивают про номер первого успеха или про их число
      - Первый успех на n-м — это (n−1) неудача подряд и успех, то есть
        p(1−p)^(n−1)
      - "«Хотя бы один» считать через дополнение: 1 − (1−p)^n"
    traps:
      - "«Первый дождь на десятый день» считают как 0,8¹⁰·0,2 или как 0,2:
        девять сухих дней и один дождливый — это 0,8⁹·0,2"
      - "«Хотя бы один» пересчитывают по слагаемым вместо дополнения
        и теряют член"
      - "Показатель сдвигают на единицу: (1−p)^n вместо (1−p)^(n−1)"
      - "Условие «максимум пять бросков» забывают, и суммируют по всем n"
    calculator:
      mode: allowed
      note: >
        Шесть блоков из семи с калькулятором, и он нужен ровно на
        возведение в степень.
    prereq: [tree]
    raw_tags: [geometric_probability, first_success, multiplication_rule,
               probability_model, enumerate_outcomes, compound_probability,
               identify_target_scores]
    blocks: ['2024-MAY-TZ1-P2-Q06-C', '2024-MAY-TZ1-P3-Q01-A-I',
             '2024-MAY-TZ1-P3-Q01-A-II', '2024-MAY-TZ1-P3-Q01-E',
             '2024-MAY-TZ1-P3-Q01-F', '2024-MAY-TZ1-P3-Q01-G-I',
             '2022-MAY-TZ2-P1-Q10-C']

  - id: total_probability
    name: Полная вероятность
    rung: 6
    trigger: >
      Совокупность разбита на части — два станка, три сотрудника, два
      сорта яблок, — и спрашивают вероятность по всей совокупности.
      Ключевое слово «randomly selected» без указания части.
    chain:
      - Проверить, что части покрывают всё и не пересекаются
      - Для каждой части взять её долю и условную вероятность внутри неё
      - Сложить произведения
    traps:
      - "Условные вероятности складывают без весов частей: 0,08 + 0,06 + 0,11
        вместо 0,55·0,08 + 0,25·0,06 + 0,2·0,11"
      - "Доли частей не проверяют на единицу, и одна часть теряется"
      - "Внутри части берут не ту вероятность: у нормально распределённых
        весов своя μ и σ на каждой части"
    calculator:
      mode: needed
      note: >
        Все три блока требуют GDC по-настоящему: внутри частей стоят
        нормальные и биномиальные вероятности.
    prereq: [tree]
    raw_tags: [law_of_total_probability, normal_distribution,
               binomial_distribution, binomial_probability_formula, gdc]
    blocks: ['2022-MAY-TZ1-P2-Q11-C-I', '2025-MAY-TZ3-P2-Q11-C-I',
             '2025-NOV-TZ1-P2-Q07-A']

  - id: bayes
    name: "Байес: вверх по дереву"
    rung: 7
    trigger: >
      Известно следствие, спрашивают причину. «Given that the muffin
      weighs less than 61 g, find the probability that it is chocolate»:
      дерево идёт от сорта к весу, а вопрос — от веса к сорту.
    chain:
      - "Числитель — вероятность одного пути: доля причины на условную
        вероятность следствия при ней"
      - Знаменатель — полная вероятность следствия, то есть приём 6
      - Разделить
    traps:
      - "Числитель и знаменатель меняют местами — тот же промах, что
        и в приёме 2, но здесь его труднее заметить"
      - "В знаменателе пишут долю причины вместо полной вероятности следствия"
      - "Схема оценивания требует показать условную вероятность в контексте:
        «not just P(A|B)» — голая формула балла не даёт"
      - "Округляют промежуточное значение до трёх цифр и получают 0,723
        вместо 0,722; markscheme это принимает, но не всегда"
    calculator:
      mode: needed
      note: >
        Знаменатель — та же полная вероятность, что в приёме 6, и GDC
        нужен там же и по той же причине.
    prereq: [total_probability]
    raw_tags: [bayes_theorem, conditional_probability, law_of_total_probability]
    blocks: ['2022-MAY-TZ1-P2-Q11-C-II', '2024-MAY-TZ2-P1-Q06-B',
             '2025-MAY-TZ3-P2-Q11-C-II', '2025-NOV-TZ1-P2-Q07-B',
             '2022-NOV-COMMON-P2-Q10-C']

  - id: without_replacement
    name: Без возвращения
    rung: 8
    trigger: >
      Слова «without replacement», или из коробки вынимают подряд и не
      кладут обратно. Признак того, что знаменатель на каждом шаге
      уменьшается.
    chain:
      - Первый множитель — доля нужных среди всех
      - На каждом следующем шаге уменьшить и числитель, и знаменатель
      - Сократить и, если в условии буква, привести к уравнению
    traps:
      - "Знаменатель не уменьшают: получается вынимание с возвращением,
        и ответ выходит больше настоящего"
      - "Уменьшают знаменатель, но не числитель: жёлтых после вынутого
        жёлтого стало y − 1, а не y"
      - "Получив квадратное уравнение на число шаров, берут дробный корень"
      - "Порядок считают там, где он не важен, и наоборот"
    calculator:
      mode: allowed
      note: >
        Три блока с калькулятором, и все три — алгебра с буквой:
        считать в них нечего, пока буква не найдена.
    prereq: [tree]
    raw_tags: [without_replacement, combinatorial_product, probability_expression,
               cross_multiplication, algebraic_cancellation, quadratic_solving,
               integer_solution]
    blocks: ['2023-MAY-TZ2-P2-Q11-A', '2023-MAY-TZ2-P2-Q11-D',
             '2023-MAY-TZ2-P2-Q11-E']

  - id: counting_space
    name: Перебор равновозможных исходов
    rung: 9
    trigger: >
      Исходы равновозможны и их можно пересчитать: три броска кости дают
      216 троек, две кости дают 16 пар. Вероятность становится дробью
      «сколько подходит / сколько всего».
    chain:
      - Назвать пространство и его размер, и убедиться, что исходы
        равновозможны
      - Записать условие на исход формулой (дискриминант, сумма)
      - Пересчитать подходящие — по случаям, а не подряд
    traps:
      - "Считают наборы, а не упорядоченные тройки: (1,2,3) и (3,2,1) —
        разные исходы, и оба в 216"
      - "Пропускают случай при переборе: у ac = 2 восемь функций,
        а не четыре"
      - "Дискриминант приравнивают к нулю там, где нужно строгое
        неравенство, и наоборот"
      - "Складывают вероятности вместо счёта исходов, когда исходы
        уже равновозможны"
    calculator:
      mode: allowed
      note: >
        Считать здесь нечего: перебор ведётся на бумаге по случаям,
        и калькулятор не помогает ни в одном из пяти блоков.
    prereq: [event_algebra]
    raw_tags: [enumeration, counting_outcomes, sample_space, discriminant,
               probability_from_distribution, complementary_event,
               distribution_matching, maximum_sum]
    blocks: ['2024-MAY-TZ2-P3-Q02-C', '2024-MAY-TZ2-P3-Q02-F',
             '2022-MAY-TZ2-P1-Q10-B', '2022-MAY-TZ2-P1-Q10-D',
             '2022-MAY-TZ2-P1-Q10-E']

  - id: unknown_probability
    name: Буква внутри вероятности
    rung: 10
    trigger: >
      В пространстве стоит буква — доля k, вероятность p, процент x, —
      и дана вероятность какого-то события. Ответ находят не подстановкой,
      а решением уравнения.
    chain:
      - Выразить данную вероятность через букву по устройству пространства
      - Приравнять к данному числу и решить
      - Отбраковать корни вне [0, 1] и назвать причину вслух
    traps:
      - "Отбрасывают лишний корень молча. Схема оценивания мая 2024 TZ2
        даёт R1 именно за фразу «8/3 > 1»"
      - "Уравнение составляют по неверной ветви: «не гнездится ни в один
        сезон» — это (1−k)(1−k/2), а не 1 − k·k/2"
      - "Оценку доли ищут из числителя вместо условной вероятности:
        18 из 150 положительных — это P(G′|+), а не P(G′)"
      - "Проценты и доли смешивают: x = 7,38 значит 7,38%, то есть 0,0738"
    calculator:
      mode: allowed
      note: >
        Квадратные уравнения решаются на GDC, но составляются на бумаге,
        и отбраковка корня тоже на бумаге.
