version: 0.2
practicum: A2
title: "Геометрические прогрессии и бесконечные суммы"
source_topic: number_algebra.geometric_sequences

corpus:
  blocks: 31
  marks: 89
  effective_blocks: 27
  effective_marks: 77
  sessions: November 2021 — November 2025
  papers: {1: 37, 2: 38, 3: 4}
  gdc_marks: 40
  note: >
    Практикум собран из двух тем корпуса. Первая,
    number_algebra.geometric_sequences, взята целиком — семнадцать
    блоков и 55 баллов. Вторая, number_algebra.sequences, отдала
    остаток после A1: десять блоков и 22 балла, где вопрос начинается
    арифметической последовательностью и кончается геометрической.

    89 баллов по корпусу, 77 рабочих. Вычтено четыре блока. Ноябрьский
    дубль 2023 года стоит 7 баллов и в A1 уже посчитан по копии TZ1;
    ещё два блока не про последовательности вовсе — факториал
    в исследовании про площади и коробка из листа картона, оба
    разобраны в corpus_issues карточки A1.

    Самая маленькая тема секции A и самая ровная по бумагам за всю
    серию — 37 баллов без калькулятора против 38 с ним. Формально
    доля GDC 52%, и здесь это почти правда: наименьшее n ищут таблицей
    или логарифмом, и обе дороги схема оценивания принимает наравне.

    Семь приёмов идут по тому, чем оказывается знаменатель. Сначала он
    просто число и берётся делением. Потом он решает, есть ли у ряда
    сумма вообще. Потом прячется в сигму. Потом сам становится
    неизвестным в уравнении на букву. Напоследок он перестаёт быть
    числом и делается выражением с x — и тогда сумма ряда оказывается
    функцией.

    Проверке передают не ответ и не формулу, а правило — первый член
    и знаменатель. Член она находит умножением, сумму — сложением
    первых n членов, бесконечную сумму — сложением до тех пор, пока
    хвост не станет мал. Ни u₁r^(n−1), ни u₁(rⁿ−1)/(r−1), ни u₁/(1−r)
    внутри неё нет ни разу.

principle: >
  Геометрическая последовательность — это одно правило, и оно
  отличается от арифметического одним словом.

  > От члена к члену **умножают** на одно и то же.

  Отсюда всё остальное за строчку. u_n = u₁r^(n−1) — это «умножили на
  r ровно n − 1 раз», и минус единица здесь та же самая, что
  в арифметической прогрессии, и теряется так же часто.

  Формула суммы получается вычитанием. Выпишите S_n, умножьте всё
  на r и вычтите одно из другого — в середине всё сократится, останутся
  первый член и то, что выросло за хвостом.

  Дальше начинается то, чего в арифметической прогрессии нет вовсе.
  Если |r| < 1, члены убывают, и хвост можно сделать меньше любого
  наперёд заданного числа — тогда у бесконечного ряда есть сумма.
  Если |r| ≥ 1, её нет, и это не оговорка в учебнике, а половина
  вопросов темы.

  Ещё одно, чего нет у арифметической. Знаменатель находят делением,
  и деление даёт квадратное уравнение всякий раз, когда неизвестное
  сидит внутри членов. У квадратного уравнения два корня, и выбирает
  между ними отдельное условие — знак, целость, сходимость. Ответ
  «r = √3» без «±» схема оценивания балла лишает прямой оговоркой.

  Проверка устроена по тому же правилу. Ей передают первый член
  и знаменатель, и члены она получает умножением. Отсюда её главное
  свойство — расходящийся ряд она сложить не может, и говорит об этом
  теми же словами, какими это сказал бы экзаменатор.

directions:
  forward: >
    Прогрессия известна, спрашивают её член или сумму — конечную,
    бесконечную или наименьшую подходящую. Приёмы 1, 2, 3 и 6.
  hidden: >
    Прогрессия записана не списком — сигмой, многочленом, периодической
    дробью. Приёмы 4 и 7, и работа в том, чтобы увидеть u₁ и r.
  condition: >
    Прогрессия — не список, а требование. Приём 5, где «эти три величины
    образуют геометрическую последовательность» превращается
    в квадратное уравнение на букву.

skills:
  - id: ratio_and_term
    name: Знаменатель и член по номеру
    rung: 1
    trigger: >
      Даны два члена (не обязательно соседние) или процент роста,
      спрашивают третий член, знаменатель или значение через сколько-то
      шагов. Признак — слова first term, fourth term, increases by 50%,
      decreases by 11% each year.
    chain:
      - Выписать, какие члены даны и какие у них номера
      - Между номерами p и q ровно q − p умножений, значит u_q = u_p·r^(q−p)
      - Извлечь корень нужной степени, не забыв про знак при чётной
      - Дойти до спрошенного члена умножением от ближайшего известного
    traps:
      - >
        Умножение сделано n раз вместо n − 1. Первый член тоже член,
        и до него умножений ноль
      - >
        При чётной степени взят только положительный корень. У r² = 9
        два решения, и следующий пункт часто выбирает второе
      - >
        Знаменатель взят как u₁/u₂ вместо u₂/u₁, и вся прогрессия
        пошла в обратную сторону
      - >
        В модели с процентами первый год посчитан дважды. Стоимость
        после n лет это u₁r^(n−1), если u₁ — стоимость после первого года
    calculator:
      mode: speeds_up
      note: >
        Кубический корень из 86.4/50 на бумаге не берут, и Paper 2
        этого не требует. На Paper 1 числа подобраны так, что корень
        виден глазом — 0.21³ и 2^(−3/10) из ноября 2025 не в счёт,
        там бумага с калькулятором.
    prereq: []
    raw_tags: [common_ratio, find_common_ratio, geometric_sequence,
               compute_geometric_term, nth_term_formula, apply_term_formula,
               verify_common_ratio, exponential_decay, percentage_decrease,
               substitute, compute_terms]
    blocks: [2025-MAY-TZ2-P2-Q07-A, 2025-MAY-TZ3-P1-Q10-B-I,
             2025-MAY-TZ1-P1-Q05-B, 2024-MAY-TZ1-P2-Q01-A,
             2024-MAY-TZ1-P2-Q01-B]

  - id: finite_sum
    name: Сложить первые n
    rung: 2
    trigger: >
      Слово sum рядом с конечным числом членов, знак Σ с верхним
      пределом n, или «сколько всего» у чего-то, что каждый раз
      умножается. Признак того, что сумма конечная, — верхний предел
      есть, и он не бесконечность.
    chain:
      - Выписать u₁ и r
      - "Сосчитать, сколько именно членов складывается: от 0 до n их n + 1"
      - Подставить в S_n = u₁(rⁿ − 1)/(r − 1)
      - Проверить знаменатель на нуль — при r = 1 сумма это просто nu₁
    traps:
      - >
        Число слагаемых взято за n там, где ряд начинается с x⁰.
        В 1 + x + … + xⁿ слагаемых n + 1, и отдельный балл схемы стоит
        именно за это
      - >
        Сумма спутана с членом. S_n растёт, u_n при |r| < 1 убывает
      - >
        Знаменатель дроби записан как 1 − r при r > 1 или наоборот.
        Обе записи верны вместе со своим числителем и неверны порознь
      - >
        Среднее десяти членов посчитано как S₁₀, а делить на десять
        забыто
    calculator:
      mode: helps
      note: >
        Сумму конечного ряда GDC считает целиком, и на Paper 2 это
        законный ход. Но три из четырёх вопросов приёма стоят
        на Paper 1, и там ответ просят в форме p((9/4)^a − 1) —
        десятичное число за него баллов не даёт.
    prereq: [ratio_and_term]
    raw_tags: [geometric_series, sum_formula, sum_of_geometric_series,
               finite_sum, sigma_notation, write_series, expand_polynomial,
               number_of_terms]
    blocks: [2024-MAY-TZ1-P1-Q05-A, 2024-MAY-TZ1-P1-Q05-B,
             2025-MAY-TZ1-P1-Q05-A]

  - id: sum_to_infinity
    name: Бесконечная сумма и условие сходимости
    rung: 3
    trigger: >
      S∞, слова sum to infinity, converges, indefinitely, total distance
      if it continued forever. Или обратный вопрос — «объясните, почему
      бесконечной суммы не существует».
    chain:
      - Найти r и посмотреть на |r|
      - "При |r| ≥ 1 ответ словами: члены не убывают, суммы нет"
      - При |r| < 1 подставить в S∞ = u₁/(1 − r)
      - Если спрашивают букву внутри u₁, решить полученное уравнение
    traps:
      - >
        Условие |r| < 1 названо как r < 1. Отрицательный знаменатель
        меньше единицы всегда, и чередующийся расходящийся ряд под такую
        формулировку подходит
      - >
        Оба значения r, найденные раньше, не рассмотрены. Схема
        оценивания снимает балл за рассуждение, где взято одно из двух
      - >
        Полный пройденный путь взят за S∞. Частица уходит и возвращается,
        и путь вдвое больше суммы расстояний
      - >
        В знаменателе 1 + r вместо 1 − r, когда r отрицательный
    calculator:
      mode: partial
      note: >
        Знаменатель ноябрьской 2025 задачи получается делением двух
        считанных максимумов, и без GDC их не найти. Сама же сумма
        и условие сходимости — одна строчка на бумаге.
    prereq: [ratio_and_term]
    raw_tags: [sum_to_infinity, infinite_geometric_series, convergence,
               convergence_criterion, state_condition, geometric_series,
               total_distance]
    blocks: [2021-NOV-COMMON-P2-Q05-B, 2025-MAY-TZ3-P1-Q10-B-II,
             2025-NOV-TZ3-P2-Q10-E, 2022-MAY-TZ1-P1-Q10-A]

  - id: series_from_sigma
    name: Прогрессия, записанная сигмой
    rung: 4
    trigger: >
      Ряд задан знаком суммы, и члена списком не написано ни одного.
      Признак — показатель при индексе внутри скобки, а не снаружи,
      и нижний предел, который бывает и нулём, и единицей.
    chain:
      - Подставить нижний предел и получить первый член
      - Взять отношение двух соседних слагаемых — это и есть r
      - "Проверить, чему равен первый член на самом деле: множитель перед скобкой им не является"
      - Дальше как обычно — конечная сумма или бесконечная
    traps:
      - >
        За первый член принят множитель перед скобкой. У Σ от r = 1
        выражения (2/3)(7/8)^r первый член это 7/12, а не 2/3
      - >
        Нижний предел не посмотрен. Сумма от 0 и сумма от 1 отличаются
        на целый член
      - >
        Периодическая дробь собрана не полностью. 0.2535353… это 0.2
        плюс ряд, и первое слагаемое в ряд не входит
    calculator:
      mode: helps
      note: >
        GDC складывает сигму как есть, и ответ 0.0535353… получается
        мгновенно. Но вопрос просит точное значение дробью, и обратно
        из десятичной записи её не достать.
    prereq: [finite_sum, sum_to_infinity]
    raw_tags: [sigma_notation, series_from_sigma, geometric_series,
               decompose_repeating_decimal, add_fractions, simplify_fraction,
               sum_to_infinity]
    blocks: [2021-NOV-COMMON-P2-Q05-A, 2025-NOV-TZ1-P2-Q06-A,
             2025-NOV-TZ1-P2-Q06-B]

  - id: geometric_condition
    name: Три величины в геометрической прогрессии
    rung: 5
    trigger: >
      Слова form a geometric sequence рядом с выражениями, в которых
      сидит буква, или show that s² = at. Ответа-числа в условии нет —
      он внутри самих членов.
    chain:
      - Приравнять два отношения — второе к первому и третье ко второму
      - Умножить крест-накрест и получить s² = at
      - Раскрыть скобки — уравнение выйдет квадратным на букву
      - "Решить и оставить оба корня: выбирать между ними будет следующий пункт"
    traps:
      - >
        Один корень потерян. У квадратного уравнения их два, и второе
        значение буквы даёт совсем другую последовательность
      - >
        Знак у r потерян при извлечении корня. Схема оценивания даёт
        M1A1A0 за √3 без ±
      - >
        Условие записано разностями, а не отношениями. Это проверка
        на арифметическую последовательность, а не на геометрическую
      - >
        При r = −1 сумма чётного числа членов равна нулю, и это
        отдельный ответ, который считать не нужно
    calculator:
      mode: 'no'
      note: >
        Все шесть блоков приёма стоят на Paper 1. Уравнение квадратное,
        коэффициенты целые, и весь вопрос рассчитан на раскрытие скобок
        руками.
    prereq: [ratio_and_term]
    raw_tags: [relate_geometric_terms, solve_for_ratio, equate_ratios,
               cross_multiply, simplify_to_quadratic, solve_quadratic,
               factorize, determine_sign_of_ratio,
               recognize_alternating_sequence, sum_of_pairs, geometric_mean]
    blocks: [2024-MAY-TZ2-P1-Q10-B, 2023-MAY-TZ1-P1-Q10-D,
             2023-MAY-TZ1-P1-Q10-E, 2025-MAY-TZ3-P1-Q10-C-I,
             2025-MAY-TZ3-P1-Q10-C-II, 2025-MAY-TZ3-P1-Q10-C-III]

  - id: smallest_n
    name: Наименьшее n
    rung: 6
    trigger: >
      Слова smallest, least, how many years рядом с неравенством, в
      котором n стоит в показателе. Ответ обязан быть целым, и потому
      это не решение неравенства, а его округление в нужную сторону.
    chain:
      - Записать неравенство через S_n или через u_n
      - Свести к r^n > c или r^n < c
      - Взять логарифм, помня, что при основании меньше единицы знак переворачивается
      - "Округлить в нужную сторону и проверить соседний номер: он условию отвечать не должен"
    traps:
      - >
        Округление в другую сторону. У «наименьшего n при S_n больше
        числа» дробный корень 26.9 округляется вверх, до 27
      - >
        Неравенство записано через u_n там, где условие про S_n. Схема
        оценивания ноября 2021 снимает за это M0 отдельной оговоркой
      - >
        При делении на отрицательное или при логарифме по основанию
        меньше единицы знак неравенства не перевёрнут
      - >
        Номер года и номер члена перепутаны. После n полных лет
        стоимость это (n + 1)-й член
    calculator:
      mode: replaces
      note: >
        Таблица значений на GDC отвечает на весь приём целиком, и схема
        оценивания принимает её наравне с логарифмом, называя по имени —
        sketch OR table of values OR algebraic manipulation involving
        logarithms. Все три блока приёма стоят на Paper 2.
    prereq: [finite_sum, sum_to_infinity]
    raw_tags: [solve_inequality, exponential_inequality, logarithms,
               table_of_values, least_value, smallest_n, round_up]
    blocks: [2022-NOV-COMMON-P2-Q03, 2021-NOV-COMMON-P2-Q05-C,
             2024-MAY-TZ1-P2-Q01-C]

  - id: ratio_with_x
    name: Знаменатель — выражение с буквой
    rung: 7
    trigger: >
      Ряд из степеней x, и отношение соседних членов не число,
      а выражение. Признак — многоточие в записи 1 + x + x² + … или
      сигма, внутри которой стоит степень чего-то с x.
    chain:
      - Взять отношение двух соседних слагаемых и увидеть в нём r
      - "Сосчитать слагаемые: у 1 + x + … + xⁿ их n + 1"
      - Подставить в ту же формулу суммы — она не знает, число r или нет
      - При бесконечной сумме выписать область, где |r| < 1
    traps:
      - >
        Слагаемых сосчитано n вместо n + 1, и в ответе xⁿ вместо x^(n+1)
      - >
        Область сходимости записана через r, а не через x. |−2x²| < 1
        это |x| < 1/√2, и именно x спрашивают
      - >
        Знак минус внутри знаменателя потерян. У ряда 1 − x² + x⁴ − …
        знаменатель равен −x², и сумма выходит 1/(1 + x²)
      - >
        Случай x = 1 не оговорён. Формула суммы при нём делит на нуль,
        и условие «for x ≠ 1» в вопросе стоит не случайно
    calculator:
      mode: 'no'
      note: >
        Ответ здесь всегда выражение, и считать в нём нечего. Один
        из трёх блоков формально стоит на Paper 2, но и он —
        показать, что f₃(x) равно выписанному многочлену.
    prereq: [finite_sum, sum_to_infinity, series_from_sigma]
    raw_tags: [geometric_series, sum_to_infinity, algebraic_manipulation,
               expand_polynomial, write_series, convergence,
               rational_function]
    blocks: [2022-NOV-COMMON-P3-Q01-E, 2025-NOV-TZ3-P3-Q02-A,
             2025-MAY-TZ1-P2-Q12-B]

corpus_issues:
  - id: '2025-MAY-TZ1-P2-Q12-C'
    what: >
      Пять баллов числятся за calculus.series, а спрашивают там область
      сходимости геометрического ряда и его сумму — |−2x²| < 1 даёт
      K = 1/√2, а S∞ даёт 1/(1 + 2x²). Схема оценивания начинается
      словами recognition of geometric series with common ratio −2x².
    why: >
      Ряд Маклорена для 1/(1 + 2x²) действительно совпадает с этим
      рядом, поэтому тема выбрана не наугад. Но метод, за который
      ставят баллы, — сумма геометрической прогрессии, и приём живёт
      здесь. Блок оставлен за E2, а пункт (b) того же вопроса взят
      в A2 как седьмой приём.
  - id: 'source_pages сдвинуты на обложку'
    what: >
      У майской 2024 TZ1 Paper 1 корпус указывает страницу 6 для
      вопроса 5, а на шестой странице PDF ещё идёт вопрос 4. То же
      у Paper 2 той же сессии и у майской 2023 TZ1 Paper 1. Записан
      печатный номер, а PDF начинается с обложки.
    why: >
      Та же непоследовательность отмечена в карточках A1, D1 и C2 —
      четвёртый раз подряд. Разбору она не мешает, archive.py ищет
      вопрос по тексту, но при ручной вычитке страницу приходится
      искать на одну дальше.
  - id: 'ноябрьский дубль 2023 года'
    what: >
