version: 0.2
practicum: E2
title: Ряды Маклорена
source_topic: calculus.series
also_covers: []

corpus:
  blocks: 27
  marks: 105
  effective_blocks: 26
  effective_marks: 99
  sessions: May 2021 — November 2025
  papers: {1: 14, 2: 4, 3: 8}
  gdc_marks: 43
  note: >
    Тема идёт одним практикумом: 99 баллов при границах 60–200, середина
    нижней половины диапазона. Резать нечего — лестница здесь одна и очень
    жёсткая, и сливать не с чем: соседи по секции заняты E1 и E3–E9.

    Один блок из двадцати семи дублирует другой. Вопрос про e^(cos 2x)
    в ноябре 2023 поставлен в TZ1 и TZ2 слово в слово: бумаги действительно
    разные (8823-7106 и 8823-7111), совпадение в них самих, а не в разметке.
    Ровно та же пара уже отмечена в карточке E1 — там это был sin²(kx)/x²
    из тех же двух бумаг. Отсюда 26 блоков и 99 баллов вместо 27 и 105.

    43% баллов с калькулятором, и здесь это не иллюзия — впервые за пять
    практикумов подряд. Считать в теме есть что: приближения π к четырём
    знакам, √3 в виде c/d, y(0.15) до шести значащих цифр, оценки ошибки
    порядка 10⁻⁵ и перебор по числу членов. Все они живут в Paper 2 и 3,
    и все требуют настоящей арифметики, а не точной формы.

    Устроена тема необычно ровно: 56 баллов из 99 идут единым вопросом
    в конце Paper 1 — двадцатибалльным разбором одной функции от ряда
    до приближения, — а ещё 21 балл занимает ноябрьское исследование
    2025 года про arctan и π, единственное место в архиве, где вообще
    заходит речь об ошибке приближения.

directions:
  build: >
    Ряда ещё нет, его надо получить. Пять способов, и выбор между ними —
    половина работы: приёмы 1–5.
  transform: >
    Ряд уже есть, и с ним что-то делают: дифференцируют, интегрируют или
    берут прямо из уравнения. Приёмы 6–7.
  use: >
    Ряд получен, и он замещает функцию — в пределе, в приближении числа,
    под интегралом. Плюс единственный в архиве разговор о том, насколько
    приближение верно: приёмы 8–9.

skills:
  - id: from_derivatives
    name: Ряд по определению
    rung: 1
    trigger: >
      Известного ряда для этой функции нет, и подвести её под известный
      не выходит. Прямая примета: предыдущий пункт вопроса просил найти
      n-ю производную, доказать формулу для неё индукцией или показать
      соотношение вида f″ = 2(f′ − f). Всё это заготовки под подстановку
      в формулу Маклорена, и «hence» их обязывает использовать.
    chain:
      - Написать формулу f(x) = Σ f⁽ⁿ⁾(0)·xⁿ/n!
      - Найти производные — или взять готовую формулу из предыдущего пункта
      - Подставить x = 0 в каждую
      - Поделить на n! и собрать многочлен
    traps:
      - "Забывают поделить на n!: f‴(0) = 9 даёт член 3x³/2, а не 9x³"
      - "Формулу n-й производной берут при n, начинающемся не с той единицы:
        в мае 2021 она верна лишь при n ≥ 2, и первые два члена надо считать
        отдельно"
      - "Соотношение f⁽⁴⁾ = 2(f‴ − f″) применяют к функциям, а не к числам:
        в него подставляют x = 0 и получают числовую рекурсию, дальше
        считать нечего"
      - "«Hence» игнорируют и считают четвёртую производную руками —
        пять минут вместо тридцати секунд, и обычно со знаком не туда"
    calculator:
      mode: forbidden
      note: >
        Все три блока приёма из Paper 1, и все три — точная форма.
        Производная в нуле это дробь, а не десятичная запись.
    prereq: []
    raw_tags: [maclaurin_series, taylor_series, derivative_at_zero,
               nth_derivative, factorial, substitute_maclaurin_formula,
               higher_derivatives, recurrence_relation]
    blocks: [2021-NOV-COMMON-P1-Q11-B, 2024-MAY-TZ2-P1-Q12-B,
             2025-MAY-TZ1-P1-Q12-E-I, 2022-MAY-TZ1-P1-Q12-D]

  - id: substitution
    name: Подстановка в известный ряд
    rung: 2
    trigger: >
      Функция получается из стандартной заменой аргумента: sin(x²), cos 2x,
      e^(−3x), ln(1 + 4x). Пять рядов, которые нужно знать наизусть, —
      eˣ, sin x, cos x, ln(1 + x), arctan x — стоят в справочнике, и первый
      ход темы всегда один: узнать в написанном один из них.
    chain:
      - Узнать стандартный ряд под маской
      - Подставить новый аргумент вместо x целиком, вместе со степенью
      - Пересчитать, до какого члена нужно разложение исходного ряда
      - Собрать и упорядочить по возрастанию степеней
    traps:
      - "Возводят в степень не всё: у sin(x²) член −x⁶/6, а не −x³/6 —
        (x²)³ = x⁶"
      - "Берут столько же членов, сколько в исходном ряду: у cos 2x до x⁴
        нужны три члена ряда косинуса, а у sin(x²) до x⁶ — только два"
      - "Знак множителя теряют: у cos 2x член 2x⁴/3, потому что (2x)⁴/24 =
        16x⁴/24"
      - "Ряд обрывают на «первых двух членах» вместо «первых двух ненулевых»:
        у чётной функции каждый второй член нулевой, и счёт сбивается сразу"
    calculator:
      mode: forbidden
      note: >
        Оба блока из Paper 1. Калькулятор годится ровно на проверку:
        сравнить значение функции и многочлена в x = 0.1.
    prereq: [from_derivatives]
    raw_tags: [maclaurin_series, standard_series, series_substitution,
               recognize_series, composite_function, series_expansion]
    blocks: [2024-MAY-TZ1-P1-Q08-A-I, 2023-NOV-TZ1-P1-Q11-D]

  - id: binomial_series
    name: Биномиальный ряд с нецелым показателем
    rung: 3
    trigger: >
      Скобка в степени, которая не является целым неотрицательным числом:
      (1 + t)⁻¹, (1 − x)⁻⁴, (1 − ax)^(−1/2), √(1 + x). Разложение бесконечно,
      и вопрос всегда обрывает его на заказанном члене.
    chain:
      - Привести к виду (1 + u)^p — единица впереди обязательна
      - Выписать p, p(p−1)/2!, p(p−1)(p−2)/3! — три коэффициента обычно и нужны
      - Подставить u вместе с его знаком и множителем
      - Если требуют, назвать область сходимости |u| < 1
    traps:
      - "Знак внутри скобки теряют: у (1 − x)⁻⁴ все коэффициенты выходят
        положительными именно потому, что минусы сокращаются попарно"
      - "Из скобки не выносят: (2 − x)^(1/2) раскладывать нельзя, пока это
        не √2·(1 − x/2)^(1/2)"
      - "Область сходимости пишут по одной скобке из двух: у произведения
        (1 − 2x)^(−1/2)(1 − 4x)^(−1/2) сходятся обе, и решает |x| < 1/4"
      - "Формулу для целого показателя тянут на дробный: (2n−1)!/(n−1)!
        в мае 2024 не сокращается до знакомого биномиального коэффициента"
    calculator:
      mode: forbidden
      note: >
        Ноябрь 2025 просит показать, что a = 4, и найти b — оба ответа
        целые и точные. Единственная арифметика темы, где GDC полезен,
        стоит в следующем пункте того же вопроса и уже не про ряд.
    prereq: [substitution]
    raw_tags: [binomial_theorem, binomial_series, fractional_index,
               negative_index, maclaurin_series, convergence, validity_range]
    blocks: [2025-NOV-TZ1-P1-Q05-A, 2024-MAY-TZ2-P1-Q12-B]

  - id: product_of_series
    name: Произведение рядов
    rung: 4
    trigger: >
      Функция — произведение двух, у каждой из которых ряд известен:
      eˣ sin x, √(1 + x)·e^(mx), (1 − 2x)^(−1/2)(1 − 4x)^(−1/2), sin²(x²).
      Самый частый приём темы: 21 балл из 99.
    chain:
      - Разложить каждый множитель, взяв запас по степеням
      - Перемножить, отбрасывая всё выше заказанной степени сразу
      - Собрать подобные
      - "Проверить свободный член: он равен произведению свободных членов"
    traps:
      - "Берут одинаковое число членов у обоих множителей: у eˣ sin x до x³
        нужны три члена экспоненты и два синуса, потому что синус начинается
        с x и съедает одну степень"
      - "Перемножают целиком и тонут в лишних степенях — отбрасывать надо
        по ходу, а не в конце"
      - "У квадрата берут квадраты членов: sin²(x²) ≠ x⁴ − x¹²/36, средний
        член 2·x²·(−x⁶/6) никуда не девается"
      - "Забывают, что произведение может понизить нужную глубину: у
        4x·sin(x²)cos(x²) множитель x впереди сдвигает всё на степень"
    calculator:
      mode: forbidden
      note: >
        Все пять блоков из Paper 1. Ответы — x + x² + x³/3, 1 + 3x + 19x²/2,
        m = 3/2 и −5/2: точные всюду.
    prereq: [substitution, binomial_series]
    raw_tags: [series_multiplication, collect_terms, maclaurin_series,
               product_of_series, truncation, equate_coefficients]
    blocks: [2022-MAY-TZ1-P1-Q12-A, 2021-MAY-TZ1-P1-Q12-C,
             2024-MAY-TZ2-P1-Q12-C, 2024-MAY-TZ1-P1-Q08-A-II,
             2024-MAY-TZ1-P1-Q08-B]

  - id: composition
    name: Ряд внутри ряда
    rung: 5
    trigger: >
      Внутрь стандартной функции подставлена не степень, а целое выражение,
      которое само надо разложить: e^(cos 2x − 1), sec x = (1 + (cos x − 1))⁻¹.
      Отличие от приёма 2 в том, что внутренняя часть — ряд, а не одночлен,
      и возводить в степень приходится многочлен.
    chain:
      - Разложить внутреннюю функцию и отнять то, что делает её малой в нуле
      - Убедиться, что внутреннее выражение обращается в нуле в ноль —
        иначе внешний ряд не сходится к тому, что нужно
      - Подставить его как u во внешний ряд
      - Возвести в квадрат и в куб только то, что даёт нужные степени
      - Собрать подобные и, если надо, домножить на вынесенный множитель
    traps:
      - "Подставляют cos 2x вместо cos 2x − 1: e^u раскладывается около
        u = 0, а cos 2x в нуле равен единице, не нулю. Именно поэтому
        вопрос ноября 2023 и разбит на три пункта"
      - "Вынесенный множитель теряют на последнем шаге: e^(cos 2x) =
        e·e^(cos 2x − 1), и вся e должна остаться в ответе"
      - "У u² берут только первый член: (−2x² + 2x⁴/3)² даёт 4x⁴, и без
        него коэффициент при x⁴ выходит неверным"
      - "sec x раскладывают через производные — четыре производные секанса
        против трёх строк с биномом"
    calculator:
      mode: checks
      note: >
        Ноябрь 2023 — Paper 1, май 2021 — Paper 2, но и там ответ задан
        в условии («show that»), так что десятичной проверки не хватит.
        GDC полезен ровно на то, чтобы сверить e^(cos 0.2) с многочленом.
    prereq: [substitution, product_of_series]
    raw_tags: [composite_series, series_substitution, maclaurin_series,
               nested_expansion, factor_out, recognize_series]
    blocks: [2021-MAY-TZ2-P2-Q09-B, 2023-NOV-TZ1-P1-Q11-D]

  - id: term_by_term
    name: Дифференцирование и интегрирование ряда
    rung: 6
    trigger: >
      Ряд для нужной функции неизвестен, но известен ряд для её производной
      или первообразной. Приметы: «use integration to show», «by
      differentiating both sides», и — самая незаметная — геометрическая
      прогрессия в условии, потому что её сумма 1/(1 − r) и есть ряд.
    chain:
      - Записать известный ряд (чаще всего геометрический)
      - Продифференцировать или проинтегрировать обе части почленно
      - Постоянную интегрирования найти подстановкой x = 0
      - "Сверить область сходимости: она не меняется"
    traps:
      - "Постоянную интегрирования не находят: arctan x = x − x³/3 + … + C,
        и C = 0 только после подстановки нуля. Балл стоит отдельно"
      - "Дифференцируют левую часть и забывают, что справа тоже функция
        от r: d/dr [a/(1 − r)] = a/(1 − r)², и квадрат появляется именно
        отсюда"
      - "Геометрическую прогрессию не узнают в сумме Σ(−2x²)ʳ и считают
        члены руками"
      - "Условие |r| < 1 не выписывают, а от него зависит и ответ на
        следующий пункт: наибольшее K это 1/√2, а не бесконечность"
    calculator:
      mode: speeds_up
      note: >
        Два блока из трёх — Paper 2 и Paper 3. Само почленное действие
        одинаково с калькулятором и без; GDC нужен дальше, когда из ряда
        достают число.
    prereq: [substitution]
    raw_tags: [term_by_term_integration, term_by_term_differentiation,
               geometric_series, sum_to_infinity, integration_constant,
               maclaurin_series, convergence]
    blocks: [2025-NOV-TZ3-P3-Q02-B, 2024-MAY-TZ1-P3-Q01-C-I,
             2025-MAY-TZ1-P2-Q12-C]

  - id: from_ode
    name: Ряд из дифференциального уравнения
    rung: 7
    trigger: >
      Функция задана не формулой, а уравнением с начальным условием,
      и спрашивают её ряд. Формулы для y нет вовсе — но производные
      в нуле уравнение выдаёт по одной, и больше ничего не нужно.
    chain:
      - Подставить x = 0 и начальное условие в само уравнение — это y′(0)
      - Продифференцировать уравнение неявно, по всей правой части
      - Подставить x = 0 и уже найденные значения — это y″(0)
      - Повторить столько раз, сколько членов просят
      - Собрать Σ y⁽ⁿ⁾(0)·xⁿ/n!
    traps:
      - "Правую часть дифференцируют как функцию одного x, забыв, что y
        тоже зависит от x: в (x²y − y)/(x² + 1) член y′ обязан появиться"
      - "Подставляют x = 0 до дифференцирования — тогда уравнение
        превращается в число и производных больше не даёт"
      - "Делят на n! не для всех членов: y‴(0) = 9 даёт 3x³/2"
      - "Приближение считают по ряду там, где следующий пункт просит точное
        решение, и не замечают, что шесть значащих цифр они не совпадают"
    calculator:
      mode: required
      note: >
        Единственный блок приёма — Paper 2, и второй его пункт просит
        y(0.15) с точностью до шести значащих цифр. Без GDC этого не сделать,
        и весь смысл пункта в сравнении: ряд даёт 2.58881, точное решение —
        другое число, метод Эйлера — третье.
    prereq: [from_derivatives]
    raw_tags: [implicit_differentiation, differential_equation,
               maclaurin_series, initial_condition, higher_derivatives,
               numerical_approximation]
    blocks: [2023-MAY-TZ1-P2-Q12-C-I-II]

  - id: use_series
    name: Ряд вместо функции
    rung: 8
    trigger: >
      Ряд уже получен — обычно в предыдущем пункте, и «hence» это говорит
      прямо. Дальше с многочленом делают то, что с функцией не выходило:
      берут предел, подставляют число, интегрируют.
    chain:
      - Заменить функцию отрезком её ряда
      - "Сделать с многочленом то, что просят: сократить, подставить,
        проинтегрировать почленно"
      - Если ответ число — довести арифметику до заказанной точности
      - Назвать, при каком x приближение вообще законно
    traps:
      - "Подставляют в исходную функцию вместо ряда — приближения не
        получается вовсе, а получается то же самое число"
      - "Интегрируют функцию, а не ряд: ∫₀¹ e^(x²)sin(x²)dx первообразной
        не имеет, и вся суть пункта в том, чтобы этого не пробовать"
      - "Область сходимости не проверяют: приближение при x = 1/10 законно,
        при x = 1/2 — уже нет"
      - "Ответ дают в другой форме, чем просят: «в виде c/d, где c, d
        целые» — это 837/500, а не 1.674"
    calculator:
      mode: speeds_up
      note: >
        Четыре блока из шести — Paper 2 и Paper 3, и именно здесь
        калькулятор перестаёт быть иллюзией: π к четырём знакам, √3 в виде
        дроби, 61/105. Два блока Paper 1 при этом требуют точной формы.
    prereq: [substitution, term_by_term]
    raw_tags: [maclaurin_series, series_approximation, limit_evaluation,
               term_by_term_integration, numerical_approximation,
               substitute_value, definite_integral]
    blocks: [2022-MAY-TZ1-P1-Q12-B, 2024-MAY-TZ2-P1-Q12-E,
             2025-NOV-TZ3-P3-Q02-C, 2025-NOV-TZ3-P3-Q02-G,
             2021-MAY-TZ1-P3-Q02-E-I, 2021-MAY-TZ2-P2-Q09-C]

  - id: error_bound
    name: Насколько приближение верно
    rung: 9
    trigger: >
      В условии стоит слово «error» или граница вида 0.0001, 1×10⁻⁶.
      Единственное место архива, где спрашивают не значение приближения,
      а его качество. Работает, когда ряд знакочередующийся и члены убывают
      по модулю: тогда ошибка не превосходит первого отброшенного члена.
    chain:
      - Убедиться, что ряд знакочередующийся и члены убывают
      - Написать первый отброшенный член как формулу от номера
      - Приравнять его к границе и решить — обычно перебором по номеру
      - "Перевести номер члена в число членов: ошибка от n членов
        оценивается членом n + 1"
    traps:
      - "Ошибка на единицу: границу примеряют к n-му члену вместо (n+1)-го.
        Это главная и почти единственная потеря приёма"
      - "Номер члена выдают за число членов: n = 15 в степени x^n значит
        восьмой ненулевой член, а нужных членов семь"
      - "Границу применяют к ряду, который не знакочередуется, — теорема
        тогда ничего не говорит, и это надо оговорить"
      - "При проверке теоремы сравнивают приближение с приближением:
        настоящую ошибку даёт точное значение из предыдущего пункта,
