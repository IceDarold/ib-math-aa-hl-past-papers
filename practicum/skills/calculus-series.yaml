      8823-7111, — но вопрос про f(x) = e^(cos 2x) поставлен в них слово
      в слово, включая область −π/4 ≤ x ≤ 5π/4 и все пять пунктов. Это
      не ошибка разметки, а совпадение в самих бумагах; ровно та же пара
      бумаг уже дала дубль в E1 (sin²(kx)/x²). Стоит пометить блоки
      как эквивалентные, чтобы счётчики баллов не удваивали тему.
      В архиве E2 вопрос входит один раз.
  - block: 2022-MAY-TZ1-P1-Q12-B
    issue: >
      В task_summary верхний предел интегрирования записан как 1/2:
      «the definite integral from 0 to 1/2 of e^(x^2) sin(x^2) dx».
      В бумаге предел равен 1, и схема оценивания даёт 61/105 —
      1/3 + 1/5 + 1/21, то есть значение именно на отрезке [0, 1].
      Условие восстановлено по бумаге.
  - block: 2024-MAY-TZ2-P1-Q12-C
    issue: >
      task_summary приводит ответ к виду 1 + 3x + 19x²/2, а бумага просит
      показать (2 + 6x + 19x²)/2. Числа те же, но «show that» — требование
      к записи, и в архиве стоит форма из бумаги.
  - blocks: [2025-NOV-TZ3-P3-Q02-E, 2025-NOV-TZ3-P3-Q02-H,
             2025-NOV-TZ3-P3-Q02-I]
    issue: >
      Во всех трёх task_summary подынтегральное выражение записано как
      (arctan x)/x. В бумаге стоит arctan x, без деления. Проверяется
