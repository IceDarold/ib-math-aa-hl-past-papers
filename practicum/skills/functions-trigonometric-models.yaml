version: 0.1
practicum: C4
title: "Синусоидальные модели: амплитуда, период, сдвиг"
source_topic: functions.trigonometric_functions
corpus:
  blocks: 34
  marks: 83
  sessions: May 2021 — November 2025
  papers: {1: 11, 2: 62, 3: 10}
  gdc_marks: 72
  note: >
    Зеркало практикума C3. Там 77% баллов без калькулятора, здесь 87% с ним.
    Считать почти нечего: работа в том, чтобы перевести словесное описание
    в формулу и потом эту формулу прочитать.

    Особенность темы — длинный связный вопрос. Типичный блок архива это семь
    пунктов подряд про один и тот же прилив, где параметры из (a)–(d)
    используются в (e)–(g). Поэтому ошибка в амплитуде стоит не двух баллов,
    а восьми, и приёмы 1–5 важнее приёмов 6–8, хотя баллов на них меньше.

skills:
  - id: period_from_coefficient
    name: Период и коэффициент b
    rung: 1
    trigger: >
      В условии есть слово «период», либо описано, через сколько повторяется
      событие: «между соседними приливами 12 часов», «оборот занимает
      20 минут», «график пересекает ось в точках 0, 2m, 4m».
    chain:
      - Определить период T из описания
      - "Синус и косинус: b = 2π/T, обратно T = 2π/b"
      - "Тангенс: b = π/T, обратно T = π/b"
    traps:
      - "Формула синуса применена к тангенсу. У tan период вдвое короче,
        и ответ получается ровно вдвое больше нужного"
      - Период спутан с полупериодом. Между соседними максимумами проходит
        период, а между максимумом и следующим минимумом — половина
      - "Период найден верно, но не переведён в b: в ответ идёт T вместо 2π/T"
    calculator:
      mode: speeds_up
      note: >
        Считает 2π/7.8, и только. Формулу выбирает человек, и именно
        на выборе между 2π/b и π/b теряется балл.
    prereq: []
    raw_tags: [period_determination, period_formula, period_of_cosine,
               period_of_tangent, recognize_period, relate_period_to_coefficient,
               determine_period, identify_period, state_period, find_period,
               calculate_frequency, period_to_b, compute_half_period,
               period_division, coefficient_effect]
    blocks: [2023-MAY-TZ2-P2-Q10-A, 2025-MAY-TZ1-P2-Q02-A, 2021-NOV-COMMON-P2-Q09-A,
             2023-MAY-TZ1-P1-Q05-A, 2025-NOV-TZ1-P2-Q04-B]

  - id: amplitude_and_midline
    name: Амплитуда и средняя линия
    rung: 2
    trigger: Даны наибольшее и наименьшее значения величины.
    chain:
      - a = (max − min)/2
      - d = (max + min)/2
      - "Проверить: d + a обязано дать максимум, d − a — минимум"
    traps:
      - Амплитуда взята как весь размах, без деления пополам
      - "Формулы перепутаны местами: сумма ушла в амплитуду, разность в среднюю
        линию. Ловится проверкой d + a = max за секунду"
    calculator:
      mode: speeds_up
      note: >
        Арифметика в одну строку. Markscheme принимает и второй путь —
        систему d + a = max, d − a = min; он длиннее, но выручает,
        когда формулы забылись.
    prereq: []
    raw_tags: [amplitude_formula, midline_formula, amplitude_from_extrema,
               amplitude_from_diameter, determine_amplitude, vertical_shift,
               determine_vertical_shift, simultaneous_equations]
    blocks: [2021-NOV-COMMON-P2-Q09-B, 2021-NOV-COMMON-P2-Q09-C,
             2023-MAY-TZ2-P2-Q10-B]

  - id: amplitude_sign
    name: Знак амплитуды
    rung: 3
    trigger: >
      Сказано, где начинается движение: «груз отпускают из нижней точки»,
      «кабинка стартует внизу», «локальный минимум в (0, −8)». Формула при этом
      без сдвига, вида a·cos(bt) + d.
    chain:
      - Подставить t = 0; косинус даёт единицу, значит H(0) = a + d
      - Старт в минимуме означает a < 0, старт в максимуме — a > 0
      - Взять величину амплитуды из приёма 2 и приписать найденный знак
    traps:
      - "Знак не поставлен вовсе: арифметика верна, а фраза про нижнюю точку
        не использована. Это и есть то, ради чего вопрос задан"
      - Минус перед амплитудой перепутан со сдвигом c. Оба выражают «начинаем
        не с максимума», но одновременно их не применяют
    calculator:
      mode: checks
      note: >
        Построить график с найденными параметрами и посмотреть, где он
        начинается, — проверка на десять секунд, снимающая весь вопрос.
    prereq: [amplitude_and_midline]
    raw_tags: [sign_determination, solve_for_parameter, use_given_points]
    blocks: [2023-MAY-TZ2-P2-Q10-B, 2021-MAY-TZ1-P2-Q03, 2025-NOV-TZ1-P2-Q04-A]

  - id: phase_shift
    name: Фазовый сдвиг
    rung: 4
    trigger: >
      Известен момент, в который случился максимум или минимум: «первый прилив
      в 04:30», «локальный максимум в (16, 2)». Либо просят сдвинуть готовую
      модель во времени.
    chain:
      - "Правило в одну строку: c = момент первого максимума минус четверть периода"
      - Либо подставить точку максимума в модель и решить sin(...) = 1
      - Из бесконечной серии решений выбрать наименьшее положительное
      - "При сдвиге во времени: «раньше» уменьшает c, «позже» увеличивает"
    traps:
      - Взят первый попавшийся корень вместо наименьшего положительного;
        решения идут через период, и отрицательные среди них встречаются
      - "Единицы: сдвиг дан в минутах, а модель считает в часах"
      - "Знак: «на 50 минут раньше» — это вычесть, а не прибавить"
    calculator:
      mode: checks
      note: >
        Решает уравнение sin(...) = 1, но наименьший положительный корень
        выбирает человек. График показывает, попал ли максимум туда,
        куда сказано в условии.
    prereq: [period_from_coefficient]
    raw_tags: [phase_shift_determination, phase_shift, phase_shift_adjustment,
               find_phase_shift, horizontal_translation, time_conversion,
               substitution]
    blocks: [2021-NOV-COMMON-P2-Q09-D, 2021-NOV-COMMON-P2-Q09-G,
             2025-NOV-TZ1-P2-Q04-C]

  - id: build_model
    name: Сборка модели целиком
    rung: 5
    trigger: >
      Дано словесное описание ситуации и вид формулы, спрашивают все параметры
      сразу. Обычно 5–7 баллов — самый дорогой пункт темы.
    chain:
      - Размах даёт величину амплитуды
      - Слова о начале движения дают знак
      - Крайние значения дают среднюю линию
      - Период даёт b
      - Момент экстремума даёт c
      - "Проверить подстановкой: h(0) обязано совпасть с описанием"
    traps:
      - Параметры ищутся не в том порядке, и знак амплитуды теряется,
        потому что о нём вспоминают последним
      - Средняя линия отсчитана от нуля, а не от нижнего положения объекта
        (у колеса обозрения центр на высоте «низ плюс радиус»)
    calculator:
      mode: checks
      note: >
        Второй путь, который markscheme принимает наравне: подставить две
        известные точки графика и решить систему относительно параметров.
        Систему GDC решает сразу — см. приём linear_system в C6.
    prereq: [amplitude_sign, phase_shift]
    raw_tags: [model_formulation, use_given_points, use_tidal_data,
               solve_for_parameter, system_of_equations, solving_linear_system,
               tangent_values]
    blocks: [2021-MAY-TZ1-P2-Q03, 2024-MAY-TZ1-P2-Q10-D, 2025-MAY-TZ1-P2-Q02-B,
             2025-NOV-TZ1-P2-Q04-A]

  - id: use_model
    name: Чтение готовой модели
    rung: 6
    trigger: >
      Модель уже собрана, спрашивают значение в момент времени, момент
      по значению или число событий за интервал.
    chain:
      - "Значение в момент: подставить t и посчитать"
      - "Момент по значению: решить H(t) = k и выбрать нужный корень по графику"
      - "Счёт событий: найти первый экстремум, дальше они идут через период"
    traps:
      - "Калькулятор в градусах. Все модели темы содержат π в коэффициенте,
        и градусный режим даёт правдоподобный неверный ответ"
      - "Счёт делением интервала на период. При старте в минимуме первый
        максимум приходится на полпериода, и деление даёт верный ответ
        случайно; при старте в максимуме тот же счёт ошибается на единицу"
      - Взят первый корень уравнения вместо того, который просят
    calculator:
      mode: required
      note: >
        Здесь он и правда нужен: значения нетабличные, корни ищутся численно.
        Все блоки приёма из Paper 2.
    prereq: [build_model]
    raw_tags: [function_evaluation, trigonometric_evaluation, evaluate_function,
               substitute_value, round_to_significant_figures, counting_maxima,
               graphical_interpretation, numerical_solve_gdc, use_gdc,
               gdc_evaluation, find_root, periodic_behavior, set_equations_equal,
               find_maximum, find_threshold, iterate_composition]
    blocks: [2021-NOV-COMMON-P2-Q09-E, 2023-MAY-TZ2-P2-Q10-C,
             2022-MAY-TZ2-P2-Q10-A-I-II, 2022-MAY-TZ2-P2-Q10-B,
             2024-MAY-TZ1-P2-Q10-A]

  - id: threshold_interval
    name: Порог и суммарное время
    rung: 7
    trigger: >
      «Сколько времени уровень выше 5 метров», «какую долю суток», то есть
      спрашивают не момент, а длительность.
    chain:
      - Решить уравнение H(t) = k и найти все корни в интервале
      - По графику понять, между какими корнями функция выше порога
      - Сложить длины всех подходящих промежутков
    traps:
      - "Найдена одна полоса из двух. За сутки промежуток обычно повторяется
        дважды, и ответ получается вдвое меньше нужного. Спрашивают total"
      - Промежутки перепутаны местами — взят отлив вместо прилива;
        без графика это не видно
    calculator:
      mode: required
      note: >
        Корни уравнения ищутся численно, но складывать промежутки
        и решать, какие из них подходят, приходится человеку.
    prereq: [use_model]
    raw_tags: [solve_trigonometric_inequality, interval_analysis,
               time_accumulation, inequality_setup, solve_linear_inequality,
               subtraction, rounding]
    blocks: [2021-NOV-COMMON-P2-Q09-F, 2024-MAY-TZ1-P2-Q10-B]

  - id: bounds_argument
    name: Оценка через ±1
    rung: 8
    trigger: >
      Просят доказать неравенство при всех значениях переменной, а не найти
      точку: «покажите, что A всегда выше B», «известно, что g(x) ≥ 7 при всех x».
      Почти всегда Paper 1.
    chain:
      - Отделить слагаемое с синусом от остального
      - Оценить синус константой; аргумент при этом не важен
      - Показать, что остального хватает с запасом
    traps:
      - Ищутся точки пересечения. «Всегда» через численные корни
        не доказывается, и метод не засчитывают
      - Оценка сделана, но не сказано, что она достигается или строгая —
        markscheme требует явного R1
    calculator:
      mode: forbidden
      note: >
        Единственный приём темы, где калькулятор бесполезен, и единственный,
        где почти все вопросы из Paper 1. Ответ здесь рассуждение,
        а не число.
    prereq: []
    raw_tags: [trigonometric_bound, inequality_proof, sine_minimum,
               form_difference, algebraic_manipulation, substitute_x_zero,
               evaluate_trigonometric_expression]
    blocks: [2022-MAY-TZ1-P1-Q05-B, 2022-MAY-TZ2-P2-Q10-C]

# Что в теме есть, но приёмом не стало.
leftovers:
  - what: Чётность и нечётность
    marks: 4
    blocks: [2023-NOV-TZ1-P1-Q09-A, 2025-MAY-TZ2-P3-Q01-B]
    note: >
      «Покажите, что f(x) = sin²(kx)/x² чётная» — подставить −x и вспомнить,
      что синус нечётен. Приёма не образует: два блока, один шаг, к моделям
      отношения не имеет. Разобрано в разделе про Paper 1.
  - what: Композиция с тригонометрией
    marks: 4
    blocks: [2022-MAY-TZ1-P1-Q03-A, 2023-MAY-TZ1-P2-Q02-A]
    note: >
      Подставить g в f и упростить. Оба блока — пункт (a) вопроса, чей
      пункт (b) уже разбирается в C3: например f(2x) = 3sin2x/cos2x,
      а дальше решают tan 2x = 1/√3. Материал по существу принадлежит
      композиции функций (B2) и уравнениям (C3).

# Замечания к классификации, отправить в classification/reviews.
corpus_issues:
  - block: 2025-MAY-TZ1-P2-Q02-B
    issue: >
      В evidence markscheme записан как «a = -√3/2 (0.866025..., 0.866)» —
      знак в скобках потерян. Решение системы даёт a = −√3/2 ≈ −0.866,
      это проверено независимо в practicum/tests/verify_c4.py. Само значение
      в method_path верное, расходится только десятичное пояснение.

ladder:
  - period_from_coefficient
  - amplitude_and_midline
  - amplitude_sign
  - phase_shift
  - build_model
  - use_model
  - threshold_interval
  - bounds_argument
