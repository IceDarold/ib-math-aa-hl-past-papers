version: 0.2
practicum: D3
title: Биномиальное распределение
source_topic: statistics.probability
also_covers: [statistics.discrete_random_variables]

corpus:
  blocks: 23
  marks: 71
  effective_blocks: 20
  effective_marks: 62
  sessions: May 2021 — May 2025
  papers: {2: 23}
  gdc_marks: 71
  note: >
    Темы «биномиальное распределение» в разметке нет. Его вопросы лежат
    в двух темах почти поровну: 36 баллов в statistics.probability (это
    те, что D2 оставил для D3) и 35 в statistics.discrete_random_variables.
    D3 берёт из обеих всё, где модель — X ~ B(n, p): точечные и
    накопленные вероятности, условные внутри одного распределения, среднее
    и дисперсию, наименьшее n, биномиальное поверх другого.

    Девять баллов — ноябрьский дубль 2023 года, в восьмой раз за серию:
    Q6(a) и Q10(c) одной и той же бумаги посчитаны двумя зональными
    копиями. Без дубля 20 блоков и 62 балла.

    Все 23 блока из Paper 2, и 100% баллов формально с калькулятором.
    Здесь это почти правда: вероятность «не больше шести из пятидесяти»
    на бумаге не берётся, и схема оценивания пишет «use of tables» как
    метод. Без GDC решаются только квадратное уравнение на p, Var(1 − 2X)
    и наименьшее n через логарифм — около десяти баллов из 62. Но и там
    калькулятор делает последний шаг, а баллы стоят за перевод слов в
    неравенство: «more than 6», «fewer than 49», «at least one».

directions:
  read: >
    Модель названа или узнаётся сразу, и вопрос про одно событие над ней:
    ровно k, не больше k, хотя бы k. Работа — перевести слова в границу
    так, чтобы калькулятор, умеющий только P(X ≤ k), её взял. Приёмы 1, 2.
  summarise: >
    Спрашивают не вероятность, а число, описывающее всё распределение:
    среднее, дисперсию, дисперсию преобразованной величины — или, наоборот,
    по дисперсии ищут p. Приём 3.
  cut: >
    Внутри одного распределения отрезают часть: «given that at most six».
    Числитель — пересечение двух диапазонов значений. Приём 4.
  stack: >
    Вероятность успеха сама получена из другого распределения, или
    неизвестно число испытаний. Биномиальное становится шагом внутри
    вопроса, а не вопросом. Приёмы 5, 6.

skills:
  - id: exact_value
    name: Узнать B(n, p) и взять P(X = k)
    rung: 1
    trigger: >
      Одно и то же испытание повторяют фиксированное число раз, исходов
      у него два, вероятность успеха не меняется, испытания независимы —
      и спрашивают «exactly k». Чаще всего p получено в предыдущем пункте
      из нормального распределения: «in a random selection of 12
      chocolate muffins, find the probability that exactly 5 weigh less
      than 61 g».
    chain:
      - Назвать величину и модель словами или символами — X ~ B(n, p). За
        это первый балл, и без него ответ без решения теряет второй
      - Взять p полностью, со всеми цифрами калькулятора, а не округлённым
      - P(X = k) — binompdf, или nCk·pᵏ(1 − p)ⁿ⁻ᵏ
    traps:
      - "Берут накопленную вероятность вместо точечной: binomcdf там, где
        «exactly». Для 10 дождливых дней из 31 это 0,967 вместо 0,0419"
      - "Путают p и 1 − p: считают вероятность того, что вес больше 61 г,
        когда спрашивали «меньше»"
      - "Ответ с двумя значащими цифрами. Схема оценивания мая 2024:
        «If no working shown, award (M1)A0 for 0.042 (2 sf)»"
      - "Не пишут модель: B(12; 0,365) — это и есть M1"
    calculator:
      mode: needed
      note: >
        Все пять блоков с калькулятором и все пять — одно нажатие binompdf.
        Балл за метод стоит на записи модели, а не на счёте.
    prereq: []
    raw_tags: [binomial_distribution, probability_exact, gdc, binomial_probability,
               probability_calculation, recognize_distribution, binomial_model,
               binomial_pdf]
    blocks: ['2022-MAY-TZ1-P2-Q11-B', '2023-MAY-TZ2-P2-Q03-D',
             '2024-MAY-TZ1-P2-Q06-A', '2023-MAY-TZ1-P2-Q11-D',
             '2023-NOV-TZ2-P2-Q10-C-I']

  - id: cumulative
    name: "Слова в границу: не больше, хотя бы, больше"
    rung: 2
    trigger: >
      В вопросе стоит «at most», «at least», «more than», «fewer than» —
      слово, превращающее одно значение в диапазон. Калькулятор умеет
      только P(X ≤ k), и всё остальное переводится в эту форму руками.
    chain:
      - Записать событие неравенством на X — отдельной строкой, до калькулятора
      - «Не больше k» это X ≤ k; «меньше k» это X ≤ k − 1
      - «Хотя бы k» это 1 − P(X ≤ k − 1); «больше k» это 1 − P(X ≤ k)
      - «Хотя бы один» — через дополнение, 1 − P(X = 0)
    traps:
      - "«At least 10» считают как 1 − P(X ≤ 10): десять выпадает. Схема
        оценивания мая 2024 даёт M1 именно за 1 − P(X ≤ 9)"
      - "«More than 6» считают как 1 − P(X ≤ 5): шесть попадает туда, где
        его нет"
      - "Вместо 1 − P(X ≤ k) пишут P(X ≤ k) — это противоположное событие"
      - "«Хотя бы один» складывают по слагаемым от 1 до 30 и теряют член"
    calculator:
      mode: needed
      note: >
        Пять блоков, все с калькулятором, и в трёх из них n = 31, 40, 64:
        сумму на бумаге не сложить. Но калькулятор ошибку границы не
        заметит — он честно посчитает P(X ≤ 5), если попросить.
    prereq: [exact_value]
    raw_tags: [binomial_distribution, cumulative_probability, complement_rule,
               binomial_probability, cumulative_distribution, probability_calculation,
               gdc, evaluate_binomial_probability, round_answer]
    blocks: ['2024-MAY-TZ1-P2-Q06-B', '2021-MAY-TZ2-P2-Q10-E',
             '2025-MAY-TZ2-P2-Q10-D', '2025-MAY-TZ3-P2-Q11-A-I',
             '2021-NOV-COMMON-P2-Q03-A']

  - id: mean_variance
    name: Среднее, дисперсия и p по дисперсии
    rung: 3
    trigger: >
      Спрашивают «expected number», E(X), Var(X) или дисперсию величины,
      линейно выраженной через X, — либо дисперсия дана, а неизвестно p.
    chain:
      - E(X) = np — ожидаемое число успехов, и оно не обязано быть целым
      - Var(X) = np(1 − p)
      - Var(aX + b) = a²·Var(X) — постоянная уходит, множитель в квадрате
      - Если дана дисперсия, np(1 − p) = данное число — квадратное
        уравнение на p, и корней у него обычно два
    traps:
      - "Округляют ожидаемое число до целого: 4,56 рейса — верный ответ"
      - "Берут один корень: p = 0,641 и p = 0,359 дают одну дисперсию,
        потому что p и 1 − p в np(1 − p) симметричны. Схема оценивания
        ноября 2023 — A1A1, по баллу за каждый"
      - "Var(1 − 2X) считают как −2·Var(X) или как 4·Var(X) + 1"
      - "Путают дисперсию и стандартное отклонение"
    calculator:
      mode: allowed
      note: >
        Три блока с калькулятором, и по-настоящему он нужен в одном — где
        p из нормального распределения. np(1 − p) = 5,75 решается
        формулой корней, дисперсия Y — умножением на четыре.
    prereq: [exact_value]
    raw_tags: [binomial_distribution, expected_value, binomial_variance_formula,
               quadratic_equation, solve_for_variable, binomial_variance,
               substitution, gdc_solve, variance_linear_transformation,
               substitute_value]
    blocks: ['2021-MAY-TZ2-P2-Q10-D', '2023-NOV-TZ1-P2-Q06-A',
             '2023-NOV-TZ2-P2-Q06-A', '2023-NOV-TZ1-P2-Q06-B']

  - id: conditional_binomial
    name: Условная вероятность внутри одного распределения
    rung: 4
    trigger: >
      «Given that at most six surveys were entered inaccurately, find the
      probability that exactly four…» — оба события про одну и ту же X.
      Условие отрезает диапазон значений, и всё считается внутри него.
    chain:
      - "Записать P(A | B) с событиями в контексте — «X = 4 | X ≤ 6», а не
        голое P(A | B): иначе M0"
      - "Числитель — пересечение диапазонов. {X ≤ 2} ∩ {X ≥ 1} это X = 1 или 2"
      - Знаменатель — вероятность условия, и границу в нём перевести так же
        аккуратно, как в приёме 2
    traps:
      - "«Fewer than 49» переводят как X ≤ 49. Схема оценивания ноября 2023
        разбирает этот случай отдельной оговоркой: 0,0149581 вместо
        0,0157 — (A0)(M1)(A1)A0"
      - "В числитель ставят всё событие, а не пересечение: P(X ≤ 2)/P(X ≥ 1)
        больше единицы, и это видно — если посмотреть"
      - "Условную вероятность переворачивают: P(X ≥ 1 | X ≤ 2)"
      - "Забывают разделить и сдают пересечение как ответ"
    calculator:
      mode: needed
      note: >
        Все четыре блока с калькулятором, и в каждом по две накопленные
        вероятности. Работа на бумаге — только числитель и граница.
    prereq: [cumulative]
    raw_tags: [conditional_probability, binomial_distribution,
               compute_binomial_probabilities, substitute_values, evaluate_result,
               round_answer, gdc, gdc_binomial, binomial_cdf, binomial_pdf]
    blocks: ['2021-NOV-COMMON-P2-Q03-B', '2025-MAY-TZ3-P2-Q11-A-II',
             '2023-NOV-TZ1-P2-Q10-C-I-AND-C-II', '2023-NOV-TZ2-P2-Q10-C-II']

  - id: nested
    name: Биномиальное поверх другого распределения
    rung: 5
    trigger: >
      Успехом названо событие, вероятность которого сама считается: коробка
      «with at least 30 premium apples», спортсменка, у которой «at least
      one throw of 60 metres». Внутренний шаг — нормальное или биномиальное,
      внешний — снова биномиальное или «ровно один из двоих».
    chain:
      - "Решить, что здесь одно испытание: яблоко, коробка или бросок"
      - Посчитать вероятность успеха этого испытания и держать её полностью
      - Построить внешнюю модель с этим p и ответить на вопрос о ней
      - «Ровно один из двоих» — P(A)(1 − P(B)) + P(B)(1 − P(A)), не
        объединение
    traps:
      - "Во внешнюю модель подставляют вероятность внутреннего испытания:
        B(10; 0,628) вместо B(10; 0,0739)"
      - "«Only one of Rachel or Sophia qualifies» считают как «хотя бы
        одна» — случай, когда прошли обе, остаётся внутри"
      - "Промежуточную вероятность округляют до 0,0739 и получают 0,00395
        вместо 0,00394; схема оценивания даёт FT, но не всегда"
    calculator:
      mode: needed
      note: >
        Оба блока с калькулятором и оба требуют его дважды: внутреннее
        распределение и внешнее. Семибалльный майский 2022 TZ2 — самый
        длинный вопрос темы, и в нём ни одной формулы, только модели.
    prereq: [cumulative]
    raw_tags: [binomial_distribution, probability_calculation, normal_cdf,
               complement_rule, probability_of_independent_events,
               probability_of_exactly_one_event]
    blocks: ['2025-MAY-TZ2-P2-Q10-E', '2022-MAY-TZ2-P2-Q08']

  - id: unknown_trials
    name: Неизвестное число испытаний
    rung: 6
    trigger: >
      «Determine the least value of n such that P(X ≥ 1) > 0.99», «the least
      number of trials required to be 99% sure of at least one success»,
      «the probability that at most six… is approximately 0.367. Find n».
      Неизвестна не вероятность, а n.
    chain:
      - Записать неравенство на вероятность как функцию n
      - Для «хотя бы одного» это 1 − (1 − p)ⁿ > 0,99, и логарифм даёт границу
      - Иначе — таблица значений на калькуляторе по n
      - Ответ — целое n по нужную сторону границы, и соседнее проверить
    traps:
      - "Сдают границу из логарифма, 16,0078, вместо целого 17"
      - "Округляют вниз: при n = 16 вероятность 0,98998 — ещё меньше 0,99"
      - "Логарифм числа меньше единицы отрицателен, и знак неравенства при
        делении на него не переворачивают"
      - "В «approximately 0.367» ищут n, при котором вероятность больше
        0,367, а не близка к нему"
    calculator:
      mode: needed
      note: >
        Три блока, и схема оценивания мая 2024 TZ2 печатает рядом два
        метода — логарифмы и «table only approach» — и даёт за оба полный
        балл. В мае 2025 TZ3 логарифм не работает вовсе: P(X ≤ 6) от n
        не выражается одной степенью, и остаётся только таблица.
    prereq: [cumulative]
    raw_tags: [binomial_distribution, complement_rule, inequality, solve_for_n,
               binomial_probability, exponential_inequality, logarithmic_solving,
               integer_bound, cumulative_probability, gdc, trial_and_error]
    blocks: ['2023-MAY-TZ1-P2-Q11-C', '2024-MAY-TZ2-P2-Q05',
             '2025-MAY-TZ3-P2-Q11-B']

imported:
  - practicum: D2
    what: >
      Условная вероятность приёма 4 — определение из D2, применённое
      к событиям над одной величиной. «Ровно один из двоих» приёма 5 —
      дерево D2 с двумя ветвями. Первый успех на n-м испытании
      (май 2024 TZ1 Q6(c)) стоит в D2, хотя пункты (a) и (b) того же
      вопроса здесь.
  - practicum: D5
    what: >
      В шести вопросах из четырнадцати p получено из нормального
      распределения в предыдущем пункте, ещё в одном — интегралом плотности.
      Как их получить — D5 и D6; здесь p дано числом.
  - practicum: D4
    what: >
      E(X) и Var(X) дискретной величины вообще и Var(aX + b) — D4. Здесь
      только тот случай, когда величина биномиальная и np, np(1 − p)
      берутся сразу.
  - practicum: A2
    what: >
      Наименьшее n через логарифм — тот же приём, что наименьшее n
      у геометрической прогрессии: 0,75ⁿ < 0,01 это её член.
  - practicum: D1
    what: >
      nCk в формуле P(X = k) — число способов из D1. Число способов
      расположить три успеха подряд (май 2023 TZ1 Q11(e)–(f)) — вопрос D1,
      хотя стоит в той же задаче, что наименьшее n.

corpus_issues:
  - id: 'ноябрьский дубль 2023 года'
    what: >
      2023-NOV-TZ1-P2 и 2023-NOV-TZ2-P2 — одна и та же бумага. В D3 это
      Q6(a) и Q10(c), девять баллов посчитаны дважды. Восьмой практикум
      серии, где дубль вычитают руками.
  - id: '2023-NOV-TZ1-P2-Q10 и 2023-NOV-TZ2-P2-Q10'
    what: >
      Одна и та же часть (c) одного и того же вопроса размечена по-разному
      в двух копиях. В TZ1 это один блок C-I-AND-C-II на 6 баллов в
      statistics.discrete_random_variables; в TZ2 — два блока, C-I на 2 балла
      в discrete_random_variables и C-II на 4 балла в statistics.probability.
    why: >
      Дубль сам по себе только удваивает баллы. Разная нарезка делает хуже:
      одна и та же условная вероятность попадает в две разные темы, и счёт
      долей в map.yaml расходится с тем, что вопрос спрашивает.
  - id: '2023-NOV-TZ2-P2-Q06-B'
    what: >
      Var(Y) для Y = 1 − 2X в TZ2 числится за statistics.expected_value,
      а тот же пункт TZ1 — за statistics.discrete_random_variables. Третий
      пример того же рода в одной бумаге.
  - id: '2023-MAY-TZ1-P2-Q11-C и -D'
    what: >
      Две соседние части одного вопроса про одну модель B(n; 0,239) лежат
      в разных темах: (c) «наименьшее число испытаний» в statistics.probability,
      (d) «ровно три из десяти» в statistics.discrete_random_variables.
  - id: 'source_pages в теме'
    what: >
      Смещение на единицу у шести вопросов из четырнадцати:
      2021-NOV-COMMON-P2-Q03 (6 вместо 7), 2022-MAY-TZ1-P2-Q11 (14 вместо 15),
      2023-MAY-TZ1-P2-Q11 (14 вместо 15), 2021-MAY-TZ2-P2-Q10 (11 вместо 12),
      2023-NOV-TZ1-P2-Q06 и Q10 (10 и 14 вместо 11 и 15), 2024-MAY-TZ1-P2-Q06
      (8 вместо 9, уже в D2). Номер совпадает с тем, что напечатан внизу
      страницы, а не с номером страницы в PDF.
    why: >
      Самое наглядное — ноябрь 2023: в копии TZ1 смещение есть, в копии
      TZ2 той же бумаги нет. Значит, дело не в бумаге, а в том, откуда
      разметчик брал номер: с колонтитула или из просмотрщика.
  - id: 'биномиального распределения нет в таксономии'
    what: >
      Тема разрезана пополам: 36 баллов в statistics.probability и 35 в
      statistics.discrete_random_variables, и граница между ними случайна —
      см. два предыдущих пункта. Карта поэтому собирает D3 долями двух тем,
      а не темой.

ladder: [exact_value, cumulative, mean_variance, conditional_binomial, nested,
         unknown_trials]
