version: 0.2
practicum: E6
title: Площади, объёмы вращения, накопление
source_topic: calculus.integration_applications
also_covers: []

corpus:
  blocks: 46
  marks: 197
  effective_blocks: 45
  effective_marks: 194
  sessions: May 2021 — November 2025
  papers: {1: 78, 2: 106, 3: 13}
  gdc_marks: 119
  note: >
    Вторая половина темы calculus.integration_applications. Тема целиком —
    85 блоков и 354 балла, почти вдвое больше верхней границы, и разрезана
    она поимённо: E5 взял 39 блоков и 157 баллов, всё, где вопрос — «чему
    равна первообразная»; сюда идут остальные 46 блоков и 197 баллов, всё,
    где вопрос — «что этот интеграл измеряет». Списки лежат в blocks обеих
    карточек, как это сделано у A5, A6, E3 и E4.

    Граница проходит по вопросу, а не по функции. Одна и та же ∫cos⁴x dx
    стоит по обе стороны: у майской 2025 TZ1 Paper 1 вопрос 12 пункт (c)
    просит её взять — это E5, а пункт (d) просит объём вращения, который
    через неё считается, — это E6. Так же разрезан ноябрьский 2022 Paper 3
    вопрос 2: интеграл площади поверхности берут здесь, а описание
    преобразования и координаты пересечений уходят в функции.

    Зеркальное отражение E5 по бумагам. Там 55% баллов были Paper 1, здесь
    Paper 1 — 40%, а с калькулятором 119 баллов из 197, то есть 60%.
    Причина ровно та же, только с другой стороны: первообразную калькулятор
    не берёт, а число под кривой считает. Площадь между графиками, объём
    вращения, путь точки — почти всегда GDC и три значащие цифры.

    Ноябрьские 2023 TZ1 и TZ2 — одна и та же бумага; разбор в карточке E5
    и в corpus_issues здесь. На E6 приходится один двойной блок на 3 балла:
    за вычетом дубля 45 блоков и 194 балла.

directions:
  flat: >
    Измеряют плоскую область. Одна кривая и ось — приём 1, две кривые —
    приём 2. Пределы либо даны, либо их сначала находят пересечением.
  solid: >
    Измеряют тело вращения. Вокруг оси x — приём 3, вокруг оси y — приём 4
    (сначала надо выразить x через y), кольцо между двумя кривыми или
    обратный ход «объём известен, найдите параметр» — приём 5.
  surface: >
    Измеряют не объём, а обёртку: площадь поверхности вращения. Формулу
    дают в самом вопросе, работа — упростить подкоренное выражение.
    Приём 6, и он весь из одного Paper 3.
  motion: >
    Измеряют движение. Перемещение и путь — приём 7, разница между ними
    и есть весь приём. Накопление величины по её скорости — приём 8.

skills:
  - id: area_under_curve
    name: Площадь под кривой
    rung: 1
    trigger: >
      Область ограничена одной кривой, осью x и, возможно, вертикальной
      прямой. Спрашивают «find the area of the shaded region» или
      «show that the area is 12π». Если кривая пересекает ось внутри
      отрезка, в вопросе стоит слово total.
    chain:
      - "Найти, где кривая пересекает ось x внутри отрезка"
      - "Разбить отрезок этими точками"
      - "На каждом куске взять определённый интеграл"
      - "Сложить модули кусков — площадь неотрицательна"
    traps:
      - "Взят один интеграл по всему отрезку: куски под осью вычлись,
        и вместо площади вышла разность"
      - "Модуль поставлен снаружи суммы, а не на каждый кусок"
      - "Точка пересечения с осью найдена не вся: у cos√x их бесконечно
        много, и нужен именно тот корень, что лежит между пределами"
      - "Ответ отрицательный и так и оставлен: площадь отрицательной
        не бывает"
    calculator:
      mode: mixed
      note: >
        Девятнадцать баллов из двадцати двух — Paper 1, и ответы там
        точные: 12π, 4πn, 4 + ½ln(3/7). Единственные три балла
        с калькулятором — «найдите полную площадь», где GDC берёт
        интеграл от модуля прямо.
    prereq: []
    raw_tags: [definite_integral, integrate_trigonometric_function,
               substitute_limits, simplify_expression, gdc_evaluate,
               absolute_area, round_value, absolute_value,
               trigonometric_evaluation, algebraic_simplification,
               algebraic_manipulation, area_under_curve]
    blocks: [2021-MAY-TZ2-P1-Q10-B, 2022-NOV-COMMON-P2-Q02-C,
             2023-MAY-TZ2-P1-Q12-C, 2025-MAY-TZ2-P1-Q10-D]

  - id: area_between_curves
    name: Площадь между двумя графиками
    rung: 2
    trigger: >
      Область зажата между двумя кривыми или между кривой и прямой.
      Пределы в условии обычно не названы — их дают пересечения.
      Частый вид: область между графиком и обратной ему функцией,
      и тогда работает симметрия относительно y = x.
    chain:
      - "Найти абсциссы пересечений: решить f(x) = g(x)"
      - "Понять, какая кривая сверху на каждом куске"
      - "Взять ∫(верхняя − нижняя) по каждому куску"
      - "Сложить"
    traps:
      - "Вычтено наоборот, и площадь вышла со знаком минус"
      - "Кривые меняются местами внутри отрезка, а интеграл взят один"
      - "Область между f и f⁻¹ посчитана одним интегралом: она
        симметрична относительно y = x, и половину считают, а потом
        удваивают"
      - "Пересечения найдены с точностью до трёх цифр и в таком виде
        подставлены в пределы: округлять надо ответ, а не пределы"
    calculator:
      mode: mixed
      note: >
        Семнадцать баллов Paper 1 и четырнадцать Paper 2. Ровно
        та граница, о которой стоит помнить: если пересечения находятся
        точно (0 и 3, ±1, π/2 и 5π/6) — это Paper 1 и ответ точный;
        если пересечение решается только численно — это Paper 2.
    prereq: [area_under_curve]
    raw_tags: [intersection_of_lines, area_between_curves, definite_integral,
               gdc_numerical_integration, symmetry_argument,
               inverse_function_reflection, area_by_doubling,
               integrate_difference, antiderivative_trig,
               evaluate_definite_integral, gdc_integration, evaluate_integral,
               exponential_function, symmetry, find_intersection,
               numerical_integration, subtraction_of_areas, trapezium]
    blocks: [2021-MAY-TZ1-P2-Q10-D, 2021-MAY-TZ1-P2-Q10-E,
             2024-MAY-TZ1-P1-Q04-B, 2024-MAY-TZ2-P2-Q01-B,
             2025-MAY-TZ1-P1-Q03, 2025-MAY-TZ1-P2-Q12-E,
             2025-NOV-TZ1-P1-Q03-B, 2025-NOV-TZ3-P1-Q09-D]

  - id: volume_about_x
    name: Объём вращения вокруг оси x
    rung: 3
    trigger: >
      «The region is rotated 2π (360°) about the x-axis». Формула
      V = π∫y²dx есть в справочнике; работа начинается после того,
      как функцию возвели в квадрат.
    chain:
      - "Записать V = π∫[f(x)]²dx с пределами области"
      - "Возвести подынтегральную функцию в квадрат и упростить"
      - "Взять интеграл — как правило, заменой или по частям"
      - "Подставить пределы"
    traps:
      - "π потеряно: остался просто интеграл от квадрата"
      - "Возведена в квадрат не функция, а уже взятый интеграл"
      - "(f(x))² записано как f(x²)"
      - "Пределы взяты по y, хотя вращение вокруг оси x"
    calculator:
      mode: mixed
      note: >
        Поровну: десять баллов Paper 1 и десять Paper 2. На Paper 1
        квадрат специально устроен так, чтобы после него интеграл брался:
        x sin(x²), cos⁴x, k²eˣ/(1+eˣ)². На Paper 2 квадрат считает GDC,
        и ответ — три цифры.
    prereq: [area_under_curve]
    raw_tags: [volume_of_revolution, definite_integral,
               integration_by_substitution, evaluate_definite_integral,
               algebraic_simplification, find_x_intercept,
               volume_of_revolution_formula, evaluate_definite_integral_gdc,
               disk_method, substitution_u_equals_x_squared,
               trigonometric_integration, substitution_of_limits]
    blocks: [2021-MAY-TZ2-P2-Q11-A, 2022-NOV-COMMON-P2-Q11-C,
             2024-MAY-TZ1-P1-Q06, 2025-MAY-TZ1-P1-Q12-D]

  - id: volume_about_y
    name: Объём вращения вокруг оси y
    rung: 4
    trigger: >
      «Rotated about the y-axis», и пределы в условии заданы по y:
      0 ≤ y ≤ 4, от y_A до y_B, «filled to a height of h metres».
      Первый шаг — не интеграл, а алгебра: выразить x через y.
    chain:
      - "Выразить x через y: обратить функцию или решить уравнение кривой"
      - "Записать V = π∫x²dy с пределами по y"
      - "Возвести в квадрат и упростить"
      - "Взять интеграл и подставить пределы по y"
    traps:
      - "Взято π∫y²dx вместо π∫x²dy: перепутана ось"
      - "x выражено через y, а пределы оставлены по x"
      - "(2 + e^(y/4))² раскрыто как 4 + e^(y/2): пропущено удвоенное
        произведение"
      - "Обратная функция найдена с потерей ветви: у x² = 16y корней два,
        и берут тот, что лежит в области"
    calculator:
      mode: mixed
      note: >
        Двадцать четыре балла из тридцати — Paper 2, самый калькуляторный
        приём темы после накопления. Единственный Paper 1 —
        x² + y⁴ = r⁴, где x² выражается без всякого обращения функции
        и интеграл выходит табличным.
    prereq: [volume_about_x]
    raw_tags: [inverse_function, volume_of_revolution,
               integration_with_respect_to_y, definite_integral,
               trigonometric_integration, inverse_ln_function,
               algebraic_expansion, integration_by_antiderivative,
               numerical_evaluation, integration, substitution,
               rearrange_equation, evaluate_integral, simplify_expression,
               rearrange_for_x, volume_of_revolution_about_y_axis]
    blocks: [2022-MAY-TZ1-P2-Q10-C, 2023-MAY-TZ2-P2-Q07,
             2024-MAY-TZ2-P2-Q07, 2025-MAY-TZ2-P2-Q12-F,
             2025-MAY-TZ3-P1-Q07, 2025-NOV-TZ3-P2-Q05]

  - id: volume_between_and_condition
    name: Кольцо между двумя телами и объём как условие
    rung: 5
    trigger: >
      Либо тело получено вычитанием: область между двумя кривыми,
      сфера с высверленным цилиндром. Либо объём уже известен —
      285 см³, 300 см³ — и найти просят параметр: радиус k, высоту h.
    chain:
      - "Записать объём как разность двух интегралов или как интеграл
        разности квадратов радиусов"
      - "Внешний радиус и внутренний брать от одной и той же оси"
      - "Если объём дан — приравнять выражение к нему"
      - "Решить полученное уравнение относительно параметра"
    traps:
      - "Вычтены радиусы, а не их квадраты: π∫(R − r)²dy вместо
        π∫(R² − r²)dy"
      - "Пределы для внешней и внутренней кривой взяты разные, хотя
        кольцо одно"
      - "Уравнение решено, но отброшен не тот корень: у k² = 680/π
        подходит только положительный"
      - "Параметр найден с точностью пределов, а не ответа"
    calculator:
      mode: mixed
      note: >
        Тринадцать баллов из двадцати — Paper 2, и там уравнение решает
        GDC. Единственный Paper 1 — сфера с высверленным цилиндром, где
        радиус r сокращается сам и остаётся h³ = 6.
    prereq: [volume_about_y]
    raw_tags: [solve_for_variable, algebraic_manipulation, substitute_value,
               express_variable, volume_of_revolution, definite_integral,
               gdc_equation_solving, cylinder_radius_expression,
               integration_limits, definite_integration, limits_substitution,
               volume_relationship, equation_formation, cube_root,
               inverse_function, subtraction_of_volumes]
    blocks: [2021-MAY-TZ2-P2-Q11-B, 2022-MAY-TZ2-P2-Q06,
             2023-MAY-TZ1-P1-Q09, 2025-NOV-TZ1-P2-Q08]

  - id: surface_of_revolution
    name: Площадь поверхности вращения
    rung: 6
    trigger: >
      В самом вопросе напечатана формула A = 2π∫y√(1 + (dy/dx)²)dx.
      Её не помнят и не выводят — её применяют. Просят обычно show that:
      получить πrl для конуса, 4πr² для сферы.
    chain:
      - "Найти dy/dx для данной кривой"
      - "Подставить и упростить подкоренное выражение — оно всегда
        сворачивается"
      - "Умножить на y: под корнем часто остаётся многочлен"
      - "Взять интеграл и подставить пределы"
    traps:
      - "Корень не упрощён, и интеграл дальше не берётся: у полусферы
        √(1 + x²/(r²−x²)) равно r/√(r²−x²), и после умножения на y
        остаётся просто r"
      - "y забыт под интегралом: осталась длина дуги, а не площадь"
      - "2π заменено на π по привычке от объёма"
      - "Пределы взяты от 0 до r вместо −r до r: поверхность считается
        по всей кривой"
    calculator:
      mode: "yes"
      note: >
        Все тринадцать баллов — один Paper 3, ноябрь 2022. Калькулятор
        разрешён, но нужен он ровно в последнем пункте темы: три из
        четырёх блоков — show that, и там считать нечего.
    prereq: [volume_about_x]
    raw_tags: [substitution, factor_out_constants, definite_integral,
               evaluate_definite_integral, simplify_radical,
               algebraic_simplification, definite_integral_setup,
               common_denominator]
    blocks: [2022-NOV-COMMON-P3-Q02-A, 2022-NOV-COMMON-P3-Q02-B-III,
             2022-NOV-COMMON-P3-Q02-D, 2022-NOV-COMMON-P3-Q02-E-IV]

  - id: displacement_and_distance
    name: Перемещение и путь
    rung: 7
    trigger: >
      Дана скорость v(t), спрашивают, где точка оказалась или сколько
      она прошла. Слово displacement — одно, слово distance или total
      distance — другое, и весь приём в этой разнице.
    chain:
      - "Прочитать, что спрашивают: перемещение или путь"
      - "Перемещение — ∫v dt по всему отрезку"
      - "Путь — найти, где v меняет знак, разбить отрезок и сложить
        модули кусков; то же самое — ∫|v|dt"
      - "Если нужна не перемена, а положение, добавить начальное s(0)"
    traps:
      - "Путь посчитан как ∫v dt: куски назад вычлись вместо того,
        чтобы прибавиться"
      - "Модуль поставлен на ответ, а не на скорость"
      - "Корень v(t) = 0 найден не тот или найден не весь: у v = t sin t − 3
        на [0, 10] знак меняется трижды"
      - "Постоянная интегрирования не найдена: s(0) = 0 сказано в условии,
        а не подставлено"
      - "Перемещение названо отрицательным путём"
    calculator:
      mode: mixed
      note: >
        Девятнадцать баллов Paper 1 и двадцать два Paper 2, и они устроены
        по-разному. На Paper 1 скорость — многочлен или экспонента, корень
        находится точно (t = 2, T = ln(1+v₀)), ответ точный: 13 м, 88/27,
        v₀ − ln(1+v₀). На Paper 2 всё делает GDC одним ∫|v|dt, и весь балл
        за то, поставлен ли модуль.
    prereq: [area_under_curve]
    raw_tags: [distance_as_integral_of_absolute_velocity,
               definite_integral_absolute_value, gdc_numerical_integration,
               set_velocity_zero, solve_for_exponential, integrate_velocity,
               apply_initial_condition, substitute_time, simplify_expression,
               differentiate, set_derivative_to_zero, solve_linear_equation,
               integrate_polynomial, substitute_value,
               evaluate_rational_expression, split_integral_at_sign_change,
               evaluate_definite_integral, sum_absolute_areas,
               set_up_definite_integral, absolute_value_integral,
               evaluate_integral_gdc, displacement_difference,
               evaluate_numerically, displacement_as_integral,
               negative_displacement, total_distance,
               sum_absolute_displacements, kinematics]
    blocks: [2021-MAY-TZ1-P2-Q04-B, 2021-MAY-TZ2-P1-Q11-B-I-AND-B-II,
             2021-NOV-COMMON-P1-Q10-A-I-AND-A-II, 2021-NOV-COMMON-P1-Q10-C,
             2022-MAY-TZ1-P2-Q04-C, 2023-MAY-TZ2-P2-Q05-C,
             2023-NOV-TZ1-P2-Q04-B, 2023-NOV-TZ2-P2-Q04-B,
             2024-MAY-TZ1-P2-Q04-C, 2025-MAY-TZ2-P2-Q05-B,
             2025-NOV-TZ1-P2-Q10-E, 2025-NOV-TZ3-P2-Q10-C]

  - id: accumulated_change
    name: Накопление по скорости накопления
    rung: 8
    trigger: >
      Дана скорость, с которой что-то прибывает: R′(t) для дождя в жёлобе,
      0.4 м³/с для воды в баке, две скорости бегунов. Спрашивают, сколько
      накопилось, когда наберётся заданное количество или кто где окажется.
    chain:
      - "Записать накопленное как интеграл скорости по времени"
      - "Прибавить начальное значение, если оно дано"
      - "Если спрашивают момент — приравнять накопленное к цели и решить"
      - "Сравнить с ёмкостью, если вопрос «переполнится ли»"
    traps:
      - "Начальное значение не прибавлено: d(0) = 100 дано затем,
        чтобы найти постоянную"
      - "Сравнивают скорости вместо накопленного"
      - "Интеграл взят по неверному отрезку: «during any 60-second period»
        значит от 0 до 60, а не до конца бури"
      - "Ответ на «переполнится ли» дан без двух чисел: нужны и объём
        жёлоба, и объём воды"
    calculator:
      mode: "yes"
      note: >
        Все двадцать баллов — Paper 2, ни одного Paper 1. Это самый
        сюжетный приём темы: дождь в жёлобе, бак, самолёт и машина
        на полосе, две бегуньи на 200 метрах. Считает всюду GDC,
        а работа — правильно записать, что накапливается.
    prereq: [displacement_and_distance]
    raw_tags: [formula_application, division, definite_integral,
               trigonometric_integration, volume_from_cross_section,
               inequality_comparison, equation_solving, distance_calculation,
               integrate, initial_condition, subtract_displacements]
    blocks: [2022-MAY-TZ1-P2-Q10-D, 2023-MAY-TZ1-P2-Q10-C,
             2025-MAY-TZ3-P2-Q10-D, 2025-NOV-TZ1-P2-Q10-C]

corpus_issues:
  - block: 2023-NOV-TZ2-P2-Q04-B
    issue: >
      Ноябрьские 2023 TZ1 и TZ2 — одна и та же бумага; полный разбор
      в карточке E5. На E6 приходится один двойной блок на 3 балла:
      «найдите путь за первые q секунд» стоит в корпусе дважды, как
      2023-NOV-TZ1-P2-Q04-B и 2023-NOV-TZ2-P2-Q04-B, с одинаковым
      ответом 7.68 м. За вычетом дубля 45 блоков и 194 балла.

      Девятый практикум подряд с зональным дублем. Вычитать его надо
