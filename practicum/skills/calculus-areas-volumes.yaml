  - block: 2025-NOV-TZ1-P2-Q08
    issue: >
      Здесь не только извлечение: markscheme сам себе противоречит.
      Условие говорит, что графики f и g пересекаются в точке (5, 3),
      и f, записанная в схеме как x² = y² + 16, через неё проходит:
      f(5) = √(25 − 16) = 3. Вторая кривая записана как x² = 25 − 50y,
      и при x = 5 она даёт y = 0, а не 3.

      Арифметика схемы отвергает и саму эту запись. Схема печатает
      179.0707 − 39.269908 = 139.8008 и ответ 89π/2. Первое число —
      это π∫₀³(y² + 16)dy = 57π, сходится точно. Второе равно 12.5π,
      а π∫(25 − 50y)dy не равно 12.5π ни на каком отрезке, начинающемся
      в нуле: уравнение 25b − 25b² = 12.5 действительных корней не имеет.
      Ровно 12.5π даёт x² = 25 − 25y на отрезке от 0 до 1.

      То есть верны ровно две вещи: объём от f равен 57π и ответ равен
      89π/2. Что стоит между ними, из бумаги не читается. В архиве
      спрошен объём от f — единственное, что здесь однозначно.
  - block: 2023-MAY-TZ2-P2-Q07
    issue: >
