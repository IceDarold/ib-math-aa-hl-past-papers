version: 0.1
practicum: A8
title: Неравенства
source_topic: number_algebra.inequalities + functions.inequalities
corpus:
  blocks: 31
  marks: 87
  sessions: May 2021 — November 2025
  papers: {1: 38, 2: 29, 3: 20}
  gdc_marks: 49
  note: >
    Две темы корпуса взяты целиком: number_algebra.inequalities (28 блоков,
    82 балла) и functions.inequalities (3 блока, 5 баллов). Вторая слишком
    мала, чтобы жить отдельно, и по существу от первой не отличается:
    все три её блока — про множество значений параметра.

    Самая маленькая тема секции A и самая рассыпанная. Неравенство почти
    никогда не бывает целым вопросом: 26 блоков из 31 — отдельные пункты
    внутри чужих вопросов, чаще всего последние.

    Формально 56% баллов с калькулятором, но реальной работы для GDC
    здесь на 9 баллов: одно неравенство с показательной функцией и дробью
    (4 балла), один целочисленный ответ (3 балла) и одно чтение по графику
    в исследовании (2 балла). Остальное в «калькуляторных» бумагах —
    дискриминант, Виета и доказательство от противного.

principle: >
  У неравенства нет ответа-числа. Ответ — множество, и всё содержание темы
  в его границе: откуда граница берётся и входит ли она в ответ. Конец,
  пришедший из нуля выражения, входит тогда и только тогда, когда
  неравенство нестрогое; конец, пришедший из разрыва, не входит никогда.

  Неравенство приходит с трёх сторон, и по ним построена лестница.
  Приёмы 1–4: его решают, ответ — множество по x. Приёмы 5–7: оно
  возникает как условие на букву («два различных корня» превращается
  в Δ > 0), ответ — множество по параметру, а решается это множество
  теми же приёмами 1–4. Приём 8: его доказывают, множества нет вовсе.

  Отсюда главное умение темы: до начала счёта понять, о чём спрашивают —
  о x или о букве. Половина потерянных баллов это перепутанные роли.

skills:
  - id: critical_values
    name: Критические значения и знак
    rung: 1
    trigger: >
      «Solve f(x) ≤ c» для многочлена, «find the range of possible values
      of d given d² − 9d > 0».
    chain:
      - Перенести всё в одну сторону
      - Найти критические значения — нули выражения
      - Расставить знаки по пробным точкам между ними
      - Собрать промежутки и решить про каждый конец
      - Пересечь с областью, если она задана
    traps:
      - >
        Умножение или деление на выражение неизвестного знака. 1/x > 1
        не равносильно 1 > x, и ответ получается внешне правдоподобным
      - >
        Заданная область теряется. «d < 0 или d > 9, но d ∈ ℝ⁺, поэтому
        d > 9» — последний балл стоит за вторую половину фразы
      - >
        Запись «x < −10, x > 6» через запятую читается как «и то, и другое»,
        то есть как пустое множество. Нужно or или ∪
      - >
        Выбрана не та сторона. Проверяется за секунду подстановкой одной
        точки — например нуля
    calculator:
      mode: checks
      note: >
        Квадратное неравенство решается устно быстрее, чем вводится в GDC.
        Калькулятор уместен как проверка стороны: график параболы сразу
        показывает, между корнями решение или снаружи.
    prereq: []
    raw_tags: [quadratic_inequality, critical_values, interval_testing,
               factor_inequality, solve_quadratic_inequality,
               apply_domain_restriction, sign_analysis, factoring]
    blocks: [2025-MAY-TZ1-P1-Q10-C, 2023-NOV-TZ1-P1-Q10-B-III]

  - id: rational_inequality
    name: Дробно-рациональное неравенство
    rung: 2
    trigger: >
      «Solve f(x) > x», где f — дробь; в записи есть знаменатель
      с переменной.
    chain:
      - Всё в одну сторону и к общему знаменателю
      - Разложить числитель и знаменатель на множители
      - Критические значения — нули числителя И нули знаменателя
      - Таблица знаков, нули знаменателя всегда выколоты
    traps:
      - >
        Домножение на знаменатель без разбора его знака. При отрицательном
        знаменателе неравенство переворачивается, и из двух промежутков
        ответа остаётся один
      - >
        Ноль знаменателя включён в ответ. Он не входит ни при строгом,
        ни при нестрогом неравенстве
      - >
        Найдены границы, но не предъявлены все куски ответа. Разметка даёт
        по A1 за каждый промежуток, а не за критические значения
    calculator:
      mode: helps
      note: >
        Оба блока архива — Paper 2, и GDC даёт корни числителя быстрее
        формулы. Но ответ там записывают точно (−10 ± 2√31), так что
        калькулятор экономит время, а не заменяет алгебру.
    prereq: [critical_values]
    raw_tags: [rational_inequality, common_denominator, sign_analysis,
               quadratic_formula, case_analysis, quadratic_inequality]
    blocks: [2023-NOV-TZ2-P2-Q11-F, 2023-NOV-TZ1-P2-Q11-F]

  - id: absolute_value
    name: Неравенство с модулем
    rung: 3
    trigger: >
      Модуль в условии, «sketch |f(x)|», «solve f(|x|) > 0»,
      «hence solve» после эскиза.
    chain:
      - "Снять модуль: по случаям или по готовой равносильности"
      - "|A| < b это −b < A < b; |A| > b это A < −b или A > b"
      - Для f(|x|) — заменить x на |x| и решать относительно |x|
    traps:
      - >
        Перепутаны две равносильности. Признак ошибки виден сразу: у «|A| > b»
        ответ обязан состоять из двух кусков
      - >
        f(|x|) и |f(x)| считают одним и тем же. Первое симметрично
        относительно нуля, второе — вообще говоря нет
      - >
        Забывают, что для |A| < b при b ≤ 0 решений нет вовсе
    calculator:
      mode: helps
      note: >
        Оба блока из Paper 1, но эскиз здесь и есть метод: markscheme даёт
        M1 за график наравне с алгеброй. На Paper 2 модуль почти всегда
        решается графиком.
    prereq: [critical_values]
    raw_tags: [solve_absolute_inequality, sketch_absolute_function,
               find_critical_points, read_inequality_from_graph]
    blocks: [2022-MAY-TZ2-P1-Q03-C, 2022-MAY-TZ2-P1-Q03-D]

  - id: gdc_intervals
    name: Численно, по точкам пересечения
    rung: 4
    trigger: >
      Paper 2, в неравенстве функции разных типов (показательная и дробь),
      «give your answer to 3 s.f.», «find the maximum number of…».
    chain:
      - Нарисовать обе части и найти все точки пересечения
      - Отметить точки, где выражение не определено
      - Проверить знак по одной точке в каждом промежутке
      - Собрать ответ, различая концы-пересечения и концы-разрывы
      - Для целочисленного ответа — взять целую часть и проверить обоих соседей
    traps:
      - >
        Записаны точки пересечения вместо множества. Три балла из четырёх
        стоят за интервалы, а не за корни
      - >
        Выколотые точки области потеряны. В блоке мая 2022 их две, и они
        разрывают ответ на три куска
      - >
        Целый ответ округляют вверх. Округление здесь по смыслу задачи,
        а не по правилам арифметики, и всегда вниз
      - >
        Подстановка округлённого конца в исходное неравенство даёт ложь.
        Это не ошибка, а следствие округления: проверять надо чуть внутри
    calculator:
      mode: required
      note: >
        Единственное место темы, где без GDC не обойтись. Уравнение
        2^x − 2^(−x) = (x−1)/(x²−2x−3) аналитически не решается,
        и markscheme требует три значащих цифры.
    prereq: [rational_inequality]
    raw_tags: [set_up_inequality, find_intersection_gdc, interval_analysis,
               union_of_intervals, domain_restrictions, solve_inequality,
               integer_solution]
    blocks: [2022-MAY-TZ1-P2-Q06-B, 2025-MAY-TZ1-P2-Q10-D]

  - id: discriminant_condition
    name: Дискриминант как условие на букву
    rung: 5
    trigger: >
      «Two distinct real roots», «no real roots», «the graph touches the
      x-axis», «the line is tangent», «two distinct points of intersection».
    chain:
      - Перевести слова условия в знак дискриминанта
      - Вычислить Δ как выражение с буквой
      - Решить полученное неравенство приёмом 1
      - Отдельно разобрать вырожденный случай a = 0, если буква в старшем коэффициенте
      - Наложить оставшиеся ограничения — целочисленность, знак, «наибольшее»
    traps:
      - >
        Формула Δ = b² − 4ac предполагает a ≠ 0. Если буква стоит в старшем
        коэффициенте, случай a = 0 надо разобрать руками
      - >
        Знак Δ выбран не тот. «Two distinct» это строго больше нуля,
        «at least one» — не меньше
      - >
        Решение неравенства принято за ответ, хотя спрашивали наибольшее
        целое. В архиве это два блока из пяти
      - >
        В вопросах «show that … = 5» баллы стоят за вывод. Написать ответ,
        который и так напечатан, — ноль
    calculator:
      mode: checks
      note: >
        Уравнение с буквой калькулятор не решит. Полезен на последнем шаге:
        подставить найденное целое значение и соседнее, убедившись, что
        корни появляются ровно там, где обещано.
    prereq: [critical_values]
    raw_tags: [discriminant, compute_discriminant, apply_discriminant_condition,
               simplify_inequality, rearrange_equation, inequality,
               integer_constraints, positive_integer, factorization,
               inequality_setup, inequality_solving]
    blocks: [2021-NOV-COMMON-P1-Q07-A, 2025-NOV-TZ3-P1-Q09-A,
             2023-NOV-TZ1-P1-Q10-B-II, 2024-MAY-TZ2-P3-Q02-D,
             2025-MAY-TZ2-P1-Q05-A]

  - id: root_signs
    name: Знаки корней через Виета
    rung: 6
    trigger: >
      «One positive and one negative root», «both roots are positive»,
      «the roots are both positive or both negative».
    chain:
      - "Записать произведение и сумму корней: αβ = c/a, α+β = −b/a"
      - Перевести требование о знаках в условия на них
      - Добавить условие на дискриминант, если корни не обязаны быть разных знаков
      - Пересечь все условия
    traps:
      - >
        Для «корни одного знака» забывают дискриминант. Условия αβ > 0
        и α+β > 0 выполняются и для пары комплексно сопряжённых корней
      - >
        Для «корни разных знаков» дискриминант пишут зря: при c/a < 0
        он положителен автоматически
      - >
        Условия объединяют вместо пересечения. Условие на знак добавляется
        к условию на действительность, а не заменяет его
      - >
        Значение a = 0 не исключено. Там уравнение перестаёт быть
        квадратным и корень остаётся один
    calculator:
      mode: checks
      note: >
        Корни находить не нужно вовсе — в этом смысл приёма. GDC полезен
        для проверки: взять одно значение из ответа, решить уравнение
        численно и посмотреть на знаки.
    prereq: [rational_inequality]
    raw_tags: [product_of_roots, rational_inequality, critical_values,
               sign_analysis, inequality_intersection]
    blocks: [2022-MAY-TZ1-P2-Q08-B, 2025-MAY-TZ2-P1-Q05-B]

  - id: solution_count
    name: Число решений как множество параметров
    rung: 7
    trigger: >
      «For all x ∈ ℝ», «exactly two intersection points», «no intersection
      points», «there exists at least one line normal to».
    chain:
      - "Для «при всех x» — свести к максимуму или минимуму: max F(x) ≤ 0"
      - Для «ровно N решений» — найти, где решения сливаются или исчезают
      - Эти значения параметра и есть границы ответа
      - Между границами число решений постоянно — проверить по одной точке
    traps:
      - >
        Выколотая точка не выколота. Значение, при котором два решения
        слились в одно, из ответа «ровно два» выбрасывается, и за это
        стоит отдельный балл
      - >
        Ответ записан приближённо. В блоке мая 2023 граница равна e^(1/e),
        и разметка прямо отказывает в балле за 1.44
      - >
        Односторонний ответ. «a < e^(1/e)» без левой границы a > 1
        получает ноль, это оговорено в markscheme
      - >
        «При всех x» решают подстановкой одного удобного x. Нужен максимум
        или дискриминант, а не проба
    calculator:
      mode: helps
      note: >
        Все шесть блоков — Paper 2 и Paper 3, и график здесь главный
        инструмент: он показывает, при каком значении параметра кривые
        касаются. Ответ при этом обязан быть точным.
    prereq: [discriminant_condition]
    raw_tags: [function_composition, complete_square, quadratic_maximum,
               domain_analysis, critical_value, equality, set_notation,
               state_interval, interpret_graphical_result]
    blocks: [2021-MAY-TZ2-P2-Q04-B, 2025-NOV-TZ1-P3-Q01-B-II,
             2025-NOV-TZ1-P3-Q01-C-I, 2025-NOV-TZ1-P3-Q01-C-II,
             2023-MAY-TZ2-P3-Q01-F-I, 2023-MAY-TZ2-P3-Q01-F-II]

  - id: prove_inequality
    name: Доказать неравенство
    rung: 8
    trigger: >
      «Show that … ≥ …», «prove by contradiction that», «hence deduce that
      x > ln x», «use the AM–GM inequality to prove».
    chain:
      - "Перенести всё в одну сторону: доказать A ≥ B это доказать A − B ≥ 0"
      - "Сделать неотрицательность видной из записи: выделить полный квадрат"
      - "Либо сослаться на монотонность: применить возрастающую функцию к обеим частям"
      - "Либо применить известное неравенство о средних вместе с признаком равенства"
      - "Либо от противного: предположить обратное и дойти до «квадрат отрицателен»"
      - Закончить фразой-выводом — за неё стоит R1
    traps:
      - >
        Дошли до 0 > (x−y)² и остановились. Противоречие надо предъявить
        словами, иначе R1 не ставят
      - >
        Возведение в квадрат без оговорки о знаке частей. Законно только
        когда обе части положительны
      - >
        Применили log или другую функцию, не сказав, что она возрастает.
        Для убывающей знак перевернулся бы, и без этой ссылки вывод неполон
      - >
        В AM–GM доказано только «≤», а спрашивают равенство. Нужен набор,
        на котором граница достигается
    calculator:
      mode: none
      note: >
        Единственный приём темы, где GDC бесполезен полностью, включая
        блоки из бумаг с калькулятором. Доказательство от противного
        в Paper 2 он не сокращает ни на строку.
    prereq: []
    raw_tags: [add_expressions, combine_exponentials, complete_square,
               conclude_non_negative, assume_negation, square_both_sides,
               algebraic_manipulation, contradiction, direct_proof,
               apply_am_gm_inequality, raise_to_power, equality_condition,
               logarithm_properties, inequality_manipulation,
               monotonic_function, substitution, deduce_inequality,
               apply_previous_result]
    blocks: [2021-MAY-TZ2-P1-Q11-E, 2025-NOV-TZ3-P2-Q09,
             2023-MAY-TZ1-P3-Q02-D-II, 2025-MAY-TZ3-P3-Q02-F,
             2025-MAY-TZ1-P1-Q08-A, 2023-MAY-TZ2-P3-Q01-C]

# Что осталось за пределами приёмов.
leftovers:
  - what: Системы линейных уравнений (8 баллов)
    blocks: [2025-NOV-TZ1-P1-Q06, 2025-NOV-TZ3-P2-Q11-B-II]
    why: >
      Неравенства в этих блоках нет ни одного. Первый — приведение матрицы
      к ступенчатому виду и подбор параметров, при которых система имеет
      бесконечно много решений; второй — решение двух линейных уравнений
      на a и b. Разметка отправила их сюда, по-видимому, из-за слова
      «условие». Тот же случай, что отмечен в карте практикумов для C5:
      корпусу нужна тема number_algebra.systems_of_equations.
  - what: Алгебраическое «show that» без неравенства (4 балла)
    blocks: [2025-NOV-TZ1-P3-Q01-B-I]
    why: >
      Подстановка t = ±√m в выражение для c и упрощение. Неравенство
      появляется только в следующем пункте, который в приёме
      solution_count и есть. Сам этот пункт — фоновая алгебра.
  - what: Область сходимости ряда (1 балл)
    blocks: [2024-MAY-TZ2-P1-Q12-D]
    why: >
      |x| < 1/4 как условие применимости биномиального разложения.
      Неравенство здесь форма ответа, а приём принадлежит A3: знать,
      что (1+u)^n сходится при |u| < 1, и подставить u.

# Куда ведёт тема дальше.
leads_to:
  - practicum: B1
    what: >
      Дискриминант как условие на параметр — общий инструмент с темой
      уравнений: «при каких k уравнение имеет решение» решается там же
      и так же. Разница только в том, что здесь ответ — множество,
      а там значение.
  - practicum: B4
    what: >
      Приём solution_count опирается на понимание, где графики касаются
      и где расходятся. Исследование функции даёт для этого производную;
      в блоке мая 2023 граница e^(1/e) именно так и получается.
  - practicum: A7
    what: >
      Приём prove_inequality пересекается с доказательствами: три блока
      из шести — прямое доказательство и доказательство от противного,
      только объектом служит неравенство. Технику «квадрат неотрицателен»
      стоит смотреть здесь, а структуру доказательства — там.
  - practicum: A4
    what: >
      Знаки корней через Виета — тот же аппарат, что vieta_quadratic,
      применённый к неравенству. Проверка verify_factored из A4 работает
      и здесь, в задании 18.

# Что проверка практикума принципиально не ловит.
verification_limits:
  - what: строгость конца, найденного калькулятором
    why: >
      В задании 5 концы округлены до трёх значащих цифр, и подстановка
      в исходное неравенство в самой точке ничего не решает: −1.27
      отличается от истинного −1.26686… как раз в ту сторону. Поэтому
      verify_param_set в окрестности границ ничего не проверяет,
      и запись «−1.27 < x» вместо «−1.27 ≤ x» проходит. На экзамене
      за это снимают балл.
  - what: то, что лежит за окном проверки
    why: >
      verify_param_set проверяет точки внутри окна (по умолчанию от −30
      до 30). Ответ «6 < k < 100» вместо «k > 6» пройдёт, потому что
      конец 100 лежит снаружи. Зафиксировано в verify_a8.py.
  - what: законность шага, а не его результат
    why: >
      verify_nonneg_form требует, чтобы запись была явно неотрицательной,
      но не спрашивает, почему возведение в квадрат было законным.
      В доказательстве от противного оговорка про положительность частей
      обязательна, и проверить её ноутбук не может.
  - what: словесные баллы
    why: >
      R1 за фразу «квадрат не может быть отрицательным, противоречие»
      и за ссылку на возрастание log₂ ставится за формулировку. Числа
      там нет; формулировки приведены в решениях дословно.

# Расхождения с разметкой корпуса. В classification/ ничего не менялось.
corpus_issues:
  - block: 2022-MAY-TZ1-P2-Q06-B
    what: >
      Записано f(x) = 2^(−x) − 2^x. С такой f ни одна из трёх записанных
      там же точек пересечения (−1.26686, 0.177935, 3.06167) не является
      решением уравнения f = g.
    check: >
      sympy: в этих точках 2^(−x) − 2^x − g(x) равно 3.98, −0.495 и −16.5,
      то есть f = −g, а не f = g. При f(x) = 2^x − 2^(−x) все три точки
      обращают разность в ноль с точностью 1e−9, и знак разности на шести
      промежутках воспроизводит записанный ответ целиком, вместе
      с выколотыми −1 и 3.
    impact: >
      Практикум использует f(x) = 2^x − 2^(−x). Ответ при этом совпадает
      с записанным в корпусе дословно, так что перепутан именно знак
      при извлечении, а не ответ.
  - block: 2025-NOV-TZ3-P2-Q09
    what: >
      В выдержке из markscheme стоит «0 > x² − 4xy + y²», а следующей
      строкой «0 > (x − y)²». Одно из другого не следует.
    check: >
      sympy: возведение √(xy) > (x+y)/2 в квадрат даёт 4xy > (x+y)²,
      то есть 0 > x² − 2xy + y² = (x − y)². Выражение x² − 4xy + y²
      неприводимо, factor оставляет его как есть — полным квадратом
      оно не является вовсе.
    impact: >
      Практикум ведёт вывод через x² − 2xy + y². Похоже на потерю
      коэффициента при извлечении: строка про (x − y)² в корпусе верна
      и согласуется именно с −2xy.
  - block: 2022-MAY-TZ2-P1-Q03-D
    what: >
      У блока стоит собственная пометка корпуса formula_extraction_uncertain.
      В выдержке речь об эскизе |f(x)|, а записанный ответ x < −1/2
      или x > 1/2 отвечает f(|x|) > 0.
    check: >
      sympy: |f(x)| > 0 при f = (2x−1)/(x+1) даёт всю прямую без точек
      −1 и 1/2 — не то. f(|x|) > 0 даёт ровно записанный ответ, и
      критические точки ±1/2 из выдержки получаются именно так.
    impact: >
      Практикум ставит задание как f(|x|) > 0. Разница между f(|x|)
      и |f(x)| вынесена в теорию отдельным абзацем: она и есть содержание
      приёма absolute_value.
  - block: 2025-NOV-TZ1-P3-Q01-B-I
    what: >
      В кратком описании блока формула записана как
      c = 1/m^(1/2) − 1/m^(1/2), то есть тождественный ноль.
    check: >
      sympy: такая разность равна нулю при любом m, и никакого условия
      на число нормалей из неё не выводится. В приведённой в том же блоке
      выдержке из markscheme стоит c = ±(1/√m − m√m) — с ней всё
      согласуется, включая слияние двух значений при m = 1.
    impact: >
      Практикум пользуется формой из markscheme. Задание 13 построено
      на том, что два значения c отличаются знаком и совпадают ровно
      при m = 1.
  - block: 2025-NOV-TZ1-P1-Q06
    what: >
      Двенадцать баллов темы (три блока) к неравенствам не относятся:
      это системы линейных уравнений и алгебраическое «show that».
    check: >
      Ни в одном из трёх блоков нет ни одного знака неравенства —
      ни в условии, ни в разметке method_path, ни в выдержке
      из markscheme.
    impact: >
      Вынесено в leftovers. Предложение то же, что записано в карте
      практикумов для C5: завести number_algebra.systems_of_equations.
      Без этого 14% темы не имеет отношения к её названию.

