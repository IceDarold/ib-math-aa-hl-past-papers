version: 0.1
practicum: A4
title: "Многочлены: Виета, деление, кратность корней"
source_topic: number_algebra.polynomials
corpus:
  blocks: 50
  marks: 145
  sessions: May 2021 — November 2025
  papers: {1: 62, 2: 34, 3: 49}
  gdc_marks: 83
  note: >
    Тема взята целиком, делить не пришлось. Самая широкая тема секции A
    и единственная в архиве, где Paper 3 весит больше Paper 2.

    Формально 57% баллов с калькулятором, но цифра обманывает: реальной
    работы для GDC здесь на 4 балла (перебор целых q в исследовании
    мая 2022 и система из трёх линейных уравнений в ноябре 2022).
    Причина в том, что калькулятор умеет находить корни, а вопросы темы
    — про то, что связано с корнями без их нахождения.

principle: >
  Многочлен читается с двух сторон, по коэффициентам и по корням, и вся
  тема состоит в переходах между этими чтениями. Приёмы 1–3 идут от
  коэффициентов к корням: подставили — нашли множитель — поделили.
  Приёмы 4–8 идут обратно: корни не находят вовсе, работают с их суммами
  и произведениями, потому что те выражаются через коэффициенты сразу.

  Отсюда главное умение темы: до начала счёта понять, спрашивают ли корни.
  «Найдите произведение решений», «покажите, что a² − 3b = 0», «найдите q
  и r» решаются, не находя ни одного корня. Кто начинает с формулы корней
  кубического уравнения, теряет не баллы, а время.

  Приём 9 стоит особняком: он ничего не говорит о корнях, зато превращает
  дробь в сумму, которую можно проинтегрировать, и в архиве почти всегда
  оказывается пунктом (a) длинного вопроса по интегрированию.

skills:
  - id: factor_remainder
    name: Множитель и остаток
    rung: 1
    trigger: >
      «Show that (x−a) is a factor», «the remainder is R when divided by
      (x−b)», «(x−1) is a factor and f(3) = −2».
    chain:
      - Прочитать каждое условие как значение многочлена в точке
      - Подставить и получить по уравнению на каждое условие
      - Решить линейную систему на буквы
    traps:
      - >
        Несведённый множитель: для (2x+1) корень равен −1/2, а не −1 и не −2.
        Общее правило — (αx+β) отвечает P(−β/α) = 0
      - >
        В вопросах «show that» балл стоит за выкладку: запись «P(−1)=0, ч.т.д.»
        без подстановки получает ноль
      - >
        Не пишут фразу-вывод «следовательно, (x+1) — множитель». Счёт виден,
        ответ на заданный вопрос — нет
    calculator:
      mode: checks
      note: >
        Система из двух линейных уравнений решается устно быстрее, чем
        вводится в GDC. Калькулятор уместен как проверка: подставить
        найденные значения и убедиться, что f(1) = 0.
    prereq: []
    raw_tags: [factor_theorem, remainder_theorem, factor_verification,
               remainder_check, substitution, simultaneous_equations,
               system_of_equations, elimination, exhaustive_check,
               constraint_satisfaction]
    blocks: [2024-MAY-TZ1-P1-Q11-A, 2025-MAY-TZ3-P2-Q02,
             2022-NOV-COMMON-P1-Q11-B-I, 2022-NOV-COMMON-P1-Q11-B-II,
             2025-NOV-TZ3-P2-Q06]

  - id: polynomial_division
    name: Деление с остатком
    rung: 2
    trigger: >
      «Express in the form Q(x) + R/d(x)», «show that (2x²−5x−3)/(x−1) =
      2x−3−6/(x−1)», «express as a product of linear factors».
    chain:
      - Поделить уголком, схемой Горнера или подбором коэффициентов
      - "Проверить условие: степень остатка меньше степени делителя"
      - Для разложения — найти корень подстановкой, поделить, разложить частное
    traps:
      - >
        Остаток той же степени, что делитель. Сумма делитель·частное+остаток
        сходится, но делением это не является: делить можно дальше
      - >
        «Product of three linear factors» — требование к записи. Ответ,
        равный многочлену, но записанный одной строкой, балла не получает
      - >
        Кандидаты в целые корни — делители свободного члена, делённые
        на делители старшего. Про знаменатель забывают
    calculator:
      mode: checks
      note: >
        Раскрыть найденное произведение и сравнить — десять секунд
        и спасённые три балла. График квартики показывает целый корень
        быстрее, чем перебор делителей.
    prereq: [factor_remainder]
    raw_tags: [polynomial_division, synthetic_division, polynomial_factorization,
               polynomial_factorisation, factorise_cubic, quadratic_factorization,
               linear_factors, factorization, common_denominator,
               algebraic_simplification, rational_root_test, find_integer_root]
    blocks: [2021-NOV-COMMON-P1-Q06-A, 2024-MAY-TZ1-P1-Q11-B,
             2022-NOV-COMMON-P1-Q11-B-III, 2022-MAY-TZ2-P3-Q02-H-II,
             2022-MAY-TZ2-P3-Q02-H-III]

  - id: repeated_root
    name: Кратный корень
    rung: 3
    trigger: >
      «Divisible by (x+1)²», «has a repeated root», «the graph touches
      the x-axis at x = a».
    chain:
      - "Записать два условия: P(a) = 0 и P′(a) = 0"
      - Решить систему на буквы
      - "Либо второй путь: P(x) = (x−a)²(x² + αx + β) и приравнять коэффициенты"
    traps:
      - >
        Пишут только P(a) = 0 и получают одно уравнение на две буквы
      - >
        Дифференцируют многочлен с буквой в коэффициенте и теряют её:
        производная 3px² от px³, а не 3x²
    calculator:
      mode: checks
      note: >
        Кратный корень виден на графике: кривая касается оси, а не пересекает
        её. В Paper 2 это способ увидеть ответ до всякой алгебры.
    prereq: [polynomial_division]
    raw_tags: [equating_coefficients, solving_simultaneous_equations,
               polynomial_division, identify_coefficients]
    blocks: [2025-MAY-TZ2-P1-Q07, 2024-MAY-TZ1-P1-Q11-B,
             2022-NOV-COMMON-P1-Q11-B-III]

  - id: vieta_quadratic
    name: Виета для квадратного
    rung: 4
    trigger: >
      «The roots are α and β», спрашивают α²+β², произведение решений,
      сумму — но не сами корни.
    chain:
      - "Выписать α+β = −b/a и αβ = c/a"
      - Перевести требуемую величину в эти две через тождество
      - "α²+β² = (α+β)² − 2αβ — работает в большинстве блоков приёма"
    traps:
      - >
        Забывают старший коэффициент: у 2x²−5x+1 сумма корней 5/2, а не 5
      - >
        Путают знак суммы. Проще запомнить чередованием −, +, −, +
      - >
        Начинают искать корни. Если их не спрашивают, это лишняя страница
      - >
        Система на буквы оказалась квадратной — решений два, и второй
        отбрасывается только проверкой условия (действительность корней,
        k > 0, n ∈ ℤ⁺)
    calculator:
      mode: checks
      note: >
        Все блоки приёма решаются алгеброй. GDC годится, чтобы подставить
        найденные коэффициенты и посмотреть на корни.
    prereq: []
    raw_tags: [vieta_formula, vieta_formulas, vietas_formulas, sum_of_roots,
               product_of_roots, vieta_product, quadratic_coefficients,
               algebraic_identity, algebraic_expansion, apply_identity]
    blocks: [2022-MAY-TZ1-P2-Q08-A, 2025-NOV-TZ3-P2-Q06, 2022-MAY-TZ2-P1-Q12-D,
             2024-MAY-TZ1-P1-Q10-F]

  - id: vieta_higher
    name: Виета для кубического и выше
    rung: 5
    trigger: >
      «Write down the sum of the roots», связь между корнями задана
      («корни α, β и α+β»), многочлен пятой степени с буквами.
    chain:
      - Выписать все симметричные суммы, а не одну
      - Подставить в них заданную связь между корнями
      - Решить систему; знаки чередуются от старшего коэффициента
    traps:
      - >
        Пользуются одной формулой из трёх. Неизвестных обычно тоже три,
        и одного уравнения не хватает
      - >
        Знак произведения зависит от чётности степени: для кубического
        это −a₀/a₃, для квартики +a₀/a₄
    calculator:
      mode: forbidden
      note: Уравнение с буквой в коэффициенте GDC не решает.
    prereq: [vieta_quadratic]
    raw_tags: [sum_of_roots, product_of_roots, substitute_symmetric_sums,
               substitution, solve_linear_system, equate_and_solve,
               polynomial_coefficients, expand_cubic, expand_polynomial]
    blocks: [2024-MAY-TZ2-P1-Q07-A, 2021-MAY-TZ2-P1-Q07, 2024-MAY-TZ2-P1-Q07-C,
             2022-MAY-TZ2-P3-Q02-A, 2025-NOV-TZ1-P3-Q01-E-II]

  - id: conjugate_roots
    name: Комплексные корни парами
    rung: 6
    trigger: >
      Коэффициенты действительны, один корень мнимый или задан множитель
      вида (z − 3i); «explain why the equation has at least one real root».
    chain:
      - Приписать сопряжённый корень
      - "Свернуть пару в действительный множитель z² − 2Re(z₀)z + |z₀|²"
      - Дальше работать формулами Виета, уже без комплексных чисел
    traps:
      - >
        Применяют теорему к многочлену с комплексными коэффициентами.
        У z − i корень один
      - >
        Не называют корни явно. Markscheme мая 2023 снимает два балла
        именно за отсутствие фразы «3i и −3i — корни»
    calculator:
      mode: forbidden
      note: Все блоки приёма — Paper 1 и Paper 3 без вычислений.
    prereq: [vieta_higher]
    raw_tags: [conjugate_root_theorem, factorization_over_complex,
               roots_of_unity, cubic_behaviour, factor_theorem]
    blocks: [2023-MAY-TZ1-P1-Q07, 2024-MAY-TZ2-P1-Q07-B,
             2022-MAY-TZ2-P3-Q02-E-II, 2021-MAY-TZ2-P3-Q02-G-I]

  - id: symmetric_sums
    name: Симметричные суммы и вещественность
    rung: 7
    trigger: >
      «Show that p² − 2q = α²+β²+γ²», «deduce that the roots cannot all
      be real», «state a condition in terms of p and q».
    chain:
      - "Возвести сумму корней в квадрат: (Σα)² = Σα² + 2Σαβ"
      - "Заменить обе суммы коэффициентами: Σα = −p, Σαβ = q"
      - "Для разностей: Σ(α−β)² = 2Σα² − 2Σαβ = 2p² − 6q"
      - Сумма квадратов действительных чисел неотрицательна — отсюда критерий
    traps:
      - >
        Путают константу: для кубического критерий p² < 3q, для квартики
        p² < 2q. Разные тождества, разные числа
      - >
        Считают критерий двусторонним. Из p² ≥ 3q не следует ничего:
        контрпример q = 12 для x³ − 7x² + qx + 1
      - >
        В пункте «что отсюда следует», когда критерий молчит, пишут
        «все корни действительны». Верный ответ — «ничего сказать нельзя»
    calculator:
      mode: partial
      note: >
        Единственное место темы, где GDC делает работу: перебрать целые q
        от 1 до 16 и найти, где корни перестают быть действительными.
        Markscheme принимает и график, и таблицу.
    prereq: [vieta_higher]
    raw_tags: [expand_square_of_sum, substitute_symmetric_sums,
               simplify_expression, expand_squared_differences, symmetric_sums,
               inequality_manipulation, proof_by_contradiction,
               root_reality_condition, root_reality_criterion, state_condition,
               compute_p_squared, compare_with_3q, compare_with_2q,
               compare_with_condition, apply_condition, interpret_result,
               gdc_exploration, find_counterexample, test_integer_values,
               apply_cubic_condition, proof_by_factorisation]
    blocks: [2022-MAY-TZ2-P3-Q02-B-I, 2022-MAY-TZ2-P3-Q02-B-II,
             2022-MAY-TZ2-P3-Q02-C, 2022-MAY-TZ2-P3-Q02-D,
             2022-MAY-TZ2-P3-Q02-E-I, 2022-MAY-TZ2-P3-Q02-F-I,
             2022-MAY-TZ2-P3-Q02-F-II, 2022-MAY-TZ2-P3-Q02-G,
             2022-MAY-TZ2-P3-Q02-H-I]

  - id: root_transformation
    name: Уравнение с новыми корнями
    rung: 8
    trigger: >
      «Find m and n such that the roots of x²+mx+n=0 are 1/α³ and 1/β³»,
      «find p, q, r such that 1/z₁ … satisfy pw⁴+qw²+r=0».
    chain:
      - "Путь подстановки: выразить старую переменную через новую и подставить"
      - "Путь Виета: посчитать сумму и произведение новых корней через старые"
      - "Собрать уравнение x² − Sx + P = 0"
    traps:
      - >
        В x²+mx+n сумма корней равна −m, а не m. Находят 95 и пишут m = 95
      - >
        Идут через Виета там, где подстановка короче. Правило: если новый
        корень выражается через старый явно и обратимо, подставляйте
      - >
        Для α³+β³ забывают тождество (α+β)³ − 3αβ(α+β) и пытаются
        возводить в куб порознь
    calculator:
      mode: forbidden
      note: Условие прямо запрещает находить корни.
    prereq: [vieta_quadratic]
    raw_tags: [substitute_reciprocal, clear_denominators, cancellation,
               simplify_rational_expression, distribute, collect_like_terms,
               compute_p_squared]
    blocks: [2021-NOV-COMMON-P2-Q06-A, 2021-NOV-COMMON-P2-Q06-B,
             2025-MAY-TZ2-P1-Q12-D]

  - id: partial_fractions
    name: Простейшие дроби
    rung: 9
    trigger: >
      «Express in partial fractions», «write in the form A/(x+1) + B/(2x+1)».
      Почти всегда пункт (a) длинного вопроса по интегрированию.
    chain:
      - Умножить тождество на общий знаменатель
      - Подставить значения, обнуляющие знаменатели, либо приравнять коэффициенты
      - "Для кратного множителя (x+a)² завести два слагаемых, а не одно"
    traps:
      - >
        Для кратного множителя пишут одно слагаемое. Система оказывается
        несовместной — это признак пропуска, а не арифметической ошибки
      - >
        Приравнивают коэффициенты там, где подстановка удобных значений
        решает за одну строку
      - >
        Не выделяют целую часть у неправильной дроби и раскладывают то,
        что раскладывать нельзя
    calculator:
      mode: checks
      note: >
        apart в GDC даёт ответ мгновенно, но баллы стоят за тождество
        и подстановку. Годится как проверка.
    prereq: [polynomial_division]
    raw_tags: [partial_fractions, partial_fraction_decomposition,
               compare_coefficients, equate_coefficients, equating_coefficients,
               solve_linear_system, substitute_values, algebraic_manipulation]
    blocks: [2021-MAY-TZ1-P2-Q12-A, 2025-NOV-TZ3-P2-Q12-C,
             2024-MAY-TZ1-P1-Q11-C, 2024-MAY-TZ1-P1-Q11-D]

# Материал темы, не ставший приёмом.
leftovers:
  - what: Упрощение рациональных выражений (около 15 баллов)
    blocks: [2025-NOV-TZ1-P1-Q02-A, 2025-MAY-TZ2-P3-Q01-D-I,
             2025-MAY-TZ3-P3-Q02-G, 2023-MAY-TZ1-P1-Q12-B]
    why: >
      Сократить дробь, привести к общему знаменателю, выбрать корень после
      возведения в квадрат — это фоновый навык, а не приём темы. В корпусе
      такие блоки попали в polynomials, потому что работа идёт с многочленами,
      но проверяется в них алгебраическая аккуратность, а не многочлены.
      Разобраны в теории 2 практикума.
  - what: Подгонка многочлена под данные (5 баллов)
    blocks: [2022-NOV-COMMON-P3-Q01-B-II, 2022-NOV-COMMON-P3-Q01-B-III]
    why: >
      Σi² = a₁n + a₂n² + a₃n³ — подставить n = 1,2,3 и решить систему.
      Приём по существу принадлежит A1 (суммы) и A7 (индукция); многочлен
      здесь только форма ответа. Единственное место темы, где GDC решает
      систему за вас.
  - what: Координатная геометрия внутри исследования (6 баллов)
    blocks: [2024-MAY-TZ1-P3-Q02-F-II, 2024-MAY-TZ1-P3-Q02-G,
             2024-MAY-TZ1-P3-Q02-I]
    why: >
      Подставить x = m/2 в квартику, найти наклон прямой через две точки,
      посчитать отношение отрезков. Работа с многочленом здесь чисто
      арифметическая; приёмы принадлежат B3 и C5.

# Куда ведёт тема дальше.
leads_to:
  - practicum: E5
    what: >
      Приём partial_fractions существует ради интегрирования: все четыре
      блока — первые пункты длинных вопросов, где потом интегрируют.
      Туда же уходит выделение целой части из приёма polynomial_division.
  - practicum: E7
    what: >
      Разложение 1/(x(k−x)) — первый шаг логистического уравнения.
      Блок 2021-MAY-TZ1-P2-Q12 целиком живёт в E7, а его пункт (a) здесь.
  - practicum: A5
    what: >
      Приём conjugate_roots — та же теорема, что в A5 используется для
      разложения многочлена по корням. Здесь она инструмент Виета,
      там — свойство сопряжения.
  - practicum: A7
    what: >
      Пункт (ii) блока ноября 2022 требует перебрать все случаи и показать
      единственность. Балл стоит за полноту рассуждения, а не за верное
      число — это тот же тип требования, что R1 в теме доказательств.

# Что проверка практикума принципиально не ловит.
verification_limits:
  - what: раскрытие скобок в задании 9(a)
    why: >
      check_series сверяет значения, а (p+q)³ − 3pq(p+q) численно равно
      p³+q³. Ответ, переписанный из условия без раскрытия, проверка примет,
      хотя доказательство состоит именно в раскрытии. То же ограничение,
      что в A3; зафиксировано в verify_a4.py.
  - what: способ, которым получено разложение на множители
    why: >
      verify_factored проверяет форму записи и равенство, но не может
      отличить деление уголком от подсмотренного ответа. Это и не нужно:
      экзаменатор оценивает выкладку на бумаге, ноутбук — результат.
  - what: словесные пункты исследования Paper 3
    why: >
      Пункты (c), (e)(ii), (h)(i) блока мая 2022 оцениваются R1 за
      формулировку («сумма квадратов не может быть отрицательна»,
      «отсюда ничего не следует»). Числа там нет, проверять нечего;
      формулировки приведены в решениях дословно.

# Расхождения с разметкой корпуса. В classification/ ничего не менялось.
corpus_issues:
  - block: 2021-MAY-TZ2-P1-Q07
    what: >
      Уравнение записано как x³ − kx² + 3k = 0, и с ним записанный там же
      ответ k = 2√6 несовместен. Последний шаг разбора превращает
      k³/8 + 3k = 0 в k²/8 = 3, то есть теряет знак.
    check: >
      sympy: k³/8 = −3k даёт k ∈ {0, ±2√6·i} — положительных действительных
      решений нет. Ответ 2√6 получается из k³/8 = 3k, то есть когда
      произведение корней равно +3k (свободный член −3k). Кроме того,
      условие αβ = k²/4 несовместимо с нулевым коэффициентом при x:
      сумма попарных произведений равна αβ + (α+β)² = k²/2, а не 0.
    impact: >
      В практикуме уравнение приведено к согласованному виду
      x³ − kx² + (k²/2)x − 3k = 0. Тогда αβ = k²/4 выводится из среднего
      коэффициента (в корпусе оно дано), а произведение корней даёт ровно
      k = 2√6. Все три формулы Виета согласованы; проверено в verify_a4.py.
  - block: 2025-NOV-TZ3-P2-Q06
    what: >
      Записано «solve simultaneous equations r − q = 10 and q²/4 − r = 37/4
      to find q = −7, r = 3». Система квадратная, и решений у неё два.
    check: >
      sympy: q² − 4q − 77 = 0 даёт q = −7 (r = 3) и q = 11 (r = 21).
      Оба решения удовлетворяют обоим уравнениям. Отбрасывается второе
      только проверкой дискриминанта: у 2x²+11x+21 он равен −47,
      корни недействительны; у 2x²−7x+3 он равен 25.
    impact: >
      Значит, в условии обязано стоять требование действительных корней —
      иначе блок недоопределён. В практикуме задание построено вокруг
      этого: сначала спрашиваются оба кандидата, потом выживший.
  - block: 2024-MAY-TZ1-P1-Q11-D
    what: >
      Правая часть записана как 1 − 4/(2x+1) − 2/(x+1) + 2/(2x+1)².
      Левой части она не равна.
    check: >
      sympy: (1 − x/Q)/((1+x)(2x+1)) при Q = (x+1)(2x+1) равно
      (2x²+2x+1)/((x+1)²(2x+1)²), и apart даёт
      2/(x+1) + 1/(x+1)² − 4/(2x+1) + 2/(2x+1)². Разность с записью
      корпуса равна (−x²+2x+4)/(x+1)², то есть не ноль. Два слагаемых
      из четырёх совпадают; у 2/(x+1) перевёрнут знак, а на месте
      1/(x+1)² стоит свободная единица — похоже на потерю знаменателя
      при извлечении формулы.
    impact: >
      Практикум использует проверенную sympy форму. Задание от этого
      только выигрывает: кратный множитель в знаменателе — единственное
      место темы, где нужны два слагаемых на один множитель.

