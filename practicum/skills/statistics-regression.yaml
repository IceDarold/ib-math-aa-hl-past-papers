# Материал, пришедший из других практикумов.
imported:
  - practicum: D4
    what: >
      Таблица частот и её среднее (май 2022 TZ1 Paper 2 Q1 размечена в
      statistics.discrete_random_variables). D4 берёт таблицу как
      распределение и спрашивает E и Var; D7 берёт её как набор
      наблюдений и спрашивает медиану и стандартное отклонение. Объект
      один, вопросы разные, и в kit это видно: `Freq` из table.py и
      `Sample` из data.py считают одно и то же двумя путями.
  - practicum: D5
    what: >
      Ящик с усами мая 2022 TZ2 Q4 лежит в
      statistics.continuous_random_variables, откуда собран D5. Нормального
      распределения в вопросе нет ни в одном пункте.
  - practicum: D2
    what: >
      Ящик с усами мая 2021 TZ1 Q3 и среднее с размахом ноября 2025 TZ3 Q2
      лежат в statistics.probability, откуда собраны D2 и D3. Вероятности
      в них нет.
  - practicum: B1
    what: >
      Система двух линейных уравнений — она решает пересечение двух прямых
      регрессии (май 2022 TZ1 Q2(b)(ii), май 2025 TZ1 Q4(b)) и обратную
      задачу на среднее (май 2024 TZ2 Q2(b)).

