      Двадцать два балла — ящики с усами, медиана и стандартное отклонение
      таблицы частот, среднее с размахом, способ отбора — размечены по
      трём разным темам вероятностей, хотя вероятности в них нет ни в
      одном пункте. Нужна тема statistics.descriptive; до неё блоки
      приписаны к statistics.regression долями, и это записано в карте.
