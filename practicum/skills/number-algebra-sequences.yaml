version: 0.2
practicum: A1
title: "Арифметические прогрессии и суммы"
source_topic: number_algebra.sequences

corpus:
  blocks: 61
  marks: 169
  effective_blocks: 47
  effective_marks: 135
  sessions: May 2021 — November 2025
  papers: {1: 71, 2: 17, 3: 47}
  gdc_marks: 64
  note: >
    Тема number_algebra.sequences взята не целиком: в ней живут и
    арифметические последовательности, и геометрические. A1 берёт первые,
    A2 — вторые, и разрез идёт по вопросу, а не по теме: у майской 2023
    TZ1 бумаги пункты (a)–(c) арифметические, а (d)–(e) геометрические,
    и это один и тот же вопрос 10.

    169 баллов по корпусу, 135 рабочих. Вычтено четырнадцать блоков:
    десять геометрических (22 балла) уходят в A2, ноябрьский дубль
    2023 года стоит 7 баллов, и ещё два блока не по теме вовсе — они
    перечислены в corpus_issues.

    47 баллов из 135 стоят в Paper 3, и это вторая доля исследований
    в архиве после многочленов. Причина в жанре: «рассмотрите
    последовательность, порождённую вот таким правилом» — идеальная
    завязка тридцатибалльного исследования, и в архиве таких три.

    Формально 47% баллов идут с калькулятором. Из них 25 — одно
    исследование про AS-линейные функции, где считать нечего вовсе:
    вся работа алгебраическая, а Paper 3 просто разрешает кнопку.
    Настоящая доля — два места: наибольшая сумма (7 баллов) и подбор
    целого номера по таблице (10 баллов).

principle: >
  Арифметическая последовательность — это не формула, а одно правило:
  от члена к члену прибавляют одно и то же. Всё остальное в теме
  выводится из этой фразы за одну строчку, и выводить полезнее, чем
  вспоминать.

  u_n = u₁ + (n − 1)d — это «прибавили d ровно n − 1 раз», и минус
  единица здесь не деталь записи, а счёт шагов: между первым и седьмым
  членом шесть шагов, а не семь. S_n = n/2 (u₁ + u_n) — это школьная
  история про Гаусса: сложить ряд с самим собой, записанным задом
  наперёд, получить n одинаковых пар, поделить пополам. Вторая запись
  S_n = n/2 (2u₁ + (n − 1)d) — та же формула, в которую подставили u_n.

  Отсюда же и то, что тема на самом деле спрашивает. Прогрессия задаётся
  двумя числами, u₁ и d, и почти всякий вопрос архива — это два условия
  на эти два числа. «Седьмой член равен шести, а шестой и двенадцатый
  в сумме дают двадцать четыре» — система из двух линейных уравнений,
  и решать её умеют с восьмого класса. Работа в том, чтобы её написать.

  Проверка устроена по тому же принципу. Ей передают не ответ и не
  формулу, а правило: первый член и шаг. Член она находит сложением,
  сумму — сложением первых n членов, и ни u₁ + (n − 1)d, ни
  n/2 (2u₁ + (n − 1)d) внутри неё не написано ни разу. Поэтому 2n + 3,
  5 + 2(n − 1) и n + (n + 3) проходят одинаково.

directions:
  forward: >
    Прогрессия известна, спрашивают её член или сумму. Приёмы 1–2.
  backward: >
    Член или сумма известны, спрашивают прогрессию. Приёмы 3–4 и 7–8:
    два условия дают систему, сумма задана формулой, номер обязан быть
    целым.
  condition: >
    Прогрессия — не список, а требование. Приёмы 5–6: «эти три величины
    образуют арифметическую последовательность» превращается в уравнение
    на буквы, которые в них сидят.

skills:
  - id: nth_term
    name: Какой это по счёту член
    rung: 1
    trigger: >
      Даны первый член и разность (или формула u_n прямо в условии),
      спрашивают член по номеру или номер по члену. Признак — линейная
      формула вида u_n = 15 − 3n: коэффициент при n и есть d, свободный
      член это u₀, а не u₁.
    chain:
      - Выписать u₁ и d; из формулы u_n = an + b это d = a и u₁ = a + b
      - Между u₁ и u_n ровно n − 1 шагов
      - Подставить в u_n = u₁ + (n − 1)d
      - "Обратно: приравнять u_n к данному числу и решить линейное уравнение"
    traps:
      - >
        Шаг сделан n раз вместо n − 1. Первый член тоже член, и до него
        шагов ноль
      - >
        Для u_n = 15 − 3n первым членом назван 15. Это u₀; u₁ = 12
      - >
        Разность взята как u₁ − u₂ вместо u₂ − u₁, и знак получился
        противоположный
    calculator:
      mode: replaces
      note: >
        Единственный вопрос приёма с калькулятором (май 2021 TZ2) решается
        одним линейным уравнением, и функция solve на GDC отвечает
        мгновенно. На Paper 1 то же самое делается в уме.
    prereq: []
    raw_tags: [nth_term_formula, apply_term_formula, evaluate_term,
               find_common_difference, compute_consecutive_terms,
               recognise_linear_coefficient, linear_equation,
               solve_linear_equation, substitute_value, substitution,
               rearrange_terms]
    blocks: [2022-MAY-TZ2-P1-Q01-A, 2022-MAY-TZ2-P1-Q01-B,
             2022-MAY-TZ2-P1-Q01-C, 2021-MAY-TZ2-P2-Q02-A,
             2025-NOV-TZ1-P1-Q01-A]

  - id: series_sum
    name: Сложить первые n
    rung: 2
    trigger: >
      Слово sum, знак Σ, или задача, в которой что-то накапливается
      рядами: карты в пирамиде, точки в треугольном числе. Признак —
      величина растёт не на одно и то же, а на нарастающее.
    chain:
      - Убедиться, что складываемое само по себе арифметическое
      - Выписать u₁ и d этого складываемого
      - "S_n = n/2 (u₁ + u_n) — короче, когда u_n известен"
      - "S_n = n/2 (2u₁ + (n − 1)d) — короче, когда известна d"
      - Если сумма дана, полученное равенство и есть уравнение на n
    traps:
      - >
        S_n спутана с u_n. Треугольное число P₃(n) = n(n+1)/2 — это
        сумма 1 + 2 + … + n, а не n-й член
      - >
        Множитель n/2 потерян или взят как n: сумма выходит вдвое больше
      - >
        Слагаемых на одно больше или меньше. От 1 до n их n, а не n − 1
      - >
        Диаграмму пересчитали неверно: t₄ = 26 получается из t₃ = 15
        добавлением одиннадцати карт, а не десяти
    calculator:
      mode: speeds_up
      note: >
        Двадцать из двадцати двух баллов приёма стоят в бумагах с
        калькулятором, но считает он только арифметику. Единственное
        настоящее применение — таблица значений t_n, по которой видно,
        где сумма перевалила за нужное число.
    prereq: [nth_term]
    raw_tags: [arithmetic_series_sum, arithmetic_sum_formula, sum_formula,
               arithmetic_series, sum_of_first_n_integers, sum_of_squares,
               evaluate_sum, sigma_notation, series_identification,
               set_sum_to_zero, solve_for_n, formula_substitution,
               algebraic_substitution, algebraic_simplification,
               extend_pattern, add_cards, count_cards, read_from_diagram,
               diagram_construction, geometric_visualization,
               verbal_interpretation, evaluate_at_x_equals_1,
               equation_setup, quadratic_solving, positive_root_selection,
               fraction_addition, factorization, arithmetic_sequence]
    blocks: [2022-NOV-COMMON-P3-Q01-A, 2022-NOV-COMMON-P3-Q01-B-I,
             2022-NOV-COMMON-P3-Q01-D-III, 2022-MAY-TZ1-P3-Q01-A-I,
             2022-MAY-TZ1-P3-Q01-A-II, 2022-MAY-TZ1-P3-Q01-B-I,
             2022-MAY-TZ1-P3-Q01-B-II, 2022-MAY-TZ1-P3-Q01-B-III,
             2022-MAY-TZ1-P3-Q01-D, 2025-MAY-TZ1-P2-Q10-A,
             2025-MAY-TZ1-P2-Q10-B, 2025-MAY-TZ1-P2-Q10-C,
             2025-NOV-TZ1-P1-Q01-B]

  - id: two_conditions
    name: Два условия на u₁ и d
    rung: 3
    trigger: >
      В условии два факта о последовательности и ни одного из чисел
      u₁, d прямо не названо. «u₈ = S₈ = 8», «седьмой член равен шести,
      а шестой и двенадцатый в сумме двадцать четыре».
    chain:
      - Записать каждый факт через u₁ и d, ничего не вычисляя
      - Получить систему из двух линейных уравнений
      - Решить её подстановкой или вычитанием
      - Подставить обратно и убедиться, что оба факта выполнены
    traps:
      - >
        Один факт использован дважды, второй — ни разу: система выходит
        вырожденной, и u₁ с d по ней не находятся
      - >
        S₈ записана как u₈: сумма первых восьми и восьмой член здесь
        оба равны восьми, и это два разных уравнения
      - >
        При вычитании уравнений потерян знак; проверка подстановкой
        ловит это за десять секунд, и её стоит делать всегда
    calculator:
      mode: none
      note: >
        Все три вопроса приёма из Paper 1, и все три решаются вручную
        быстрее, чем система вводится в GDC.
    prereq: [nth_term, series_sum]
    raw_tags: [simultaneous_equations, system_of_equations, linear_system,
               solve_simultaneous, arithmetic_nth_term,
               arithmetic_sequence_sum, arithmetic_sum_formula,
               nth_term_formula, arithmetic_sequence, solve_linear_equation,
               substitution]
    blocks: [2021-MAY-TZ1-P1-Q02, 2025-NOV-TZ3-P1-Q01,
             2023-NOV-TZ1-P1-Q03-A]

  - id: sum_to_term
    name: От суммы обратно к членам
    rung: 4
    trigger: >
      Задана формула суммы, а спрашивают члены: «S_n = n² + 4n, найдите
      u₆». Отличительный признак — в условии стоит S, а в вопросе u.
    chain:
      - "u₁ = S₁: сумма одного члена и есть этот член"
      - "u_n = S_n − S_{n−1}: всё, что добавилось на n-м шаге"
      - Отсюда d = u₂ − u₁, а дальше обычная формула члена
      - "Проверка: подставить найденное u_n обратно в S_n"
    traps:
      - >
        u_n посчитан как S_n / n. Это среднее членов, а не член
      - >
        Взято S_{n+1} − S_n вместо S_n − S_{n−1}: номер сдвинут на единицу
      - >
        Формулу S_n приняли за u_n и стали искать разность её значений
        дважды
    calculator:
      mode: none
      note: >
        Оба вопроса приёма из Paper 1. Работа тут не вычислительная:
        надо увидеть, что S_n − S_{n−1} и есть n-й член.
    prereq: [series_sum]
    raw_tags: [relate_term_to_sum, recognize_u1_equals_S1, term_from_sums,
               evaluate_Sn, substitute_n, find_term, find_common_difference,
               apply_arithmetic_term_formula, arithmetic_sequence_term,
               simplify_expression]
    blocks: [2023-MAY-TZ1-P1-Q10-A, 2023-MAY-TZ1-P1-Q10-B,
             2023-MAY-TZ1-P1-Q10-C, 2023-NOV-TZ1-P1-Q03-B]

  - id: constant_difference
    name: Постоянная разность как условие
    rung: 5
    trigger: >
      Последовательность задана с буквой внутри («k − 5, 3 − 2k,
      5k + 3»), и сказано, что она арифметическая. Или наоборот:
      дано правило u_n и просят показать, что она арифметическая.
    chain:
      - "Условие всегда одно: u₂ − u₁ = u₃ − u₂"
      - "Найти букву: раскрыть это равенство и решить уравнение"
      - "Показать: вычислить u_{n+1} − u_n в общем виде"
      - Разность обязана не содержать n — тогда она постоянна
      - Та же мысль иначе — средний член есть среднее соседних
    traps:
      - >
        Проверены только три конкретных члена там, где просят показать
        для всех n. Схема оценивания это отдельно оговаривает:
        «award M0 for consideration of special cases»
      - >
        Разность посчитана, но не сказано вслух, что она постоянна.
        Это отдельный балл R1
      - >
        Найденное k подставлено не туда: u₃ = 5k + 3, а не 3 − 2k
    calculator:
      mode: none
      note: >
        Все шесть вопросов приёма из Paper 1. Здесь считать нечего:
        одно линейное уравнение либо одно вычитание в общем виде.
    prereq: [nth_term]
    raw_tags: [equate_differences, equating_differences, common_difference,
               arithmetic_sequence_verification, arithmetic_sequence,
               term_generation, algebraic_transformation,
               algebraic_rearrangement, algebraic_manipulation,
               inequality_reasoning, evaluate_expression, substitute,
               substitution, solve_linear_equation, common_ratio,
               geometric_sequence]
    blocks: [2025-MAY-TZ3-P1-Q10-A-I, 2025-MAY-TZ3-P1-Q10-A-II,
             2024-MAY-TZ2-P1-Q10-A, 2024-MAY-TZ2-P1-Q10-C,
             2024-MAY-TZ2-P1-Q10-D, 2023-MAY-TZ2-P1-Q12-D]

  - id: condition_on_coefficients
    name: Величины без номеров, поставленные в прогрессию
    rung: 6
    trigger: >
      Арифметическую последовательность образуют не члены u₁, u₂, u₃,
      а именованные величины: коэффициент, корень, свободный член.
      Признак — у последовательности нет индексов вовсе, и длина её
      всегда три или пять.
    chain:
      - Выразить всё через коэффициенты; корень линейной это r = −c/m
      - "Для квадратичной сумма корней = −b/a, произведение = c/a (Виета)"
      - Написать условие постоянной разности между соседними величинами
      - Получить уравнение на коэффициенты и решить его
      - Отбросить значения, при которых функция вырождается
    traps:
      - >
        Порядок величин переставлен. m, r, c — именно в этом порядке;
        m, c, r даёт другое уравнение и другой ответ
      - >
        Забыто ограничение, которое приносит знаменатель: c = −m²/(m+2)
        существует не при всех m, и m ≠ −2 — отдельный балл
      - >
        Из b(2a + 1) = 0 взят один корень из двух. Оба случая, b = 0
        и a = −½, разбираются дальше по отдельности
      - >
        Ответ записан десятичной дробью там, где просят exact values
    calculator:
      mode: allowed
      note: >
        Все 25 баллов приёма стоят в Paper 3, и все 25 — алгебра.
        Кнопка тут не помогает нигде, кроме проверки корней квадратного
        уравнения 4b² + 20b + 5 = 0, ответ на которое всё равно требуют
        точный.
    prereq: [constant_difference]
    raw_tags: [arithmetic_mean, common_difference_from_arithmetic_sequence,
               compute_common_difference, verify_arithmetic_sequence,
               eliminate_variable, eliminate_denominator,
               express_in_single_variable, form_linear_function,
               form_quadratic_equation, determine_quadratic,
               solve_for_parameter, solve_for_c, solve_quadratic,
               solve_linear_equation, zero_product_property, factor,
               compute_coefficient, domain_restriction,
               algebraic_manipulation, simplify, substitute]
    blocks: [2023-MAY-TZ2-P3-Q02-A, 2023-MAY-TZ2-P3-Q02-B-II,
             2023-MAY-TZ2-P3-Q02-B-III, 2023-MAY-TZ2-P3-Q02-E-I,
             2023-MAY-TZ2-P3-Q02-E-II, 2023-MAY-TZ2-P3-Q02-E-III,
             2023-MAY-TZ2-P3-Q02-F, 2023-MAY-TZ2-P3-Q02-G-I,
             2023-MAY-TZ2-P3-Q02-G-II]

  - id: extremum_of_sum
    name: Наибольшая сумма
    rung: 7
    trigger: >
      Слова maximum, greatest value рядом с S_n. Разность при этом
      обязательно отрицательная: у растущей последовательности
      наибольшей суммы нет.
    chain:
      - Убедиться, что d < 0 — иначе вопрос бессмыслен
      - Сумма перестаёт расти там, где члены становятся отрицательными
      - Решить u_n ≥ 0 и взять наибольшее целое n
      - Подставить это n в формулу суммы
    traps:
      - >
        Найден номер, а записан он вместо суммы. Спрашивают значение S_n,
        а не n
      - >
        Взято дробное n из графика. Вершина параболы стоит в 13.158,
        а сумм с дробным номером не бывает; схема оценивания снимает
        балл именно за (13.1582, 547.119)
      - >
        Член, равный нулю, посчитан «лишним». Если u₂₅ = 0, то S₂₄ = S₂₅,
        и оба ответа верны
    calculator:
      mode: helps
      note: >
        Оба вопроса из Paper 2, и таблица значений S_n действительно
        отвечает быстрее алгебры. Но округлять из неё нельзя: ответ
        просят с двумя знаками после запятой, и брать его надо
        подстановкой целого n в формулу.
    prereq: [series_sum, nth_term]
    raw_tags: [quadratic_maximum, maximization, gdc_graphical,
               sum_of_arithmetic_sequence, arithmetic_series_sum,
               common_difference, arithmetic_sequence]
    blocks: [2021-MAY-TZ2-P2-Q02-B, 2025-MAY-TZ2-P2-Q07-B]

  - id: integer_condition
    name: Номер обязан быть целым
    rung: 8
    trigger: >
      Слова smallest, minimum, least рядом с требованием делимости или
      совпадения: «сколько карт нужно, чтобы не осталось лишних»,
      «наименьшее число, треугольное и пятиугольное одновременно».
    chain:
      - Написать нужное равенство или делимость через n
      - Понять, что решать его в целых числах алгебра не умеет
      - Составить таблицу значений и читать её глазами
      - Взять наименьшее n, при котором условие выполнено
    traps:
      - >
        Решено уравнение вместо условия делимости. t_n = 52 и
        «t_n делится на 52» — разные задачи, и первая даёт не тот ответ
      - >
        Ответом названо не то, что спрашивают: тринадцать рядов, а не
        пять пачек
      - >
        Взят отрицательный корень квадратного уравнения. Номер члена
        не бывает отрицательным, и n = −27 в ответ не идёт
      - >
        Перечислено слишком мало значений. Первое совпадение треугольных
        и пятиугольных чисел — 210, на двадцатом и двенадцатом местах
    calculator:
      mode: required
      note: >
        Единственный приём темы, где калькулятор действительно нужен:
        все десять баллов идут в бумагах с ним, и во всех трёх схемах
        оценивания метод назван «uses a table of values». Алгебра здесь
        не работает — целочисленных решений она не ищет.
    prereq: [series_sum]
    raw_tags: [integer_condition, integer_solutions, divisibility,
               check_divisibility, table_generation, list_terms,
               sequence_comparison, common_term_identification,
               compute_coefficients]
    blocks: [2022-MAY-TZ1-P3-Q01-E, 2025-MAY-TZ1-P2-Q10-E,
             2023-MAY-TZ2-P3-Q02-C]

  - id: log_terms
    name: Члены-логарифмы
    rung: 9
    trigger: >
      Члены записаны логарифмами: ln x + p ln x + ⅓ ln x + …, или
      9 + ln 9, 5 + ln 3, 1 + ln 1. Признак — буква стоит внутри
      логарифма, и вынести её оттуда нельзя.
    chain:
      - Привести все логарифмы к одному основанию и одному аргументу
      - "ln 9 = 2 ln 3, ln 1 = 0 — после этого члены сравнимы"
      - Общая разность выходит кратной ln 3 (или ln x) — это и есть d
      - Дальше обычная сумма; ln x сокращается и остаётся уравнение на n
      - Отбросить отрицательный корень
    traps:
      - >
        ln x сокращён слишком рано, вместе с числовой частью.
        В сумме −90 − 25 ln 3 обе части нужны
      - >
        ln(1/x³) прочитано как 3 ln x. Знак минус здесь весь ответ:
        это −3 ln x
      - >
        Из n² − 7n − 18 = 0 взят корень n = −2. Номер члена
        положителен, и ответ n = 9
      - >
        Разность посчитана как отношение. Отношение делает
        последовательность геометрической, а здесь она арифметическая
    calculator:
      mode: forbidden
      note: >
        Оба вопроса приёма из Paper 1, и оба «show that». Десятичная
        запись ln 3 = 1.0986 не приносит здесь ни одного балла: ответ
        обязан остаться выражением с ln 3.
    prereq: [series_sum, constant_difference]
    raw_tags: [logarithm_properties, logarithmic_identity,
               arithmetic_series_sum, arithmetic_sequence,
               common_difference, quadratic_equation, factorisation,
               algebraic_simplification, solve_linear_equation,
               substitution]
    blocks: [2022-MAY-TZ1-P1-Q10-B, 2024-MAY-TZ2-P1-Q10-E]

corpus_issues:
  - id: 'ноябрьский дубль 2023 года'
    what: >
      2023-NOV-TZ1-P1-Q03 и 2023-NOV-TZ2-P1-Q03 — одна и та же бумага
      в двух зональных копиях. Совпадают дословно, включая обе методы
      схемы оценивания; коды бумаг 8823−7106 и 8823−7111. Семь баллов
      посчитаны дважды.
    why: >
      Тот же дубль вычитали в B4, C3, D2, D1 и C2 — шестой практикум
      подряд. Стоит выкусывать его при сборке classification/generated,
      а не в каждой карточке отдельно.
  - id: '2023-MAY-TZ1-P3-Q01-E'
    what: >
      Один балл числится за sequences, а последовательность там
      A_n = n! — ни арифметическая, ни геометрическая. Вопрос стоит
      в исследовании про площади под кривыми, и вся работа до него
      интегральная: это E6, а последний пункт — узнавание факториала
      в ряду 1, 2, 6, 24, 120.
  - id: '2025-MAY-TZ3-P3-Q02-H-III'
    what: >
      Четыре балла числятся за sequences, а исследование целиком про
      коробку из листа картона: объём V = x(a − 2x)(b − 2x)
      максимизируют производной и ищут условия, при которых максимум
      целый. Никакой последовательности в вопросе нет — это E9.
  - id: 'арифметическое и геометрическое в одной теме'
    what: >
      В number_algebra.sequences лежат обе прогрессии сразу, а рядом
      есть отдельная тема number_algebra.geometric_sequences. Десять
      блоков из sequences (22 балла) геометрические и по смыслу
      принадлежат второй теме.
    why: >
      На разрез A1/A2 это не влияет — доли в карте посчитаны по
      вопросам, а не по темам, — но всякий, кто возьмёт тему целиком,
      получит практикум из двух несовместимых половин.
  - id: 'вопрос, разрезанный между практикумами'
    what: >
      Майский 2023 TZ1 вопрос 10 и майский 2025 TZ3 вопрос 10 начинаются
      арифметической последовательностью и кончаются геометрической.
      Пункты (a)–(c) идут в A1, (d)–(e) — в A2.
    why: >
      Так и задумано экзаменом: он проверяет, отличает ли ученик одну
      от другой. Но архивный ноутбук A1 обрывает такой вопрос на
      середине, и об этом в нём сказано прямым текстом.
  - id: 'номер страницы: печатный или в PDF'
    what: >
      У майской 2023 TZ1 бумаги корпус указывает страницу 13 для
      вопроса 10, а в PDF на тринадцатой странице ещё идёт вопрос 9:
      записан печатный номер, а PDF начинается с обложки. Та же
      непоследовательность отмечена в карточках D1 и C2.
    why: >
      practicum/drill/archive.py ищет вопрос по тексту и берёт номер
      корпуса только как ориентир, поэтому на разборе это не сказывается.

