version: 0.2
practicum: D1
title: "Комбинаторика: размещения, блоки, дополнение"
source_topic: statistics.combinatorics
also_covers: []

corpus:
  blocks: 30
  marks: 89
  effective_blocks: 28
  effective_marks: 83
  sessions: May 2021 — November 2025
  papers: {1: 6, 2: 19, 3: 3}
  gdc_marks: 64
  note: >
    Тема statistics.combinatorics взята целиком: других тем в D1 нет и
    быть не может — счёт в архиве больше нигде не живёт отдельным
    вопросом. 30 блоков и 89 баллов по корпусу, но два блока из них —
    ноябрьский дубль 2023 года: одна и та же бумага лежит двумя
    зональными копиями (TZ1 и TZ2), и вопрос про шестерых мальчиков и
    трёх девочек посчитан дважды. В карточке он входит один раз, поэтому
    рабочих чисел два: 28 вопросов и 83 балла.

    Это самая маленькая тема секции D и вторая по малости во всём
    архиве после E1. Пятнадцать вопросов за пять сессий, ни одного
    длиннее семи баллов, и ни одной сессии без единого вопроса.
    Комбинаторика на AA HL стоит ровно столько, сколько стоит: её
    спрашивают каждый год и никогда помногу.

    77% баллов с калькулятором, и доля не обманывает: nPr, nCr и n! —
    это физические кнопки, и 126126 или 12441600 в уме не берутся. Но кнопки стоят в самом конце. На
    них приходится последний A1 каждого вопроса — около 28 баллов из
    83; остальные 55 стоят за решение о том, что именно надо посчитать,
    и здесь калькулятор не помогает ничем.

directions:
  count: >
    Считать по шагам: сколько выборов на каждом, важен ли порядок,
    повторяются ли объекты. Приёмы 1–3 — вся арифметика темы.
  restrict: >
    Ограничение в условии: «вместе», «не вместе», «хотя бы». Приёмы 4
    и 5 — два способа с ним обойтись: склеить и вычесть.
  split: >
    Одним счётом не обойтись, объекты распадаются на непересекающиеся
    случаи. Приём 6.
  unknown: >
    В самом счёте стоит буква, и её ищут из данного числа способов.
    Приём 7 — он же единственное место темы, где ответ отбраковывают
    за то, что он противоречит условию задачи, а не арифметике.

skills:
  - id: product_rule
    name: Правило произведения
    rung: 1
    trigger: >
      Объект собирают по шагам, и на каждом шаге выбор не зависит от
      того, что выбрано раньше: три броска кости, три позиции кода,
      пять овец по загонам, где загон вмещает всех. Признак — слова
      «each», «in turn», «repetition allowed» или просто то, что
      выбранное не убывает.
    chain:
      - Разбить объект на шаги и назвать, что выбирают на каждом
      - Посчитать, сколько вариантов на каждом шаге
      - Перемножить
    traps:
      - "Складывают вместо умножения: сложение — для случаев, которые
        друг друга исключают, умножение — для шагов, которые идут подряд"
      - "Пишут n! там, где повторы разрешены: 5³ = 125, а не 5·4·3 = 60.
        Ноябрь 2022 задаёт оба вопроса подряд именно поэтому"
      - "Ограничение вешают не на тот шаг: у пяти овец в шести загонах
        первая имеет 6 вариантов, а вторая 5 только потому, что её
        считают второй; посчитать её первой и оставить 6 — потерять балл"
      - "«Explain why there are 216» — это балл за слова 6×6×6, а не
        за число 216: оно напечатано в условии"
    calculator:
      mode: allowed
      note: >
        Шесть баллов приёма из семи — Paper 1, где калькулятора нет
        вовсе, а 5³ и 6⁵ − 6⁴ берутся в уме. Седьмой балл — «объясните,
        почему 216» из майского исследования 2024 года: ответ напечатан
        в условии, считать нечего.
    prereq: []
    raw_tags: [multiplication_principle, counting_principle, multiplication_rule,
               exponentiation, restricted_placement]
    blocks: ['2022-NOV-COMMON-P1-Q11-A-I', '2024-MAY-TZ2-P3-Q02-A',
             '2021-MAY-TZ1-P1-Q09-A']

  - id: permutation
    name: "Размещения: порядок важен, повторов нет"
    rung: 2
    trigger: >
      Объекты расставляют или выстраивают, каждый занимает своё место
      и второй раз не берётся: расположить в ряд, занять три должности,
      составить число из разных цифр. Слова «arrange», «in a line»,
      «distinct», «in order».
    chain:
      - "Решить, все объекты расставляют или только часть: n! или nPr"
      - Занятую позицию — ту, где ограничение, — заполнить первой
      - Остальные позиции заполнить оставшимися объектами
    traps:
      - "Ограниченную позицию оставляют напоследок: шестизначное число
        из разных цифр — это 9 × ⁹P₅ = 136080, потому что первая цифра
        не ноль. Схема оценивания мая 2022 TZ2 прямо называет два
        неверных ответа: ¹⁰P₆ = 151200 и ⁹P₆ = 60480, и оба дают M1A0"
      - "nPr путают с nCr: размещения больше сочетаний ровно в r! раз,
        и в ответе это видно"
      - "15! не считают, а оставляют как есть — и это верно: схема
        принимает и 15!, и 1,31 × 10¹²"
      - "Забывают, что «выбрать председателя, зама и казначея» — это
        размещения, а «выбрать ещё четверых» — сочетания, и в одном
        вопросе бывает и то, и другое"
    calculator:
      mode: speeds_up
      note: >
        Семь баллов из девяти с калькулятором, и здесь он действительно
        считает: ⁹P₅, ¹⁰P₃ и 15! — кнопки. Метод от этого не меняется
        ни на шаг: решение о том, какая позиция ограничена, принимается
        до того, как что-нибудь нажато.
    prereq: [product_rule]
    raw_tags: [permutation, permutations, permutation_counting, factorial,
               factorial_evaluation, restricted_first_digit,
               permutations_with_restrictions]
    blocks: ['2022-NOV-COMMON-P1-Q11-A-II', '2025-NOV-TZ3-P2-Q08-A',
             '2022-MAY-TZ2-P2-Q09-A', '2025-NOV-TZ1-P2-Q02']

  - id: combination
    name: "Сочетания: порядок не считают"
    rung: 3
    trigger: >
      Отбирают группу, и внутри неё никто ничем не отличается от
      другого: комитет, команда, набор книг, подмножество. Слово
      «select», «choose», «selection», или прямая оговорка «order is
      not important». Второй признак, менее заметный: порядок внутри
      группы задан условием однозначно — цифры по возрастанию
      расставляются единственным способом, и значит, считать его
      не надо.
    chain:
      - Убедиться, что порядок внутри группы ничего не меняет
      - Записать nCr — размещения, поделённые на r! внутренних порядков
      - Если групп несколько и они неразличимы, поделить ещё на число их перестановок
    traps:
      - "Пишут nPr вместо nCr: ответ больше верного ровно в r! раз"
      - "«Цифры по возрастанию» считают как размещения. Каждое
        неупорядоченное подмножество даёт ровно одно возрастающее
        число, и схема оценивания мая 2022 TZ2 ставит отдельный A1
        именно за эту фразу — ⁹C₆ × 1"
      - "Три равные команды из пятнадцати: ¹⁵C₅ · ¹⁰C₅ · ⁵C₅ = 756756
        считает команды различимыми. Их надо поделить на 3!, и в схеме
        мая 2025 TZ2 деление на 3! — отдельный A1 из трёх"
      - "Обратная ошибка: делят на k! там, где группы как раз
        различаются — «первая группа» и «вторая группа» в условии
        названы, и переставлять их нельзя"
    calculator:
      mode: speeds_up
      note: >
        Пять баллов из шести с калькулятором, но ⁹C₆ = 84 берётся и
        в уме. Кнопка нужна на 126126 — и только после того, как
        решено, что делить надо на 3!.
    prereq: [permutation]
    raw_tags: [combination, combinations, binomial_coefficient,
               selection_with_unique_ordering, multinomial_coefficient,
               division_by_permutations]
    blocks: ['2022-MAY-TZ2-P2-Q09-B', '2024-MAY-TZ2-P1-Q09-A',
             '2025-MAY-TZ2-P2-Q11-A']

  - id: block
    name: "Вместе: склеить в один объект"
    rung: 4
    trigger: >
      В условии сказано, что несколько объектов стоят рядом:
      «next to each other», «immediately after», «grouped together»,
      «consecutively». Ограничение положительное — что-то обязано быть
      вместе, а не наоборот.
    chain:
      - Склеить то, что стоит вместе, в один объект
      - Расставить получившиеся объекты как обычно
      - Умножить на число порядков внутри склейки
      - Если склеек несколько, умножить и на порядок самих склеек
    traps:
      - "Забывают умножить на порядок внутри блока: три девочки рядом —
        это 7! × 3!, и в схеме ноября 2023 множитель 3! стоит
        отдельным A1"
      - "Забывают порядок самих блоков: книги трёх континентов — это
        6! × 5! × 4! × 3!, и последний множитель — тот самый, который
        теряют. Схема ноября 2025 TZ3 даёт за него отдельный M1:
        «recognise that the three groups can be placed in any order»"
      - "«Пятеро подряд в ряду из десяти мест» — это 6 × 5! = 720, где
        6 это число положений блока, а не 6!. Числа совпадают, и схема
        мая 2022 TZ1 пишет «accept 6!»: верный ответ приходит
        и по неверной причине"
      - "«Jack finishes immediately after Andrea» — блок с одним
        внутренним порядком, а не с двумя: умножать на 2! здесь нечего"
      - "Соседство считают по всей фигуре, когда условие говорит «в том
        же ряду»: у двух рядов по пять мест соседних пар восемь, а не
        девять — пара через границу рядов не соседняя"
    calculator:
      mode: speeds_up
      note: >
        Все пятнадцать баллов приёма из бумаг с калькулятором, и
        6! × 5! × 4! × 3! = 12441600 без него не сложить. Но склейка —
        решение, а не вычисление: калькулятор перемножает то, что уже
        выписано.
    prereq: [permutation]
    raw_tags: [block_method, block_treatment, block_restriction, grouping,
               treating_as_unit, consecutive_arrangement, direct_count,
               row_consideration]
    blocks: ['2021-MAY-TZ2-P2-Q07-A', '2022-MAY-TZ1-P2-Q09-A',
             '2023-NOV-TZ1-P2-Q07-A', '2024-MAY-TZ1-P2-Q09-A',
             '2025-NOV-TZ3-P2-Q08-B', '2023-MAY-TZ1-P2-Q11-E']

  - id: complement
    name: "Через запрещённое: посчитать всё и вычесть"
    rung: 5
    trigger: >
      Ограничение отрицательное: «must not», «not next to each other»,
      «at least», «no girl adjacent». Прямой счёт разваливается на
      много случаев, а запрещённое считается одним ходом — потому что
      «не вместе» это дополнение к «вместе», а приём 4 «вместе» уже
      умеет.
    chain:
      - Посчитать всё без ограничения
      - Посчитать ровно то, что условие запрещает, — обычно склейкой
      - Вычесть
    traps:
      - "Вычитают из неправильного целого: у мая 2024 TZ1 вычитать надо
        не из 10!, а из ответа пункта (a) — Алвин и Бобби всё ещё
        обязаны сидеть рядом"
      - "«Хотя бы две девочки» считают как 3C2 × 6C3 и складывают
        с чем-нибудь: правильных путей два — сложить два случая
        (ровно 2 и ровно 3) или вычесть два случая (ни одной и ровно
        одну) из всех. Оба дают 75, промежуточные смеси не дают ничего"
      - "Запрещённое считают, забыв про порядок внутри пары: у мая 2021
        TZ1 это 2 × 7 × 4!, и двойка здесь за то, что Амбер и Брауни
        можно поменять местами"
      - "Симметрия — тот же приём в вырожденном виде: «Джек где-то
        после Андреа» это ровно половина всех порядков, 8!/2, потому
        что каждому порядку отвечает ровно один зеркальный. Считать
        по позициям 7 + 6 + … + 1 тоже можно, но это в семь раз дольше"
    calculator:
      mode: speeds_up
      note: >
        Десять баллов из четырнадцати с калькулятором. Четыре
        оставшихся — овцы мая 2021 TZ1 из Paper 1, где 6! − 2·7·4!
        считают руками. Вычитание одинаково в обеих бумагах; кнопка
        экономит последнюю строчку.
    prereq: [block]
    raw_tags: [complementary_counting, complement_counting, complement_rule,
               subtraction, inclusion_exclusion, symmetry_argument,
               grid_adjacency]
    blocks: ['2021-MAY-TZ1-P1-Q09-B', '2021-MAY-TZ2-P2-Q07-B',
             '2024-MAY-TZ1-P2-Q09-B', '2023-NOV-TZ1-P2-Q07-B']

  - id: cases
    name: Разбор случаев и правило сложения
    rung: 6
    trigger: >
      Ни прямой счёт, ни дополнение одним выражением не берутся:
      ответ зависит от того, где именно стоит объект или сколько их
      какого сорта. Признак — ограничение, которое ведёт себя по-разному
      в разных положениях: Питер с краю и Питер не с краю, четыре книги
      из Азии и четыре из Европы, остаток числа при делении на три.
    chain:
      - Найти признак, по которому объекты распадаются
      - Проверить, что случаи не пересекаются и покрывают всё
      - Посчитать каждый случай отдельно приёмами 1–5
      - Сложить
    traps:
      - "Случаи пересекаются, и общая часть считается дважды. Проверка
        одна: может ли один объект попасть в два случая сразу"
      - "Случаи не покрывают всё: «четыре книги с одного континента» —
        это ⁶C₄ + ⁵C₄ + ⁴C₄, и четвёрка из Африки ровно одна, но она
        есть. Схема ноября 2025 TZ3 ставит M1 за само понимание, что
        случаев три"
      - "Забывают, что положение объекта меняет число вариантов у
        остальных: у мая 2022 TZ1 Питер с краю запрещает одно место,
        Питер не с краю — два, отсюда 2 × ⁸P₄ и 8 × ⁷P₄"
      - "Перебор подменяют формулой там, где условие нельзя записать
        формулой: у майского исследования 2024 года «ac = 2, два
        различных корня» — это восемь троек, и схема принимает их
        выписанными списком"
    calculator:
      mode: partial
      note: >
        Все пятнадцать баллов из бумаг с калькулятором, но работа
        делится ровно пополам. Разбиение на случаи — целиком бумага;
        каждый случай — кнопка. У майского исследования 2024 года
        кнопки нет вовсе: ответ получают перечислением восьми троек.
    prereq: [complement, combination]
    raw_tags: [case_analysis, cases, addition_principle, combinatorial_addition,
               modulo_partition, enumeration, counting, discriminant]
    blocks: ['2022-MAY-TZ1-P2-Q09-B', '2023-MAY-TZ2-P2-Q09',
             '2025-NOV-TZ3-P2-Q08-C', '2024-MAY-TZ2-P3-Q02-E-I',
             '2024-MAY-TZ2-P3-Q02-E-II']

  - id: unknown_n
    name: Буква внутри счёта
    rung: 7
    trigger: >
      Число объектов не дано, а спрашивается: «write down an expression
      for the number of ways», «determine the value of n», «find the
      greatest n such that». Считать приходится тем же, чем и всегда,
      но с буквой, и итог приравнивают к данному числу.
    chain:
      - Записать счёт выражением от n — теми же приёмами 1–6
      - Приравнять к данному числу или поставить под неравенство
      - Убрать факториалы сокращением, а не раскрытием
      - Решить и отбросить корни, которые условию задачи не годятся
    traps:
      - "Раскрывают факториалы вместо того, чтобы сократить: ⁿC₃ и
        ⁿ⁻²C₂ отличаются множителем, и уравнение сводится к квадратному
        за две строчки. Схема мая 2024 TZ2 ставит M1 за «valid attempt
        to eliminate all factorials»"
      - "Оставляют оба корня. n² − 13n + 36 = 0 даёт 9 и 4, но при
        n = 4 во второй группе остаётся один студент, а условие требует
        не меньше трёх. Схема прямо пишет: «Do not award the final A1
        if additional values of n are given»"
      - "Неравенство решают и округляют не в ту сторону: 6/(n(n−1)) > 0,05
        даёт n < 11,47, и наибольшее целое — 11, а не 12. Проверка
        двух соседних значений стоит A1"
      - "Забывают, что n здесь целое и положительное, и сдают дробный
        корень"
    calculator:
      mode: partial
      note: >
        Одиннадцать баллов из семнадцати с калькулятором, и делят они
        работу пополам: уравнение составляют руками, решают на GDC.
        У майского вопроса 2023 TZ1 схема прямо принимает табличный
        путь — «n = 11 gives 0,0545…, n = 12 gives 0,0454…», — то есть
        перебор на калькуляторе засчитывается как решение неравенства.
    prereq: [cases]
    raw_tags: [constrained_counting, equation_setup, factorial_elimination,
               quadratic_solving, quadratic_equation, solution_validation,
               solve_for_n, inequality, probability_expression,
               algebraic_simplification]
    blocks: ['2024-MAY-TZ2-P1-Q09-B', '2023-MAY-TZ1-P2-Q11-F',
             '2025-MAY-TZ3-P2-Q08']

imported:
  - practicum: D2
    what: >
      Перебор равновозможных исходов (приём 9 карточки D2) — это D1,
      поставленный в знаменатель вероятности. Там пространства
      маленькие и перечисляются руками; здесь их считают.
  - practicum: A3
    what: >
      ⁿCᵣ здесь и биномиальный коэффициент там — одно и то же число,
      и оба практикума этим пользуются. Разница в том, что A3 читает
      его как коэффициент разложения, а D1 — как число подмножеств.
  - practicum: A4
    what: >
      Квадратное уравнение приёма 7 решается как обычно. Новое одно:
      корень отбрасывают не за то, что он посторонний, а за то, что
      он противоречит условию задачи — второй группе не хватает людей.
  - practicum: A8
    what: >
      Неравенство 6/(n(n−1)) > 0,05 из майского вопроса 2023 TZ1
      решается техникой A8; здесь оно только последний шаг.

corpus_issues:
  - id: 'ноябрьский дубль 2023 года'
    what: >
      2023-NOV-TZ1-P2-Q07 и 2023-NOV-TZ2-P2-Q07 — одна и та же бумага
      в двух зональных копиях: текст совпадает дословно, различаются
      только коды бумаг (8823−7107 и 8823−7112). Шесть баллов
      посчитаны дважды. Тот же дубль уже находили в B4, C3 и D2 —
      четвёртый практикум подряд, и каждый раз он вычитается вручную.
    why: >
      Это уже не находка, а свойство корпуса. Стоит выкусывать дубль
      при сборке classification/generated, а не в каждой карточке
      отдельно: карточки расходятся в том, какую копию оставить, и
      сумма по практикумам перестаёт сходиться с суммой по корпусу.
  - id: 'номер страницы: печатный или в PDF'
    what: >
      Номер страницы билета корпус пишет то печатным номером, то
      индексом страницы в PDF, и различаются они на единицу — на
      обложку. В этой теме пятнадцать вопросов, и разметка делится
      почти поровну: восемь раз записан печатный номер (май 2021 TZ1
      Paper 1, май 2021 TZ2, ноябрь 2022, май 2023 обе зоны, май 2024
      обе зоны, исследование 2024), семь раз — индекс в PDF (май 2022
      обе зоны, ноябрь 2023 обе зоны, вся сессия 2025 года).
      У схем оценивания такого расхождения нет: там обложки нет и
      оба номера совпадают.
    why: >
      В D2 нашлось четыре промаха «на единицу», и все в одну сторону —
      оттуда читалось, что корпус просто сдвинут. Это не так: он
      непоследователен, и внутри одной темы встречаются обе записи.
      Чинить это перенумерацией нельзя, нужен признак; practicum/drill/
      archive.py поэтому и ищет вопрос по тексту, беря номер корпуса
      только как ориентир.
  - id: 'archive.locate теряет поздние пункты схемы'
    what: >
      Схема оценивания майского вопроса 2023 TZ1 Q11 занимает страницы
      24–26, и пункты (e) и (f) — те самые, что принадлежат D1, —
      напечатаны на 26-й. Корпус указывает 26 верно. Но archive.locate
      ищет страницу по строке «11.», находит начало вопроса на 24-й и
      возвращает [24, 25]: подсказка корпуса отброшена, а PAGE_LIMIT
      для схемы равен двум.

      Проверено по всему корпусу: подсказка оказывается позже
      найденных страниц у 178 блоков из 1426 — каждый восьмой. Все
      они одного вида: поздний пункт длинного вопроса.
    why: >
      Это не ошибка разметки, а ошибка кода, и она тихая: режим разбора
      показывает модели страницу схемы, на которой разбираемого пункта
      нет, без единого признака того, что страница не та. Чинить надо
      в archive.locate — дотягивать список страниц до подсказки, когда
      вопрос до неё продолжается, — но менять это стоит с отдельным
      прогоном по всем 1426 блокам, а не походя.
  - id: '2024-MAY-TZ2-P1-Q09-B'
    what: >
      method_path пишет «Reject n=4 (second group would have only 1
      student, violating "at least three")». Причина названа верно, но
      в схеме оценивания её нет: там стоит только Note «Do not award
      the final A1 if additional values of n are given». Пересказ здесь
      лучше оригинала, и это стоит знать, когда на него опираются.
  - id: '2024-MAY-TZ2-P3-Q02'
    what: >
      Три блока исследования числятся за комбинаторикой (a, e(i),
      e(ii) — 4 балла), а соседние (c), (d) и (f) — за вероятностью
      и функциями, хотя считают в них ровно то же самое: тройки
      (a, b, c) с условием на дискриминант. Разрез проходит не по
      методу, а по тому, спрашивают в пункте число или вероятность.
  - id: '2025-MAY-TZ3'
    what: >
      У майской сессии 2025 года три зоны, и TZ3 в корпусе есть, а
      в разметке архива каталог называется так же. Это не ошибка,
      но стоит помнить: до 2025 года зон было две, и код, который
      перебирает TZ1/TZ2, тихо теряет треть сессии.

ladder: [product_rule, permutation, combination, block, complement,
         cases, unknown_n]
