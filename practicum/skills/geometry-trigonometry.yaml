version: 0.1
practicum: C1
title: "Треугольник: синусы, косинусы, площадь"
source_topic: geometry.trigonometry
corpus:
  blocks: 39
  marks: 116
  sessions: May 2021 — November 2025
  papers: {1: 52, 2: 54, 3: 10}
  gdc_marks: 64
  note: >
    Тема взята целиком: 39 блоков, 116 баллов, внутри диапазона.
    Распределение по бумагам почти ровное — 52 балла без калькулятора
    и 54 с ним, — и это редкость: обычно тема живёт в одной бумаге.
    Различает их не сложность, а форма ответа: в Paper 1 просят точное
    значение, в Paper 2 три значащие цифры.

    Целым вопросом треугольник бывает пять раз; остальные 34 блока —
    пункты внутри чужих вопросов, чаще всего первые: треугольник
    служит входом в задачу про производную, про модель или про тело.

    Четырнадцать баллов из 116 к треугольнику не относятся вовсе —
    подробности в corpus_issues и leftovers.

    В blocks приёма sine_rule нет вопроса May 2025 TZ1 Paper 1 Q11(c)(ii)
    (задание 8 практикума): в корпусе он сейчас лежит одним блоком
    2025-MAY-TZ1-P1-Q11-C, а в идущем параллельно прогоне классификации
    разбит на C-I и C-II. Ссылаться на идентификатор, который меняется,
    смысла нет; источник указан в самом задании.

principle: >
  Длина стороны или величина угла сами по себе ничего не значат: ответ
  здесь — треугольник, а найденное число всего лишь одна его часть.
  Отсюда два следствия, вокруг которых построена лестница.

  Первое: формулу выбирают по тому, что дано, а не по тому, что ищут.
  Три стороны или две стороны с углом между ними — косинусы. Сторона
  против известного угла — синусы. Две стороны и угол между ними —
  площадь. Правило читается прямо с чертежа, и потому чертёж —
  обязательный первый ход, а не украшение.

  Второе: данных бывает мало для одного треугольника. Две стороны и угол
  против меньшей из них задают два разных треугольника, и оба настоящие.
  Какой из них имеется в виду, решает условие, а не алгебра, — и это
  единственное место темы, где ответ не определяется данными.

  Проверка устроена по тому же принципу: solve_triangle достраивает
  треугольник из данных условия и в неоднозначном случае возвращает два,
  а verify_triangle не хранит эталона и говорит вслух, когда ваш ответ
  отвечает лишь одному из двух.

skills:
  - id: right_triangle
    name: Прямоугольный треугольник
    rung: 1
    trigger: >
      Прямой угол в чертеже; тело вращения или пирамида; «find the angle
      between the edge and the base».
    chain:
      - Найти в чертеже прямоугольный треугольник
      - Подписать гипотенузу и оба катета
      - Выбрать отношение по тому, какие две стороны участвуют
      - Обратная функция, если ищут угол
    traps:
      - >
        В пирамиде взята вся диагональ основания вместо половины: угол
        выходит меньше настоящего, а ошибка видна только по чертежу
      - >
        Уровень глаз наблюдателя не вычтен из высоты объекта
      - >
        Горизонтальный катет отмерен до основания тела, а не до его оси
    calculator:
      mode: helps
      note: >
        В Paper 2 всё считается сразу; в Paper 1 те же треугольники дают
        точные значения (√29, 5√2), и калькулятор не нужен.
    prereq: []
    raw_tags: [right_triangle_trigonometry, tangent_ratio, inverse_tangent,
               pythagoras_theorem, pythagorean_theorem, square_diagonal,
               inverse_trigonometric_function, secant_definition,
               cosecant_definition, trigonometric_ratio_application]
    blocks: [2024-MAY-TZ1-P2-Q02-A, 2025-MAY-TZ2-P2-Q02-B,
             2025-MAY-TZ2-P2-Q02-C, 2023-MAY-TZ1-P1-Q11-A]

  - id: elevation_and_bearing
    name: От описания к чертежу
    rung: 2
    trigger: >
      «Bearing of D from J is 034°», «angle of elevation», «500 km
      directly east» — чертежа нет, есть слова.
    chain:
      - Нарисовать север стрелкой и отметить известные направления
      - Перевести направления в углы треугольника вычитанием
      - Подписать все известные длины
      - Достроить недостающий угол суммой углов треугольника
    traps:
      - >
        Направление 034° взято как угол треугольника. Оно отсчитывается
        от севера, а сторона идёт на восток — между ними прямой угол
      - >
        Угол возвышения отсчитан от вертикали, а не от горизонтали
      - >
        Забыто, что углы возвышения из одной точки в разные стороны
        вместе с углом между лучами дают развёрнутый угол
    calculator:
      mode: helps
      note: >
        Оба блока приёма из Paper 2. Считать там нечего до тех пор, пока
        чертёж не построен, — а это ручная работа.
    prereq: [right_triangle]
    raw_tags: [bearing_conversion, bearing_calculation, triangle_angle_sum,
               angle_calculation, inverse_trigonometric_ratio,
               distance_calculation]
    blocks: [2023-MAY-TZ1-P2-Q01-A, 2025-MAY-TZ2-P3-Q02-A-II,
             2023-MAY-TZ2-P2-Q02]

  - id: cosine_rule
    name: Теорема косинусов
    rung: 3
    trigger: >
      Три стороны (ищут угол) или две стороны и угол между ними
      (ищут третью сторону).
    chain:
      - Проверить, что известный угол лежит между известными сторонами
      - "Подставить в a² = b² + c² − 2bc·cos A"
      - Для угла — та же формула, решённая относительно косинуса
      - "Сверить правдоподобие: против большей стороны больший угол"
    traps:
      - >
        Перепутано соглашение: сторона a лежит против угла A, и путаница
        здесь дороже любой арифметической ошибки
      - >
        При тупом угле «поправляют» знак руками. Минус уже стоит
        в формуле, а косинус отрицателен сам
      - >
        Угол известен, но лежит не между сторонами: тогда формула даёт
        квадратное уравнение, и корней бывает два
    calculator:
      mode: helps
      note: >
        В Paper 1 та же формула работает с точными косинусами (3/4, 1/5)
        и приводит к красивым радикалам — признак, что задача составлена
        под точный ответ.
    prereq: [right_triangle]
    raw_tags: [cosine_rule, substitution, evaluate_square_root,
               algebraic_manipulation, equating_expressions,
               isosceles_triangle, solve_for_side]
    blocks: [2025-MAY-TZ3-P2-Q01-A, 2023-MAY-TZ2-P2-Q02,
             2022-NOV-COMMON-P2-Q09-A-I-III, 2021-MAY-TZ2-P1-Q06]

  - id: sine_rule
    name: Теорема синусов
    rung: 4
    trigger: >
      Известна сторона вместе с противолежащим ей углом; «find the
      distance», «show that d = …».
    chain:
      - Найти пару «сторона — противолежащий угол»
      - При необходимости достроить третий угол суммой
      - Взять из пропорции ровно две дроби
      - Решить получившееся линейное уравнение
    traps:
      - >
        Взяты все три дроби сразу: уравнение перестаёт быть линейным
        на вид, хотя решается так же
      - >
        arcsin возвращает острый угол, а второе решение 180° − B тоже
        бывает годным — см. приём ambiguous_case
      - >
        Третий угол не найден, и пропорция составляется из двух
        неизвестных
    calculator:
      mode: helps
      note: >
        В Paper 1 теорема синусов приводит к точным значениям
        (sin 75°, sin 2θ), и там она соседствует с формулами сложения
        углов из C3.
    prereq: [cosine_rule]
    raw_tags: [sine_rule, side_calculation, triangle_angle_sum,
               trigonometric_manipulation, exact_trigonometric_values,
               rationalize_denominator, inverse_sine]
    blocks: [2023-MAY-TZ1-P2-Q01-B, 2025-MAY-TZ3-P2-Q01-B,
             2024-MAY-TZ2-P2-Q11-E]

  - id: ambiguous_case
    name: Неоднозначный случай
    rung: 5
    trigger: >
      Две стороны и угол против меньшей из них; слова «smallest
      possible», «all possible values», «the two possible».
    chain:
      - "Найти sin B = b·sin A / a"
      - Взять оба угла — B и 180° − B
      - Отбросить тот, при котором сумма с известным углом больше 180°
      - Достроить оба треугольника и выбрать нужный по условию
    traps:
      - >
        Взят только острый корень: калькулятор второго не показывает
      - >
        Оба треугольника найдены, но выбор не сделан — вопрос почти
        всегда просит один из них
      - >
        Забыто, что при a ≥ b или A ≥ 90° треугольник всё-таки один
    calculator:
      mode: checks
      note: >
        Тот же ответ даёт квадратное уравнение теоремы косинусов
        относительно третьей стороны: два положительных корня — это
        те же два треугольника, полученные без arcsin.
    prereq: [sine_rule]
    raw_tags: [ambiguous_case_selection, quadratic_solving,
               perimeter_calculation, trigonometric_equation_solving]
    blocks: [2021-NOV-COMMON-P2-Q02]

  - id: triangle_area
    name: Площадь треугольника
    rung: 6
    trigger: >
      «Find the area», площадь дана и ищут сторону, треугольник
      на координатной плоскости или на диаграмме Аргана.
    chain:
      - "Две стороны и угол между ними: S = ½ab·sin C"
      - Прямоугольный — половина произведения катетов
      - На плоскости — половина основания на высоту, прямо с осей
      - Обратная задача решается тем же уравнением относительно стороны
    traps:
      - >
        Угол взят не между указанными сторонами
      - >
        Формула ½ab·sin C применяется там, где основание уже
        параллельно оси и всё считается устно
      - >
        В прямоугольном треугольнике за катет принята гипотенуза
    calculator:
      mode: 'no'
      note: >
        Почти все блоки приёма из Paper 1: площадь просят точным
        значением, и там, где синус берётся из косинуса, калькулятор
        только мешает.
    prereq: [cosine_rule]
    raw_tags: [area_of_triangle, area_of_triangle_sine_formula,
               triangle_area_sine_formula, area_formula_sine,
               area_triangle_sine_formula, apply_area_formula,
               area_right_triangle, base_height, argand_diagram,
               identify_right_triangle_legs, midpoint_formula, symmetry]
    blocks: [2023-NOV-TZ1-P1-Q04, 2024-MAY-TZ1-P1-Q12-D,
             2022-NOV-COMMON-P1-Q03-B, 2024-MAY-TZ2-P1-Q03-B,
             2025-MAY-TZ2-P1-Q03-C, 2021-MAY-TZ1-P3-Q02-B]

  - id: exact_values
    name: Точные значения
    rung: 7
    trigger: >
      Paper 1; «find the exact value», «in the form p√q», «where
      p, q ∈ ℤ⁺».
    chain:
      - "sin из cos по тождеству: знак в треугольнике всегда плюс"
      - Перемножать под корнем, а не считать
      - Избавляться от иррациональности домножением на сопряжённое
      - Довести q до свободного от квадратов
    traps:
      - >
        Ответ записан десятичной дробью. «Exact» — требование к записи,
        и 29,4 вместо 12√6 балла не получает
      - >
        Оставлена дробь вида 10√2/(√6+√2): без сопряжённого форма
        из условия не получается
      - >
        q не сокращено: 5√175 равно 25√7, но записано неверно
    calculator:
      mode: 'no'
      note: >
        Приём существует именно потому, что калькулятора нет. Проверить
        себя им всё же полезно: 12√6 = 29,39.
    prereq: [triangle_area]
    raw_tags: [pythagorean_identity, sin_from_cos, sine_from_cosine,
               algebraic_simplification, simplify_rational_expression,
               arithmetic_simplification, exact_trigonometric_values]
    blocks: [2021-MAY-TZ2-P1-Q06, 2023-NOV-TZ2-P1-Q04,
             2025-MAY-TZ2-P1-Q03-A, 2025-MAY-TZ2-P1-Q03-B]

  - id: triangle_as_model
    name: Треугольник с буквой
    rung: 8
    trigger: >
      «Show that …» с параметром, площадь как функция, «find the maximum
      area», разность арктангенсов.
    chain:
      - Назвать буквой ровно одну величину
      - Выразить через неё все нужные стороны и углы
      - Связать лишние буквы теоремой косинусов или суммой углов
      - Дальше — производная или GDC
    traps:
      - >
        В выражении осталось две буквы: потеряно соотношение между ними
      - >
        Область параметра не найдена. Из cos α = 6cos β − 5 следует
        cos β ≥ 2/3, и без этого максимум ищется не там
      - >
        Разность арктангенсов заменена суммой: зависит от того,
        по одну ли сторону лежат оба треугольника
    calculator:
      mode: required
      note: >
        Единственный приём темы, где GDC действительно нужен: максимум
        площади четырёхугольника аналитически в программе не берётся.
        Проверить его можно формулой Брахмагупты — она даёт 8√6.
    prereq: [triangle_area, sine_rule]
    raw_tags: [trigonometric_substitution, single_variable_expression,
               gdc_optimization, angle_difference, arctan_definition,
               algebraic_rearrangement, geometric_interpretation,
               algebraic_sum]
    blocks: [2022-NOV-COMMON-P2-Q09-B, 2025-MAY-TZ3-P2-Q09-A,
             2021-MAY-TZ1-P2-Q09-A, 2023-MAY-TZ2-P1-Q10-B]

leftovers:
  - what: Аналитическая геометрия и производные внутри темы треугольника
    marks: 14
    blocks: [2025-MAY-TZ3-P2-Q12-D, 2025-NOV-TZ1-P1-Q10-D,
             2025-NOV-TZ1-P3-Q01-A-II, 2023-NOV-TZ1-P3-Q02-A-II,
             2023-NOV-TZ2-P3-Q02-A-II, 2025-MAY-TZ2-P1-Q06-A]
    why: >
      Ни в одном из шести блоков нет ни теоремы синусов, ни теоремы
      косинусов, ни площади треугольника: это касательные к семейству
      решений дифференциального уравнения, приближение π через интеграл,
      уравнение нормали, произведение угловых коэффициентов
      перпендикулярных прямых и формула расстояния. Подробности
      в corpus_issues.
  - what: Треугольник внутри задачи о последовательности
    marks: 5
    blocks: [2025-MAY-TZ1-P2-Q10-F]
    why: >
      Высота равностороннего треугольника нужна там на один шаг, а весь
      вопрос про сумму арифметической прогрессии и неравенство. Приём
      right_triangle покрывает нужное, целым заданием блок не стал.
  - what: Периметр и площадь двух целочисленных треугольников
    marks: 1
    blocks: [2021-MAY-TZ1-P3-Q02-G-II]
    why: >
      Один балл на арифметику после того, как треугольники уже найдены.
      Сами они найдены в B1, задание 7 — там же и разобраны.

leads_to:
  - practicum: C2
    why: >
      Радианная мера и сектор используют ту же формулу площади,
      но с углом в радианах; тела вращения продолжают приём
      right_triangle.
  - practicum: C3
    why: >
      Точные значения sin 75° и формула двойного угла приходят оттуда.
      В C1 они инструмент, в C3 — предмет.
  - practicum: E9
    why: >
      Треугольник с буквой почти всегда вход в оптимизацию или
      в связанные скорости: «угол обзора» и «лестница за углом» —
      классические задачи E9, и обе начинаются здесь.
  - practicum: C5
    why: >
      Площадь треугольника через векторное произведение — тот же ответ
      другим способом; сравнение двух путей стоит того, чтобы его
      увидеть.

verification_limits:
  - what: >
      verify_triangle судит по данным условия, а не по вопросу.
    why: >
      Если данные допускают два треугольника, проходит любой из них —
      проверка сообщает об этом, но выбрать за вас не может.
    impact: >
      В задании 10 правильность выбора ловит только check_num
      на периметр. Измерено в verify_c1.py (предел 1).
  - what: >
      Допуск сравнения относительный, 5·10⁻³.
    why: >
      Так проходит ответ с тремя значащими цифрами, ради которого всё
      и делается.
    impact: >
      Ответ с четырьмя значащими цифрами проходит тоже, хотя markscheme
      просит ровно три. Измерено в verify_c1.py (предел 2).
  - what: >
      verify_exact следит за точностью записи, но не за её формой.
    why: >
      Проверяется отсутствие десятичных чисел и равенство значению.
    impact: >
      Запись 5√175/2 проходит вместо 25√7/2, хотя «p, q ∈ ℤ⁺»
      подразумевает q без квадратов. Измерено в verify_c1.py (предел 3).
  - what: >
      verify_identity сверяет значения в точках, а не запись.
    why: >
      Тождество проверяется подстановкой нескольких чисел.
    impact: >
      Ответ через sec и cosec и ответ через 1/cos и 1/sin неразличимы;
      в «show that» из архива это ровно то, что требуется, но требование
      к форме записи проверка не поддержала бы. Измерено в verify_c1.py
      (предел 4).

corpus_issues:
  - block: 2022-NOV-COMMON-P1-Q03-B
    what: >
      В описании блока стороны прямоугольного треугольника записаны как
      a, (a²−1)/(2a), (a²+1)/(2a). Такой треугольник не прямоугольный:
      это не пифагорова тройка.
    check: >
      sympy: a² + ((a²−1)/(2a))² − ((a²+1)/(2a))² = a² − 1, то есть ноль
      только при a = 1, а в условии a > 1. С делением на 2 невязка
      тождественно нулевая, и это подтверждает пункт (a) того же
      вопроса в бумаге: «show that a² + ((a²−1)/2)² = ((a²+1)/2)²».
    impact: >
      Площадь при верном прочтении равна a(a²−1)/4, а при записанном
      в корпусе — (a²−1)/4: ответы различаются множителем a. Практикум
      использует форму из бумаги, задание 13 включает и пункт (a).
      Похоже на потерю множителя при извлечении формулы из PDF:
      «2» под дробной чертой прочиталось вместе с идущей следом буквой.
  - block: 2023-NOV-TZ2-P3-Q02-A-II
    what: >
