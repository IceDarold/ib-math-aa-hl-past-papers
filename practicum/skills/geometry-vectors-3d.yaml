skills:
  - id: linear_system
    name: Система линейных уравнений и три её случая
    rung: null
    trigger: >
      Три (реже два) линейных уравнения с тремя неизвестными. Признак,
      отличающий этот приём от обычной подстановки: в системе есть буквенный
      параметр, и спрашивают не решение, а при каком значении параметра
      решение единственно, отсутствует или его бесконечно много.
      Геометрическая формулировка того же самого — «при каких b и d три
      плоскости пересекаются по прямой».
    chain:
      - Выписать расширенную матрицу или подготовиться исключать переменную
      - Привести к ступенчатому виду, исключая по одной переменной
      - Посмотреть на последнюю строку — весь вопрос в ней
      - "Строка 0 = 0: решений бесконечно много, ответ записывается
        параметрически через t"
      - "Строка 0 = c при c ≠ 0: решений нет"
      - "Иначе решение единственно, дорешать обратным ходом"
    traps:
      - "Найдено значение параметра, при котором нет единственного решения,
        и на этом остановились. А спрашивали два разных случая: при одном
        значении параметра решений нет, при другом их бесконечно много"
      - Бесконечное множество решений записано одной точкой вместо
        параметрической формы
      - Обнуление последней строки проверено только по коэффициентам,
        без правой части — а именно она различает «нет решений»
        и «бесконечно много»
    geometry: >
      Три случая — это взаимное расположение трёх плоскостей: единственное
      решение есть точка пересечения, бесконечное множество есть общая прямая,
      отсутствие решений означает, что общей точки у трёх плоскостей нет.
      Поэтому приём и живёт в C6: алгебраический и геометрический вопрос
      здесь буквально один и тот же, заданный на двух языках.
    calculator:
      mode: partial
      note: >
        Разделение резкое, и его стоит запомнить. Систему с числовыми
        коэффициентами GDC решает сразу, и markscheme это прямо разрешает:
        «M1 for attempt to solve using GDC or manual row operations».
        Но вопрос про параметр калькулятор не решает вообще — там надо
        понимать, когда строка обнуляется. Из шести блоков архива пять
        с калькулятором, и все пять на параметр приходится делать руками.
    prereq: []
    raw_tags: [row_reduction, gaussian_elimination, solve_linear_system,
               linear_system, eliminate_variable, elimination, infinite_solutions,
               consistency_condition, linear_dependence, determinant_zero,
               parameter_determination, parametric_form, form_linear_system]
    blocks: [2025-NOV-TZ1-P1-Q06, 2025-NOV-TZ3-P2-Q07-A, 2025-NOV-TZ3-P2-Q07-B,
             2025-NOV-TZ3-P2-Q07-C, 2025-MAY-TZ2-P2-Q09-B,
             2022-NOV-COMMON-P3-Q01-B-III]
    corpus_marks: 18

# Замечания к классификации, отправить в classification/reviews.
corpus_issues:
  - kind: taxonomy_gap
    proposal: number_algebra.systems_of_equations
    issue: >
      В classification/taxonomy/topics.yaml нет подтемы под системы линейных
      уравнений, хотя в программе они есть отдельным пунктом (AHL 1.16:
      до трёх уравнений с тремя неизвестными, случаи единственного решения,
      бесконечного множества и его отсутствия). Классификатору некуда было
      их положить, и шесть блоков разъехались по четырём чужим темам.
      Это причина, а не следствие: пока подтемы нет, новые сессии будут
      расползаться так же.
  - block: 2025-NOV-TZ1-P1-Q06
    marks: 6
    assigned: number_algebra.inequalities
    should_be: number_algebra.systems_of_equations
    issue: >
      «Find α and β for which the linear system has infinitely many solutions»,
      method_path — расширенная матрица, приведение к ступенчатому виду,
      обнуление третьей строки. Неравенств в блоке нет вовсе. Самая грубая
      из ошибок: блок уезжает в практикум A8, где метод не разбирается.
  - blocks: [2025-NOV-TZ3-P2-Q07-A, 2025-NOV-TZ3-P2-Q07-B, 2025-NOV-TZ3-P2-Q07-C]
    marks: 6
    assigned: geometry.vectors
    should_be: number_algebra.systems_of_equations
    issue: >
      Чистая система уравнений: параметрическое общее решение, единственное
      решение при данных a и k, значения параметров для вырожденного случая.
      Ни векторов, ни плоскостей в условии нет. Сейчас уезжают в C5.
  - block: 2025-MAY-TZ2-P2-Q09-B
    marks: 4
    assigned: geometry.vectors
    should_be: geometry.vectors_3d
    issue: >
      Тема угадана верно по смыслу — три плоскости и условие пересечения
      по прямой, — но подтема должна быть vectors_3d, а не vectors:
      по карте практикумов vectors уходит в C5, а плоскости разбираются в C6.
  - kind: watch
    issue: >
      Пять блоков из шести — из сессий 2025 года. В двенадцати полных сессиях
      2021–2024 (все три бумаги в каждой) таких вопросов нет ни одного.
      Либо совпадение, либо экзамен начал их спрашивать. Сейчас на тему
      18 баллов, до нижней границы практикума не хватает. Если следующие
      сессии добавят ещё, тему надо выносить в секцию A отдельным
      практикумом, а не держать приёмом в C6.
