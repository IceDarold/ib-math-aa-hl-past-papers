title: Прямые и плоскости в пространстве
source_topic: geometry.vectors_3d
status: stub
stub_note: >
  Карточка заведена раньше самого практикума, чтобы не потерять разбор
  систем линейных уравнений. Здесь пока один приём; остальные появятся,
