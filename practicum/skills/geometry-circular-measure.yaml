version: 0.2
practicum: C2
title: "Радианная мера, сектор, объёмные тела"
source_topic: geometry.circular_measure
also_covers: [geometry.solid_geometry]

corpus:
  blocks: 40
  marks: 127
  effective_blocks: 34
  effective_marks: 105
  sessions: May 2021 — November 2025
  papers: {1: 24, 2: 74, 3: 7}
  gdc_marks: 81
  note: >
    Две темы корпуса взяты целиком: geometry.circular_measure (32 блока,
    99 баллов) и geometry.solid_geometry (8 блоков, 28 баллов). Порознь
    вторая не практикум — 28 баллов при нижней границе 60, — а вместе они
    одна тема и есть: круг задаёт конус, сектор сворачивается в его
    боковую поверхность, и в архиве обе живут в одних и тех же вопросах.

    127 баллов по корпусу, но рабочих 105. Вычтено шесть блоков:
    ноябрьский дубль 2023 года (7 баллов), три блока не по теме
    (комплексные числа, интеграл поверхности эллипсоида, конус, который
    строят векторами, — 14 баллов) и однобалльное «истолкуйте предел
    геометрически» из исследования про ряд Маклорена. Все шесть
    перечислены в corpus_issues.

    74 балла из 105 стоят в Paper 2, и это самая «вторая бумага» тема
    архива после синусоидальных моделей. Причина простая: сектор
    измеряют, а измерение кончается числом в три значащие цифры.

    Формально 77% баллов идут с калькулятором. Настоящая доля куда
    меньше: считать нечего до тех пор, пока не решено, из чего сложена
    фигура, а после этого остаётся арифметика. Уравнение, которое
    без калькулятора не решается вовсе, встречается на всю тему дважды
    (θ − sin θ = c у мая 2022 TZ1 и мая 2025 TZ2) и стоит 9 баллов.

principle: >
  Радианная мера — не другая шкала для угла, а определение угла через
  длину: θ это во сколько раз дуга длиннее радиуса. Отсюда всё остальное.
  s = rθ не формула, которую запоминают, а сама эта фраза, переписанная
  умножением; A = ½r²θ получается из неё за одну строчку. Именно поэтому
  градусы в эти формулы подставлять нельзя: в них подставляют не угол,
  а отношение длин, и у градуса такого отношения нет.

  Всё остальное в теме — это разложение фигуры на части, у которых мера
  уже известна. Сегмент это сектор без треугольника. Логотип это
  прямоугольник без двух сегментов. Жёлоб это сегмент и прямоугольник.
  Кольцо это сектор без сектора. Работа делается до вычислений и на
  чертеже, а не в калькуляторе, и лестница идёт по тому, из чего фигуру
  складывают.

  Проверка устроена по тому же принципу. Ей передают не ответ и не метод,
  а границу фигуры: где проходят дуги и где отрезки. Площадь она берёт
  формулой Грина по этому контуру, длину — суммой кусков, объём тела
  вращения — теоремой Паппа. Формул темы у неё нет ни одной, и потому
  3549π/16, 696.844 и 697 проходят одинаково.

directions:
  measure: >
    Фигура дана, спрашивают её меру. Приёмы 1–6: длина дуги, периметр,
    площадь сектора, хорда, сегмент, составная область.
  unknown: >
    Мера дана, спрашивают фигуру. Приём 8 — две связи между r и θ дают
    одно уравнение, и у него бывает лишний корень.
  leave: >
    Круг перестаёт быть плоским: сектор сворачивают в конус, фигуру
    вращают. Приём 9.

skills:
  - id: radian_arc
    name: Радианная мера и длина дуги
    rung: 1
    trigger: >
      В условии стоит угол в радианах или длина дуги; спрашивают одно
      из трёх — s, r, θ, — а два других даны. Признак радиан — само
      число: угол 2.08 или 5.2 градусами быть не может, а «210°»
      просит перевода.
    chain:
      - Выписать, что из трёх дано, и что ищут
      - Градусы, если они есть, перевести умножением на π/180
      - Подставить в s = rθ и решить относительно неизвестного
      - Проверить, что найденный угол лежит там, где велит условие
    traps:
      - >
        Градусы подставлены в s = rθ. Ошибка не видна в ответе: длина
        выходит числом того же порядка, просто в 57 раз больше
      - >
        Дуга спутана с хордой: по прямой между концами короче, чем
        по окружности, и в задаче про пятиугольник это разные числа
      - >
        Взята меньшая дуга там, где спрашивают большую. Большая
        считается как r(2π − θ), а не как r·θ
    calculator:
      mode: speeds_up
      note: >
        Формула одна и та же на любой бумаге. В Paper 1 ответ выходит
        точным (5/2, 30/π), в Paper 2 — тремя значащими цифрами,
        и вся разница в том, нажимают ли кнопку в последней строчке.
    prereq: []
    raw_tags: [arc_length, arc_length_formula, radian_measure,
               convert_degrees_to_radians, angle_conversion,
               circumference_fraction, solve_for_variable,
               solve_linear_equation, central_angle_of_regular_polygon,
               major_arc_calculation, algebraic_rearrangement]
    blocks: [2023-MAY-TZ2-P1-Q01-B, 2023-MAY-TZ1-P2-Q10-A,
             2025-NOV-TZ1-P2-Q01-A, 2025-MAY-TZ2-P3-Q02-B-II,
             2025-MAY-TZ2-P3-Q02-D, 2025-MAY-TZ3-P2-Q04]

  - id: angular_rate
    name: Угол, растущий во времени
    rung: 2
    trigger: >
      Что-то вращается: «one revolution every 16 seconds», «rotates at
      a constant rate». Спрашивают время, за которое пройден угол, или
      угол, пройденный к моменту t.
    chain:
      - Полный оборот это 2π, и за период T он проходится целиком
      - Скорость вращения ω = 2π/T радиан в секунду
      - Угол к моменту t это α = ωt
      - "Обратно: время на угол α это α/ω"
    traps:
      - >
        Взят угол, а не время: в ответе радианы там, где просят секунды
      - >
        Половинный угол не удвоен. Дуга AB видна из центра под углом 2θ,
        где θ найден из прямоугольного треугольника
      - >
        Оборот посчитан как 360 при том, что дальше всё в радианах
    calculator:
      mode: speeds_up
      note: >
        Оба вопроса приёма из Paper 2, но считается в них деление.
        Вся работа — понять, что 2π делится на период, а не на что-то ещё.
    prereq: [radian_arc]
    raw_tags: [angular_velocity, proportional_reasoning, linear_expression,
               linear_function_evaluation]
    blocks: [2024-MAY-TZ2-P2-Q11-B, 2024-MAY-TZ2-P2-Q11-C,
             2024-MAY-TZ2-P2-Q11-D]

  - id: sector_perimeter
    name: Периметр сектора
    rung: 3
    trigger: >
      Слово perimeter при фигуре, у которой есть дуга. Или обратно:
      периметр дан числом, и из него ищут r или θ.
    chain:
      - Обойти границу пальцем и назвать каждый кусок
      - Дуга даёт rθ, каждый прямой кусок — свою длину
      - Сложить всё, что обошли, и ничего больше
      - Если периметр дан, полученное равенство и есть уравнение
    traps:
      - >
        Посчитана одна дуга. Сектор ограничен дугой и двумя радиусами,
        и P = rθ + 2r — это два разных слагаемых, а не одно
      - >
        У кольцевой фигуры забыты прямые перемычки между окружностями:
        в букве «C» их две, и весят они 2(10 − r)
      - >
        Периметр спутан с длиной окружности: 2πr это вся окружность,
        а сектору достаётся её часть
    calculator:
      mode: speeds_up
      note: >
        Складывать здесь нечего сложного, и оба вопроса Paper 1 решаются
        в уме. Калькулятор появляется только там, где периметр дан
        и получившееся уравнение оказывается квадратным.
    prereq: [radian_arc]
    raw_tags: [perimeter_of_sector, sector_perimeter, perimeter_calculation,
               perimeter_sum, addition, circumference_of_circle]
    blocks: [2023-MAY-TZ2-P1-Q01-A, 2024-MAY-TZ1-P1-Q03-A,
             2025-NOV-TZ3-P2-Q03-A, 2023-NOV-TZ1-P2-Q03-B]

  - id: sector_area
    name: Площадь сектора
    rung: 4
    trigger: >
      Спрашивают площадь части круга, ограниченной двумя радиусами.
      Слово shaded и чертёж, на котором закрашен «кусок пирога».
    chain:
      - Убедиться, что угол в радианах
      - "Решить, о каком секторе речь: о том, что при угле θ, или о большем"
      - Для большего взять 2π − θ
      - Подставить в A = ½r²θ
    traps:
      - >
        Закрашен больший сектор, а подставлен угол меньшего. Разница
        видна на чертеже и не видна в формуле
      - >
        Угол в градусах. Площадь выходит примерно в 57 раз больше,
        и схема оценивания за это снимает всё после первого балла
      - >
        Взята ½r²sin θ — это площадь треугольника, а не сектора
    calculator:
      mode: speeds_up
      note: >
        Половина, квадрат и умножение. В Paper 2 ответ округляют до трёх
        значащих цифр, в Paper 1 оставляют точным — 3549π/16, а не 697.
    prereq: [radian_arc]
    raw_tags: [sector_area, area_of_sector, sector_area_formula,
               area_of_sector_radians, area_of_sector_degrees, reflex_angle,
               area_of_circle, substitution, substitute_values]
    blocks: [2023-MAY-TZ2-P1-Q01-C, 2022-MAY-TZ2-P2-Q01-B,
             2025-MAY-TZ1-P2-Q01-A, 2025-NOV-TZ3-P2-Q03-B,
             2023-NOV-TZ1-P2-Q03-A]

  - id: chord_half_angle
    name: Хорда и половинный угол
    rung: 5
    trigger: >
      В фигуре есть хорда: ширина жёлоба, отрезок пути внутри круга,
      сторона вписанного многоугольника. Или дано расстояние от центра
      до хорды.
    chain:
      - Опустить из центра перпендикуляр на хорду
      - Он делит и хорду, и угол пополам
      - "Из прямоугольного треугольника: половина хорды это r sin(θ/2), расстояние до неё r cos(θ/2)"
      - "Обратно, по расстоянию d: половина угла это arccos(d/r)"
    traps:
      - >
        Ответом дана половина хорды. AB = 2·AM, и удвоение — отдельный
        балл схемы
      - >
        Найден половинный угол, а в следующую формулу подставлен как
        целый: сектор и сегмент считаются по θ, а не по θ/2
      - >
        Теорема косинусов применена к углу в градусах при том, что
        остальная задача идёт в радианах
    calculator:
      mode: speeds_up
      note: >
        Тот же прямоугольный треугольник, что в C1, и та же обратная
        функция. Все четыре блока из Paper 2, и все кончаются числом
        в три значащие цифры.
    prereq: [radian_arc]
    raw_tags: [chord_length, cosine_rule, sine_rule,
               right_angled_trigonometry, right_triangle_trigonometry,
               inverse_trigonometric_function, pythagorean_theorem,
               circle_geometry, midpoint, distance_calculation]
    blocks: [2022-MAY-TZ2-P2-Q01-A, 2024-MAY-TZ2-P2-Q11-A,
             2023-MAY-TZ1-P2-Q10-B]

  - id: segment_area
    name: Площадь сегмента
    rung: 6
    trigger: >
      Закрашена часть круга между хордой и дугой. Слово segment, или
      чертёж, на котором прямая сторона одна, а не две.
    chain:
      - Достроить два радиуса к концам хорды
      - Сектор это ½r²θ, треугольник на тех же радиусах — ½r²sin θ
      - "Сегмент это их разность: ½r²(θ − sin θ)"
      - "Проверить знаком: сегмент меньше сектора, и всегда положителен"
    traps:
      - >
        Вычтен не тот треугольник: площадь считают по двум радиусам
        и углу между ними, а не по хорде и высоте
      - >
        Ответом дан сектор. Схема оценивания различает три числа —
        сектор, треугольник и их разность, — и балл стоит за разность
      - >
        sin θ посчитан в градусном режиме, а θ подставлен в радианах.
        В одной формуле два режима сразу — самая тихая ошибка темы
    calculator:
      mode: speeds_up
      note: >
        Считается разность двух известных чисел. Но режим калькулятора
        здесь значит больше, чем где-либо в теме: в формуле стоят
        и θ, и sin θ, и градусный режим портит только второе слагаемое.
    prereq: [sector_area, chord_half_angle]
    raw_tags: [area_of_segment, subtract_segment_areas, area_of_triangle,
               triangle_area, area_of_triangle_sine_formula, equate_areas,
               subtraction, trigonometric_identity]
    blocks: [2021-NOV-COMMON-P2-Q04-A, 2022-MAY-TZ1-P2-Q02-A,
             2025-NOV-TZ1-P2-Q01-B, 2025-MAY-TZ2-P2-Q06]

  - id: composite_region
    name: Составная область
    rung: 7
    trigger: >
      Закрашена фигура, которой нет отдельного имени: логотип, жёлоб,
      буква «C», область между многоугольником и окружностью. Признак —
      на чертеже больше одной прямой стороны.
    chain:
      - Разрезать фигуру на части, у которых мера известна
      - Выписать каждую часть отдельной строкой со своим знаком
      - Сложить и вычесть
      - "Проверить порядок величины по чертежу: доля круга видна на глаз"
    traps:
      - >
        Из прямоугольника вычтен один сегмент вместо двух, или наоборот:
        в логотипе их два, в жёлобе один
      - >
        Одинаковых частей несколько, а посчитана одна. У пятиугольника
        сегментов пять, и множитель 5 — отдельный балл
      - >
        Кольцевая фигура посчитана как разность окружностей вместо
        разности секторов: угол одинаков у обеих, и его нельзя терять
    calculator:
      mode: speeds_up
      note: >
        «There are many different ways to dissect the cross-section»,
        пишет схема оценивания майского жёлоба 2023 года, и все они
        дают одно число. Выбор разреза — работа на чертеже, и она вся
        до калькулятора.
    prereq: [segment_area, sector_area]
    raw_tags: [area_decomposition, area_of_rectangle, rectangle_area,
               trapezium_area, algebraic_simplification, multiplication]
    blocks: [2022-MAY-TZ1-P2-Q02-B, 2023-NOV-TZ1-P2-Q03-A,
             2023-MAY-TZ1-P2-Q10-B, 2025-NOV-TZ1-P2-Q01-B]

  - id: unknown_from_conditions
    name: Две связи вместо двух чисел
    rung: 8
    trigger: >
      В условии не дано ни r, ни θ, зато даны две величины, которые от
      них зависят: периметр и площадь, площадь и отношение, периметр
      и длина окружности. Или «show that» с уравнением в ответе.
    chain:
      - Выписать обе связи формулами приёмов 1–7
      - Исключить одну букву подстановкой
      - Решить получившееся уравнение
      - Отбросить корень, который условие запрещает
    traps:
      - >
        Второй корень оставлен в ответе. Схема оценивания снимает
        последний A1 за любое лишнее значение, даже если верное
        стоит рядом
      - >
        Условие отбора взято из алгебры вместо задачи: r < 10 сказано
        в билете, а не следует из уравнения
      - >
        Уравнение получилось трансцендентным (θ − sin θ = c), и его
        пытаются решить алгебраически. Такое решают графиком
    calculator:
      mode: partial
      note: >
        Здесь единственное место темы, где калькулятор делает работу,
        а не арифметику: θ − sin θ = c руками не решается никак. Но это
        9 баллов из 105, и уравнение сначала надо получить — вывод
        квадратного уравнения у мая 2024 стоит 4 балла из 8 и идёт
        в Paper 1.
    prereq: [sector_perimeter, sector_area, segment_area]
    raw_tags: [equation_setup, form_equation, derive_quadratic,
               solve_quadratic, quadratic_equation, equation_solving,
               solving_equation, solving, gdc_solve, gdc_numerical_solve,
               numerical_solution, solve_for_radius, substitute_back,
               compute_theta, ratio_application, algebraic_manipulation,
               simplify_equation, significant_figures, round, rounding]
    blocks: [2024-MAY-TZ1-P1-Q03-A, 2024-MAY-TZ1-P1-Q03-B,
             2025-NOV-TZ3-P2-Q03-A, 2025-NOV-TZ3-P2-Q03-B,
             2025-MAY-TZ2-P2-Q06, 2023-NOV-TZ1-P2-Q03-B,
             2022-MAY-TZ1-P2-Q02-B]

  - id: cone_from_circle
    name: Круг выходит из плоскости
    rung: 9
    trigger: >
      Конус: сектор сворачивают в боковую поверхность, или даны две
      величины из трёх (радиус, высота, образующая), или спрашивают
      объём и площадь поверхности.
    chain:
      - "Дуга сектора становится окружностью основания: rθ = 2πR"
      - "Радиус, высота и образующая связаны Пифагором: l² = R² + h²"
      - Объём это ⅓πR²h
      - Полная поверхность это πR² + πRl, боковая — πRl
    traps:
      - >
        В полной поверхности забыто основание: πrl это только боковая
        часть, а total surface area включает круг
      - >
        Радиус сектора взят за радиус конуса. Радиус сектора становится
        образующей, а радиус основания получается из длины дуги
      - >
        Множитель ⅓ потерян: πR²h — это цилиндр той же высоты
    calculator:
      mode: mixed
      note: >
        Половина блоков приёма из Paper 1, и там ответ точный:
        8√3π/3, 6√5π. Вторая половина из Paper 2, и там 851 м³.
        Формулы одни и те же, а форма ответа разная.
    prereq: [radian_arc, sector_area]
    raw_tags: [cone_volume, cone_volume_formula, volume_of_cone,
               surface_area_of_cone, perpendicular_height, simplify_surd,
               equate_arc_length_to_circumference, factorisation,
               distance_formula_3d]
    blocks: [2025-MAY-TZ1-P2-Q01-B, 2021-MAY-TZ2-P1-Q10-C,
             2021-MAY-TZ2-P1-Q10-D, 2024-MAY-TZ1-P2-Q02-B,
             2022-NOV-COMMON-P1-Q02-B, 2022-NOV-COMMON-P3-Q02-B-I,
             2022-NOV-COMMON-P3-Q02-B-II]

corpus_issues:
  - id: 'ноябрьский дубль 2023 года'
    what: >
      2023-NOV-TZ1-P2-Q03 и 2023-NOV-TZ2-P2-Q03 — одна и та же бумага
