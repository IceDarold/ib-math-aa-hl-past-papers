version: 0.1
practicum: B1
title: "Уравнения: квадратные, дробные, с параметром"
source_topic: functions.equations (0.771 темы)
corpus:
  blocks: 73
  marks: 222
  sessions: May 2021 — November 2025
  papers: {1: 100, 2: 48, 3: 74}
  gdc_marks: 122
  note: >
    Тема functions.equations (100 блоков, 288 баллов) разделена между B1
    и B2. Сюда ушло всё, что про сами уравнения, в B2 — 27 блоков
    (66 баллов) про композицию, вычисление значений и чётность.

    Доля в карте пересчитана: было 0.55 наугад, стало 0.771 по разбору
    всех ста блоков. Композиция в теме уравнений весит меньше, чем
    казалось: её основные баллы лежат в functions.inverse_functions
    и functions.graphing.

    Шесть из 222 баллов — один и тот же вопрос: ноябрьская Paper 3
    2023 года лежит в корпусе двумя копиями, TZ1 и TZ2, хотя бумага
    одна (Common). Подробности в corpus_issues.

    Формально 55% баллов с калькулятором, но настоящей работы для GDC
    здесь на 15 баллов: два численных решения в моделях и одно чтение
    точки пересечения. Остальное в «калькуляторных» бумагах — Paper 3,
    где считают не числа, а условия на параметр.

principle: >
  Уравнение чаще всего не дано, а построено. Половина баллов темы стоит
  до того, как начинается решение: «show that the x-coordinates satisfy
  x² − 2dx + 9d = 0» — это четыре балла, и ни один из них не за корни.

  Вторая половина мысли про сами корни. Решение — цепочка шагов, и не
  каждый шаг равносилен. Возведение в квадрат, умножение на знаменатель
  и «снятие логарифмов» корни добавляют; деление на выражение
  с переменной — теряет; область из условия (x > 4, s > 0, q ≠ 0)
  выбрасывает лишние в самом конце, и за это стоит отдельный балл.

  Отсюда лестница. Приёмы 1–2 работают с уже записанным уравнением.
  Приёмы 3–6 его строят: из условия задачи, из пересечения графиков,
  из замены. Приёмы 7–9 переворачивают вопрос: уравнение дано с буквой,
  а спрашивают, при каких её значениях корней столько-то, — и ответом
  снова оказывается множество, то есть работа из A8.

  Главное умение темы: до начала счёта понять, просят ли решить.
  «Show that», «hence show» и «find the value of k such that» — три
  разных вопроса, и корни нужны только в первом.

skills:
  - id: zero_of_function
    name: Нуль функции и пересечения с осями
    rung: 1
    trigger: >
      «Find the zero of f», «write down the coordinates where the graph
      crosses the axes», «find the x-intercepts».
    chain:
      - Ось y — это подстановка x = 0
      - Ось x — это уравнение f(x) = 0
      - Для дроби приравнять нулю числитель
      - Проверить, что знаменатель в этой точке не ноль
      - "Ответить в той форме, о которой спрашивают: число или координаты"
    traps:
      - >
        Спрашивают coordinates, а записывают одно число. Пара и число —
        разные ответы, и балл ставят за пару
      - >
        Ноль числителя совпал с нулём знаменателя: у (x−2)/(x²−4)
        нулей нет вовсе, хотя числитель обращается в ноль
      - >
        Перепутаны оси: f(0) вместо решения f(x) = 0
    calculator:
      mode: checks
      note: >
        В Paper 2 корень читают с графика, но записывают с тремя
        значащими цифрами; в Paper 1 всё решается устно. Калькулятор
        здесь полезен как проверка, что корень один, а не два.
    prereq: []
    raw_tags: [x_intercept, y_intercept, set_numerator_to_zero,
               solve_linear_equation, find_x_intercepts, find_y_intercept,
               numerator_zero, gdc_find_root, evaluate_function]
    blocks: [2023-MAY-TZ1-P1-Q01-A, 2023-MAY-TZ2-P1-Q02-B,
             2021-NOV-COMMON-P2-Q10-A, 2023-NOV-TZ2-P2-Q11-B]

  - id: quadratic_toolkit
    name: "Квадратный трёхчлен: четыре записи одного"
    rung: 2
    trigger: >
      «Write in the form a(x−h)²+k», «vertex», «axis of symmetry»,
      «find b and c given the roots».
    chain:
      - Понять, какая из четырёх записей отвечает на вопрос
      - Вершина — выделить квадрат или взять −b/(2a)
      - Ось симметрии — она же полусумма корней
      - Корни — разложение на множители или формула
      - Сколько корней — дискриминант
    traps:
      - >
        «Write in the form» — требование к записи. Раскрытая скобка
        численно равна ответу, но балла не получает
      - >
        Внутри квадрата оставлен коэффициент: (2x−3)² вместо a(x−h)²
      - >
        Забыто, что ось симметрии это полусумма корней, — и второй
        корень ищут заново вместо одной строки
    calculator:
      mode: 'no'
      note: >
        Все блоки приёма из Paper 1. Вершина и корни находятся быстрее
        руками, чем вводятся в GDC.
    prereq: [zero_of_function]
    raw_tags: [completing_the_square, vertex_form, axis_of_symmetry,
               average_of_roots, form_quadratic_from_roots,
               compare_coefficients, vertex_x_coordinate, quadratic_formula,
               solve_quadratic, quadratic_factorisation, perfect_square]
    blocks: [2025-MAY-TZ1-P1-Q10-A, 2025-NOV-TZ1-P1-Q04-A,
             2025-NOV-TZ1-P1-Q04-B, 2024-MAY-TZ1-P1-Q10-C,
             2024-MAY-TZ1-P1-Q10-D, 2021-NOV-COMMON-P1-Q07-B,
             2025-NOV-TZ1-P1-Q03-A, 2024-MAY-TZ2-P3-Q02-B]

  - id: equation_from_situation
    name: Построить уравнение по условию
    rung: 3
    trigger: >
      «Show that …», «hence show that a = 8/(b−4)+4», «show that the
      x-coordinates satisfy …». Уравнения в условии нет, есть ситуация.
    chain:
      - Записать обе величины по отдельности
      - Приравнять
      - Привести к виду, напечатанному в условии
      - Написать требуемое и остановиться
    traps:
      - >
        Ответ дан, поэтому проверяют дорогу. Написать сразу напечатанное
        и поставить точку — ноль баллов
      - >
        Проверка подстановкой вместо вывода: markscheme прямо ограничивает
        такое решение половиной баллов
      - >
        Приведение к нужному виду само бывает неравносильным: домножение
        на (b−4) разрешает случай b = 4, которого в записи не было
    calculator:
      mode: 'no'
      note: >
        Приём целиком алгебраический. В Paper 3 он стоит в бумаге
        с калькулятором, но считать там нечего — вся работа в записи.
    prereq: [quadratic_toolkit]
    raw_tags: [equate_expressions, area_square, perimeter_square,
               area_right_triangle, perimeter_right_triangle,
               rearrange_equation, forming_quadratic, substitute_coordinates,
               solve_simultaneous_equations, rearranging_equation]
    blocks: [2021-MAY-TZ1-P3-Q02-A, 2021-MAY-TZ1-P3-Q02-F,
             2025-MAY-TZ3-P1-Q04-A, 2025-NOV-TZ1-P3-Q01-E-I,
             2023-NOV-TZ1-P1-Q10-B-I]

  - id: extraneous_roots
    name: Лишние и потерянные корни
    rung: 4
    trigger: >
      В уравнении есть дробь, корень или логарифм; в условии стоит
      область (x > 4, s > 0, q ≠ 0) или требование целых решений.
    chain:
      - Решить, не деля на выражение с переменной
      - Подставить каждый корень в исходное уравнение
      - Отбросить те, что не проходят по области
      - Сказать словами, почему корень отброшен
    traps:
      - >
        «s² = 4s, делим на s, s = 4» — ответ верный, корень потерян.
        В markscheme за пару s = 4 и s = 0 в ответе стоит A1M1A0
      - >
        Возведение в квадрат добавляет корень, и его записывают в ответ
      - >
        Область условия забыта: −√17 законен как корень x² = 17,
        но не годится при x > 4
      - >
        Отброшенный корень бывает законен сам по себе: при q = 0 вершина
        действительно лежит на прямой, его исключает фраза условия,
        а не алгебра
    calculator:
      mode: 'no'
      note: >
        Калькулятор здесь скорее мешает: solver выдаёт корни готовыми
        и не показывает, какой из них появился по дороге.
    prereq: [equation_from_situation]
    raw_tags: [domain_restriction, apply_domain_condition, discard_zero,
               select_domain_solution, positive_root, square_root,
               plus_minus, isolate_radical, square_both_sides,
               integer_solutions, divisibility_check, factorise]
    blocks: [2021-MAY-TZ1-P3-Q02-G-I, 2021-MAY-TZ2-P1-Q04-A,
             2023-MAY-TZ2-P1-Q10-A, 2025-MAY-TZ2-P2-Q12-B]

  - id: exp_log_equation
    name: Замена и законы логарифмов
    rung: 5
    trigger: >
      В уравнении рядом стоят a^{2x} и a^x; или несколько логарифмов,
      возможно с разными базами.
    chain:
      - "Показательное: замена A = a^x, дальше квадратное"
      - Отбросить неположительные корни по A до возвращения к x
      - "Логарифмическое: привести к одной базе, собрать в один логарифм"
      - Приравнять аргументы и проверить, что они были положительны
    traps:
      - >
        Решили квадратное по A и остановились: A = 1/3 не ответ,
        спрашивали x
      - >
        Забыто A > 0, и отрицательный корень возвращается в ответ
      - >
        Смена базы не замечена: 1/(2 log₂ 3) выглядит лишним слагаемым,
        а это log₃ √2 и вход в решение
      - >
        «Снятие логарифмов» неравносильно: аргументы обязаны быть
        положительными, и корни надо подставить обратно
    calculator:
      mode: 'no'
      note: >
        Оба блока приёма из Paper 1. Ответы точные: x = −1, x = 1/2,
        и GDC тут ничего не даёт.
    prereq: [extraneous_roots]
    raw_tags: [substitution, quadratic_recognition, solving_quadratic,
               solve_exponential_equation, solve_logarithmic_equation,
               change_of_base, power_rule_of_logs, product_rule_of_logs,
               equate_log_arguments, solve_power_equation, exponentiate,
               log_power_rule, log_quotient_rule, eliminate_logarithms]
    blocks: [2024-MAY-TZ2-P1-Q02, 2021-NOV-COMMON-P1-Q03,
             2023-MAY-TZ1-P1-Q04, 2023-NOV-TZ2-P1-Q10-B]

  - id: curve_meets_line
    name: Пересечение графиков
    rung: 6
    trigger: >
      «The line and the curve meet», «the graphs intersect», «find the
      points of intersection», «solve f(x) = g(x)».
    chain:
      - Приравнять правые части
      - Привести к стандартному виду, перенося слагаемые
      - Решить полученное уравнение
      - Если спрашивают точки — вернуть y и записать координаты
    traps:
      - >
        Остановиться на x, когда просят точки пересечения
      - >
        «Пересекаются на оси x» это не f = g, а f = 0 и g = 0
      - >
        Домножение на знаменатель добавляет корень: у f = mx+1
        с f = (2x+6)/(3x+6) после домножения появляется x = −2
      - >
        Деление на (a+b) вместо разложения на множители: законно только
        потому, что a и b положительны
    calculator:
      mode: helps
      note: >
        В Paper 3 пересечение находят алгебраически (ответ буквенный),
        в Paper 2 — по графику. Различает бумага, а не задача.
    prereq: [equation_from_situation]
    raw_tags: [equate_functions, equate_expressions, find_intersection,
               intersection_point, solve_simultaneous_equations,
               simultaneous_equations, polynomial_equation, set_equal,
               find_intersection_points, factorisation]
    blocks: [2025-MAY-TZ3-P1-Q04-A, 2023-NOV-TZ2-P3-Q02-C,
             2022-MAY-TZ2-P3-Q01-G, 2024-MAY-TZ1-P3-Q02-H,
             2022-MAY-TZ2-P3-Q01-F-II]

  - id: gdc_solve
    name: Численное решение в модели
    rung: 7
    trigger: >
      Paper 2, некрасивые числа, «3 significant figures», «find the first
      time when», разность двух моделей.
    chain:
      - Записать уравнение целиком
      - Построить обе части или ввести solver
      - Выбрать корень по условию (первый, в промежутке, положительный)
      - Продолжать счёт неокруглённым значением
    traps:
      - >
        Взят не тот корень: «first» и «0 ≤ t ≤ 6» — часть задания
      - >
        Округлили в середине: подстановка 3.35 вместо 3.34881 меняет
        следующий ответ, и теряется A1 в следующем пункте
      - >
        Смена знака бывает полюсом, а не корнем: у модели с синусом
        в знаменателе разрыв выглядит как решение
      - >
        Голый ответ без выписанного уравнения и эскиза — ноль за метод
    calculator:
      mode: required
      note: >
        Единственный приём темы, где калькулятор действительно нужен:
        15 баллов из 222. Всё остальное «калькуляторное» решается руками.
    prereq: [curve_meets_line]
    raw_tags: [gdc_solve, gdc_numerical_solve, gdc_intersection, gdc_solver,
               numerical_solve, numerical_solution, root_finding,
               solve_using_gdc, round_value, equation_solving]
    blocks: [2021-MAY-TZ1-P2-Q10-A, 2024-MAY-TZ2-P2-Q11-G,
             2022-MAY-TZ1-P2-Q04-A, 2024-MAY-TZ2-P2-Q01-A,
             2025-NOV-TZ1-P2-Q10-B, 2024-MAY-TZ1-P3-Q02-D]

  - id: discriminant_condition
    name: Дискриминант как условие на букву
    rung: 8
    trigger: >
      «Tangent to the curve», «exactly one solution», «two distinct real
      roots», «at least one real solution», «find the range of f».
    chain:
      - Привести к квадратному уравнению
      - Записать Δ и перевести слова условия в знак
      - Решить полученное неравенство по букве
      - Добавить ограничения, о которых Δ не знает (замена, область)
    traps:
      - >
        Уравнение перестало быть квадратным: случай нулевого старшего
        коэффициента разбирается отдельно
      - >
        Замена сузила область: у A = e^x годятся только A > 0,
        и само ln k требует k > 0
      - >
        «Ровно одно решение» не равно Δ = 0, если уравнение с дробью
        или с заменой: считать надо решения исходной задачи
      - >
        Найдено одно значение из двух: за m = −1 ± 2√2 стоит A1A1
    calculator:
      mode: checks
      note: >
        Границы можно прочитать с графика, но записывают их точно, через
        радикалы. Калькулятор годится как проверка знака неравенства.
    prereq: [exp_log_equation, curve_meets_line]
    raw_tags: [discriminant, discriminant_condition, discriminant_zero,
               set_discriminant_zero, quadratic_inequality, range,
               parameter_range, solve_for_parameter, inequality_solving,
               root_classification]
    blocks: [2025-MAY-TZ3-P1-Q04-B, 2023-MAY-TZ1-P1-Q04,
             2024-MAY-TZ2-P1-Q05-B-II, 2023-NOV-TZ1-P2-Q11-E,
             2024-MAY-TZ2-P1-Q05-B-III]

  - id: solution_count
    name: Сколько решений
    rung: 9
    trigger: >
      «How many solutions», «exactly two x-axis intercepts», «four
      solutions», «state the conditions on n and k».
    chain:
      - Найти стационарные точки и значения функции в них
      - Эти значения — границы; между ними число решений постоянно
      - На границе решения сливаются, поэтому знаки строгие
      - Записать ответ множеством значений параметра
    traps:
      - >
        Границы включены в ответ: при b = −4 пересечений два, а не три,
        и A1 стоит именно за строгий знак
      - >
        Забыта чётность: «ровно четыре решения» у x^n(a−x)^n = k требует
        чётного n, и это отдельный M1
      - >
        Считают корни вместо картинки: вопрос про число решений почти
        всегда решается эскизом, а не формулами
    calculator:
      mode: helps
      note: >
        Paper 3 прямо предлагает «by systematically varying the value
        of b»: семейство смотрят в GDC. Границы всё равно записывают
        точно, из стационарных точек.
    prereq: [discriminant_condition]
    raw_tags: [graphical_solution_counting, critical_value_identification,
               vary_parameter, identify_critical_values, state_inequality_set,
               state_set_of_values, stationary_point_on_axis,
               deduce_intercept_count, parity_argument, find_range,
               inequality_conditions, squared_equation, range_analysis]
    blocks: [2023-NOV-TZ2-P3-Q01-A, 2023-NOV-TZ2-P3-Q01-B-I,
             2023-NOV-TZ2-P3-Q01-C-I, 2023-NOV-TZ2-P3-Q01-H,
             2021-MAY-TZ2-P3-Q01-H, 2023-MAY-TZ1-P1-Q08-B]

leftovers:
  - what: Пересечение прямой с кривой как часть исследования Paper 3
    marks: 14
    blocks: [2022-MAY-TZ2-P3-Q01-F-II, 2022-MAY-TZ2-P3-Q01-G,
             2024-MAY-TZ1-P3-Q02-H]
    why: >
      Приём тот же (curve_meets_line), но обёртка требует всего вопроса
      целиком: касательная к кубической кривой, рациональные точки,
      деление многочленов. Разобрано в теории 6, отдельным заданием
      не стало — без предыдущих пунктов исследования оно не читается.
  - what: Формулы Виета внутри чужого вопроса
    marks: 2
    blocks: [2023-MAY-TZ2-P3-Q02-D-I, 2023-MAY-TZ2-P3-Q02-D-II]
    why: >
      Два блока по одному баллу: «write down the sum of roots»,
      «write down the product». Приём целиком разобран в A4, здесь
      он появляется как известный факт.
  - what: Вспомогательные записи в исследованиях
    marks: 5
    blocks: [2023-NOV-TZ1-P3-Q02-A-I, 2025-MAY-TZ3-P3-Q02-A-I,
             2025-MAY-TZ3-P3-Q02-A-II, 2025-MAY-TZ3-P3-Q02-B]
    why: >
      «Write down the value of V when x = 0», «write down an expression
      for the gradient». Уравнения там нет, есть подстановка; приёмом
      такое не становится.
  - what: Неравенства внутри темы уравнений
    marks: 11
    blocks: [2021-MAY-TZ1-P2-Q11-F, 2023-MAY-TZ2-P2-Q08-B,
             2025-NOV-TZ3-P1-Q05-B]
    why: >
      Три блока, где решают не уравнение, а неравенство. Приёмы
      целиком в A8 (rational_inequality, absolute_value), повторять
      их здесь незачем.

leads_to:
  - practicum: B2
    why: >
      Композиция и обратные функции забирают оставшиеся 66 баллов темы.
      Уравнение там появляется как способ найти обратную: f(y) = x.
  - practicum: B4
    why: >
      Множество значений через дискриминант (задание 17) — это уже
      исследование функции: асимптоты и дырка в множестве значений
      описывают один и тот же график.
  - practicum: A8
    why: >
      Приёмы 7–9 заканчиваются неравенством на букву, и решают его
      машинкой из A8. verify_param_set в этом практикуме — тот же самый.
  - practicum: E8
    why: >
      Приём solution_count опирается на стационарные точки; в B1 они
      берутся как известные, в E8 их учатся находить и различать.

verification_limits:
  - what: >
      verify_param_set не замечает пропущенное отдельное значение, если
      оно иррационально.
    why: >
      Пробы берутся внутри промежутков ответа, на границах и по
      регулярной сетке; в иррациональную точку сетка не попадает,
      а внутренности у одной точки нет.
    impact: >
      У задания 14 рядом стоит check_set: он сверяет набор целиком.
      Измерено в verify_b1.py (предел 4).
  - what: >
      Потерянная нижняя граница в задании 15 (забытое k > 0) проверкой
      не ловится.
    why: >
      При k ≤ 0 логарифм не определён, holds возвращает None, и точка
      пропускается. Пропущенных точек проверка не считает ошибкой —
      она печатает их число.
    impact: >
      Ответ «−30 ≤ k ≤ e^{9/4}» проходит. Измерено в verify_b1.py
      (предел 5).
  - what: >
      Лишний кусок ответа за пределами окна (−30, 30) не проверяется.
    why: >
      verify_param_set берёт пробы только внутри окна.
    impact: >
      Ответ «(0,1) ∪ (100,200)» вместо «(0,1)» проходит. Измерено
      в verify_b1.py (предел 3).
  - what: >
      verify_root_set проверяет, какие корни найдены, но не то, как они
      записаны.
    why: >
      Совпадение корней устанавливается символически, а при неудаче —
      численно с допуском 1e−9.
    impact: >
      Там, где в условии стоит «exact value», десятичная запись
      с 15 знаками пройдёт, хотя markscheme её не примет. Измерено
      в verify_b1.py (предел 2).
  - what: >
      verify_equation принимает любой числовой множитель.
    why: >
      Уравнения равны с точностью до переноса слагаемых и умножения
      на ненулевое число — это определение, а не послабление.
    impact: >
      Запись «17x² − 17(m+1)x + 34 = 0» пройдёт там, где markscheme
      ждёт напечатанный вид. Измерено в verify_b1.py (предел 1).

corpus_issues:
  - block: 2023-NOV-TZ2-P3-Q02-C
    what: >
      Ноябрьская Paper 3 2023 года лежит в корпусе дважды — как
      2023-november-tz1 и как 2023-november-tz2, по 22 блока и 55 баллов
      в каждой копии. В архиве бумага одна: AA_HL/2023/November/Common/
      Paper 3, и своих Paper 3 у зон TZ1 и TZ2 нет.
    check: >
      Состав блоков и баллы в копиях совпадают полностью. При этом
      11 блоков из 22 получили в двух прогонах разные primary_topic:
      Q1(a)–(c) в одной копии functions.curve_sketching, в другой
      functions.equations. В теме уравнений прямо удвоены 6 баллов
      вопроса Q2(c) — он попал в functions.equations в обеих копиях.
    impact: >
      Итог корпуса завышен на 55 баллов, B1 — на 6. В практикуме вопрос
      использован один раз (задание 12), а Q1 — один раз (задание 18).
      Пометка о шести баллах стоит в шапке ноутбука и в карте.
  - block: 2021-NOV-COMMON-P1-Q03
    what: >
      В блоке нет самого уравнения: описание говорит только «applying
      change-of-base, power rule and product/quotient rule … leading to
      x^5 = 1/32». У блока стоит собственная пометка корпуса
      formula_extraction_uncertain.
    check: >
      Условие восстановлено по бумаге (страница 7 вопросника):
      log₃ √x = 1/(2 log₂ 3) + log₃(4x³) при x > 0. Оно даёт ровно
      записанный в markscheme промежуточный шаг x = 32x⁶ и ответ
      x = 1/2, и других положительных корней у него нет.
    impact: >
      Практикум ставит задание 10 в восстановленном виде. Проверка
      в verify_b1.py: подстановка 1/2 обращает уравнение в ноль,
      а sp.solve не даёт ничего лишнего при x > 0.
  - block: 2024-MAY-TZ2-P1-Q05-B-II
    what: >
      Ответ «m = −1/6» полон только вместе с условием m ≠ 0, которого
      в описании блока нет.
    check: >
      sympy: при m = 0 уравнение f(x) = g(x) превращается в x = 0
      и тоже имеет ровно одно решение. Условие m ≠ 0 стоит в бумаге
      (May 2024 TZ2, Paper 1, Q5), но в разметку блока не попало.
    impact: >
      В задании 16 оговорка вынесена в условие, а проверка возвращает
      None при m = 0 — иначе она справедливо отвергала бы верный ответ.
  - block: 2024-MAY-TZ2-P2-Q11-G
    what: >
      В описании блока сказано «solve w = 0 for t → t ≈ 3.35 (first
      solution)», но не сказано, что у модели есть разрыв.
    check: >
      sympy: знаменатель sin(2.37 − πt/8) обращается в ноль при
      t = 6.0352, и численный поиск видит там смену знака. Настоящий
      второй корень — t = 12.78. Разрыв от корня отличается тем, что
      значения по сторонам от него порядка 10³, а не нулевые.
    impact: >
      В решении 13 разрыв назван прямо: слово «first» в условии
      относится к корню 3.35, а полюс около 6.04 решением не является.

