version: 0.1
practicum: C7
title: Расстояния, углы и векторное произведение
source_topic: geometry.vectors_3d
also_covers: [geometry.vectors]

corpus:
  blocks: 26
  marks: 114
  effective_blocks: 24
  effective_marks: 108
  sessions: May 2021 — November 2025
  papers: {1: 37, 2: 56, 3: 21}
  gdc_marks: 77
  note: >
    Третий и последний практикум по векторам; разрез тот же, по действию.
    C5 взял всё, что делается без плоскости и без векторного произведения,
    C6 — всё, где плоскость сама предмет вопроса, C7 — остаток, и остаток
    этот однороден: здесь векторами меряют. Площадь, объём, угол,
    расстояние — четыре величины, и все четыре берутся из одного
    произведения. 48 баллов из 182 geometry.vectors (доля 0.264) и 66 из
    216 geometry.vectors_3d (0.3053), разобрано поблочно при сборке C6.

    Граница с C6 проведена так. Векторное произведение в C6 есть, но там
    оно только способ получить нормаль; здесь оно само предмет: его длина
    — площадь, его знак — порядок множителей, его тождество с скалярным
    произведением — отдельный вопрос экзамена. Расстояние от точки до
    плоскости осталось в C6 (это длина перпендикуляра, который C6 строит
    и без того); расстояние до прямой и ближайшая точка прямой — здесь.

    26 блоков по корпусу, 24 рабочих; 114 баллов, 108 рабочих. Дубль
    ноября 2023 года снова есть: векторное произведение с буквой и
    наименьшая площадь Q8(a), (c) стоят и в TZ1, и в TZ2 одной бумаги
    (6 баллов). Q8(b) в копии TZ2 размечен как calculus.optimization и
    сюда не попал — см. corpus_issues.

    Paper 1 — 37 баллов, Paper 2 — 56, Paper 3 — 21: это единственный
    практикум по векторам, где Paper 3 весит заметно. Оба вопроса Paper 3
    — исследования: сферический треугольник мая 2025 TZ2 (16 баллов сюда)
    и поворот гиперболы ноября 2021.

    Девять баллов доли — не про векторы вовсе: поворот гиперболы ноября
    2021 Q1(g) и площадь многоугольника на диаграмме Аргана мая 2025 TZ2
    Q12(c). Они приписаны сюда разметкой, и решено оставить их в доле —
    иначе доли по geometry.vectors не складываются в единицу, — но в
    практикум они не идут: в leftovers и corpus_issues записано, куда они
    относятся по содержанию.

    Приём volume — самый тонкий во всей серии: один блок, 4 балла. Он
    оставлен отдельной ступенью, а не приписан к площади, потому что
    действие другое: у площади одно векторное произведение, у объёма —
    произведение и высота, и треть. Если следующие сессии не добавят
    объёмов, ступень стоит слить с area.

directions:
  - >
    Векторное произведение — вектор, а не число, и задано оно не с
    точностью до множителя: у него своя длина |u||v| sin θ.
  - >
    Всякая мера здесь — длина одного векторного произведения: площадь
    параллелограмма это |u × v|, треугольника — половина, объём пирамиды —
    шестая часть определителя из трёх рёбер.
  - >
    Угол с плоскостью считается через нормаль и потом дополняется до
    прямого; угол между плоскостями — острый угол между нормалями.
  - >
    Ближайшая точка прямой — та, где отрезок к ней перпендикулярен
    направлению; расстояние — длина этого отрезка.

skills:
  - id: cross
    name: Векторное произведение — счёт и проверка
    rung: 1
    trigger: >
      «Show that AB × AC = …»; «find the vector a × p»; «given that
      b × c = (−4, −1, 3)»; «use a vector method». Два вектора даны или
      строятся по точкам, и нужен третий, перпендикулярный обоим.
    chain:
      - "Свести к двум векторам из одной вершины: AB = B − A, AC = C − A"
      - "Компоненты произведения — u₂v₃ − u₃v₂, u₃v₁ − u₁v₃, u₁v₂ − u₂v₁"
      - "Средняя компонента именно u₃v₁ − u₁v₃: в записи определителем
        перед j стоит минус"
      - "Проверить скалярным произведением: u · (u × v) и v · (u × v) — нули"
      - "С буквой всё то же: раскрыть скобки и привести подобные"
      - "Порядок множителей менять нельзя: v × u = −(u × v)"
    traps:
      - "Знак средней компоненты: (2 − 3p, 2 + p, p² − 2p) вместо
        (2 − 3p, −2 − p, p² − 2p)"
      - "Множители переставлены, и весь вектор вышел с обратным знаком"
      - "Компоненты перемножены по отдельности: (u₁v₁, u₂v₂, u₃v₃)"
      - "Произведение сокращают на общий множитель, как нормаль, — а у
        произведения своя длина"
      - "В «show that» приводят результат, не выписав ни AB, ни AC: схема
        ставит A0A0"
    calculator:
      mode: allowed
      note: >
        Все 10 баллов приёма на калькуляторных бумагах, и это ничего не
        значит: три разности произведений быстрее и надёжнее руками.
        Калькулятор разве что проверяет знак.
    prereq: []
    raw_tags: [algebraic_simplification, cross_product, determinant, determinant_expansion,
               vector_subtraction]
    blocks: ['2023-NOV-TZ1-P2-Q08-A', '2023-NOV-TZ2-P2-Q08-A', '2025-MAY-TZ2-P3-Q02-C-I']

  - id: area
    name: Площадь — длина векторного произведения
    rung: 2
    trigger: >
      «Hence, find the area of parallelogram ABCD»; «use a vector method to
      find the area of the triangle PQR»; «find the smallest possible area of
      triangle ABC»; «the area of triangle ABC is √6». Площадь — и дана,
      и искомая: в одну сторону из неё достают |u × v|.
    chain:
      - "Два ребра из одной вершины и их векторное произведение"
      - "|u × v| — площадь параллелограмма на этих рёбрах"
      - "Треугольник — его половина: S = ½|u × v|"
      - "Длину брать от произведения, а не перемножать длины: |u||v| было бы
        площадью только при прямом угле"
      - "Если площадь дана, а искать нужно вектор, читать то же равенство
        справа налево: |u × v| = 2S"
      - "Наименьшая площадь при букве — минимум |u × v|², и корень брать в
        самом конце"
    traps:
      - "Половина забыта: у треугольника взята площадь параллелограмма"
      - "Ответ — |u × v|², корень не извлечён"
      - "Площадь считают как |u||v| или как скалярное произведение"
      - "Минимум найден по p и в ответ пошло само p, а не площадь"
      - "Три значащие цифры округлены до двух: 1.3 вместо 1.30"
    calculator:
      mode: speeds_up
      note: >
        17 баллов из 21 на калькуляторных бумагах, и здесь он правда
        работает: минимум многочлена четвёртой степени и корень из 18954
        считает GDC, схема этого и ждёт («attempt to find minimum»).
    prereq: [cross]
    raw_tags: [area_of_parallelogram, area_of_triangle, critical_point_analysis,
               cross_product, differentiation, function_minimization,
               half_magnitude_cross_product, magnitude, magnitude_squared,
               numerical_evaluation, orthogonality_conditions, polynomial_expansion,
               square_root, system_of_equations, triangle_area,
               triangle_area_from_cross_product, vector_product]
    blocks: ['2023-NOV-TZ1-P2-Q08-B', '2023-NOV-TZ1-P2-Q08-C', '2023-NOV-TZ2-P2-Q08-C',
             '2024-MAY-TZ1-P2-Q12-C', '2025-MAY-TZ3-P1-Q11-C', '2025-NOV-TZ1-P2-Q12-D']

  - id: volume
    name: Объём пирамиды — основание и высота
    rung: 3
    trigger: >
      «Hence, find the volume of pyramid PQRS». Основание уже посчитано
      предыдущим пунктом, вершина лежит на нормали к нему.
    chain:
      - "Основание — треугольник или параллелограмм, его площадь уже есть"
      - "Высота — расстояние от вершины до плоскости основания; если вершина
        стоит на нормали, это длина отрезка до неё"
      - "V = ⅓ · S · h"
      - "То же одним счётом: шестая часть определителя из трёх рёбер,
        выходящих из вершины"
      - "Определитель брать по модулю: знак говорит только про порядок рёбер"
    traps:
      - "Треть забыта: посчитана призма"
      - "Взят весь определитель: это параллелепипед, вшестеро больше"
      - "Высотой берут расстояние до вершины основания, а не до плоскости"
      - "В ответ идёт площадь основания"
    calculator:
      mode: speeds_up
      note: >
        Все 4 балла на Paper 2, и корень из 234 с умножением на площадь
        основания — работа для GDC.
    prereq: [area]
    raw_tags: [magnitude, vector_subtraction, volume_of_pyramid]
    blocks: ['2025-NOV-TZ1-P2-Q12-G']

  - id: identity
    name: Тождество Лагранжа — скалярное и векторное вместе
    rung: 4
    trigger: >
      «Show that |a × b|² = |a|²|b|² − (a · b)²»; «using the definitions of
      u · v and u × v in terms of |u|, |v| and θ, show that
      (u · v)² + |u × v|² = |u|²|v|²»; «hence, or otherwise, find the value
      of |u|». Само тождество спрашивают, а следующим пунктом им пользуются.
    chain:
      - "Записать оба произведения через длины и угол: u · v = |u||v| cos θ,
        |u × v| = |u||v| sin θ"
      - "Возвести в квадрат и вынести |u|²|v|²"
      - "cos²θ + sin²θ = 1 — и тождество доказано"
      - "Обратный ход: из трёх известных величин четвёртая находится
        подстановкой, без угла"
      - "Дальше — система: u · v даёт линейное уравнение на буквы, |u| —
        квадратное"
    traps:
      - "Написано |u × v| = |u||v| cos θ: синус и косинус перепутаны"
      - "Тождество доказывают на конкретных векторах — схема требует общего хода"
      - "Компонентный способ начат и брошен: «full marks only if fully developed»"
      - "Из квадратного уравнения взят один корень, а их два, и каждому
        отвечает своя вторая буква"
    calculator:
      mode: partial
      note: >
        15 баллов из 19 на Paper 2, но само тождество — алгебра, и
        калькулятор в ней не участвует. Он решает квадратное уравнение
        последнего пункта и считает √11.
    prereq: [cross]
    raw_tags: [algebraic_manipulation, algebraic_simplification, area_of_triangle,
               cross_product_magnitude, cross_product_magnitude_definition, dot_product,
               dot_product_definition, dot_product_substitution, pythagorean_identity,
               quadratic_solving, system_of_equations, trigonometric_identity,
               trigonometric_substitution, vector_magnitude_identity]
    blocks: ['2021-MAY-TZ2-P1-Q05', '2024-MAY-TZ1-P2-Q12-A', '2024-MAY-TZ1-P2-Q12-B-I-III']

  - id: angle
    name: Углы с плоскостью — через нормаль
    rung: 5
    trigger: >
      «Show that the acute angle between the planes P1 and P2 is 60°»; «show
      that cos θ = 1/5»; «the angle between a line and a plane is α, find the
      value of α»; «show that the angle at vertex A is 90°»; «find the
      bearing from Bogotá to Moscow».
    chain:
      - "У плоскости работает нормаль, у прямой — направление"
      - "Между плоскостями: cos θ = |n₁ · n₂| / (|n₁||n₂|), модуль и даёт острый угол"
      - "Между прямой и плоскостью: угол с нормалью считается тем же
        скалярным произведением, а искомый — то, что осталось до прямого:
        sin α = |d · n| / (|d||n|)"
      - "Без модуля выйдет тупой угол; тогда острый — 180° − θ"
      - "С буквой в нормали получается уравнение на угол, и решает его GDC"
      - "Угол между двумя векторными произведениями считается так же: они
        сами векторы"
    traps:
      - "В ответ идёт угол с нормалью, а не с плоскостью"
      - "Оставлен тупой угол, хотя спрашивали острый"
      - "Модуль потерян, и косинус вышел отрицательным"
      - "Ответ в градусах, когда вопрос просит радианы: схема ставит A0"
      - "Дуга на сфере считается по хорде, а не по углу: s = rθ"
    calculator:
      mode: helps
      note: >
        21 балл из 30 на калькуляторных бумагах. Тригонометрическое
        уравнение мая 2023 («12 + 2cos α − sin α = √17√14 sin α») решает
        только GDC; остальное — скалярное произведение и arccos.
    prereq: [cross]
    raw_tags: [acute_angle_adjustment, angle_between_line_and_plane, angle_between_planes,
               angle_between_vectors, arc_length_formula, bearing_calculation,
               compute_dot_product, compute_magnitudes, cross_product, dot_product,
               extract_direction_vector, extract_normal_vector, extract_normal_vectors,
               magnitude_calculation, normal_vectors, scalar_product, solve_for_angle,
               solve_trigonometric_equation]
    blocks: ['2023-MAY-TZ1-P2-Q08', '2025-MAY-TZ1-P1-Q11-A', '2025-MAY-TZ2-P3-Q02-C-II',
             '2025-MAY-TZ2-P3-Q02-E', '2025-MAY-TZ2-P3-Q02-F', '2025-MAY-TZ3-P1-Q11-E']

  - id: closest
    name: Ближайшая точка прямой — перпендикуляр из точки
    rung: 6
    trigger: >
      «Find the coordinates of the point P on L that is nearest to the
      origin»; «find PN · AB in terms of μ»; «given that N is the point on L2
      that lies closest to P, find the coordinates of N».
    chain:
      - "Общая точка прямой — с буквой: N = c + μd"
      - "Вектор от данной точки к ней, PN = N − P, тоже с буквой"
      - "Ближайшая — та, где PN перпендикулярен прямой: PN · d = 0"
      - "Уравнение линейное, буква одна; её значение — обратно в прямую"
      - "Тот же ответ даёт минимум |PN|² по букве — производная даёт то же
        уравнение"
    traps:
      - "В ответ идёт значение буквы, а не точка"
      - "Скалярное произведение берут с радиус-вектором точки, а не с
        направлением прямой"
      - "PN считают как P − N: знак уравнения меняется, корень тот же, но
        дальше путается"
      - "Для ближайшей к началу координат точки забывают, что P здесь — O"
    calculator:
      mode: allowed
      note: >
        5 баллов из 12 на Paper 2, и уравнение всё равно линейное: 9λ = 12.
        Производную в способе с минимумом тоже считают руками.
    prereq: []
    raw_tags: [dot_product, dot_product_zero, nearest_point_on_line, parametric_evaluation,
               perpendicular_condition, solve_linear_equation, substitute_parameter,
               vector_subtraction]
    blocks: ['2023-MAY-TZ2-P2-Q06-B', '2025-NOV-TZ3-P1-Q10-D', '2025-NOV-TZ3-P1-Q10-E']

  - id: distance
    name: Расстояние до прямой и между прямыми
    rung: 7
    trigger: >
      «Hence or otherwise, find the shortest distance from A to L1»; «find the
      minimum distance between l1 and l2». Прямые параллельны или точка лежит
      вне прямой, и нужна длина перпендикуляра.
    chain:
      - "Взять любую точку прямой и вектор к ней от данной точки: AP"
      - "Расстояние — |AP × d| / |d|: векторное произведение отрезает
        продольную часть"
      - "Или так: |AP| sin θ, где θ — угол между AP и прямой"
      - "Между параллельными прямыми — то же самое от точки одной до другой"
      - "Или без произведения: общая точка второй прямой, условие
        перпендикулярности, длина"
      - "Сначала убедиться, что прямые параллельны: у пересекающихся
        расстояние ноль"
    traps:
      - "Не поделено на |d|: ответ вышел в |d| раз больше"
      - "В ответ идёт |AP| — расстояние до выбранной точки, а не до прямой"
      - "Взята длина проекции на прямую: это второй катет, а не искомый"
      - "Для непараллельных прямых считают как для параллельных"
    calculator:
      mode: 'no'
      note: >
        Оба блока приёма — Paper 1, 9 баллов без калькулятора. Ответы
        точные: 3√2 и 3√6.
    prereq: [cross, closest]
    raw_tags: [cross_product, derivative, distance_between_parallel_lines,
               find_vector_between_points, identify_parallel_lines,
               minimize_squared_distance, perpendicular_distance, substitution,
               trigonometric_ratio, vector_magnitude]
    blocks: ['2021-MAY-TZ2-P1-Q08-B', '2023-MAY-TZ1-P1-Q12-C']

leftovers:
  - blocks: ['2021-NOV-COMMON-P3-Q01-G', '2025-MAY-TZ2-P1-Q12-C']
    marks: 9
    what: >
      Векторов в этих блоках нет. Поворот гиперболы x² − y² = 1 до xy = k
      (ноябрь 2021 Paper 3, 5 баллов) — последний пункт исследования про
      гиперболические функции, и делается он поворотом точки на 45°.
      Площадь четырёхугольника ABCD на диаграмме Аргана (май 2025 TZ2
      Paper 1, 4 балла) — прямоугольник со сторонами √2 и √6 из корней
      уравнения z⁴ + 2z² + 4 = 0. Доля за ними оставлена, чтобы доли по
      geometry.vectors складывались в единицу; в практикум и в архив они
      не входят.

imported:
  - practicum: C5
    what: >
      Точки, векторы и прямые внутри вопросов C7: вершина D параллелограмма
      мая 2025 TZ3 Q11(a), точка пересечения прямых ноября 2025 TZ1 Q12(a),
      прямая L2 по двум точкам и «скрещиваются» ноября 2025 TZ3 Q10(b), (c),
      PA и угол между прямыми мая 2023 TZ1 Q12(a), (b), «прямые не
      пересекаются» мая 2021 TZ2 Q8(a).
  - practicum: C6
    what: >
      Плоскости, на которых считаются углы: P1 и P2 мая 2025 TZ1 Q11 и мая
      2025 TZ3 Q11(d), Π через две прямые ноября 2025 TZ1 Q12(b) и её
      пересечения с осями, прямая пересечения двух плоскостей мая 2023 TZ2
      Q6(a), нормаль к плоскости мая 2023 TZ1 Q12(d).
  - practicum: C2
    what: >
      Май 2025 TZ2 Paper 3: длина дуги s = rθ на сфере радиуса 6 —
      круговая мера в пунктах (b)(ii), (d), (e).
  - practicum: C1
    what: >
      Май 2025 TZ2 Paper 3 (a): расстояние и пеленг на плоскости, теорема
      Пифагора и arctan, — с чем потом сравнивают ответ на сфере.
  - practicum: E4
    what: >
      Ноябрь 2023 Q8(b): наименьшее значение многочлена четвёртой степени —
      производная и критическая точка, но схема разрешает и GDC.

