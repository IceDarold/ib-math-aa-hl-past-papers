# Коды тренажёра распознавания → приёмы из карточек.
#
# В каждом практикуме тренажёр просит назвать приём коротким кодом. Коды
# писались под ноутбук и с идентификаторами приёмов не совпадают: они
# короче, а иногда и группируют два приёма в один. Здесь связь записана
# явно — позиционно её брать нельзя, в C3 порядок кодов в легенде другой,
# чем в лестнице.
#
# name — короткая подпись для кнопки в тренажёре. Там, где в ноутбуке
# подписи нет (A3, A7 — ранний формат), она написана здесь по карточке.
#
# Проверяется build_bank.py: каждый код из легенды должен быть здесь,
# каждый приём — существовать в лестнице своего практикума. Ступени,
# на которые не показывает ни один код, печатаются как непокрытые.

A3:
  expand:  {skill: full_expansion,            name: раскрыть целиком}
  term:    {skill: general_term,              name: один член разложения}
  equate:  {skill: equate_coefficients,       name: приравнять коэффициенты}
  seq:     {skill: coefficients_as_sequence,  name: коэффициенты как последовательность}
  frac:    {skill: fractional_index,          name: нецелый показатель}
  approx:  {skill: product_and_approximation, name: произведение и приближение}
  complex: {skill: binomial_with_i,           name: бином с i}

A4:
  factor:    {skill: factor_remainder,     name: множитель и остаток}
  div:       {skill: polynomial_division,  name: деление с остатком}
  mult:      {skill: repeated_root,        name: кратный корень}
  vieta2:    {skill: vieta_quadratic,      name: "Виета, квадратное"}
  vieta3:    {skill: vieta_higher,         name: "Виета, степень выше двух"}
  conj:      {skill: conjugate_roots,      name: комплексные корни парами}
  sym:       {skill: symmetric_sums,       name: симметричные суммы}
  transform: {skill: root_transformation,  name: уравнение с новыми корнями}
  apart:     {skill: partial_fractions,    name: простейшие дроби}

A5:
  cart:   {skill: cartesian_arithmetic, name: "арифметика, убрать i из знаменателя"}
  parts:  {skill: equate_parts,         name: приравнять части}
  modarg: {skill: modulus_argument,     name: модуль и аргумент}
  form:   {skill: form_conversion,      name: перевод формы записи}
  prop:   {skill: product_properties,   name: свойства произведения}
  roots:  {skill: conjugate_roots,      name: сопряжённые корни}

A6:
  power:  {skill: de_moivre_power,        name: степень по Муавру}
  root:   {skill: nth_roots,              name: корень n-й степени}
  unity:  {skill: roots_of_unity,         name: корни из единицы}
  period: {skill: periodicity_condition,  name: наименьшее n по аргументу}
  rot:    {skill: rotation_geometry,      name: поворот}
  ident:  {skill: trig_via_de_moivre,     name: тождество через Муавра}
  # geom и rot — один приём карточки: и поворот, и фигура на плоскости
  # Аргана решаются умножением на комплексное число.
  geom:   {skill: rotation_geometry,      name: фигура на плоскости Аргана}

A7:
  direct: {skill: direct_proof,           name: прямое доказательство}
  repr:   {skill: integer_representation, name: представление целого}
  contra: {skill: contradiction,          name: от противного}
  sum:    {skill: induction_sum,          name: индукция для суммы}
  div:    {skill: induction_divisibility, name: индукция для делимости}
  deriv:  {skill: induction_derivative,   name: индукция для производной}
  rec:    {skill: induction_recursion,    name: индукция для рекурренты}
  ineq:   {skill: induction_inequality,   name: индукция для неравенства}

