        note: >
          Четвёртый практикум серии на английском, устроенный как B2–B4:
          ноутбук, карточка приёмов и сообщения проверок английские,
          документация репозитория остаётся русской.

          Самая тонкая тема из готовых: 85 баллов при нижней границе 60.
          Четыре подтемы взяты целиком, потому что ни одна не дотягивает
          сама — наибольшая даёт 35 баллов, — и потому что архив их тоже
          не разделяет: ноябрь 2025 Paper 3 подгоняет логистическую кривую,
          логарифмирует её и решает стоящее за ней дифференциальное
          уравнение одним вопросом.

          Лестница идёт по тому, в какую сторону надо двигать неизвестное.
          Приёмы 1–3 поднимают его из-под логарифма: три закона, смена
          основания, уравнение. Приёмы 4–6 опускают его из показателя:
          законы степеней, логарифмирование обеих частей, подгонка модели
          по двум условиям. Приёмы 7–8 — две модели, которые архив
          действительно спрашивает: проценты и логистическая. Девятый стоит
          сбоку: логарифм не как инструмент, а как функция — композиция,
          область, шкала децибел.

          54% баллов с калькулятором, и здесь это не иллюзия, в отличие от
          B2 и B3. Разрез идёт по бумаге почти без исключений: Paper 1
          спрашивает законы и точную форму, Paper 2 и Paper 3 — подгонку
          модели под данные. Один и тот же приём даёт ln 2 / 5730 на одной
          бумаге и 2380 на другой.

          Девятое понятие равенства ответов: ответом служит сама модель,
          и верна она не совпадением постоянных, а тем, что воспроизводит
          данные, из которых её строили. verify_model не хранит эталона —
          подставляет каждую пару из условия. Заодно ловит главную потерю
          баллов темы: постоянные верны, а отсчёт времени сдвинут (t = 19
          вместо t = 27). Вторая новая проверка, verify_in_terms_of,
          сторожит вопрос «выразите log 24 через p и q»: требует, чтобы
          чужих букв в ответе не было и чтобы после подстановки истинных
          значений получалось нужное число.

          Два замечания к разметке. Блок 2025-NOV-TZ3-P1-Q08-A помечен
          темой mathematical_models, но ни показательной, ни логарифмической
          функции в нём нет — это оптимизация с sec и tan, и в архивный
