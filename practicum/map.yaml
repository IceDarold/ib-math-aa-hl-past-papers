# Карта практикумов: разбиение архива на ноутбуки.
#
# Правило гранулярности: практикум = 60–200 баллов исходного материала,
# 5–9 приёмов, одна связная лестница. Меньше 60 — мало практики, тему нужно
# слить с соседней. Больше 200 — ноутбук не проходится за один заход, тему
# нужно резать. Проверяется скриптом check_map.py по classification/generated.
#
# subtopics — темы корпуса, из которых берётся материал. Элемент списка это
# либо имя темы целиком, либо {topic: ..., share: ...}, когда тему делят
# несколько практикумов. Сумма долей по одной теме должна давать 1.
#
# exception — осознанный выход за диапазон с обоснованием. Скрипт такие
# практикумы показывает, но не считает ошибкой.

version: 0.2
status: draft

sections:
  A:
    title: Number and algebra
    practicums:
      - id: A1
        title: Арифметические прогрессии и суммы
        subtopics: [{topic: number_algebra.sequences, share: 0.8}]
        status: ready
        notebook: practicum/number_algebra/practicum-a1-arithmetic-sequences.ipynb
        kaggle: ib-math-praktikum-a1-arithmetic-sequences
        archive: practicum/number_algebra/archive-a1-arithmetic-sequences.ipynb
        kaggle_archive: ib-math-archive-a1-arithmetic-sequences
        skills: practicum/skills/number-algebra-sequences.yaml
        note: >
          Тема number_algebra.sequences взята не целиком: в ней лежат обе
          прогрессии сразу. Разрез между A1 и A2 идёт по вопросу, а не по
          теме — у майской 2023 TZ1 бумаги пункты (a)–(c) арифметические,
          (d)–(e) геометрические, и это один вопрос 10. Доля 0.8 посчитана
          по баллам: 135 из 169.

          169 баллов по корпусу, 135 рабочих. Вычтено четырнадцать блоков:
          десять геометрических уходят в A2 (22 балла), ноябрьский дубль
          2023 года стоит 7, и два блока не по теме вовсе — факториал
          в исследовании про площади и коробка из листа картона.

          Девять приёмов идут по тому, что в задаче неизвестно: сначала
          член и сумма при известной прогрессии, потом сама прогрессия
          при известных члене и сумме, потом постоянная разность как
          условие на букву, и напоследок три случая, где номер обязан
          быть целым, сумма — наибольшей, а члены оказываются
          логарифмами.

          Проверке передают не ответ и не формулу, а правило: первый член
          и шаг. Член она находит сложением, сумму — сложением первых n
          членов, и ни u₁+(n−1)d, ни n/2(2u₁+(n−1)d) внутри неё нет.
          Отсюда и обратный ход: «ваш седьмой член равен шести?» —
          так проверяется «найдите первый член и разность».
      - id: A2
        title: Геометрические прогрессии и бесконечные суммы
        subtopics: [{topic: number_algebra.sequences, share: 0.2}, number_algebra.geometric_sequences]
        status: ready
        notebook: practicum/number_algebra/practicum-a2-geometric-sequences.ipynb
        kaggle: ib-math-praktikum-a2-geometric-sequences
        archive: practicum/number_algebra/archive-a2-geometric-sequences.ipynb
        kaggle_archive: ib-math-archive-a2-geometric-sequences
        skills: practicum/skills/number-algebra-geometric-sequences.yaml
        note: >
          Собран из двух тем сразу: number_algebra.geometric_sequences
          целиком (17 блоков, 55 баллов) и остаток number_algebra.sequences
          после A1 (10 блоков, 22 балла) — те вопросы, что начинаются
          арифметической последовательностью и кончаются геометрической.

          89 баллов по корпусу, 77 рабочих. Вычтены четыре блока:
          ноябрьский дубль 2023 года (7 баллов, копия TZ1 уже в A1)
          и два блока не про последовательности вовсе — факториал
          в исследовании про площади и коробка из листа картона.

          Самая ровная тема серии по бумагам: 37 баллов без калькулятора
          против 38 с ним. Доля GDC 52%, и здесь она почти честная —
          наименьшее n схема оценивания разрешает искать таблицей
          наравне с логарифмом.

          Семь приёмов идут по тому, чем оказывается знаменатель:
          число, найденное делением; условие сходимости; спрятанный
          в сигму; неизвестное в квадратном уравнении; и напоследок
          выражение с x, при котором сумма ряда становится функцией.

          Проверке передают правило — первый член и знаменатель.
          Член она находит умножением, сумму сложением, бесконечную
          сумму — сложением до тех пор, пока хвост не станет мал.
          Отсюда и то, чего в A1 быть не могло: расходящийся ряд
          проверка сложить не может и говорит об этом сама.
      - id: A3
        title: Биномиальная теорема
        subtopics: [number_algebra.binomial_theorem]
        status: ready
        notebook: practicum/number_algebra/practicum-a3-binomial.ipynb
        kaggle: ib-math-praktikum-a3-binomial
        skills: practicum/skills/number-algebra-binomial.yaml
        note: >
          Тема взята целиком: 109 баллов, 24 блока, внутри диапазона.
          Единственная тема секции A без единого блока Paper 3 — вопросы
          короткие и самостоятельные, в длинные исследования бином не заходит.

          Шесть приёмов из семи — прочтения формулы общего члена, поэтому
          лестница получилась однородной: раскрыть целиком, найти один член,
          приравнять коэффициенты, связать коэффициенты последовательностью,
          продолжить на нецелые показатели, перемножить ряды, подставить i.

          Проверка разложений сверяет значения, а не запись: у ученика
          выходит 5*x/2, у Python 2.5, и хеш от srepr тут бесполезен.
          Обратная сторона — нераскрытая скобка численно равна своему
          разложению, и такой ответ проверка примет.
      - id: A4
        title: "Многочлены: Виета, деление, кратность корней"
        subtopics: [number_algebra.polynomials]
        status: ready
        notebook: practicum/number_algebra/practicum-a4-polynomials.ipynb
        kaggle: ib-math-praktikum-a4-polynomials
        skills: practicum/skills/number-algebra-polynomials.yaml
        note: >
          Тема взята целиком: 145 баллов, 50 блоков. Самая широкая в секции A
          и единственная в архиве, где Paper 3 весит больше Paper 2
          (49 баллов против 34).

          Девять приёмов ложатся в две половины. Первая идёт от коэффициентов
          к корням: множитель, деление, кратный корень. Вторая — обратно:
          Виета, сопряжённые пары, симметричные суммы, преобразование корней.
          Отсюда главное умение темы — до начала счёта понять, спрашивают ли
          корни вообще. Простейшие дроби стоят девятым приёмом особняком:
          они ничего не говорят о корнях и ведут в E5 и E7.

          Формально 57% баллов с калькулятором, но реальной работы для GDC
          здесь на 4 балла из 145.

          Проверка устроена обратно к A3. Там сверялись значения, и
          нераскрытая скобка проходила. Здесь «представьте в виде
          произведения линейных множителей» — требование к записи, и
          verify_factored разбирает написанное, не факторизуя его сам.
      - id: A5
        title: "Комплексные числа: формы и арифметика"
        subtopics: [{topic: number_algebra.complex_numbers, share: 0.605}]
        status: ready
        notebook: practicum/number_algebra/practicum-a5-complex-forms.ipynb
        kaggle: ib-math-praktikum-a5-complex-forms
