          и 31 балл из 350.

          Граница проходит по вопросу, а не по функции. «Найдите f′(x)» —
          E3. «Найдите касательную», «под углом 70°», кривая, заданная
          уравнением, — E4: там производная работает наклоном, и половина
          баллов стоит на уравнении прямой. «Найдите ускорение», «скорость
          роста» — E9: там производная работает скоростью. Один и тот же
          вопрос архива поэтому бывает разрезан: у мая 2022 Paper 3 пункт
          (d)(i) показывает вид g′(x) и стоит здесь, а (d)(ii) строит по
          ней касательную и стоит в E4.

          Тридцать четыре блока из пятидесяти пяти — Paper 3. Тема живёт
          в длинных исследованиях: производную там берут не ради ответа,
          а ради следующего пункта. Двадцать девять баллов из 188 — одно
          майское исследование 2025 года про кривизну.

          Двенадцатое понятие равенства ответов в серии, и самое прямое:
          производная у функции одна, и verify_derivative вычисляет её
          из условия. Новое здесь не это, а разбор неверного ответа.
          Промахи темы именные — потерянный множитель цепного правила,
          произведение как u′v′, перевёрнутый знак в частном, непонижённый
          показатель, — и проверка строит каждый из них из той же самой
          функции. Ни верных ответов, ни неверных она не хранит: и те,
          и другие выводятся.

          73% баллов формально с калькулятором, настоящей работы для GDC
          на 15 баллов из 188. Самая большая иллюзия калькулятора
          за девять практикумов.
