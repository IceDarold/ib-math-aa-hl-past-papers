        status: ready
        notebook: practicum/number_algebra/practicum-a6-de-moivre.ipynb
        kaggle: ib-math-praktikum-a6-de-moivre
        skills: practicum/skills/number-algebra-de-moivre.yaml
        note: >
          Доля тождеств — четыре блока (18 баллов), где тригонометрическое
          тождество получают возведением в степень по Муавру и приравниванием
          мнимых частей: sin 5θ, (1 ± i tan θ)^4, tan(π/12) через аргумент.
          Приём здесь комплексный, тождество — результат, поэтому материал
          живёт тут, а не в C3.
      - id: A7
        title: "Доказательство: индукция, прямое, от противного"
        subtopics: [number_algebra.mathematical_induction, number_algebra.proof]
        status: ready
        notebook: practicum/number_algebra/practicum-a7-proof.ipynb
        kaggle: ib-math-praktikum-a7-proof
        skills: practicum/skills/number-algebra-proof.yaml
        note: >
          Две темы корпуса взяты целиком: индукция (112 баллов) и proof
          (48 баллов). Резать не пришлось — 160 баллов внутри диапазона,
          и делить их нечем: шаг индукции сам является прямым
          доказательством, а индукция для делимости построена
          на представлении целых из темы proof.

          Единственная тема архива без калькулятора вообще. Формально
          доля с GDC 34%, но 48 из 54 таких баллов — части длинных
          исследований Paper 3, где GDC работает в соседних пунктах.

          Проверка здесь устроена иначе, чем в остальных практикумах:
          ответ напечатан в условии, поэтому сверяются переход и остаток,
          а не итог. Словесную часть — два-три балла из семи в каждом
          задании — ноутбук проверить не может, о чём в нём сказано прямо.
      - id: A8
        title: Неравенства
        subtopics: [number_algebra.inequalities, functions.inequalities]
        status: ready
        notebook: practicum/number_algebra/practicum-a8-inequalities.ipynb
        kaggle: ib-math-praktikum-a8-inequalities
        skills: practicum/skills/number-algebra-inequalities.yaml
        note: >
          Две темы взяты целиком: number_algebra.inequalities (82 балла)
          и functions.inequalities (5 баллов). Вторая отдельно не живёт —
          все три её блока про множество значений параметра, то есть
          про то же самое.

          Самая рассыпанная тема архива: 26 блоков из 31 — отдельные
          пункты внутри чужих вопросов, чаще всего последние. Целым
          вопросом неравенство бывает дважды за пять лет.

          Двенадцать баллов (три блока) неравенствами не являются вовсе:
          две системы линейных уравнений и алгебраическое «show that».
          Это те же блоки, из-за которых в C5 предложено завести
          number_algebra.systems_of_equations; разбор — в corpus_issues
          карточки.

          Проверки здесь третьего типа. В A3 сверялись значения, в A4 —
          форма записи, тут — множества: у неравенства нет ответа-числа,
          и все баллы стоят на границе множества решений.

  B:
    title: Functions
    practicums:
      - id: B1
        title: "Уравнения: квадратные, дробные, с параметром"
        subtopics: [{topic: functions.equations, share: 0.771}]
        status: ready
        notebook: practicum/functions/practicum-b1-equations.ipynb
        kaggle: ib-math-praktikum-b1-equations
        skills: practicum/skills/functions-equations.yaml
        note: >
          Доля темы пересчитана по корпусу: было 0.55 наугад, стало 0.771
          по разбору всех ста блоков. Композиция в теме уравнений весит
          заметно меньше, чем казалось при составлении карты: её основные
          баллы лежат в functions.inverse_functions и functions.graphing,
          а сюда попадают только 27 блоков (66 баллов), и все они ушли в B2.

          Девять приёмов делятся на три части по тому, что дано. Приёмы 1–2
          работают с уже записанным уравнением. Приёмы 3–6 его строят:
          из условия задачи, из пересечения графиков, из замены — и это
          сердце темы, потому что «show that … satisfies …» стоит баллов
          больше, чем поиск корней. Приёмы 7–9 переворачивают вопрос:
          уравнение дано с буквой, а спрашивают число решений.

          Проверка снова требует своего понятия равенства ответов, уже
          четвёртого в серии: A3 сверял значения, A4 — форму записи,
          A8 — множества, здесь ответом бывает само уравнение.
          verify_equation принимает перенос слагаемых и множитель-число,
          но не домножение на букву: оно меняет множество корней.
          Второй новый разрез — лишние корни против потерянных:
          verify_root_set смотрит на список с обеих сторон и различает
          эти два случая в сообщениях.

          Параметрическая треть темы проверяется машинкой из A8:
          verify_param_set берёт множество значений буквы и спрашивает
          у самого уравнения, сколько у него решений в пробных точках.
          Дискриминант в проверке не участвует ни разу.
        exception: >
          Тема идёт одним практикумом, хотя выходит за верхнюю границу
          (222 балла, из них 6 — один и тот же вопрос ноября 2023,
          посчитанный в корпусе дважды). Естественный разрез — между
          «решить» (приёмы 1–6) и «сколько решений» (приёмы 7–9). Но
          в архиве эти половины стоят пунктами одного вопроса: (a) show
          that the intersection satisfies …, (b) hence find the values
          of the parameter. Разрезав тему, мы потеряем ровно ту связку,
          ради которой вопрос составлен. Пересмотреть, если ноутбук
          перестанет проходиться за один заход.
      - id: B2
        title: Композиция и обратные функции
        subtopics: [{topic: functions.equations, share: 0.229}, functions.inverse_functions]
        status: ready
        notebook: practicum/functions/practicum-b2-composition-inverse.ipynb
        kaggle: ib-math-praktikum-b2-composition-inverse
        skills: practicum/skills/functions-composition-inverse.yaml
        note: >
          Первый практикум серии на английском. Ноутбук, карточка приёмов
          и сообщения проверок — английские; документация репозитория,
          включая эту заметку, остаётся русской. Переключает язык сам
          ноутбук вызовом language('en') в установочной ячейке, значение
          по умолчанию в kit русское, поэтому десять готовых практикумов
          и тренажёр не задеты.

          40 блоков и 113 баллов: вся тема functions.inverse_functions
          плюс 27 блоков (66 баллов) из functions.equations, которые B1
          оставил себе не про уравнения, а про композицию, вычисление
          значений и чётность.

          Девять приёмов идут в две стороны. Приёмы 1–3 вперёд: вычислить
          композицию, записать её, приравнять к числу. Приём 4 — самая
          маленькая композиция, f(−x). Приём 5 составляет f с самой собой.
          Приёмы 6–9 назад: определяющее свойство обратной, замена x и y,
          область существования, выбор ветви корня. Петля закрывается:
          f самообратна ⟺ f∘f тождественна ⟺ график симметричен
          относительно y = x, и это же показывает случай m = −1
          в исследовании Paper 3.

          Шестое в серии понятие равенства ответов: ответом здесь служит
          функция, и верна она, когда отменяет исходную. verify_inverse
          не хранит эталона — подставляет f внутрь ответа и требует x
          обратно. Направление выбрано намеренно: f(g(x)) = x пропускает
          неверную ветвь корня, g(f(t)) = t её ловит, а именно за выбор
          ветви в markscheme стоит R1. Рядом всегда check_domain: область
          сверяется как множество, запись свободна, концы — нет.

          Пять баллов из 113 посчитаны дважды: ноябрьская сессия 2023 года
          лежит в корпусе двумя зонами, и это одна и та же бумага. Прошлые
          практикумы отмечали дубль только для Paper 3; проверено, что он
          касается всех бумаг сессии. Ещё четыре расхождения с корпусом —
          потерянные при извлечении из PDF дробная черта или корень,
          и у ноября 2021 Q2(d) вместе с формулой уехал ответ. Всё
          перепроверено в practicum/tests/verify_b2.py.

          Пятая подряд калькуляторная иллюзия: формально 44% баллов
          с калькулятором, настоящей работы для GDC здесь на один балл —
          f⁻¹(2) = 1.32 в мае 2025 TZ1 Paper 2.
      - id: B3
        title: Преобразования графиков
        subtopics: [functions.graphing]
        status: ready
        notebook: practicum/functions/practicum-b3-transformations.ipynb
        kaggle: ib-math-praktikum-b3-transformations
        skills: practicum/skills/functions-graphing.yaml
        note: >
          Второй практикум серии на английском, устроенный как B2: ноутбук,
          карточка приёмов и сообщения проверок английские, документация
          репозитория остаётся русской.

          Тема взята целиком — 37 блоков, 107 баллов, — и по-другому нельзя:
          соседи заняты. functions.equations разобрали B1 и B2, а
          curve_sketching с asymptotes дают 147 баллов, то есть весь B4.
          Шов между B3 и B4 проходит не по темам, а по тому, какую кривую
          рисуют: знакомую по форме (парабола, arccos, логарифм, гипербола)
          или незнакомую, которую надо сначала исследовать.

          Девять приёмов идут по тому, что дано. Приёмы 1–4: график дан,
          и что-то его двигает — прочитать, применить растяжение, назвать
          последовательность, найти её параметры. Приёмы 5–6: график дан,
          и что-то его складывает — симметрия, а затем |f(x)|, f(|x|)
          и 1/f(x), которые не двигают точки, а гнут кривую и ставят излом
          в каждом нуле f. Приёмы 7–9: графика нет, вы его рисуете —
          по знакомой формуле, по формуле с асимптотами, или сразу
          по целому семейству с калькулятором.

          Седьмое в серии понятие равенства ответов: ответом служит
          картинка, и спрашивают её двумя способами, поэтому и проверок
          две. verify_transform берёт описанную последовательность,
          применяет её к исходной функции и смотрит на результат —
          эталонного описания нет, поэтому любой работающий порядок
          проходит, а неработающий нет, и это ровно тот балл, который
          markscheme снимает формулировкой «A1A0 for correct horizontal
          transformations specified in the wrong order». verify_sketch
