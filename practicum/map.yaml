      - id: E4
        title: "Неявное дифференцирование: касательная и нормаль"
        subtopics: [{topic: calculus.differentiation, share: 0.374}]
        status: ready
        notebook: practicum/calculus/practicum-e4-tangents.ipynb
        kaggle: ib-math-praktikum-e4-tangents
        archive: practicum/calculus/archive-e4-tangents.ipynb
        kaggle_archive: ib-math-archive-e4-tangents
        skills: practicum/skills/calculus-tangents.yaml
        revisit: >
          Практикум назывался «Неявное и параметрическое дифференцирование»,
          пока при сборке E3 не выяснилось, что параметрического
          дифференцирования в архиве нет вовсе: ни в одной из семнадцати
          сессий не встречается кривая, заданная парой x(t), y(t), и
          производная dy/dx = (dy/dt)/(dx/dt) не спрашивается ни разу.
          Название исправлено по материалу. Пересмотреть, если следующие
          сессии её добавят.
        note: >
          Вторая треть темы calculus.differentiation: 33 блока и 131 балл,
          всё, где производная работает наклоном. Разрез поимённый, списки
          лежат в blocks карточки. Ноябрьская 2023 Paper 3 посчитана
          корпусом дважды — зональными копиями одной бумаги из Common, —
          поэтому за вычетом дубля 32 блока и 126 баллов. Седьмой практикум
          подряд с этим дублем.

          Восемь приёмов делятся по тому, чем в вопросе служит прямая.
          1–3: она ответ — касательная, нормаль, точка по наклону.
          4–6: кривая перестала быть функцией, и чтобы наклон стал числом,
          нужны обе координаты сразу. 7–8: прямая стала условием, из
          которого достают постоянную. Крайние блоки лестницы весят почти
          одинаково — 38 баллов и 37, — а середина больше обоих: 56.

          Семнадцатое понятие равенства ответов: касательная держится
          кривой. Кривая здесь — условие на пару чисел F(x, y) = 0, и
          «y = f(x)» частный случай этого, а не другой случай. Проверка
          не решает условие относительно y и не дифференцирует его: она
          идёт по кривой. Слева и справа от точки берётся шаг, для каждого
          решается F(x, ·) = 0 у самой точки, и наклон получается секущей
          через две найденные точки. Ни dy/dx = −F_x/F_y, ни правил
          дифференцирования внутри проверок нет ни разу.

          Отсюда и всё остальное: касательная — прямая через точку кривой
          с тем же наклоном, нормаль — то же с произведением наклонов −1,
          обратный ход «где наклон равен m» — просмотр кривой, вторая
          производная — три шага по ней вместо повторного дифференцирования.

          Ответ, записанный тремя значащими цифрами, ни на какой кривой
          не лежит. Поэтому проверка не подставляет его, а ищет рядом
          настоящее решение и смотрит, округляется ли оно в написанное.

          77% баллов с калькулятором, настоящей работы для GDC на 16 из 131.
          Тридцать баллов Paper 1 — самая честная доля темы за серию.

          Рядом с практикумом архивный ноутбук (archive, kaggle_archive):
          вся тема подряд, разложенная по тем же восьми приёмам, без теории
          и без лестницы. Собирается generators/build_archive_e4.py,
          проверяется tests/check_archive_e4.py.
