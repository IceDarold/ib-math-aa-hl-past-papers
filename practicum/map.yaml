  E:
    title: Calculus
    practicums:
      - id: E1
        title: Пределы, неопределённости, правило Лопиталя
        subtopics: [calculus.limits]
        status: ready
        notebook: practicum/calculus/practicum-e1-limits.ipynb
        kaggle: ib-math-praktikum-e1-limits
        skills: practicum/skills/calculus-limits.yaml
        archive: practicum/calculus/archive-e1-limits.ipynb
        kaggle_archive: ib-math-archive-e1-limits
        note: >
          Пятый практикум серии на английском, устроенный как B2–B5: ноутбук,
          карточка приёмов и сообщения проверок английские, документация
          репозитория остаётся русской.

          Самая маленькая готовая тема: 73 балла при нижней границе 60, и
          она же одна из самых связных во всём архиве. Одиннадцать блоков
          из двадцати — буквально одно правило, применённое от одного
          до трёх раз.

          Корпус числит 22 блока и 81 балл, но два блока дублируют другие,
          и дубли разной природы. Ноябрьский Paper 3 2023 года лежит в
          Common, а корпус держит его двумя зональными копиями: страницы
          совпадают побайтово (та же беда отмечена в B1 и C1). А вопрос
          про sin²(kx)/x² в ноябре 2023 поставлен в TZ1 и TZ2 слово в слово:
          бумаги действительно разные, вопрос один. Отсюда 20 блоков и
          73 балла.

          Лестница идёт по тому, что дала подстановка. Приёмы 1–2 —
          подстановка её и закрыла: точка в области определения, общий
          множитель, старшая степень на бесконечности; исчисление не нужно
          вовсе. Приёмы 3–5 — вышло 0/0 и сокращать нечего: правило
          Лопиталя, дисциплина повторного применения и ряд Маклорена как
          более короткая замена ему. Приёмы 6–8 — предел перестал быть
          вопросом: постоянная подбирается под него, стрелка стоит не под x,
          параметр сидит внутри выражения. Девятый — фраза о том, что предел
          значит для модели.

          44% баллов с калькулятором, и здесь это иллюзия почти полная:
          ответы темы — 2/3, −3, −1/4, π/4, −n/2, n(n+1)/2 — точные всюду.
          Два числа, ради которых калькулятор нужен, — k = 4 и k = 9, и оба
          не пределы, а постоянные, подобранные под предел.

          Десятое понятие равенства ответов: ответом служит предел, а у
          предела нет числа, которое можно взять и сравнить. verify_limit
          берёт выражение из условия, подходит к точке лестницей
          10⁻¹…10⁻⁸ с обеих сторон и смотрит, туда ли садятся значения;
          эталона он не хранит вовсе. Заодно отвергает ответ, в котором
          осталась переменная, и число, снятое после одного применения
          правила там, где форма была ещё 0/0. Вторая новая проверка,
          verify_indeterminate, сторожит балл за «show that the limit is in
          indeterminate form»: смотрит на числитель и знаменатель порознь и
          не верит на слово.

          Хешей в архивном ноутбуке два из двадцати трёх — самая низкая
          доля в серии, и ровно по этой причине.

          Рядом с практикумом архивный ноутбук (archive, kaggle_archive):
          вся тема подряд, разложенная по тем же девяти приёмам, без теории
          и без лестницы. Собирается generators/build_archive_e1.py,
          проверяется tests/check_archive_e1.py.
      - id: E2
        title: Ряды Маклорена
