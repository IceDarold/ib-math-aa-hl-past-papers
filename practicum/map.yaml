          предел интегрирования или постоянную.

          Восемнадцатое понятие равенства ответов: первообразная узнаётся
          по своей производной. У производной ответ один, у первообразной
          ответа нет вовсе — есть семейство, и сверять не с чем. Раздел
          написан так, что вычислить ответ он не может в принципе: внутри
          нет ни одного интегрирования, ни sympy, ни своего. Проверка умеет
          ровно одно — продифференцировать написанное и посмотреть, вышла ли
          подынтегральная функция. Постоянная исчезает сама, как бы она ни
          была одета: +c, +ln A, +(1/2)ln A. Это строже, чем в E3: там
          проверка ответ вычисляла и могла бы его напечатать, здесь она
          умеет только узнавать.

          Определённый интеграл — число, и берётся оно не первообразной,
          а сложением: адаптивным Симпсоном по самому подынтегральному
          выражению. Бесконечный предел проходится лестницей. «Покажите,
          что ∫ от a до s равен G(s)» — это G′(s) = f(s) и G(a) = 0,
          основная теорема, и снова без интегрирования.

