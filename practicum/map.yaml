          перпендикуляр из точки и отражение. 38 баллов из 182
          geometry.vectors (0.209) и 98 из 216 geometry.vectors_3d (0.4537),
          разобрано поблочно. 136 баллов по корпусу, 123 рабочих — ноябрь
          2023 Q12(b)–(d) стоит дважды. 51 балл Paper 1, 72 Paper 2.

          Системы линейных уравнений с параметром живут здесь приёмом, а не
          отдельным практикумом: три случая системы — это три расположения
          плоскостей. Подтемы под системы в таксономии нет, и они размечены
          как vectors, inequalities и polynomials; блоки из inequalities и
          polynomials считаются в A8 и A4, а в C6 идут содержанием — один из
          них стоит заданием на время. Разбор и предложение завести
          number_algebra.systems_of_equations — в corpus_issues карточки.

          Двадцать пятое понятие равенства ответов: плоскость — тоже
          множество точек, и система — набор плоскостей, её решение — их
          общая часть. Уравнение принимается с любым множителем, векторная
          форма — с любой точкой и любыми двумя направлениями в плоскости,
          общее решение системы — в любой параметризации.
        revisit: >
