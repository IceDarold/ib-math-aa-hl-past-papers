# Временная проверка: что именно видит SUBMODULE_TOKEN.
#
# Ошибка «Repository not found» на приватном репозитории означает одно из
# двух, и различить их со стороны нельзя: токену не выдан сам репозиторий
# или ему не выдано право Contents. Здесь спрашиваются оба, по отдельности,
# и печатаются только коды ответов — сам токен никуда не попадает.
#
# Запускается руками и после починки удаляется.
name: Token check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub what the token can reach
        env:
          TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${TOKEN:-}" ]]; then
            echo "СЕКРЕТ ПУСТ ИЛИ НЕ ЗАВЕДЁН"
            exit 1
          fi
          echo "длина секрета: ${#TOKEN}, начинается на: ${TOKEN:0:11}…"
          echo
          for repo in ib-math-aa-hl-past-papers drill-core ib-physics; do
            meta=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/IceDarold/$repo")
            if git ls-remote "https://x-access-token:$TOKEN@github.com/IceDarold/$repo.git" \
                 >/dev/null 2>&1; then
              git_status=ок
            else
              git_status=ОТКАЗ
            fi
            printf '%-28s репозиторий: %s   git: %s\n' "$repo" "$meta" "$git_status"
          done
          echo
          echo "200 + ок       — доступ полный"
          echo "200 + ОТКАЗ    — репозиторий выдан, а право Contents нет"
          echo "404            — сам репозиторий токену не выдан"
