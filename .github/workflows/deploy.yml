name: Deploy Question Atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://math.archik.tech

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Ядро и физика лежат подмодулями: без них служба не соберётся,
          # и лучше это узнать здесь, а не на боевой машине.
          submodules: true
          # Оба подмодуля в приватных репозиториях, а токен сборки видит
          # только свой. SUBMODULE_TOKEN — доступ на чтение к ним обоим;
          # без него подмодули придут пустыми, и выкатка остановится на
          # проверке «Drill core is missing».
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: classification/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix classification/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install drill dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            -r vendor/drill-core/requirements.txt \
            -r practicum/aahl/requirements.txt \
            -r vendor/ib-physics/api/requirements.txt \
            httpx

      - name: Build the physics atlas index
        run: python vendor/ib-physics/build_atlas.py

      - name: Build the physics practicum pages
        run: python vendor/ib-physics/build_site.py

      - name: Check the drill
        env:
          PYTHONPATH: vendor/drill-core:practicum
        run: |
          set -euo pipefail
          # Ядро — на выдуманном предмете: ему для работы не должно хватать
          # ни sympy, ни банка AA HL.
          python vendor/drill-core/tests/test_core.py
          python vendor/drill-core/tests/test_memory.py
          # Математика: механика тренажёра и вечерний набор.
          python practicum/aahl/tests/test_drill.py
          python practicum/aahl/tests/test_evening.py
          # Физика: единицы, сравнительный ответ, форма банка, генераторы.
          python vendor/ib-physics/tests/test_subject.py
          python vendor/ib-physics/tests/test_circuit.py
          python vendor/ib-physics/tests/test_cards.py
          # API физики: замок по ключу, фильтры, картинки у каждого задания.
          python vendor/ib-physics/tests/test_api.py
          # verify_drill.py здесь не запускается: он пересчитывает каждую
          # сгенерированную задачу и идёт четверть часа. Его место — рядом
          # с правкой генератора, а не на каждой выкатке.

      - name: Build application
        run: npm run build --prefix classification/web

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.MATH_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$RUNNER_TEMP/math-deploy"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/math-deploy/key"
          cp .github/known_hosts "$RUNNER_TEMP/math-deploy/known_hosts"

      - name: Build the htpasswd file
        env:
          BASIC_AUTH_USER: ${{ secrets.MATH_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.MATH_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BASIC_AUTH_USER"
          test -n "$BASIC_AUTH_PASSWORD"
          umask 077
          hash=$(printf '%s' "$BASIC_AUTH_PASSWORD" | openssl passwd -apr1 -stdin)
          printf '%s:%s\n' "$BASIC_AUTH_USER" "$hash" \
            > "$RUNNER_TEMP/math-deploy/htpasswd"

      - name: Write the grader key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" \
            > "$RUNNER_TEMP/math-deploy/openai.env"

      - name: Deploy production release
        env:
          DEPLOY_HOST: 130.17.12.5
          DEPLOY_USER: mathdeploy
          DEPLOY_KEY_PATH: ${{ runner.temp }}/math-deploy/key
          DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/math-deploy/known_hosts
          HTPASSWD_FILE: ${{ runner.temp }}/math-deploy/htpasswd
          GRADER_KEY_FILE: ${{ runner.temp }}/math-deploy/openai.env
          BASIC_AUTH_USER: ${{ secrets.MATH_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.MATH_BASIC_AUTH_PASSWORD }}
        run: classification/web/deploy/deploy.sh
