name: Deploy Question Atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://math.archik.tech

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: classification/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix classification/web

      - name: Build application
        run: npm run build --prefix classification/web

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.MATH_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$RUNNER_TEMP/math-deploy"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/math-deploy/key"
          cp .github/known_hosts "$RUNNER_TEMP/math-deploy/known_hosts"

      - name: Deploy production release
        env:
          DEPLOY_HOST: 130.17.12.5
          DEPLOY_USER: mathdeploy
          DEPLOY_KEY_PATH: ${{ runner.temp }}/math-deploy/key
          DEPLOY_KNOWN_HOSTS: ${{ runner.temp }}/math-deploy/known_hosts
        run: classification/web/deploy/deploy.sh
