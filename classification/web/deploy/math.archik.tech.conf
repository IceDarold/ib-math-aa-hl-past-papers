# Question Atlas. TLS terminates in Hiddify HAProxy.

server {
    listen unix:/opt/hiddify-manager/nginx/run/h1.sock proxy_protocol;
    server_name math.archik.tech;
    charset utf-8;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Архив IB и разбор — материал под авторским правом, наружу не отдаём.
    # Пароль лежит в секретах GitHub, htpasswd кладёт деплой.
    auth_basic "math.archik.tech";
    auth_basic_user_file /var/www/math.archik.tech/htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /opt/hiddify-manager/acme.sh/www;
        try_files $uri =404;
    }

    location /assets/ {
        root /var/www/math.archik.tech/current;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /AA_HL/ {
        root /var/www/math.archik.tech/current;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API банка физики. Мимо пароля сайта: его зовут программы, у которых
    # браузерного входа нет. Замок у него свой — ключ, и без ключа служба
    # отвечает 401. Кэш картинок она ставит сама.
    location ^~ /api/physics/ {
        auth_basic off;
        # Ключ ездит в заголовке или в ссылке, и по голому HTTP он ушёл бы
        # открытым текстом. TLS снимает HAProxy, поэтому $scheme здесь всегда
        # http: без явного https служба строила бы ссылки на http://.
        if ($proxy_protocol_server_port = 80) {
            return 308 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8043;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/drill/ {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Разбор письменной работы читает страницы билета, схему оценивания
        # и снимки тетради — это десятки секунд, а не доли. И сами снимки
        # весят мегабайты, чего умолчание nginx в 1 МБ не пропускает.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($proxy_protocol_server_port = 80) {
            return 308 https://$host$request_uri;
        }
        root /var/www/math.archik.tech/current;
        try_files $uri $uri/ /index.html;
    }
}

