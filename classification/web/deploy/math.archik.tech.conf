# Question Atlas. TLS terminates in Hiddify HAProxy.

server {
    listen unix:/opt/hiddify-manager/nginx/run/h1.sock proxy_protocol;
    server_name math.archik.tech;
    charset utf-8;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/hiddify-manager/acme.sh/www;
        try_files $uri =404;
    }

    location /assets/ {
        root /var/www/math.archik.tech/current;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /AA_HL/ {
        root /var/www/math.archik.tech/current;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        if ($proxy_protocol_server_port = 80) {
            return 308 https://$host$request_uri;
        }
        root /var/www/math.archik.tech/current;
        try_files $uri $uri/ /index.html;
    }
}

